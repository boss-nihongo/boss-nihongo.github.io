<style>
/* Layout: 單欄閱讀 App＋底部分頁；藍色調（藍染＋和紙） */

  --accent:#1d5fbf; --accent-2:#0f3f86; --soft:#dce8f8; --rt:#3b7bc9; --chip:#e6eef8;

:root[data-theme="dark"]{

  --accent:#6aa8ff; --accent-2:#a9ccff; --soft:#1a2c4b; --rt:#8ab9f5; --chip:#1a2741;
  --ok:#5fd29c; --sheet:#15223a; --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.w:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}

.hero{display:grid;gap:6px;padding-block:6px 14px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,7.5vw,38px);line-height:1.2;margin:0}

.tag{font-size:14px;color:var(--mute)}
.sec{display:grid;gap:10px;margin-block:18px}
.sec>h3{margin:0;font-size:13px;letter-spacing:.12em;color:var(--mute);font-weight:700}

.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.modebox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.modebox .lab{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.demo{font-family:var(--f-read);font-size:16px}

.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.lv b{font-family:var(--f-disp);font-size:22px}
.lv span{font-size:12px;color:var(--mute)}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

.today{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:16px;padding:16px;display:grid;gap:8px;box-shadow:var(--shadow)}
:root[data-theme="dark"] .today{color:#0c1524}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .today{color:#0c1524}}
.today small{opacity:.85;font-size:12px;letter-spacing:.1em}
.tboss{position:absolute;right:-6px;bottom:0;height:112%;max-width:46%;object-fit:contain;object-position:bottom right;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));pointer-events:none}
.herobox{position:relative;min-height:250px;display:grid;align-content:center}
.herobox .txt{max-width:58%;display:grid;gap:8px;position:relative;z-index:1}
.heroimg{position:absolute;right:-8px;bottom:0;height:270px;max-width:46%;object-fit:contain;object-position:bottom right;pointer-events:none}
.bubble{position:absolute;right:30%;top:4px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:7px 12px;border-radius:14px 14px 4px 14px;z-index:2;box-shadow:var(--shadow);white-space:nowrap}

.qres{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}

.emptyboss{display:grid;justify-items:center;gap:8px;padding:20px 0;color:var(--mute);text-align:center}

.today h2{margin:0;font-family:var(--f-disp);font-size:22px}
.today p{margin:0;font-size:14px;opacity:.92}
.today .go{justify-self:start;background:rgba(255,255,255,.95);color:#0f3f86;border:0;border-radius:99px;padding:8px 18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}

.how{display:grid;gap:6px;font-size:14px;color:var(--mute);margin:0;padding-left:20px}

.list{display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:grid;gap:6px}
.card h3{margin:0;font-family:var(--f-disp);font-size:19px}
.card p{margin:0;color:var(--mute);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;background:var(--chip);border-radius:99px;padding:2px 10px;color:var(--mute)}
.pill.ok{color:var(--ok);font-weight:700}
.pill.ac{color:var(--accent);background:var(--soft);font-weight:700}

/* 課表 */
.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.day .n{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--mute);font-size:12px;line-height:1.1;text-align:center}
.day.cur{border-color:var(--accent)} .day.cur .n{background:var(--accent);color:#fff}
.day.done .n{background:var(--soft);color:var(--ok)}
.day h4{margin:0;font-family:var(--f-disp);font-size:17px}
.tasks{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.tasks i{font-style:normal}
.tasks .y{color:var(--ok)}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.cal .hd{display:flex;justify-content:space-between;font-weight:700}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.grid7 .wd{color:var(--mute)}
.grid7 .d{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;max-width:100%}
.grid7 .d.on{background:var(--accent);color:#fff;font-weight:700}
.grid7 .d.td{outline:1.5px solid var(--accent)}

/* reader */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .row{display:flex;align-items:center;gap:8px}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.sp{flex:1}
.tg{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.story h2{font-family:var(--f-disp);font-size:27px;margin:4px 0 2px}
.story .sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.story p{font-family:var(--f-read);font-size:17px;line-height:2.2;margin:0 0 14px;border-radius:8px;transition:background .2s}
.story p.reading{background:var(--soft)}
.story hr{border:0;text-align:center;margin:20px 0}
.story hr::after{content:"◆ ◆ ◆";color:var(--accent);letter-spacing:.4em;font-size:10px}
.w{color:var(--accent);font-weight:600;cursor:pointer;border-bottom:1.5px dotted var(--accent);padding:0 1px}
.w rt,.jl rt,.ja rt{font-size:.55em;color:var(--rt);font-weight:500;font-family:var(--f-ui)}
.g{color:var(--mute);font-size:.82em}
.hide-g .g,.hide-g .jlz{display:none}
.saved-w{background:var(--soft)}
.jl{display:inline;background:var(--chip);border-radius:6px;padding:2px 6px;color:var(--accent-2);font-weight:600;cursor:pointer}
.jlz{color:var(--mute);font-size:.82em}

.box{margin-top:20px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.box h4{margin:0;font-family:var(--f-disp);font-size:18px;display:flex;align-items:center;gap:8px}
.box h4 .pill{font-family:var(--f-ui)}
.gram .pt{font-family:var(--f-disp);font-size:20px;color:var(--accent)}
.gram .how{font-size:14px;color:var(--mute)}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.ja{font-family:var(--f-read);font-size:17px;line-height:2}
.zh{color:var(--mute);font-size:14px}
.say{border:1px solid var(--line);background:var(--paper);border-radius:99px;width:38px;height:38px;display:grid;place-items:center;font-size:15px}
.vlist{display:grid}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border:0;border-top:1px solid var(--line);text-align:left;background:none}
.vrow:first-child{border-top:0}
.vrow .jp{font-family:var(--f-disp);font-size:18px;min-width:5.5em}
.vrow .jp small{display:block;font-size:11px;color:var(--rt);font-family:var(--f-ui)}
.vrow .lvp{font-size:11px;color:var(--mute)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.q{display:grid;gap:8px}
.q .qw{font-family:var(--f-disp);font-size:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;text-align:center}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:#c0392b;color:#c0392b}
.player{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.player>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 10px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:13px}
.player button{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:5px 12px;font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,35,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;display:grid;gap:10px;max-height:86vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.story p{transition:none}}
.sh-top{display:flex;align-items:flex-start;gap:10px}
.sh-word{font-family:var(--f-disp);font-size:34px;line-height:1.2}
.sh-read{color:var(--rt);font-size:15px}
.sh-zh{font-size:20px;font-weight:700}
.sh-ex{background:var(--chip);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.note{font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:8px 10px}
.conj{width:100%;border-collapse:collapse;font-size:14px}
.conj td{border-top:1px solid var(--line);padding:5px 4px}
.conj td:first-child{color:var(--mute);width:5.5em}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--mute);line-height:1}
.tip ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:5px max(8px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:150px;background:none;border:0;padding:6px 4px;border-radius:10px;font-weight:600;color:var(--mute);font-size:12px;display:grid;justify-items:center;gap:1px}
.tab b{font-size:18px;line-height:1.1;font-weight:400}
.tab[aria-selected="true"]{color:var(--accent);background:var(--soft)}
.empty{color:var(--mute);text-align:center;padding:40px 0;font-size:14px}
.foot{font-size:12px;color:var(--mute);text-align:center;margin-top:24px}
</style>

い}，聲音不高，卻讓整個電梯降了三度：「三分鐘。」\n\n「對、對不起！我是新來的翻譯，許念——」\n\n「妳的{名前|なまえ}我知道。」男人往前一步，她下意識後退，背脊撞上冰涼的電梯{壁|かべ}。他單手撐在她耳側，低頭看她，「我是九條司，這間{会社|かいしゃ}的{社長|しゃちょう}。在我這裡，[[〈遅刻:ちこく〉は〈許:ゆる〉さない。::遲到，我不允許。]]第一次{遅刻|ちこく}，要受罰。」\n\n許念嚥了口口水。員工私下都說，九條社長是全東京最{怖い|こわい}的男人，三年開除了十七個助理。\n\n「什、什麼懲罰？」\n\n「從今天起，妳調到頂樓，當我的專屬翻譯。」他鬆開手，替她按下最高樓層，「{毎日|まいにち}早上八點，我要在辦公室看到妳，和一杯不加糖的{コーヒー}。」\n\n---\n\n頂樓的{仕事|しごと}比她想像中難上許多。\n\n九條司開{会議|かいぎ}從不看稿，日文、英文、中文來回切換，她翻得滿頭大汗；他卻總能在她卡住的那一秒，用筆尖輕敲她的{机|つくえ}，低聲提示一個字。\n\n「為什麼幫我？」有一次她忍不住問。\n\n「因為妳出錯，丟的是我的臉。」他頭也不抬。\n\n可那天晚上下起大雨，她站在公司門口等計程車，一把黑色的{傘|かさ}忽然遮到她頭頂。九條司的西裝肩膀溼了一半，語氣依舊冷淡：「上車。」\n\n「不用了，社長，我自己叫車就——」\n\n「{だめ}。」他打開車門，「我不說第二次。」\n\n車裡很安靜。雨刷一下一下地擺動，她偷偷看他的{顔|かお}，發現這個男人不說話的時候，其實比傳聞{優しい|やさしい}一點點。\n\n只有一點點。\n\n---\n\n一個月後，許念在茶水間聽見同事的閒話。\n\n「聽說社長只是拿她當擋箭牌，下個月就要跟大阪的千金訂婚了。」\n\n她握著杯子的手指發白。原來那些深夜的熱湯、雨天的傘，全都只是演給別人看的戲。\n\n當晚，她把辭職信放在九條司的桌上，用剛學會的日文，一字一字地說：「{辞めます|やめます|辞める}。」\n\n九條司看著那封信，沉默了很久，久到她以為他會簽字。\n\n然後他站起來，繞過辦公桌，把她逼到落地窗前。玻璃外是整個東京的夜景，玻璃內是他越來越近的呼吸。\n\n「誰准妳走了？」\n\n「社長要訂婚了，不需要擋箭牌——」\n\n「訂婚？」他低笑一聲，眼神卻危險得嚇人，「那是我母親安排的，我上週就拒絕了。妳寧願相信茶水間的{嘘|うそ}，也不肯來問我一句？」\n\n「我……」\n\n「許念，妳以為妳為什麼會被調到頂樓？」他捏住她的下巴，逼她抬頭，「三年前在台北的書展，妳替一個迷路的日本人翻譯了一整個下午。那個人是我。」\n\n她愣住了。\n\n「我等了妳三年，等到妳自己走進我的{会社|かいしゃ}。」他的聲音壓得很低，「妳現在說要走，我不{許す|ゆるす}。」\n\n「你這是……強迫。」\n\n「對。」他毫不心虛，「所以，給我一個{返事|へんじ}。留下來，當我的女人——還是讓我吻到妳點頭為止？」\n\n許念的臉一下子紅透了。她還沒開口，他已經低頭吻了上來，霸道、強勢，卻在最後一秒放輕了力道，像怕把她弄碎。\n\n很久以後，他才抵著她的額頭，用日文說出那句話：\n\n「[[ずっと〈前:まえ〉から〈好:す〉きだった。::我很早以前就喜歡妳了。]]」\n\n窗外的雨停了。許念聽懂了——那是她來日本後學會的、最想聽見的一句話。", "blurb": "來東京上班第一天就遲到三分鐘，冷血社長把她壁咚在電梯裡：「第一次遲到，要受罰。」", "gram": {"pt": "〜ない（否定形）", "mean": "不～；表示否定", "how": "五段動詞：う段→あ段＋ない（許す→許さない）；一段動詞：去る＋ない（食べる→食べない）", "ex": "〈遅刻:ちこく〉は〈許:ゆる〉さない。", "exzh": "遲到，我不允許。"}, "boss": {"name": "九條司", "yomi": "くじょう つかさ", "mark": "司", "c1": "#0b2550", "c2": "#1d5fbf"}}, {"id": "A2", "title": "社長住在我隔壁", "band": "N5-N4", "text": "搬到東京的第一晚，林小滿就被鄰居投訴了。\n\n她的新{部屋|へや}只有六坪，一張床、一張小桌子，還有一臺會嗡嗡叫的{冷蔵庫|れいぞうこ}。晚上十一點，她正跟著手機{歌う|うたう}，門鈴響了。\n\n門外站著一個男人。白襯衫，袖子捲到手肘，頭髮還滴著水，臉色比東京十一月的夜晚還冷。\n\n「{隣|となり}的。」他只說了三個字，接著用日文補上一句：「[[〈静:しず〉かにしてください。::請安靜一點。]]」\n\n「啊，對不起！」小滿慌張地鞠躬。男人看了她一眼，關上了門。\n\n---\n\n接下來一個禮拜，小滿每天都很小心，整層樓{静か|しずか}得可怕。一個人在東京，其實有點{寂しい|さびしい}。\n\n週五晚上，她發燒了。{熱|ねつ}來得又急又猛，{薬|くすり}剛好吃完，便利商店在八百公尺外，她連站都站不穩。\n\n她扶著牆走出門，下一秒，整個人撞進一個硬邦邦的懷裡。\n\n「妳要去哪裡？」是隔壁的男人。\n\n「買{薬|くすり}……」\n\n他摸了一下她的額頭，眉頭立刻皺起來：「這叫{大丈夫|だいじょうぶ}？」\n\n不等她回答，他直接把她抱回{部屋|へや}，放回床鋪：「躺好，不准動。要不要去看{医者|いしゃ}？」\n\n「不用……睡一覺就好。」\n\n二十分鐘後，他提著一袋藥和食材回來，在她那間小小的廚房裡煮了一鍋粥。{料理|りょうり}的香味飄滿整個房間。\n\n「你為什麼對我這麼好？」\n\n「妳太吵了。」他把湯匙塞進她手裡，「{病気|びょうき}的時候更吵。」\n\n可是那一夜，他一直坐在床邊，直到她睡著。隔天早上，桌上放著一份還溫熱的{朝ご飯|あさごはん}，和一張紙條：「不准再半夜出門。」\n\n---\n\n星期一，小滿第一次走進新公司的會議室，差點把手上的資料掉在地上。\n\n坐在主位上、被所有人稱為「鷹野社長」的男人，正是她的隔壁鄰居。\n\n散會後，他把她叫進辦公室，關上門。\n\n「社長，週末的事……謝謝您。」她低著頭，「我找到新房子了，下個月就搬走，不會再吵到您。您不用{心配|しんぱい}。」\n\n鷹野湊的眼神一下子沉了。他走過來，一手撐在她身後的門上，把她困在門和他之間。\n\n「搬走？」他重複這兩個字，聲音危險得讓人發抖，「誰准了？」\n\n「那是我的自由——」\n\n「那棟公寓是我的。」他低頭，近到她能看見他睫毛的影子，「妳以為，看得到東京鐵塔的房間，房租為什麼那麼便宜？」\n\n小滿愣住了。\n\n「半年前，妳在面試時說，想住在看得到東京鐵塔的地方。」他說，「我把頂樓那間空下來，等了妳半年。結果妳搬來第一天，就在我隔壁唱了三個小時的歌。」\n\n她的{顔|かお}紅得像要燒起來：「那、那你可以直接告訴我……」\n\n「告訴妳，妳會跑。」他捏起她的下巴，「就像現在這樣。」\n\n然後他吻了她。很輕，卻不容拒絕，像那晚他一口一口餵她喝粥一樣，溫柔得霸道。\n\n「[[もう〈逃:に〉がさない。::我不會再讓妳逃走了。]]」他抵著她的額頭，「妳房間的{鍵|かぎ}，我也有一把。以後不准半夜唱歌——除非，唱給我一個人聽。」", "blurb": "半夜唱歌被隔壁投訴，發燒時卻是他抱她回房煮粥。星期一，她發現鄰居就是自家社長。", "gram": {"pt": "〜てください", "mean": "請～（請求、指示）", "how": "動詞て形＋ください（する→して→してください）", "ex": "〈静:しず〉かにしてください。", "exzh": "請安靜一點。"}, "boss": {"name": "鷹野湊", "yomi": "たかの みなと", "mark": "湊", "c1": "#0b3346", "c2": "#1f86a8"}}, {"id": "A3", "title": "總裁的蛋糕考驗", "band": "N5-N4", "text": "京都，鴨川旁邊有一間小小的{喫茶店|きっさてん}。\n\n陳小柔在這裡打工三個月，最怕的不是洗碗，而是那個男人。\n\n他{毎朝|まいあさ}八點準時出現，永遠坐靠窗的同一個{席|せき}，點一杯黑咖啡和一塊店裡最{高い|たかい}的草莓蛋糕。然後吃一口，皺眉，放下叉子。\n\n「太{甘い|あまい}。」\n\n連續三十天，同一句話。\n\n第三十一天，小柔終於忍不住了。她把蛋糕重重放在他面前：「客人，嫌{甘い|あまい}的話，可以不要點。」\n\n男人抬起頭。西裝筆挺，眼神冷淡，薄唇勾起一點點弧度：「妳做的？」\n\n「……是。」\n\n「那我更要點。」他把整塊蛋糕推回她面前，「做到我說{美味しい|おいしい}為止。」\n\n---\n\n從那天起，小柔每天下班都留在店裡練習。少放一點{砂糖|さとう}，多加一點{牛乳|ぎゅうにゅう}，烤壞了就重來。手被烤盤燙得好{痛い|いたい}，她也不肯停。\n\n她不知道，{毎晩|まいばん}，那個男人都坐在對街的車裡，看著店裡那盞最晚熄的燈。\n\n第六十天，她端出一塊淡粉色的蛋糕。\n\n男人吃了一口，沉默很久。\n\n「怎麼樣？」她緊張得手心冒汗。\n\n他放下叉子，聲音很低：「{美味しい|おいしい}。」\n\n那一瞬間，小柔{嬉しい|うれしい}得差點跳起來，對他露出了一個大大的笑容。\n\n男人愣了一下，耳朵慢慢紅了。\n\n---\n\n可是隔天，一個年輕的大學生來店裡，跟小柔聊了好久的蛋糕，她也{笑う|わらう}得很開心。\n\n靠窗的{席|せき}上，那個男人的咖啡一口都沒喝。\n\n打烊的時候，店門被推開。男人走進來，把「本日包場」的牌子掛在門上，反手鎖門。\n\n「客人，我們打烊了——」\n\n「這間店，」他一步一步走過來，把她逼到吧檯後面，雙手撐在她身體兩側，「上個月我已經買下來了。今天起，妳只能做蛋糕給我一個人吃。」\n\n「你、你說什麼？」\n\n「妳對那個學生笑了十一次。」他低頭看她，眼神黑得嚇人，「[[〈君:きみ〉の〈笑顔:えがお〉は〈俺:おれ〉だけのものだ。::妳的笑容，只屬於我。]]」\n\n小柔的心跳快得不像話：「你憑什麼……」\n\n他從西裝口袋拿出一個小小的{箱|はこ}，放在吧檯上。裡面是一條項鍊，墜子是一塊小小的草莓蛋糕。\n\n「今天是妳的{誕生日|たんじょうび}。」他說，「三個月前，妳在店門口{泣く|なく}，說來京都的第一個生日，沒有人記得。」\n\n小柔的眼眶一下子紅了。原來他每天早上來，不是為了蛋糕。\n\n「所以，」他抬起她的下巴，語氣又霸道起來，「以後的每一個{誕生日|たんじょうび}，都由我來記。[[〈君:きみ〉が〈作:つく〉ったケーキが〈食:た〉べたい。::我想吃妳做的蛋糕。]]一輩子。」\n\n她紅著{顔|かお}，還沒想好怎麼回答，他已經低頭吻了下來。\n\n那個吻，帶著一點點草莓的香味。\n\n一點也不膩——是剛剛好的甜。", "blurb": "每天早上準時來嫌蛋糕太甜的男人，在她生日那天包下整間店：「妳的笑容只屬於我。」", "gram": {"pt": "〜たい", "mean": "想要～", "how": "動詞ます形去ます＋たい（食べます→食べたい）；想要的東西可用「が」", "ex": "〈君:きみ〉が〈作:つく〉ったケーキが〈食:た〉べたい。", "exzh": "我想吃妳做的蛋糕。"}, "boss": {"name": "咖啡廳的總裁", "yomi": "", "mark": "甘", "c1": "#1e2a5c", "c2": "#5b6fd3"}}, {"id": "A4", "title": "總裁的北海道導遊", "band": "N5-N4", "text": "二月的北海道，{雪|ゆき}下得像不會停。\n\n周以寧在新千歲{空港|くうこう}舉著牌子，等她這次的客人。{飛行機|ひこうき}晚了一個小時，她要接的是——白石集團的總裁，白石嶺。旅行社的主管再三交代：「他很難搞，千萬不要惹他生氣。」\n\n一個穿黑色大衣的男人推著{荷物|にもつ}走出來，看了一眼她手上的牌子，又看了一眼她。\n\n「妳就是導遊？」\n\n「是的！白石先生，接下來五天的{予定|よてい}我都排好了——」\n\n「我不需要{予定|よてい}。」他把行李交給她，「我去哪裡，妳跟著就好。」\n\n---\n\n第一天，她攤開{地図|ちず}想介紹景點，他卻把她排好的行程全部跳過，只讓她{案内|あんない}一條沒有遊客的小路。\n\n第二天，他在小樽運河邊站了一個小時，什麼也不做，只叫她站在旁邊。\n\n「白石先生，這裡很{寒い|さむい}，我們要不要先進去？」\n\n他看了她凍紅的手一眼，把自己的{手袋|てぶくろ}脫下來，丟給她：「戴上。」\n\n「那你呢？」\n\n「我不冷。」\n\n明明他的手指也凍得發白。\n\n---\n\n第三天，暴風雪來了。\n\n往札幌的{電車|でんしゃ}全部停駛，{駅|えき}裡擠滿了人。以寧急得一直打電話，終於訂到附近一間小旅館——只剩一間房。\n\n「我睡大廳的沙發就好！」她說。\n\n「妳敢。」白石嶺接過{鍵|かぎ}，「這種天氣，女生一個人睡大廳太{危ない|あぶない}了。」\n\n那天晚上，他把床讓給她，自己靠在窗邊的椅子上。窗外是滿天的{星|ほし}，雪停了，世界安靜得只剩下兩個人的呼吸。\n\n「你為什麼要來北海道？」她忍不住問，「你明明不想看景點。」\n\n他沉默了很久，才從手機裡翻出一張{写真|しゃしん}。\n\n照片上是十年前的小樽運河。一個穿著高中制服的女孩，把自己的圍巾圍在一個坐在路邊、{疲れる|つかれる}到睡著的少年身上。\n\n「那天我離家出走，身上一毛錢都沒有。」他說，「醒來的時候，只有一條圍巾，和一張寫著『加油』的紙條。」\n\n以寧睜大了眼睛。那條圍巾，是她媽媽織的，她找了好久。\n\n「我找了妳十年。」白石嶺站起來，走到床邊，「上個月，終於在旅行社的網站上看到妳的照片。」\n\n「所以……你指定我當導遊？」\n\n「不然呢？」他低頭看她，眼神燙得驚人，「妳以為我是來看{雪|ゆき}的？」\n\n她往後縮，背卻碰到了冰冷的牆。他單手撐在她耳邊，把她圈在自己的影子裡。\n\n「白石先生，我們的合約只有五天……」\n\n「那就改。」他說，「[[〈俺:おれ〉から〈離:はな〉れないで。::不准離開我身邊。]]這不是請求，是命令。」\n\n她的心跳亂得一塌糊塗。\n\n他低頭吻住她，吻得很慢，像要把這十年的等待一次討回來。\n\n吻完，他握住她冰涼的手，十指緊扣。他的掌心很{暖かい|あたたかい}。「[[〈寒:さむ〉いなら、〈俺:おれ〉の〈手:て〉を〈握:にぎ〉っていろ。::冷的話，就握緊我的手。]]」\n\n窗外，北海道的雪又開始下了。這一次，她一點也不覺得{寒い|さむい}。", "blurb": "暴風雪困住北海道，只剩一間房。難搞的總裁客人說：「妳以為我是來看雪的？」", "gram": {"pt": "〜ないで", "mean": "不要～（請求對方別做）", "how": "動詞ない形＋で（離れる→離れない→離れないで）", "ex": "〈俺:おれ〉から〈離:はな〉れないで。", "exzh": "不准離開我身邊。"}, "boss": {"name": "白石嶺", "yomi": "しらいし れい", "mark": "嶺", "c1": "#16385e", "c2": "#5d9fd8"}}, {"id": "A5", "title": "總裁的中文家教", "band": "N5-N4", "text": "東京，六本木最高的那間{レストラン}。\n\n林知恩坐在靠窗的位子，緊張得一直喝水。她是來面試的——工作內容是「{毎週|まいしゅう}兩次，教一位企業家中文」，時薪高得離譜。\n\n對面的男人慢慢搖晃著{ワイン}杯。黑色西裝，領口鬆開一顆扣子，眼神慵懶又危險。\n\n「神崎遼。」他說，「從今天起，妳是我的中文{先生|せんせい}。」\n\n「請、請多指教！」她站起來鞠躬，差點打翻杯子。\n\n他看著她，嘴角勾起一點：「[[〈隣:となり〉に〈座:すわ〉ってもいいか。::可以坐妳旁邊嗎？]]」\n\n還沒等她回答，他已經坐到她身邊了。\n\n---\n\n{授業|じゅぎょう}比想像中難。\n\n不是因為神崎遼學得慢，而是他太常{間違える|まちがえる}。「謝謝」說成「寫寫」，「老師」說成「老婆」。\n\n「是老師，不是老婆。」知恩紅著臉糾正，「這兩個字的{意味|いみ}差很多！」\n\n「哪裡不一樣？」他一臉認真地問。\n\n「老婆是……妻子的意思。」她的聲音越來越小，{恥ずかしい|はずかしい}得想鑽進地洞。\n\n「喔。」他點點頭，「那我沒說錯。」\n\n她一口水差點噴出來。\n\n每天晚上，她都在家{練習|れんしゅう}怎麼把課教得更好。而每次{授業|じゅぎょう}結束，他都會出一份{宿題|しゅくだい}給她——不是他寫，是她寫：「明天晚上七點，陪我吃飯。」\n\n「這不是{宿題|しゅくだい}！」\n\n「是{約束|やくそく}。」他說，「{先生|せんせい}不能遲到。」\n\n---\n\n三個月後，知恩發現了一件事。\n\n那天她提早到公司，聽見神崎遼在會議室裡，跟台灣客戶用中文談了整整一小時的合約。他的中文，{上手|じょうず}得不可思議。\n\n一個「寫寫」都沒有。\n\n她站在門外，手裡的課本掉到地上。\n\n會議結束，神崎遼走出來，看見她，腳步頓了一下。\n\n「你……你根本就會說中文！」她氣得聲音發抖，「那我這三個月在教什麼？」\n\n他沒解釋，只是把她拉進旁邊的空會議室，反手關上門，一手撐在她身後的白板上。\n\n「生氣了？」\n\n「當然生氣！你騙我！」\n\n「對。」他低頭看她，眼神第一次不再慵懶，而是{本当|ほんとう}的認真，「[[〈間違:まちが〉えたのは、わざとだ。::我是故意說錯的。]]」\n\n「為什麼？」\n\n「因為只有我說錯的時候，妳才會一直看著我。」他說，「{簡単|かんたん}的道理。」\n\n知恩的臉一下子燒起來。\n\n「一年前，妳在神保町的書店打工。我想買一本中文詩集，妳用{下手|へた}的日文，花了二十分鐘向我解釋一首詩。」他的聲音低下來，「那首詩最後一句是『我想你』。我記到現在。」\n\n「所以……」\n\n「所以我想了一個最笨的辦法，讓妳每週來見我兩次。」\n\n他捏起她的下巴，用標準得過分的中文說：「林老師，今天的{授業|じゅぎょう}，換我來{教える|おしえる}。」\n\n「教什麼？」\n\n「教妳，」他低頭吻住她，吻得又慢又深，「什麼叫做{欲しい|ほしい}。」\n\n吻完，他抵著她的額頭，終於用中文、一字一字地說：\n\n「我、想、妳。」\n\n這一次，一個字都沒有{間違える|まちがえる}。", "blurb": "她是總裁的中文家教，他卻總把「老師」說成「老婆」。「我是故意說錯的。」", "gram": {"pt": "〜てもいい", "mean": "可以～嗎／～也沒關係（許可）", "how": "動詞て形＋もいい（座る→座って→座ってもいい）", "ex": "〈隣:となり〉に〈座:すわ〉ってもいいか。", "exzh": "可以坐妳旁邊嗎？"}, "boss": {"name": "神崎遼", "yomi": "かんざき りょう", "mark": "遼", "c1": "#1a1f4d", "c2": "#4b5fc7"}}, {"id": "A6", "title": "總裁的便當小偷", "band": "N5-N4", "text": "會計部的吳小晴，每天中午都在頂樓的小花園，一個人吃自己做的{弁当|べんとう}。\n\n那是她在東京唯一的小確幸：一份煎得剛剛好的玉子燒、三種顏色的{野菜|やさい}、媽媽教她的滷肉。\n\n直到那天，她的便當不見了。\n\n隔天又不見了。第三天，她決定躲在花園的柱子後面，抓住這個小偷。\n\n十二點零五分，一個穿著深灰色條紋西裝的男人走上頂樓，熟門熟路地打開她的便當盒，拿起她的{箸|はし}，一口一口吃了起來。\n\n小晴衝出去：「抓到了！你這個便當小偷——」\n\n男人抬起頭。\n\n她的聲音卡在喉嚨裡。那張臉，她只在公司年報上看過——朝霧集團的總裁，朝霧透。\n\n---\n\n「社、社長？」\n\n「{味|あじ}太淡。」朝霧透面不改色地放下{箸|はし}，「明天多放一點醬油。」\n\n「那是我的午餐！」\n\n「現在是我的。」他站起來，比她高了一個頭，伸手指著她的鼻尖，「[[〈明日:あした〉も〈作:つく〉らなければならない。::明天也得做。]]」\n\n「憑什麼？」\n\n「憑我{お腹|おなか}{空く|すく}。」\n\n小晴氣得說不出話。她想{怒る|おこる}，可是看著他吃得乾乾淨淨的便當盒，她又有點說不出的開心。\n\n---\n\n從那天起，她每天{作る|つくる}兩份{弁当|べんとう}。\n\n他從不說謝謝，只會挑剔：「{野菜|やさい}太多。」「玉子燒太甜。」「明天要有肉。」\n\n她嘴上{文句|もんく}一堆，手卻誠實地照做。\n\n直到某天中午，朝霧透沒有出現。\n\n第二天也沒有。第三天，她在會議室外聽到部長說：「社長這週都在大阪，聽說{忙しい|いそがしい}到連飯都沒時間吃。」\n\n她握著兩個早就{冷たい|つめたい}的便當盒，心裡空空的。原來，習慣一個人等另一個人，是這麼{寂しい|さびしい}的事。\n\n---\n\n週五晚上，小晴加班到九點。走出辦公室時，電梯門一打開，朝霧透站在裡面。\n\n他瘦了一點，眼睛下面有淡淡的青色。\n\n「我的{弁当|べんとう}呢？」他第一句話就問。\n\n「你三天沒來，我……」她忽然說不下去了，「我以為你吃膩了。」\n\n朝霧透看著她泛紅的眼眶，眉頭一下子皺起來。他跨出電梯，把她逼到走廊的牆邊，一手撐在她耳側。\n\n「誰准妳亂想的？」\n\n他從西裝口袋裡拿出一張摺得小小的紙條——是她第一天貼在便當盒上的：「今天也要加油喔。」\n\n「這個，我一直{隠す|かくす}在身上。」他說，「三年來，沒有人對我說過這句話。」\n\n小晴愣住了。\n\n「大阪的工作，我三天做完了五天的份。」他的聲音很低，「吃不到妳的飯，我很{困る|こまる}。」\n\n「所以，」他低頭看她，眼神霸道又溫柔，「[[お〈前:まえ〉の〈料理:りょうり〉しか〈食:た〉べない。::我只吃妳做的菜。]]這輩子都是。」\n\n「你這是要我當你的廚師嗎？」\n\n「不是廚師。」他吻住她，吻得很輕，像在嚐一道很{大切|たいせつ}的菜。\n\n「是社長夫人。」\n\n那天晚上，他們在公司樓下的便利商店，分著吃了一個飯糰。小晴覺得，那是她吃過最{美味しい|おいしい}的晚餐。", "blurb": "每天偷吃她便當的男人，竟然是總裁。「明天也得做。我只吃妳做的菜。」", "gram": {"pt": "〜なければならない", "mean": "必須～、得～", "how": "動詞ない形去い＋ければならない（作らない→作らなければならない）", "ex": "〈明日:あした〉も〈作:つく〉らなければならない。", "exzh": "明天也得做。"}, "boss": {"name": "朝霧透", "yomi": "あさぎり とおる", "mark": "透", "c1": "#0f2f4f", "c2": "#3a86c8"}}, {"id": "A7", "title": "總裁的晨跑約定", "band": "N5-N4", "text": "每天{朝|あさ}六點，蘇小荷都會在代代木公園跑步。\n\n這是她來東京之後唯一的堅持。工作再累，不管{天気|てんき}好不好，她都會穿上那雙舊舊的白色{靴|くつ}，繞著公園{走る|はしる}三圈。\n\n直到那個男人出現。\n\n黑色運動服，黑色{帽子|ぼうし}壓得很低。他每天都在同一個轉角超過她，跑得又輕又{速い|はやい}，連頭都不回。\n\n第五天，小荷不服氣了。她咬著牙加速，跟在他身後整整一圈，跑到最後雙腿{重い|おもい}得像鉛，{疲れた|つかれた|疲れる}得差點倒在地上。\n\n男人終於停下來，回頭看她。帽簷下是一張好看得過分的臉。\n\n「妳跑得太{遅い|おそい}，還硬要追。」他遞給她一瓶水，「先{休む|やすむ}。不准逞強。」\n\n她氣得說不出話，只能大口大口地喝著水。\n\n---\n\n從那天起，他們每天早上一起跑。\n\n他話很少，卻會記得她的配速，在她跑不動的時候放慢腳步，在她的{汗|あせ}流進眼睛的時候，把毛巾丟到她頭上。\n\n「你為什麼每天都來？」她問。\n\n「{運動|うんどう}。」他回答得很簡短。\n\n「那你為什麼都在等我？」\n\n他沉默了一下，沒有回答，只說了一句：「[[〈明日:あした〉も、ここで〈待:ま〉っている。::明天，我也會在這裡等妳。]]」\n\n---\n\n一個月後，小荷的公司被併購了。新社長上任第一天，全體員工在大廳集合。\n\n她站在最後一排，看見台上的男人時，整個人僵住了。\n\n西裝筆挺，頭髮梳得一絲不苟——是每天早上跟她一起跑步的那個人。新社長，早瀬隼。\n\n會後，她被叫進社長室。\n\n「社長，你、你早就知道我是誰了？」\n\n「嗯。」早瀬隼關上門，一步一步走近她，「我知道妳每天六點跑步，知道妳在{晴れ|はれ}的早上跑三圈，下雨天也不肯偷懶。」\n\n她往後退，背貼上了冰涼的門。\n\n他一手撐在她耳邊，低頭看她：「[[〈恋:こい〉をしたことがあるか。::妳談過戀愛嗎？]]」\n\n「什、什麼？」\n\n「我沒有。」他說，「所以我不知道，每天五點{起きる|おきる}，提早一小時到公園，只為了超過一個女孩，算不算。」\n\n小荷的心跳快得像剛跑完十公里。\n\n「你……一直在等我追上你？」\n\n「對。」他的聲音低下來，「妳終於追上了。」\n\n然後他吻了她。很慢，很溫柔，卻一點也不給她逃跑的機會。\n\n「明天早上六點，」他抵著她的額頭說，「不准遲到。我會{頑張る|がんばる}跑慢一點。」", "blurb": "每天早上在公園超過她的男人，竟是公司的新社長。「妳談過戀愛嗎？」", "gram": {"pt": "〜たことがある", "mean": "曾經～過（經驗）", "how": "動詞た形＋ことがある（する→した→したことがある）", "ex": "〈恋:こい〉をしたことがあるか。", "exzh": "妳談過戀愛嗎？"}, "boss": {"name": "早瀬隼", "yomi": "はやせ じゅん", "mark": "隼", "c1": "#10314a", "c2": "#3f8fc4"}}, {"id": "A8", "title": "總裁的圖書館戀人", "band": "N5-N4", "text": "{夜|よる}九點，市立{図書館|としょかん}只剩下一個客人。\n\n何雨萱在這裡當夜班管理員兩年了，從沒見過這麼奇怪的人。\n\n他{毎晩|まいばん}八點準時出現，穿著昂貴的深色西裝，坐在靠窗的同一張{椅子|いす}上，借同一本書——一本厚厚的日文{辞書|じしょ}。\n\n「先生，」第十天，雨萱終於忍不住了，「這本辭典，你已經{借りた|かりた|借りる}十次了。」\n\n男人抬起頭。金絲{眼鏡|めがね}後面，一雙眼睛冷淡又好看。\n\n「嗯。」他說，「因為還沒{読む|よむ}完。」\n\n「那是辭典！不是{小説|しょうせつ}！」\n\n他沒回答，只是低下頭，繼續翻頁。\n\n---\n\n接下來的日子，雨萱開始偷偷觀察他。\n\n他看書的時候很{静か|しずか}，可是每次她推著書車經過，他翻頁的手就會停下來。她在櫃檯打瞌睡的時候，醒來總會發現身上多了一件西裝外套。\n\n有一天，她在他{返す|かえす}的辭典裡，發現了一張紙條。\n\n上面只有一行很漂亮的{字|じ}：「妳今天笑了三次。」\n\n雨萱的臉一下子紅了。\n\n---\n\n那天晚上，九點到了。她走過去提醒他：「先生，我們要{閉める|しめる}門了。」\n\n{図書館|としょかん}的{電気|でんき}一盞一盞熄滅，只剩下他桌上那一盞。\n\n男人站起來，把那本辭典放回書架，然後轉過身，把她困在書架和他之間。\n\n「你、你要做什麼？」\n\n「黒川律。」他說，「我叫黒川律。明天起，這間圖書館的所有新書，都由黒川集團捐贈。」\n\n「為什麼？」\n\n「因為我想每天光明正大地來。」他低頭看她，「[[〈本:ほん〉を〈読:よ〉みに〈来:き〉たんじゃない。〈君:きみ〉に〈会:あ〉いに〈来:き〉た。::我不是來讀書的，是來見妳的。]]」\n\n雨萱的心跳亂成一團：「那、那本辭典……」\n\n「我一頁都沒讀進去。」他承認得毫不心虛，「[[〈君:きみ〉を〈見:み〉ながら〈読:よ〉む〈本:ほん〉が、〈一番:いちばん〉〈面白:おもしろ〉い。::一邊看著妳一邊讀的書，最有趣。]]」\n\n{暗い|くらい}的圖書館裡，他低頭吻住她。很輕，很安靜，像怕吵醒滿屋子的書。\n\n「明天，」他在她耳邊說，「我還會來。這一次，我會真的讀一本書——讀妳。」", "blurb": "每晚借同一本辭典的西裝男人，一頁都沒讀過。「比起書，我是來見妳的。」", "gram": {"pt": "〜ながら", "mean": "一邊～一邊～", "how": "動詞ます形去ます＋ながら（見ます→見ながら）", "ex": "〈君:きみ〉を〈見:み〉ながら〈読:よ〉む〈本:ほん〉が、〈一番:いちばん〉〈面白:おもしろ〉い。", "exzh": "一邊看著妳一邊讀的書，最有趣。"}, "boss": {"name": "黒川律", "yomi": "くろかわ りつ", "mark": "律", "c1": "#18203f", "c2": "#566bb8"}}, {"id": "A9", "title": "總裁的颱風夜", "band": "N5-N4", "text": "{台風|たいふう}十九號登陸的那天晚上，張若晴還在公司加班。\n\n窗外的{風|かぜ}像野獸一樣吼叫，大樓的玻璃被雨打得劈啪作響。電車全部停駛，她沒辦法{帰る|かえる}。整層樓只剩下她——還有走廊盡頭那間辦公室。\n\n結城蒼，設計部的新總監，也是公司出了名的「冰山」。他上任一個月，已經退回她七次稿子。\n\n晚上十點，突然「啪」的一聲，所有的燈都{消えた|きえた|消える}。\n\n辦公室一片{暗い|くらい}。\n\n若晴從小就覺得黑夜很{怖い|こわい}。她縮在桌子底下，聽著窗外越來越大的{音|おと}，手抖得連手機都拿不穩。\n\n一道光照了過來。\n\n「張若晴。」是結城蒼的聲音，冷冷的，卻帶著一點急，「妳在哪裡？」\n\n---\n\n他找到她的時候，她正抱著膝蓋發抖。\n\n結城蒼蹲下來，把手機的光轉向旁邊，沒有直接照她的臉。\n\n「{大丈夫|だいじょうぶ}？」\n\n「我、我沒事……」話還沒說完，窗外一道{雷|かみなり}劈下來，她尖叫一聲，整個人撞進他懷裡。\n\n他僵了一秒，然後把她抱緊。\n\n「[[〈怖:こわ〉いなら、〈俺:おれ〉につかまっていろ。::怕的話，就抓緊我。]]」\n\n---\n\n那一夜很長。\n\n他從辦公室拿來一條{毛布|もうふ}裹住她，自己只穿著襯衫，坐在她旁邊。\n\n「你不{寒い|さむい}嗎？」\n\n「不冷。」他說完，打了一個噴嚏。\n\n若晴忍不住笑了。黑暗裡，她第一次覺得這座冰山好像沒那麼冷。\n\n「你為什麼一直退我的稿？」她小聲問。\n\n結城蒼沉默了很久。\n\n「因為妳每次改稿，都會來我辦公室找我。」他的聲音很低，「退七次，就能見妳七次。」\n\n若晴愣住了。\n\n「我知道這很幼稚。」他轉過頭看她，在手機微弱的光裡，他的眼神燙得驚人，「可是我不知道，還有什麼辦法能讓妳注意到我。」\n\n她的心跳亂成一團。\n\n「今晚就在這裡{泊まる|とまる}吧，」他說，「我陪妳。」\n\n窗外的風雨還在怒吼，他卻低頭，在她的額頭落下一個很輕的吻。\n\n「[[〈雨:あめ〉が〈止:や〉んだら、〈一緒:いっしょ〉に〈帰:かえ〉ろう。::雨停了的話，我們一起回家。]]」他說，「以後每一個颱風夜，我都會在。」\n\n天色漸漸{明るく|あかるく|明るい}起來的時候，雨停了。若晴醒來，發現自己靠在他肩上，身上蓋著他的西裝。\n\n而他一夜沒{眠る|ねむる}，只是{心配|しんぱい}地看著她。", "blurb": "颱風夜停電，退了她七次稿的冰山總監找到縮在桌下的她。「怕的話，就抓緊我。」", "gram": {"pt": "〜たら", "mean": "～的話、～之後（條件）", "how": "動詞た形＋ら（止んだ→止んだら）；い形容詞→かったら；な形容詞・名詞→だったら", "ex": "〈雨:あめ〉が〈止:や〉んだら、〈一緒:いっしょ〉に〈帰:かえ〉ろう。", "exzh": "雨停了的話，我們一起回家。"}, "boss": {"name": "結城蒼", "yomi": "ゆうき あおい", "mark": "蒼", "c1": "#0c2238", "c2": "#2f6f9f"}}, {"id": "A10", "title": "總裁的沖繩假期", "band": "N5-N4", "text": "公司員工旅遊，目的地是沖繩的一座小{島|しま}。\n\n江小魚站在沙灘上，看著眼前一望無際、{青い|あおい}的{海|うみ}，心裡只有一個念頭——千萬不要被叫下水。\n\n她名字叫小魚，卻完全不會{泳ぐ|およぐ}。\n\n同事們忙著拍照，一道低沉的聲音從身後傳來：「江小魚。」\n\n她一回頭，就看見穿著白襯衫、戴著墨鏡的社長——獅堂航。他是全公司最難親近的人，連笑都很少笑。\n\n「社、社長好！」\n\n「妳為什麼不下水？」\n\n「我……我怕{暑い|あつい}。」她隨便找了個藉口。\n\n獅堂航看了一眼她發抖的手指，什麼也沒說，只把自己的{帽子|ぼうし}戴到她頭上：「{太陽|たいよう}很大。別曬傷了。」\n\n---\n\n下午，同事們玩起了香蕉船。小魚被起鬨推上船，還沒反應過來，船就翻了。\n\n{冷たい|つめたい}的海水瞬間淹過頭頂。她拚命掙扎，卻越沉越深——\n\n下一秒，一隻手緊緊抓住了她。\n\n獅堂航把她抱上岸，臉色難看得嚇人：「不會游泳為什麼不說？」\n\n「我、我怕被大家笑……」她咳著水，眼淚掉了下來。\n\n他沉默地看著她，然後用力把她抱進懷裡，聲音第一次在發抖：「[[〈俺:おれ〉の〈手:て〉を〈離:はな〉すな。::不准放開我的手。]]以後不管去哪裡，都不准。」\n\n---\n\n{夕方|ゆうがた}，同事們去參加烤肉派對，小魚一個人坐在沙灘上。\n\n獅堂航走過來，在她身邊坐下。\n\n「海，還{怖い|こわい}嗎？」\n\n「有一點。」\n\n「那我{教える|おしえる}妳。」他說，「{毎日|まいにち}教一個小時，教到妳不怕為止。」\n\n「為什麼？社長你明明很忙……」\n\n他摘下墨鏡。那雙總是冷淡的眼睛，此刻映著整片橘紅色的{空|そら}。\n\n「三年前的面試，妳說妳的{夢|ゆめ}是有一天能在沖繩看夕陽。」他說，「這趟員工旅遊的地點，是我選的。」\n\n小魚愣住了。\n\n「我等這一天，等了三年。」他握住她的手，十指緊扣，「江小魚，[[ずっと〈俺:おれ〉のそばにいてほしい。::我希望妳一直待在我身邊。]]」\n\n腳下的{砂|すな}還留著太陽的溫度，海浪一陣一陣湧上來。他低頭吻住她，吻得很深，帶著海風的鹹味。\n\n那天晚上，滿天的{星|ほし}下，他教會了她一件事——\n\n原來被一個人緊緊抱著的時候，就算沉進海裡，也不會害怕。", "blurb": "不會游泳的她在沖繩翻船，救她上岸的是冷淡的社長。「不准放開我的手。」", "gram": {"pt": "〜てほしい", "mean": "希望（對方）～", "how": "動詞て形＋ほしい（いる→いて→いてほしい）", "ex": "ずっと〈俺:おれ〉のそばにいてほしい。", "exzh": "我希望妳一直待在我身邊。"}, "boss": {"name": "獅堂航", "yomi": "しどう わたる", "mark": "航", "c1": "#0d3550", "c2": "#2f9ac9"}}, {"id": "B1", "title": "總裁的逃婚新娘", "band": "N3-N2", "text": "京都，婚禮前一小時。\n\n沈若溪提著白紗裙擺，從飯店後門跑了出來——白紗太{目立つ|めだつ}，她不敢走正門。父親為了救公司，把她嫁給一個從沒見過面的日本財閥繼承人。關於那個男人，她只聽過一個傳聞：冷血、無情，從不准任何人{逆らう|さからう}他。\n\n這是一場契約婚姻，要把她{縛る|しばる}一輩子。而她，不想再{我慢|がまん}了。\n\n後門停著一輛黑色轎車。她拉開車門就鑽進後座：「麻煩快開車，有人在追我！」\n\n這是她人生第一次逃跑。她{慌てる|あわてる}得連鞋都跑掉了一隻。\n\n駕駛座上的男人沒動。後照鏡裡，一雙狹長的眼睛慢慢抬起來。\n\n「沈小姐，」他的中文帶著一點日本腔，低沉得好聽，「穿著婚紗上陌生人的車，妳對自己的安全，未免太不負責了。」\n\n「你怎麼知道我姓沈？」\n\n他沒回答，只是按下中控鎖。喀嚓一聲，在安靜的車廂裡格外清楚。\n\n「讓我下車！」她{怒鳴った|どなった|怒鳴る}。她用力扳著門把，指尖都發白了。\n\n「{慌てる|あわてる}什麼？」男人終於轉過頭。他的西裝領口別著一朵白玫瑰——和婚禮請帖上，新郎的胸花一模一樣，「別白費力氣了，{諦めろ|あきらめろ|諦める}。」\n\n沈若溪的心跳停了一拍。\n\n「一ノ瀬蓮。」他自我介紹得慢條斯理，「妳今天的新郎。」\n\n---\n\n她被帶回了飯店，卻沒有被押進禮堂。\n\n一ノ瀬蓮把她關進頂樓套房，扯下領帶扔在沙發上，像在談一筆生意：「我們重新{話し合い|はなしあい}一次。」\n\n「我跟你沒什麼好談的。」\n\n「妳父親的公司欠了三十億，」他淡淡地說，「婚禮取消，明天銀行就會抽貸。這不是威脅，是現實。」\n\n沈若溪咬著唇，眼眶發紅。{悔しい|くやしい}——她恨這種被人捏在手心裡的感覺。\n\n「那你呢？你為什麼要娶一個連面都沒見過的女人？」\n\n他看著她，眼底閃過一絲她看不懂的情緒。「{条件|じょうけん}很簡單。」他伸出三根手指，「第一，婚後一年，妳住在我家。第二，不准對別的男人笑。第三——」\n\n「第三是什麼？」\n\n「等妳愛上我的那天，要親口告訴我。」\n\n她氣笑了：「你也太有自信了吧？開什麼{冗談|じょうだん}。」\n\n「我從不開{冗談|じょうだん}。[[〈逃:に〉がすわけにはいかない。::我不可能放妳走。]]」他俯身，把一枚戒指套進她的無名指，尺寸剛剛好，「沈若溪，我{誓う|ちかう}，我是{真剣|しんけん}的。」\n\n---\n\n婚後的日子，比她想像中奇怪。\n\n一ノ瀬蓮在外人面前冷得像一座冰山，回到家卻記得她不吃香菜、怕打雷。她夜裡被雷聲驚醒，總會發現他坐在床邊的椅子上，手裡拿著一份沒翻幾頁的文件。\n\n「你在這裡做什麼？」\n\n「這是我家。」他{図々しい|ずうずうしい}地說。\n\n「我不想給你添麻煩……」\n\n「妳是我的{花嫁|はなよめ}，」他頭也不抬，「妳的事，從來不是麻煩。」\n\n她以為自己會一直討厭他。直到那天在酒會上，一位姓藤原的學長走過來，笑著和她聊了幾句。\n\n回家的車上，一ノ瀬蓮一句話都沒說。\n\n進門的瞬間，他把她按在玄關的牆上，聲音冷得像冰：「第二條{条件|じょうけん}，妳忘了？」\n\n「我只是跟學長打招呼——」\n\n「妳對他笑了三次。」他低頭逼近，鼻尖幾乎碰到她，「妳以為我真的不會吃醋？對我{素直|すなお}一點，說，妳心裡到底有沒有我。」\n\n「是又怎麼樣，不是又怎麼樣？」她嘴硬。\n\n「是，我就吻妳；不是，我就吻到妳承認為止。」\n\n她心跳亂成一團：「你為什麼……這麼執著？」\n\n他沉默片刻，終於從西裝內袋拿出一張泛黃的舊照片。照片上是十二歲的她，在台北的醫院走廊裡，替一個哭著找媽媽的日本男孩擦眼淚。\n\n「這是我藏了十年的秘密。」他的聲音第一次有了裂縫，「這門婚事，不是妳父親求來的。是我花了十年，才終於有資格去提親。」\n\n沈若溪的眼淚掉了下來。原來那些偶然——雷雨夜的守候、餐桌上消失的香菜、剛剛好的戒指尺寸——全都不是巧合。\n\n「所以，」他抬手擦掉她的眼淚，語氣又恢復了那股不講理的強勢，「第三條，妳什麼時候要履行？」\n\n她紅著臉{睨む|にらむ}他：「你這個{憎らしい|にくらしい}的人！」\n\n「嗯，我是。」他毫不否認，低頭吻住她，吻得又深又慢，直到她揪著他的襯衫、忘了呼吸。\n\n「說。」他抵著她的唇，低聲命令。\n\n她終於投降：「……我愛上你了。」\n\n一ノ瀬蓮笑了，那是她第一次看見這座冰山真正地笑。\n\n「[[〈覚悟:かくご〉しろ。::做好覺悟吧。]]一ノ瀬太太。」他在她耳邊{囁いた|ささやいた|囁く}，「這輩子，妳都別想再逃了。」", "blurb": "婚禮前一小時逃婚，卻鑽進了新郎的車。「別白費力氣了，妳今天的新郎是我。」", "gram": {"pt": "〜わけにはいかない", "mean": "（因為情理、立場）不能～", "how": "動詞辭書形＋わけにはいかない", "ex": "〈逃:に〉がすわけにはいかない。", "exzh": "我不可能放妳走。"}, "boss": {"name": "一ノ瀬蓮", "yomi": "いちのせ れん", "mark": "蓮", "c1": "#101f45", "c2": "#3a5dc2"}}, {"id": "B2", "title": "總裁的離婚協議書", "band": "N3-N2", "text": "結婚三週年的紀念日，蘇晚把一份{書類|しょるい}放在久我征司的辦公桌上。\n\n離婚協議書。她已經簽好了名字。\n\n三年前，為了救父親的工廠，她嫁給了這個東京最年輕的財閥總裁。說好是一場三年的契約婚姻，他給錢，她扮演一個安靜的妻子。\n\n三年來，他對她{相変わらず|あいかわらず}冷淡。他晚歸、不解釋，還一副{平気|へいき}的樣子，她傳的訊息總是被他{無視|むし}。這個月，八卦雜誌更是登滿了他和女明星深夜出入飯店的照片。\n\n她已經{我慢|がまん}了三年，不想再當一個透明人了。\n\n久我征司低頭看著那份{書類|しょるい}，看了很久，久到辦公室的空氣都快凝固。\n\n然後，他把它撕成兩半。\n\n「你做什麼！」\n\n「[[〈離婚:りこん〉なんか、するものか。::離婚？我才不會答應。]]」他把碎紙丟進垃圾桶，語氣平靜得可怕，「契約上寫的是三年，不是三年就結束。」\n\n「你這也太{強引|ごういん}了！」\n\n「是。」他承認得毫不猶豫。\n\n---\n\n蘇晚搬回了娘家。\n\n第一天，他的車停在她家門口。第二天，她最愛的那家甜點店，把整間店的蛋糕都送到了她家。第三天，他親自來{出迎える|でむかえる}她，站在門外，從天亮站到天黑。\n\n她從窗簾縫裡看著他，心亂成一團。其實她{恋しい|こいしい}得要命。她不懂，一個從不{頼る|たよる}任何人、也從不讓任何人{頼る|たよる}的男人，為什麼要做到這種地步。\n\n「蘇小姐，」管家終於看不下去，「先生其實……」\n\n「我不想聽。」她打斷他，「我已經下定決心要離開他了。」\n\n---\n\n第七天晚上，她收到一個地址。\n\n是她母親生前開的那間小食堂。五年前，因為欠債被拍賣，她以為這輩子再也回不去了。\n\n推開門，裡面的桌椅、牆上的菜單、媽媽最喜歡的那盞黃色吊燈，全都和記憶裡一模一樣。\n\n久我征司站在櫃檯後面。\n\n「這是……」\n\n「這三年，我花了很多時間，一間一間找回被賣掉的東西。」他說，「那個女明星是我表妹，她認識這間店現在的屋主，幫我談了半年。每天晚歸，是因為我在這裡，一塊一塊地把它修回原來的樣子。」\n\n蘇晚的眼淚掉了下來：「那你為什麼不說？」\n\n「說了，就不是驚喜了。」他走過來，「我本來想在今天的紀念日送給妳。結果妳送了我一份離婚協議書。」\n\n「是你不解釋，我才會{誤解|ごかい}……」\n\n「對，是我的錯。」他把她逼到牆邊，一手撐在她耳側，低頭看她，眼神卻一點也不像在認錯，「但是蘇晚，妳{勘違い|かんちがい}了一件事。」\n\n「什麼？」\n\n「那份契約，從第一天開始，就是我設計的。」他的聲音壓得很低，「工廠的債，是我讓人放出風聲，妳父親才會來找我。我等的，從來不是三年。」\n\n她{呆れた|あきれた|呆れる}地瞪大了眼睛：「你、你這個騙子！」\n\n「嗯。」他毫不{悔やむ|くやむ}，低頭吻住她，吻得又凶又深，像要把這七天的思念全部討回來。\n\n吻完，他抵著她的額頭，用日文說：「[[お〈前:まえ〉はどこにも〈行:い〉かせない。::我哪裡都不會讓妳去。]]」\n\n「如果我還是要走呢？」\n\n「那我就買下妳要去的每一個地方。」他{誓った|ちかった|誓う}，「{結局|けっきょく}，妳還是會回到我身邊。」\n\n蘇晚哭著笑了。他們終於{仲直り|なかなおり}了。黃色的吊燈下，一切都和記憶裡一樣溫暖，只是多了一個不講理的男人。", "blurb": "契約婚姻三週年，她遞上離婚協議書。他撕成兩半：「離婚？我才不會答應。」", "gram": {"pt": "〜ものか", "mean": "才不～！（強烈否定，男性口氣）", "how": "動詞辭書形／な形容詞な＋ものか；女性口語多用「〜もんか」", "ex": "〈離婚:りこん〉なんか、するものか。", "exzh": "離婚？我才不會答應。"}, "boss": {"name": "久我征司", "yomi": "くが せいじ", "mark": "征", "c1": "#0c2a3d", "c2": "#2b7199"}}, {"id": "B3", "title": "總裁的勝負遊戲", "band": "N3-N2", "text": "江知夏是東京業界最難約的{通訳|つうやく}。\n\n一場跨國併購談判，她站在甲方老闆身邊，把對手公司的每一句話翻得精準又漂亮。對面坐著的，是霧島集團的總裁——霧島響。\n\n傳聞裡，他二十八歲就吞下三家公司，是業界最可怕的{相手|あいて}。\n\n談判進行到一半，霧島響忽然放下文件，不看她的老闆，只{見詰める|みつめる}她：「妳，開個價。」\n\n全場安靜。\n\n「霧島先生，請您專心談生意。」知夏面不改色。\n\n「我很專心。」他靠回椅背，嘴角微微上揚，「我看上的交易，是妳。年薪，是妳現在的三倍。」\n\n「我{断る|ことわる}。」\n\n---\n\n接下來一個月，霧島響挖了她三次，她{断る|ことわる}了三次。\n\n第四次，他直接出現在她的翻譯教室門口，穿著深灰色西裝，手裡拿著兩杯咖啡。\n\n「江小姐，來一場{勝負|しょうぶ}吧。」\n\n「我沒興趣。」\n\n「妳怕輸？」\n\n這三個字，精準地踩中了她的自尊心。這是明目張膽的挑釁，她不想{ためらう|ためらう}。知夏轉過身，抬起下巴：「比什麼？」\n\n「下週的國際論壇，妳替我翻譯。只要我挑出妳一個錯，妳就來當我的專屬口譯。」\n\n「如果你挑不出來呢？」\n\n「那我這輩子不再出現在妳面前。」\n\n這個男人太{生意気|なまいき}了。知夏冷笑：「成交。」\n\n---\n\n論壇那天，霧島響故意講得又快又難，夾雜大量專業術語和冷門成語。知夏連喝水的時間都沒有，卻翻得{見事|みごと}，一個字都沒有漏掉。\n\n散場時，台下響起{拍手|はくしゅ}。\n\n她走下台，得意地看著他：「霧島先生，你輸了。」\n\n他卻笑了：「{惜しい|おしい}。妳最後一句，把『我願意』翻成了『我同意』。」\n\n「那句話根本……」她愣住了。最後一句，是他突然加上的。\n\n——「如果有一天，我向一個女人求婚，我希望她說：我願意。」\n\n她確實譯成了「我同意」。\n\n「妳的本事，我很{評価|ひょうか}。」霧島響慢慢{迫ってきた|せまってきた|迫る}，把她逼到講台後面的布幕旁，一手撐在她耳邊，「可是，[[〈負:ま〉けたからには、〈約束:やくそく〉は〈守:まも〉ってもらう。::既然輸了，就得遵守約定。]]」\n\n「你耍賴！這是陷阱！」\n\n「商場上，只看結果。」他低頭看她，眼神燙得驚人，「我從三年前第一次聽妳翻譯，就{狙う|ねらう}妳了。」\n\n知夏的臉一下子燒起來：「你到底想怎樣？」\n\n「我想要的，從來不是一個{通訳|つうやく}。」他的聲音壓得很低，「[[お〈前:まえ〉の〈本音:ほんね〉が〈聞:き〉きたい。::我想聽妳的真心話。]]妳真的那麼討厭我？」\n\n她咬著唇，{強引|ごういん}的男人她見多了，卻第一次答不出來。\n\n如果真的討厭，她為什麼每一次都{断る|ことわる}，卻每一次都忍不住等他出現？\n\n「不說話，就是不討厭。」他得寸進尺，低頭吻住她。這個吻帶著勝利者的強勢，也帶著一點小心翼翼，像在{確かめる|たしかめる}她會不會推開。\n\n她沒有推開。\n\n很久以後，他才放開她，在她耳邊低聲說：「下次，記得翻對。」\n\n「哪一句？」\n\n「『我願意』。」他笑了，「我會讓妳說的。」", "blurb": "拒絕他三次的王牌口譯，答應了一場勝負。「既然輸了，就得遵守約定。」", "gram": {"pt": "〜からには", "mean": "既然～就（一定要）～", "how": "動詞普通形＋からには，後面接決心、義務或要求", "ex": "〈負:ま〉けたからには、〈約束:やくそく〉は〈守:まも〉ってもらう。", "exzh": "既然輸了，就得遵守約定。"}, "boss": {"name": "霧島響", "yomi": "きりしま ひびき", "mark": "響", "c1": "#0e1730", "c2": "#3d4f8f"}}, {"id": "B4", "title": "總裁的失憶妻子", "band": "N3-N2", "text": "葉初醒來的時候，第一眼看見的，是一個陌生的男人。\n\n他坐在病床邊，西裝皺了，下巴冒出青色的鬍渣，一雙眼睛紅得像三天沒睡。\n\n「妳醒了。」他的聲音沙啞得厲害。\n\n「請問……你是誰？」\n\n男人的身體僵住了。\n\n醫生說，一場小小的交通事故，讓她失去了最近三年的{記憶|きおく}。她只記得自己二十二歲，剛從台北來東京念研究所。\n\n而眼前這個男人，東條集團的總裁東條朔，說他是她的丈夫。\n\n「不可能。」葉初搖頭，「我怎麼可能嫁給一個{他人|たにん}？我們以前是戀人嗎？」她覺得這個男人很{怪しい|あやしい}。\n\n東條朔{見詰めた|みつめた|見詰める}她，眼底有什麼東西碎掉了。\n\n---\n\n出院後，她被帶回一棟大得像美術館的房子。衣櫃裡掛著她的衣服，浴室裡擺著她慣用的洗髮精，客廳的牆上掛著兩個人的婚紗照。\n\n照片裡的她，笑得很幸福。\n\n洗髮精的味道有點{懐かしい|なつかしい}，可是她一點也想不起來，腦中一片空白。這種感覺讓她很不安，好像住在別人的人生裡。\n\n「我想搬出去住一陣子。」第三天晚上，她{ためらう|ためらう}了很久，才鼓起勇氣{言い出した|いいだした|言い出す}，「在{状況|じょうきょう}弄清楚以前……」\n\n東條朔放下手中的文件，{振り向いた|ふりむいた|振り向く}。\n\n「不行。」\n\n「這是我的自由！」\n\n他站起來，一步一步把她逼到牆邊。她的背貼上冰涼的牆，他的手撐在她耳側，把她困在他的氣息裡。\n\n「[[〈全部:ぜんぶ〉〈忘:わす〉れたとしても、お〈前:まえ〉は〈俺:おれ〉の〈妻:つま〉だ。::就算妳全都忘了，妳還是我的妻子。]]」他低頭看她，眼神霸道又痛苦，「妳要{確かめる|たしかめる}什麼，我都陪妳。但是，不准離開這個家。」\n\n---\n\n那天晚上，她在書房的抽屜裡，找到一本日記。\n\n是她自己的字。\n\n「今天，東條朔又冷著一張臉來圖書館。他說只是路過，可是他已經『路過』了四十七次。」\n\n「他向我告白了。用一種很不講理的方式：『我不接受拒絕。』」\n\n「我好像，真的愛上這個霸道的男人了。」\n\n一頁一頁翻下去，{思い出|おもいで}像潮水一樣湧回來。最後一頁，日期是車禍的前一天：\n\n「明天要告訴他一個{秘密|ひみつ}。一定能{驚かす|おどろかす}他。」\n\n葉初的手開始發抖。\n\n---\n\n書房的門被推開，東條朔站在門口，看見她手上的日記，整個人僵住了。\n\n「妳……想起來了？」\n\n她看著他，眼淚一顆一顆掉下來：「東條朔，你這個笨蛋。我忘了你，你為什麼不直接把日記給我看？」\n\n「因為我想證明一件事。」他走過來，聲音啞得不像話，「就算沒有過去，妳也會再一次愛上我。」\n\n「如果我沒有呢？」\n\n「那我就再追妳四十七次。」他抬起她的下巴，「[[もう〈一度:いちど〉、〈俺:おれ〉を〈好:す〉きになれ。::再愛上我一次。]]這是命令。」\n\n她破涕為笑，踮起腳尖，先吻了他。\n\n東條朔只愣了一秒，就反客為主，緊緊抱住她，吻得又深又重，像要把這幾天的恐懼全部吞下去。\n\n她輕輕{慰めた|なぐさめた|慰める}他：「我回來了。」\n\n「對了，」她靠在他胸口，小聲說，「日記裡寫的那件事，你想知道嗎？」\n\n「說。」\n\n「我想跟你，再辦一次婚禮。」她紅著臉，「這次，我要{正直|しょうじき}地告訴所有人——是我先愛上你的。」\n\n東條朔笑了。那是她醒來以後，第一次看見他笑。", "blurb": "車禍醒來忘了三年，陌生的總裁說是她丈夫：「就算妳全都忘了，妳還是我的妻子。」", "gram": {"pt": "〜としても", "mean": "就算～也～（假設讓步）", "how": "普通形＋としても", "ex": "〈全部:ぜんぶ〉〈忘:わす〉れたとしても、お〈前:まえ〉は〈俺:おれ〉の〈妻:つま〉だ。", "exzh": "就算妳全都忘了，妳還是我的妻子。"}, "boss": {"name": "東條朔", "yomi": "とうじょう さく", "mark": "朔", "c1": "#13284a", "c2": "#6a8ed6"}}, {"id": "B5", "title": "總裁的冷面律師", "band": "N3-N2", "text": "東京丸之內，氷室法律事務所。\n\n葉以晴來上班的第一天，就聽說了老闆的外號——「冰室的閻王」。\n\n氷室慧，三十二歲，打贏過九十九場官司，從沒輸過。金框眼鏡後面那雙眼睛，看人的時候像在審判。\n\n「葉以晴。」他頭也不抬，「妳的{書類|しょるい}有三個錯字。」\n\n「對不起！我馬上改——」\n\n「在我這裡，」他終於抬起頭，眼神{険しい|けわしい}得讓她發冷，「沒有『馬上』，只有『已經』。」\n\n---\n\n以晴從小就{憧れる|あこがれる}當律師。可是家裡沒錢，她只能先當助理，一邊工作一邊準備考試。\n\n在氷室事務所的每一天都{慌ただしい|あわただしい}。她整理資料到深夜，為了辦{手続き|てつづき}跑遍半個東京，連吃飯都站著吃。\n\n氷室慧從不誇她。他只會在她交出文件時，用紅筆圈出問題，冷冷地說：「不准{怠る|おこたる}。」\n\n可是她漸漸發現，每次她加班到最後，他辦公室的燈也從來沒有熄過。\n\n---\n\n那天，一份大案子文件的{締め切り|しめきり}是下午五點。\n\n四點半，以晴發現自己弄丟了一份關鍵證據的影本。她翻遍整間辦公室，咬著{唇|くちびる}，手抖得連抽屜都拉不開。\n\n「怎麼了？」氷室慧站在門口。\n\n「我……我把證據影本弄丟了。」她的聲音在發抖，「我完全沒有{心当たり|こころあたり}……」\n\n她以為他會大發雷霆。\n\n可是他只是走過來，從她身邊的櫃子最下層，抽出一個資料夾。\n\n「昨天妳放錯地方了。我替妳收好了。」他看了一眼手錶，「還有二十八分鐘。去送件。」\n\n以晴抱著資料夾衝出去，五點前一分鐘，成功送達。\n\n---\n\n那天晚上，辦公室只剩他們兩個人。\n\n「為什麼幫我？」以晴忍不住問，「你明明說過，在你這裡，沒有失誤的空間。」\n\n氷室慧摘下眼鏡，揉了揉眉心。沒有眼鏡的他，看起來不那麼像閻王了。\n\n「妳每天最早來、最晚走。妳整理的東西，連我都挑不出毛病。」他站起來，一步一步{近寄る|ちかよる}，「[[〈認:みと〉めざるを〈得:え〉ない。〈君:きみ〉は〈優秀:ゆうしゅう〉だ。::我不得不承認，妳很優秀。]]」\n\n以晴的心跳亂成一團，往後退，背卻碰到了書架。\n\n他一手撐在書架上，低頭{見下ろす|みおろす}她。那雙總是審判別人的眼睛，此刻只裝著她一個人。\n\n「所以，妳這個錯，我來{補う|おぎなう}。」他說，「以後妳每一個錯，都由我來補。」\n\n「你……你對每個助理都這樣嗎？」\n\n「妳覺得呢？」他抬起手，輕輕{撫でる|なでる}過她的頭髮。\n\n「我、我反應很{鈍い|にぶい}，你直接說清楚……」\n\n氷室慧笑了。那是她第一次看見閻王笑。\n\n「那我就說清楚。」他低頭吻住她，吻得很克制，卻在她揪住他領帶的那一刻，徹底失了控。\n\n很久以後，他才抵著她的額頭，聲音沙啞：「[[〈俺:おれ〉の〈側:そば〉を〈離:はな〉れるな。::不准離開我身邊。]]這是我這輩子，唯一一場不打算贏的官司。」\n\n「什麼意思？」\n\n「我願意輸給妳。」\n\n她再也{堪える|こらえる}不住，笑出了眼淚。原來閻王，也可以這麼{頼もしい|たのもしい}。", "blurb": "冷面律師從不誇她，卻在她闖禍時默默收拾。「我不得不承認，妳很優秀。」", "gram": {"pt": "〜ざるを得ない", "mean": "不得不～（雖不情願也只能）", "how": "動詞ない形去ない＋ざるを得ない（認めない→認めざるを得ない；する→せざるを得ない）", "ex": "〈認:みと〉めざるを〈得:え〉ない。〈君:きみ〉は〈優秀:ゆうしゅう〉だ。", "exzh": "我不得不承認，妳很優秀。"}, "boss": {"name": "氷室慧", "yomi": "ひむろ けい", "mark": "慧", "c1": "#0b1a2e", "c2": "#35588f"}}, {"id": "B6", "title": "總裁的替身未婚妻", "band": "N3-N2", "text": "「只要演三個小時。」\n\n鳳条玲司把一張支票推到程小蔓面前，金額多到她數了兩次零。\n\n「今晚是我祖母的八十大壽。她最大的心願，就是看我{婚約|こんやく}。」他說，「妳只要扮演我的未婚妻，{上品|じょうひん}地{振舞う|ふるまう}，三個小時後，我們就是陌生人。」\n\n小蔓是個跑了三年龍套、連台詞都沒有的小演員。她看著那張支票，又看看眼前這個冷得像冰雕的男人。\n\n「成交。」\n\n---\n\n宴會廳的水晶燈，把每個人都{照らす|てらす}得閃閃發亮。\n\n小蔓穿著他準備的深藍色禮服，戴著一條{宝石|ほうせき}項鍊，挽著鳳条玲司的手臂走進去的那一刻，全場的目光都集中過來。\n\n「那就是玲司少爺的未婚妻？」「從沒聽過這號人物……」竊竊私語像潮水一樣湧來。\n\n她的手心冒汗。下一秒，鳳条玲司把她的手握得更緊，低頭在她耳邊{囁いた|ささやいた|囁く}：「別怕。妳只要看著我。」\n\n整晚，他把她{甘やかす|あまやかす}得不像話。替她剝蝦、替她擋酒、在她被親戚刁難時，不動聲色地把話接過去。\n\n連祖母都笑著說：「玲司從小就冷冰冰的，我第一次看他這麼{可愛がる|かわいがる}一個人。」\n\n小蔓知道這都是{演技|えんぎ}。可是心跳，好像不太聽話。\n\n---\n\n宴會結束，車停在她家樓下。\n\n「三個小時到了。」她把項鍊拿下來遞給他，臉上{浮かべる|うかべる}一個職業級的笑容，「謝謝你的支票，鳳条先生。我們就當不認識——」\n\n她的手腕被抓住了。\n\n鳳条玲司沒有接項鍊，而是傾身過來，一手撐在她身後的車窗上，把她困在座椅和他之間。\n\n「誰准妳走了？」\n\n「契約只到今晚——」\n\n「[[〈君:きみ〉は〈俺:おれ〉に〈惚:ほ〉れているに〈違:ちが〉いない。::妳一定是愛上我了。]]」他看著她，「不然，妳剛才為什麼不敢看我的眼睛？」\n\n「你、你也太{厚かましい|あつかましい}了吧！」\n\n「嗯。」他毫不否認，「我還有一件更{厚かましい|あつかましい}的事要告訴妳。」\n\n「什麼？」\n\n「今晚的宴會，不是為了讓祖母安心。」他的聲音低下來，「三個月前，我在一部爛片裡看到一個跑龍套的女孩。她只有一個鏡頭，卻是整部片裡唯一{本物|ほんもの}的東西。」\n\n小蔓愣住了。\n\n「我找了妳三個月，不打算再{逃がす|にがす}妳。」他說，「這張支票不是片酬，是我想{引き止める|ひきとめる}妳的手段。」\n\n「你這是……{冗談|じょうだん}吧？」\n\n「我不開{冗談|じょうだん}。」\n\n她的眼眶紅了：「可是我們之間，從頭到尾都是假的。」\n\n「[[〈偽物:にせもの〉でも〈構:かま〉わない。::就算是假的也無所謂。]]」他低頭吻住她，吻得又深又霸道，像要把今晚所有的演技都變成真的。\n\n「從今天起，」他抵著她的{唇|くちびる}說，「我會讓它一天比一天{本物|ほんもの}。」\n\n那條{宝石|ほうせき}項鍊，最後還是戴回了她的脖子上。\n這一次，沒有劇本。", "blurb": "只要演三小時的假未婚妻，他卻不肯放她走。「就算是假的也無所謂。」", "gram": {"pt": "〜に違いない", "mean": "一定是～（有把握的推測）", "how": "普通形＋に違いない（な形容詞、名詞不加だ）", "ex": "〈君:きみ〉は〈俺:おれ〉に〈惚:ほ〉れているに〈違:ちが〉いない。", "exzh": "妳一定是愛上我了。"}, "boss": {"name": "鳳条玲司", "yomi": "ほうじょう れいじ", "mark": "鳳", "c1": "#14213f", "c2": "#5577c9"}}, {"id": "B7", "title": "總裁的初戀重逢", "band": "N3-N2", "text": "十年後再見到柊誠，是在兩家公司的合併記者會上。\n\n林晚晴站在台下，{見上げる|みあげる}著台上那個西裝筆挺的男人，手裡的筆差點掉在地上。\n\n十年前，他是學校裡人人{羨む|うらやむ}的學長，也是她偷偷喜歡了三年的人。\n\n畢業那天，她鼓起勇氣寫了一封信，約他在車站見面。她在月台上等到最後一班電車，他卻沒有來。\n\n隔天，她聽到一個{噂|うわさ}：他全家搬去了國外。沒有道別，沒有回信。\n\n她{恨む|うらむ}過他很多年。\n\n---\n\n記者會結束，晚晴想趁人多從後門離開。\n\n「林晚晴。」\n\n那個聲音在走廊{響いた|ひびいた|響く}。十年了，她還是一聽就認得出來。他的出現，{却って|かえって}讓她更想逃。\n\n她沒有回頭，加快腳步往電梯走。身後的腳步聲卻{追いかけて|おいかけて|追いかける}上來。\n\n電梯門正要關上，一隻手擋住了門。柊誠走進來，按下關門鍵。\n\n狹小的空間裡，只剩下他們兩個人。\n\n「好久不見。」他說。\n\n「我們認識嗎？」她看著樓層數字，聲音冷得像冰。\n\n他沉默了一下，忽然伸手，把她困在電梯角落。\n\n「妳一直{思い込んで|おもいこんで|思い込む}，我那天是故意不來的？」\n\n「難道不是嗎？」她終於抬起頭，眼眶發紅，「我等到最後一班車！」\n\n「我知道。」他的聲音啞了，「因為那天晚上，我就站在對面的月台上。」\n\n晚晴愣住了。\n\n「我父親的公司破產，我們必須連夜離開。我想過去找妳，可是我什麼都給不了妳。」他說，「所以我只能在對面，{見送る|みおくる}妳搭上最後一班車。」\n\n原來一道月台，{隔てた|へだてた|隔てる}了他們十年。\n\n---\n\n她的{涙|なみだ}一下子掉了下來。\n\n「那你為什麼不寫信？為什麼十年都不聯絡？」\n\n「我寫了。」他從西裝內袋拿出一疊泛黃的信封，每一封都{重ねて|かさねて|重ねる}綁得整整齊齊，「一百二十封。一個月一封，全部沒有寄出去，因為我發誓，要等到有資格站在妳面前的那一天。」\n\n「……你這個笨蛋。」\n\n「嗯。」他抬手擦掉她的眼淚，「所以這次合併，是我主動提的。我{改めて|あらためて}來追妳。」\n\n「如果我已經不喜歡你了呢？」\n\n他低頭看著她，眼神霸道得一如十年前：「[[お〈前:まえ〉を〈忘:わす〉れるわけがない。::我怎麼可能忘了妳。]]妳也一樣。」\n\n「你憑什麼這麼肯定？」\n\n「因為妳剛才在台下，一直盯著我看。」\n\n她{黙る|だまる}了，咬著唇，終究還是心軟了。\n\n電梯到了一樓，門打開又關上，他卻沒有放開她。\n\n「十年前我沒能赴的那個約，」他低頭吻住她，吻得又深又急，像要把這十年全部補回來，「[[もう〈二度:にど〉と〈離:はな〉さない。::我再也不會放開妳。]]」\n\n原來那些她以為斷掉的線，從來都沒有斷。他們一直{繋がる|つながる}著。", "blurb": "十年前沒赴約的學長，成了合併公司的總裁。「我怎麼可能忘了妳。」", "gram": {"pt": "〜わけがない", "mean": "不可能～、怎麼會～（強烈否定）", "how": "普通形＋わけがない（な形容詞＋な／名詞＋の）", "ex": "お〈前:まえ〉を〈忘:わす〉れるわけがない。", "exzh": "我怎麼可能忘了妳。"}, "boss": {"name": "柊誠", "yomi": "ひいらぎ まこと", "mark": "柊", "c1": "#141c3a", "c2": "#4a5fae"}}, {"id": "B8", "title": "總裁的秘書試用期", "band": "N3-N2", "text": "「三個月。」神楽坂煌把合約丟在桌上，「撐得過試用期，就留下。撐不過，就走。」\n\n周以安是第十三任秘書。前面十二個，全都撐不住，{潰れて|つぶれて|潰れる}走了。\n\n神楽坂集團的年輕總裁，出了名的難伺候。他從不{威張る|いばる}，因為他根本不需要——只要一個眼神，整層樓都會安靜下來。沒有人能{逆らう|さからう}他的決定。\n\n第一天，以安{張り切って|はりきって|張り切る}提早兩小時到公司。\n\n第二天，她就{躓く|つまずく}了：會議資料少了一頁，被他當著所有人的面退回。\n\n「妳以為這裡是學校？」他冷冷地說，「我不需要會犯錯的人。」\n\n---\n\n以安沒有哭，也不肯{諦める|あきらめる}。她把每份文件檢查三遍，把他的行程背得滾瓜爛熟，連他的咖啡要幾度都記在本子上。她從不{怠る|おこたる}。\n\n一個月後，她{気付いた|きづいた|気付く}了一件事：神楽坂煌說「隨便」的時候，代表他很在意。\n\n兩個月後，公司一個大案子出了問題，所有人都在推卸責任，只有以安一個人{背負った|せおった|背負う}下來。她熬了三個通宵，把上百份文件全部{揃えた|そろえた|揃える}。\n\n會議結束後，神楽坂煌看了她很久，第一次開口：「……我對妳{見直した|みなおした|見直す}。」\n\n---\n\n試用期的最後一天，以安在茶水間聽見一個{噂|うわさ}。\n\n「總裁好像要她走。聽說他已經在找下一任了。」「她以為自己是誰？」\n\n她握著杯子的手微微發抖。也對，她本來就不是{恵まれた|めぐまれた|恵まれる}的人。\n\n她回到座位，把辭職信放在桌上，開始收拾東西。\n\n「妳在做什麼？」\n\n神楽坂煌站在她身後，手裡拿著那封辭職信，臉色難看得嚇人。\n\n「試用期結束了。我知道您在找下一任秘書——」\n\n他沒聽完，把辭職信撕成兩半，{強引|ごういん}地拉著她的手腕走進總裁室，反手鎖上門。\n\n「我在找的，不是秘書。」他把她按在門上，低頭逼近，「是能接替妳工作的人。」\n\n「什……什麼意思？」\n\n「因為我不想再讓妳當我的秘書。」他的聲音低下來，「當秘書，妳會一直叫我總裁。我想聽妳叫我的名字。」\n\n以安的臉一下子紅透了。她下意識想逃，他卻收緊了手臂。\n\n「[[〈好:す〉きなくせに、〈逃:に〉げるな。::明明喜歡我，就別逃。]]」\n\n「誰、誰喜歡你了！」\n\n「妳的本子上，記了我喝咖啡的溫度、我討厭的食物、我每次皺眉的原因。」他毫不留情地拆穿她，「這叫不喜歡？」\n\n她答不出來。\n\n他低頭吻住她，吻得霸道又不容拒絕：「[[お〈前:まえ〉は〈俺:おれ〉が〈選:えら〉んだ〈女:おんな〉だ。::妳是我選的女人。]]三個月前就是了。」\n\n原來這場試用期，被{試す|ためす}的從來不是她。是他在等，等她願意留下來。", "blurb": "撐過三個月試用期的第十三任秘書，總裁卻在找人接替她。「明明喜歡我，就別逃。」", "gram": {"pt": "〜くせに", "mean": "明明～卻～（帶責備語氣）", "how": "普通形＋くせに（な形容詞＋な／名詞＋の：好きなくせに）", "ex": "〈好:す〉きなくせに、〈逃:に〉げるな。", "exzh": "明明喜歡我，就別逃。"}, "boss": {"name": "神楽坂煌", "yomi": "かぐらざか こう", "mark": "煌", "c1": "#101a33", "c2": "#40549a"}}, {"id": "B9", "title": "總裁的倫敦時差", "band": "N3-N2", "text": "宗像恭介被調去倫敦的那天，成田機場下著小雨。\n\n「一年。」他在出境口前說，「最多一年，我就回來。」\n\n蘇念念用力點頭，笑著揮手，{見送る|みおくる}他的背影消失在人群裡，然後蹲在地上，哭得像個孩子。\n\n---\n\n東京和倫敦，{隔てる|へだてる}著九千六百公里，和九個小時的時差。\n\n她早上起床的時候，他剛要睡。她下班的時候，他才開始一天的工作。兩個人的時間，像永遠對不上的齒輪。\n\n念念學會了{我慢|がまん}。學會不在半夜打電話吵他，學會把想念{蓄える|たくわえる}起來，留到週末的視訊。\n\n可是想念越存越多。她越來越{恋しい|こいしい}他。\n\n她開始習慣看倫敦的天氣預報，習慣在手機裡設兩個時鐘，習慣在每一則訊息來的瞬間，心跳漏掉一拍。\n\n季節{巡って|めぐって|巡る}，東京下起了第一場雪。\n\n---\n\n第八個月，他的工作{長引いた|ながびいた|長引く}。\n\n「可能要再延半年。」視訊裡，宗像恭介的眼下有很深的黑眼圈，「抱歉。」\n\n「沒關係呀，」念念笑著說，「工作重要嘛。」\n\n掛掉電話，她一個人坐在漆黑的房間裡，{堪えて|こらえて|堪える}了很久的眼淚，終於掉了下來。\n\n那天是她的生日。他忘了。\n\n---\n\n隔天早上，門鈴響了。\n\n念念頂著哭腫的眼睛去開門，然後整個人僵在原地。\n\n宗像恭介站在門外，西裝皺巴巴的，手裡提著行李箱，頭髮上還沾著雪，手指{凍えて|こごえて|凍える}發紫。\n\n「你、你不是在倫敦——」\n\n話還沒說完，她就{飛び込んだ|とびこんだ|飛び込む}他的懷裡，被他抱得幾乎喘不過氣。\n\n「我搭了十四個小時的飛機。」他的聲音啞得厲害，「只能待二十四小時，然後就要{引き返す|ひきかえす}。」\n\n「那你為什麼要回來？」\n\n「因為昨天是妳的生日。」他把臉埋在她的頸窩，「視訊裡妳在笑，可是我看得出來，妳哭過。」\n\n念念再也忍不住，把臉埋進他胸口，{思い切り|おもいきり}地哭了出來。\n\n他把她抱得更緊：「[[お〈前:まえ〉に〈会:あ〉いたくてたまらなかった。::我想見妳，想得快瘋了。]]每一天都是。」\n\n---\n\n那天晚上，他們窩在小小的沙發上，窗外的雪靜靜地下著，整座城市都{静まった|しずまった|静まる}。\n\n「延長的半年，我拒絕了。」他忽然說。\n\n「什麼？可是你的工作……」\n\n「我跟董事會談好了，倫敦的案子，三個月內結束。」他捏起她的下巴，眼神霸道得一如往常，「[[〈距離:きょり〉なんて、〈俺:おれ〉が〈縮:ちぢ〉める。::距離這種東西，我來縮短。]]」\n\n「如果做不到呢？」\n\n「那我就把總公司搬到倫敦，」他說，「然後把妳一起帶走。」\n\n她笑出了眼淚。\n\n他低頭吻住她，吻得很慢，像要把這八個月的空白一點一點{埋めて|うめて|埋める}。\n\n「{間もなく|まもなく}，」他抵著她的額頭說，「我們就不用再看兩個時鐘了。」", "blurb": "東京和倫敦隔著九小時時差，他在她生日隔天出現在門口。「我想見妳，想得快瘋了。」", "gram": {"pt": "〜てたまらない", "mean": "～得受不了、非常～", "how": "い形容詞去い＋くて＋たまらない（動詞たい形同樣變化：会いたい→会いたくて）；な形容詞＋で＋たまらない", "ex": "お〈前:まえ〉に〈会:あ〉いたくてたまらなかった。", "exzh": "我想見妳，想得快瘋了。"}, "boss": {"name": "宗像恭介", "yomi": "むなかた きょうすけ", "mark": "恭", "c1": "#0e2742", "c2": "#3d79b5"}}, {"id": "B10", "title": "總裁的求婚花束", "band": "N3-N2", "text": "白芷的花店開在銀座一條安靜的巷子裡，小到只放得下三張椅子。\n\n每個星期一早上九點，同一個男人會推開店門。\n\n深灰色大衣，冷峻的眉眼，聲音低沉：「一束花。讓收花的人開心就好。」\n\n對一間小花店來說，這樣的常客實在很{有難い|ありがたい}。白芷每次都很用心：春天是鈴蘭，夏天是向日葵，秋天是滿天星。她把每一束花都包得{生き生き|いきいき}的，像把整個季節裝進他懷裡。\n\n她一直在猜，那個收花的人，是什麼樣的女孩。\n\n---\n\n第五十二個星期一，男人沒有來。\n\n白芷站在門口等到中午，手裡那束玫瑰慢慢{萎む|しぼむ}。\n\n她告訴自己，他大概是告白成功了，不需要再買花了。可是心裡空空的，像被什麼挖走了一塊。她甚至想{憎む|にくむ}他，卻怎麼也恨不起來。\n\n下午，一位律師走進店裡。\n\n「白小姐，鷲尾先生被大雪困在北海道的機場。」他說，「他交代，一定要把這個交給妳。」\n\n律師{預かる|あずかる}的是一個小盒子。盒子裡是五十一張卡片，每一張都寫著一個日期，和一句話。\n\n「今天的鈴蘭，跟她的笑容很像。」\n「她說向日葵代表『我只看著你』。她不知道，我說的就是她。」\n「今天她剪到手指，我差點衝進去。」\n\n白芷的手開始{震える|ふるえる}。\n\n那五十一束花，從來沒有送給任何人。他每次都帶回辦公室，一束一束地插起來，看著它們慢慢{枯れる|かれる}，再在下個星期一，回來買新的。\n\n---\n\n傍晚，店門被推開了。店裡一下子{静まった|しずまった|静まる}。\n\n鷲尾薫站在門口，大衣上全是雪，頭髮亂了，呼吸急促，像是一路跑過來的。\n\n「抱歉。」他說，「第五十二個星期一，我遲到了。」\n\n白芷努力撐住的表情一下子{崩れた|くずれた|崩れる}，眼淚掉了下來：「你這個騙子……那些花，根本沒有收花的人。」\n\n「有。」他走進來，一步一步把她逼到花架前。滿屋子的玫瑰{匂う|におう}著，濃得讓人頭暈。\n\n「收花的人，一直都是妳。」他低頭{見詰める|みつめる}她，「一年前我路過這裡，只是想買一束花送給客戶。可是看見妳的那一刻，我的心就被{奪われた|うばわれた|奪う}，再也回不來。」\n\n「那你為什麼不直接說？」\n\n「因為我怕。」這個冷了一輩子的男人，聲音第一次在發抖，「怕我一開口，妳就不肯再對我笑了。」\n\n他捧起她的{頬|ほお}：「[[〈君:きみ〉に〈会:あ〉わずにはいられなかった。::我就是忍不住想來見妳。]]一個星期一次，已經是我能{堪える|こらえる}的極限。」\n\n他從大衣口袋拿出一枚戒指，單膝跪在一地{散った|ちった|散る}的花瓣上。\n\n「白芷。」他 /* ---------- 儲存 ---------- */
const KEY='jpBoss1';

function checkin(){const t=today(); if(!P.days.includes(t)) P.days.push(t); save()}
function streak(){let n=0,d=new Date(); const has=x=>P.days.includes(x.toISOString().slice(0,10));
  const f=x=>{const y=new Date(x.getTime()-x.getTimezoneOffset()*6e4);return has(y)};
  if(!f(d)) d.setDate(d.getDate()-1); while(f(d)){n++; d.setDate(d.getDate()-1)} return n}

/* ---------- 文字呈現 ---------- */
const disp=k=>D[k].w||k;
const kanaLine=t=>t.replace(RB,(m,a,r)=>r);
const rubyLine=t=>P.mode==='kana'? esc(kanaLine(t)) : esc(t).replace(RB,(m,a,r)=>`<ruby>${a}<rt>${r}</rt></ruby>`);
const rubyEx=t=>P.mode==='kana'? esc(t.replace(TOK,(m,a,r)=>r||a)) : esc(t).replace(TOK,(m,a,r)=>r?`<ruby>${a}<rt>${r}</rt></ruby>`:a);
const speakEx=t=>t.replace(TOK,(m,a,r)=>r||a);
function wordHTML(s,r,k){
  const e=D[k]; const g = e.zh===s||e.zh===k ? '' : `<span class="g">（${e.zh}）</span>`;
  const inner = !r ? s : P.mode==='kana' ? r : `<ruby>${s}<rt>${r}</rt></ruby>`;
  return `<span class="w${P.book.includes(k)?' saved-w':''}" tabindex="0" role="button" data-k="${k}" data-s="${esc(s)}">${inner}</span>${g}`;
}
function renderBody(txt){
  return txt.split(/\n\s*\n/).map((p,i)=>{
    if(p.trim()==='---') return '<hr>';
    let h=''; let last=0; const re=/\[\[(.+?)::(.+?)\]\]|\{([^{}|]+)(?:\|([^{}|]+))?(?:\|([^{}|]+))?\}/g; let m;
    while((m=re.exec(p))){ h+=esc(p.slice(last,m.index)); last=re.lastIndex;
      if(m[1]) h+=`<span class="jl" role="button" tabindex="0" data-say="${esc(kanaLine(m[1]))}">${rubyLine(m[1])}</span><span class="jlz">（${esc(m[2])}）</span>`;
      else h+=wordHTML(m[3],m[4],m[5]||m[3]); }
    h+=esc(p.slice(last));
    return `<p data-p="${i}">${h}</p>`;
  }).join('');
}
function wordsOf(s){const o=[];for(const m of s.text.matchAll(TOK)){const k=m[3]||m[1]; if(!o.includes(k)) o.push(k)} return o}
function linesOf(s){return [...s.text.matchAll(JA)].map(m=>({ja:m[1],zh:m[2]}))}
const lvStories=lv=>S.filter(s=>s.band===lv);

/* ---------- 動詞變化 ---------- */
const A={'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
const I={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
const TE={'う':'って','つ':'って','る':'って','む':'んで','ぶ':'んで','ぬ':'んで','く':'いて','ぐ':'いで','す':'して'};
function conj(w,vt){const st=w.slice(0,-1),u=w.slice(-1);
  if(vt==='v1') return {'ます形':st+'ます','て形':st+'て','ない形':st+'ない','た形':st+'た'};
  const te=(w==='行く')?st+'って':st+TE[u];
  return {'ます形':st+I[u]+'ます','て形':te,'ない形':st+A[u]+'ない','た形':te.replace(/て$/,'た').replace(/で$/,'だ')};}

/* ---------- 語音 ---------- */
let VO=[];
function loadV(){try{VO=speechSynthesis.getVoices()}catch(e){VO=[]}}
loadV(); try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
const rank=v=>(/natural|online|google|neural|premium|enhanced/i.test(v.name)?0:1)+(/kyoko|nanami|haruka|otoya|mizuki|ayumi/i.test(v.name)?-0.5:0);
function voiceFor(lang){loadV(); const L=VO.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang)); return L.sort((a,b)=>rank(a)-rank(b))[0]||null}
function jaVoice(){return voiceFor('ja')}
function zhVoice(){return voiceFor('zh-tw')||voiceFor('zh-hk')||voiceFor('zh')}
function utt(text,lang,rate){const u=new SpeechSynthesisUtterance(text); u.rate=rate||.9;
  if(lang==='ja'){u.lang='ja-JP'; const v=jaVoice(); if(v) u.voice=v} else {u.lang='zh-TW'; const v=zhVoice(); if(v) u.voice=v}
  return u}
function noJa(){ if(jaVoice()) return false; showTip(); return true }
function sayJa(t){ try{ stopRead(); speechSynthesis.cancel(); if(noJa()) return; speechSynthesis.speak(utt(t,'ja',.85)) }catch(e){} }

/* 全文朗讀：中文用中文語音、日文用日文語音（讀假名，確保讀音正確） */
let RD=null;
function segs(s){const out=[]; s.text.split(/\n\s*\n/).forEach((p,i)=>{ if(p.trim()==='---') return;
  const re=/\[\[(.+?)::(.+?)\]\]|\{([^{}|]+)(?:\|([^{}|]+))?(?:\|([^{}|]+))?\}/g; let m,last=0;
  const push=(t,l)=>{t=t.replace(/[「」『』——…]/g,' ').trim(); if(t) out.push({t,l,p:i})};
  while((m=re.exec(p))){ push(p.slice(last,m.index),'zh'); last=re.lastIndex;
    if(m[1]) push(kanaLine(m[1]),'ja'); else push(m[4]||m[3],'ja'); }
  push(p.slice(last),'zh'); }); return out}
function startRead(){ if(noJa()) return; const s=S.find(x=>x.id===st.sid); stopRead();
  RD={q:segs(s),i:0,on:true}; gcEv('jp-read-'+s.id); P.heard[s.id]=1; save(); next(); player()}
function next(){ if(!RD||!RD.on) return; if(RD.i>=RD.q.length){stopRead(); render(); return}
  const g=RD.q[RD.i]; document.querySelectorAll('.story p').forEach(p=>p.classList.toggle('reading',+p.dataset.p===g.p));
  const u=utt(g.t,g.l,g.l==='ja'?.85:1.05); u.onend=()=>{if(RD&&RD.on){RD.i++; next()}}; u.onerror=u.onend;
  try{speechSynthesis.speak(u)}catch(e){} }
function stopRead(){ if(RD){RD.on=false; RD=null} try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll('.story p.reading').forEach(p=>p.classList.remove('reading')); player()}
function player(){ $('#playerRoot').innerHTML = RD? `<div class="player"><div>🔊 朗讀中…<button id="stopR">停止</button></div></div>`:'' }

function shareText(cur){return `「${cur.l.ja.replace(RB,(m,a)=>a)}」——${cur.l.zh}\n今天被${cur.s.boss.name}教日文了😳\n看霸總小說背日檢單字，免費閱讀 👉 ${SITE}`}
async function openShare(sid){
  SH={cur:pickBoss(sid)}; openSheet(`<div class="sh-top"><div class="sh-zh">分享霸總卡</div><button class="x" data-close aria-label="關閉">×</button></div><div class="empty" style="padding:30px 0">霸總準備中…</div>`);
  await renderShare(); gcEv('jp-share-open')}
async function renderShare(){
  const c=await drawCard(SH.cur); SH.canvas=c; const url=c.toDataURL('image/png'); const t=shareText(SH.cur); SH.text=t;
  const enc=encodeURIComponent;
  openSheet(`<div class="sh-top"><div><div class="sh-zh">分享霸總卡</div><div class="tag">今天是 ${esc(SH.cur.s.boss.name)}・每次都能換一位霸總</div></div><button class="x" data-close aria-label="關閉">×</button></div>
   <img src="${url}" alt="霸總分享卡" style="width:100%;max-width:360px;justify-self:center;border-radius:14px;box-shadow:var(--shadow)">
   <div class="btns" style="justify-content:center"><button class="btn ghost" id="shNext">🔄 換一位霸總</button><button class="btn" id="shImg">📤 分享圖片</button></div>
   <div class="btns" style="justify-content:center">
    <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.threads.net/intent/post?text=${enc(t)}" data-shch="threads">Threads</a>
    <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://social-plugins.line.me/lineit/share?url=${enc(SITE)}&text=${enc(t)}" data-shch="line">LINE</a>
    <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${enc(SITE)}" data-shch="fb">Facebook</a>
    <button class="btn ghost" id="shCopy">複製文字</button></div>
   <p class="tag" id="shMsg" style="text-align:center;margin:0">手機按「分享圖片」可直接貼到 Threads、IG 限動或 LINE</p>`);
}
async function shareImg(){
  const msg=$('#shMsg'); gcEv('jp-share-img');
  try{ const blob=await new Promise(r=>SH.canvas.toBlob(r,'image/png')); const f=new File([blob],'boss-nihongo.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],text:SH.text}); return }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='boss-nihongo.png'; document.body.appendChild(a); a.click(); a.remove();
    if(msg) msg.textContent='已下載圖片，打開 Threads 新貼文選這張圖就好'; }
  catch(e){ if(msg&&e.name!=='AbortError') msg.textContent='這個瀏覽器不能直接分享，請長按上面的圖片儲存' } }
async function copyShare(){ const msg=$('#shMsg'); gcEv('jp-share-copy');
  try{ await navigator.clipboard.writeText(SH.text); msg.textContent='已複製，貼到任何地方都可以' }catch(e){ msg.textContent=SH.text } }

/* ---------- 事件 ---------- */
document.addEventListener('click',ev=>{
  const sa=ev.target.closest('[data-shch]'); if(sa){gcEv('jp-share-'+sa.dataset.shch); return}
  const t=ev.target.closest('button,[data-k],[data-say],[data-close]'); if(!t) return;
  const d=t.dataset;
  if(d.close!==undefined){closeSheet(); return}
  if(d.say){ sayJa(d.say); if(d.g&&!P.gram[st.sid]){} return }
  if(d.save){const k=d.save; P.book=P.book.includes(k)?P.book.filter(x=>x!==k):[...P.book,k]; save(); closeSheet(); render(); return}
  if(d.k){sheet(d.k,d.s); return}
  if(d.tab){stopRead(); st.view=d.tab; QZ=null; render(); window.scrollTo(0,0); return}
  if(d.lv){P.lv=d.lv; save(); render(); return}
  if(d.mode){P.mode=d.mode; save(); render(); return}
  if(d.gl){P.gl=d.gl==='1'; save(); render(); return}
  if(d.gltog!==undefined){P.gl=!P.gl; save(); render(); return}
  if(d.filter){st.filter=d.filter; render(); return}
  if(d.sid){gcEv('jp-open-'+d.sid); st.sid=d.sid; st.view='reader'; QZ=null; render(); return}
  if(d.opt){ if(QZ.ans) return; const q=QZ.qs[QZ.i]; QZ.ans=d.opt; const ok=d.opt===q.k; if(ok) QZ.ok++; else if(!P.book.includes(q.k)){P.book.push(q.k); save()}
     quiz(S.find(x=>x.id===st.sid)); setTimeout(()=>{QZ.i++; QZ.ans=null;
       if(QZ.i>=QZ.qs.length && QZ.ok===3){P.quiz[st.sid]=1; P.done[st.sid]=today(); checkin(); gcEv('jp-done-'+st.sid)}
       quiz(S.find(x=>x.id===st.sid))},900); return }
  switch(t.id){
    case 'back': stopRead(); st.view='home'; render(); break;
    case 'readAll': RD? stopRead() : startRead(); break;
    case 'stopR': stopRead(); break;
    case 'gramOk': P.gram[st.sid]=1; save(); t.textContent='✓ 已學會這個句型'; break;
    case 'addAll': {const s=S.find(x=>x.id===st.sid); wordsOf(s).forEach(k=>{if(!P.book.includes(k)) P.book.push(k)}); save(); render(); break}
    case 'sayAll': sayWords(wordsOf(S.find(x=>x.id===st.sid))); break;
    case 'sayBook': sayWords(P.book.filter(k=>D[k])); break;
    case 'shareBtn': openShare(st.sid); break;
    case 'shareHome': openShare(null); break;
    case 'shNext': SH.cur=nextBoss(); renderShare(); break;
    case 'shImg': shareImg(); break;
    case 'shCopy': copyShare(); break;
    case 'qAgain': QZ=null; quiz(S.find(x=>x.id===st.sid)); break;
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape') closeSheet();
  if(ev.key==='Enter'&&ev.target.dataset){ if(ev.target.dataset.k) sheet(ev.target.dataset.k,ev.target.dataset.s); else if(ev.target.dataset.say) sayJa(ev.target.dataset.say) }
});
render();
</script>

</body>
</html>
