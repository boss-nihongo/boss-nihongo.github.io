"}}, {"id": "A41", "title": "總裁的禮物顧問", "band": "N5-N4", "text": "銀座的百貨公司，三樓，女性飾品{売り場|うりば}。\n\n鄭小禾在這裡工作了兩年。她的笑容很甜，業績卻普通。因為她太{正直|しょうじき}，客人問「這個適合我嗎」，她總是說真話。\n\n那個星期六，一個穿著深色西裝的男人走到櫃台前，遞來一張名片——楠木集團社長，楠木創。\n\n「我要買{贈り物|おくりもの}。」\n\n「請問是送給什麼人呢？」\n\n男人想了一下：「一個……很重要的人。」\n\n「她喜歡什麼樣的東西？」\n\n「不知道。」\n\n小禾愣了一下，然後笑了：「那我們慢慢{選ぶ|えらぶ}吧。」\n\n---\n\n那天，她陪他挑了一個小時的{品物|しなもの}。\n\n她拿出圍巾，他說太花；她拿出項鍊，他說太亮；她拿出一雙羊毛{手袋|てぶくろ}，他拿在手上，摸了很久。\n\n「這個好。」他說，「很軟。」\n\n「那位小姐的手，大概多大呢？」\n\n男人看著她的手：「{大体|だいたい}……跟妳差不多。」\n\n小禾替他{包む|つつむ}好禮物，在緞帶上打了一個漂亮的蝴蝶結。\n\n「她一定會很{喜ぶ|よろこぶ}的。」\n\n男人看著她，沒有說話。\n\n---\n\n下一個星期六，他又來了。\n\n「上次的手套，她喜歡嗎？」小禾問。\n\n「……還沒送。」他說，「今天要買別的。」\n\n這一次，他買了一條圍在{首|くび}上的圍巾。再下一個星期，他買了一個小小的髮夾。每一次，他都讓小禾選，每一次，他都問一樣的問題：\n\n「這個，{似合う|にあう}妳嗎？」\n\n「這些{確か|たしか}要送給那位小姐的吧？」\n\n「嗯。」他說，「妳們的喜好，差不多。」\n\n小禾覺得有點奇怪。可是她沒有多想。\n\n---\n\n一個月後，是她的生日。\n\n她一個人加班到很晚。下班時，經過員工出口，發現那個男人站在那裡。\n\n他手上提著一個大紙袋。\n\n「楠木先生？您怎麼……」\n\n他把紙袋遞給她。\n\n裡面是她陪他挑的所有東西：羊毛手套、圍巾、髮夾、還有一個小盒子。\n\n「生日快樂。」他說，「這是生日的{お祝い|おいわい}。」\n\n小禾愣住了：「這些……不是要送給那位小姐的嗎？」\n\n「是啊。」他看著她，「那位小姐，就是妳。」\n\n「我第一次來，就是想送妳東西。可是我不知道妳喜歡什麼，所以……只好讓妳自己選。」\n\n小禾的臉一下子紅透了。\n\n「你為什麼不直接說……」\n\n「我說不出口。」他把頭轉開，「我是社長，開會可以講三個小時，可是在妳面前，一句話都講不好。妳就不一樣了，」\n\n他轉回來，看著她紅透的臉，「妳一高興，就會笑；一害羞，就會臉紅。」\n\n「[[〈君:きみ〉は〈本当:ほんとう〉にわかりやすい。::妳真的很好懂。]]」\n\n小禾想反駁，卻說不出話來。\n\n他打開最後那個小盒子，裡面是一枚小小的{指輪|ゆびわ}。\n\n「這個，」他說，「是我自己挑選的。我{迷う|まよう}了一整個月。」\n\n「如果妳願意收下，」他低聲說，「下週六，不要上班。跟我去約會。」\n\n小禾的眼淚掉了下來，笑著點頭。\n\n他把戒指戴在她手上，大小剛剛好，{合う|あう}得像是為她做的一樣。\n\n「[[〈来週:らいしゅう〉も、その〈次:つぎ〉も、〈俺:おれ〉と〈過:す〉ごせ。::下週，下下週，都跟我一起過。]]」\n\n他低頭吻住她。百貨公司的燈一盞一盞熄了，只剩下員工出口的那一盞，照著兩個人。", "blurb": "社長請她挑禮物給「很重要的人」，一挑就是一個月。", "gram": {"pt": "〜やすい", "mean": "容易～", "how": "動詞ます形＋やすい（わかる→わかりやすい）", "ex": "〈君:きみ〉は〈本当:ほんとう〉にわかりやすい。", "exzh": "妳真的很好懂。"}, "boss": {"name": "楠木創", "yomi": "くすのき はじめ", "mark": "創", "c1": "#1a2a1e", "c2": "#6b9a74"}}, {"id": "A42", "title": "總裁的柔道教練", "band": "N5-N4", "text": "陳小柔為了{痩せる|やせる}，報名了公司附近的一間{柔道|じゅうどう}教室。\n\n第一天上課，她就後悔了。\n\n教室裡全是比她高大的男人，大家穿著白色的道服，一個比一個兇。教練說：「新人先學怎麼{倒れる|たおれる}。」\n\n她被摔了二十次，摔到眼冒金星。\n\n「還要繼續嗎？」\n\n一個男人蹲在她面前，伸出手。\n\n他繫著黑帶，眼神很冷，是教室裡最強的人。大家都叫他「真田先生」。\n\n「要。」小柔咬著牙，{握る|にぎる}住他的手站起來，「我{決める|きめる}的事，就要做到。」\n\n真田恭平看了她一眼，嘴角好像動了一下。\n\n---\n\n從那天起，他成了她的練習對象。\n\n他教她怎麼站，怎麼{掴む|つかむ}對方的衣領，怎麼利用對方的力量把人摔出去。\n\n他很{厳しい|きびしい}。她的姿勢不對，他會讓她重來一百次。她累得想放棄，他就站在旁邊，冷冷地說：「這樣就{負ける|まける}了？」\n\n她氣得爬起來，再來一次。\n\n一個月後，她第一次把一個男學員摔倒了。\n\n整個教室都在鼓掌。她回頭看真田恭平，他站在角落，輕輕點了點頭。\n\n那一刻，她覺得比瘦了五公斤還{喜ぶ|よろこぶ}。\n\n---\n\n那天練習結束，她在更衣室外面等他。\n\n「真田先生，謝謝您。」她說，「我本來以為，我撐不過一個禮拜。」\n\n「妳挺有骨氣的。」他說，「比我想的還強。」\n\n「那……下個月的比賽，我可以報名嗎？」\n\n「{試合|しあい}？」他皺眉，「妳才學一個月。」\n\n「我想試試看。」\n\n他看著她，沉默了很久。\n\n「好。」他說，「我幫妳特訓。」\n\n---\n\n接下來的一個月，他每天下班後都陪她練到晚上十點。\n\n她的手腳全是{傷|きず}，他就買來藥膏，一點一點替她{塗る|ぬる}。\n\n她累得在榻榻米上{眠る|ねむる}著了，醒來時身上多了一件他的外套。\n\n比賽那天，她輸了。\n\n第二輪就被一個比她重二十公斤的女生摔了出去。\n\n她坐在場邊，低著頭，忍了很久的眼淚，終於掉了下來。\n\n「對不起。」她{謝る|あやまる}，「你陪我練了那麼久……」\n\n真田恭平在她身邊坐下。\n\n「妳知道我為什麼一直陪妳練嗎？」\n\n小柔搖頭。\n\n「三個月前，我在公司的電梯裡，看見妳在哭。」他說，「因為上司說妳胖，說妳不夠格做業務。」\n\n小柔愣住了。\n\n「我是妳們公司的社長。」他說，「那個上司，已經被我調走了。」\n\n「可是我想看的，是妳自己站起來。」\n\n「今天，妳輸了。可是妳一次都沒有{逃げる|にげる}。」他看著她，「這樣的人，我第一次遇到。」\n\n他伸手，替她擦掉眼淚。\n\n「[[〈一度:いちど〉、〈俺:おれ〉を〈信:しん〉じてみろ。::試著相信我一次。]]」\n\n「信什麼？」\n\n「信我。」他低頭吻住她，「以後，不管輸幾次，我都會站在妳旁邊。」\n\n小柔笑了，眼淚卻停不下來。\n\n「[[〈君:きみ〉は〈強:つよ〉い。::妳很堅強。]]」他說，「比任何人都強。」", "blurb": "為了減肥去學柔道，陪她練習的黑帶冷面男，竟是社長。", "gram": {"pt": "〜てみる", "mean": "試著～", "how": "動詞て形＋みる（信じる→信じてみる；命令形：信じてみろ）", "ex": "〈一度:いちど〉、〈俺:おれ〉を〈信:しん〉じてみろ。", "exzh": "試著相信我一次。"}, "boss": {"name": "真田恭平", "yomi": "さなだ きょうへい", "mark": "恭", "c1": "#141a26", "c2": "#4e6aa0"}}, {"id": "A43", "title": "總裁的生日驚喜", "band": "N5-N4", "text": "三月十四日，是徐小晴的生日。\n\n可是公司裡，沒有人知道。\n\n她進公司才一個月，在一間很小的{事務所|じむしょ}做行政。同事們都很忙，沒有人有空問新人的生日。\n\n那天早上，她照常第一個到公司，開燈、把水{沸かす|わかす}、{片付ける|かたづける}會議室。\n\n中午，她一個人在茶水間吃便當。手機響了，是媽媽傳來的訊息：「生日快樂！一個人在東京，要好好吃飯喔。」\n\n她笑了笑，卻差點{泣く|なく}出來。\n\n---\n\n下午三點，事務所的門被推開了。\n\n進來的，是總公司的社長，雪村冬吾。\n\n整個辦公室一下子安靜下來。所長{慌てる|あわてる}得站起來：「社、社長！您今天怎麼……」\n\n「路過。」雪村冬吾說，視線掃過整個辦公室，最後落在角落的小晴身上。\n\n他走過去，把一個小紙盒放在她桌上。\n\n「這是什麼？」\n\n「[[〈今日:きょう〉は〈君:きみ〉の〈誕生日:たんじょうび〉だそうだな。::聽說今天是妳的生日。]]」\n\n整個辦公室的人都看了過來。\n\n小晴的臉一下子紅了：「您、您怎麼知道？」\n\n「人事資料。」他面不改色，「我{確か|たしか}看過。」\n\n---\n\n紙盒裡，是一個小小的草莓蛋糕。\n\n旁邊放著一張卡片，上面只寫了一句話：「{今夜|こんや}七點，一樓大廳。」\n\n那天下午，小晴一個字都打不進電腦。\n\n---\n\n晚上七點，她準時到了一樓大廳。\n\n雪村冬吾已經在那裡了。他沒有穿西裝，只穿了一件深灰色的毛衣，看起來比{普段|ふだん}年輕了好幾歲。\n\n「走吧。」\n\n他帶她去了一間在河邊的小餐廳。店裡的桌上{飾る|かざる}著一束粉紅色的鬱金香。\n\n「這是……」\n\n「妳的履歷上寫，妳喜歡鬱金香。」\n\n小晴愣住了。\n\n「你為什麼對我這麼好？我只是一個新人……」\n\n雪村冬吾沉默了一下。\n\n「妳{面接|めんせつ}那天，」他說，「我剛好坐在面試官後面。」\n\n「其他人都在說自己有多{凄い|すごい}。只有妳說，『我不是最厲害的，可是我會每天第一個到公司，把大家的桌子擦得很乾淨。』」\n\n「後來，我每天早上{通る|とおる}那間事務所，都會看到燈最早{点く|つく}。」\n\n「我想，一定是妳。」\n\n小晴的眼淚掉了下來。\n\n「我一直覺得，在東京沒有人看見我。」\n\n「我看見了。」他說，「每一天。」\n\n---\n\n晚餐結束，他{送る|おくる}她到車站。\n\n月台上，風很大，她全身都{冷える|ひえる}了。他把自己的圍巾解下來，圍在她的脖子上。\n\n「生日快樂。」他低聲說。\n\n「謝謝……」她抬頭看他，「這是我來東京以後，最開心的一天。」\n\n他看著她，然後慢慢低下頭，輕輕吻了她。\n\n「[[〈来年:らいねん〉の〈誕生日:たんじょうび〉も、〈俺:おれ〉が〈祝:いわ〉う。::明年的生日，也由我來替妳慶祝。]]」\n\n電車進站了。她上了車，隔著窗戶對他揮手。\n\n他站在月台上，一直看著，直到電車開走。\n\n那天晚上，小晴回了媽媽一句話：「媽，我有好好吃飯。而且，不是一個人吃。」", "blurb": "進公司才一個月，沒人知道她的生日——除了社長。", "gram": {"pt": "〜そうだ（傳聞）", "mean": "聽說～", "how": "普通形＋そうだ（誕生日だ→誕生日だそうだ）", "ex": "〈今日:きょう〉は〈君:きみ〉の〈誕生日:たんじょうび〉だそうだな。", "exzh": "聽說今天是妳的生日。"}, "boss": {"name": "雪村冬吾", "yomi": "ゆきむら とうご", "mark": "冬", "c1": "#1a2632", "c2": "#8fb2cc"}}, {"id": "A44", "title": "總裁的晨間廣播", "band": "N5-N4", "text": "每天早上七點，公司大樓的一樓大廳，都會播放一段三分鐘的晨間廣播。\n\n負責廣播的，是總務部的新人，宋小音。\n\n她的聲音很溫柔。她負責把天氣、交通和今天的公司行程{伝える|つたえる}給大家，最後再念一句她自己{選ぶ|えらぶ}的小語錄。\n\n「今天也辛苦了。不要太{無理|むり}自己。」\n\n大部分的人都{急いで|いそいで|急ぐ}搭電梯，沒有人仔細聽。\n\n可是小音不知道，每天早上七點，頂樓的社長室，都{聞こえる|きこえる}她的聲音。\n\n---\n\n那天早上，小音得了感冒。\n\n她的{喉|のど}痛得幾乎說不出話，可是代班的人臨時有{用事|ようじ}，她只好硬著頭皮上場。\n\n「早、早安……今天的天氣……」\n\n她咳了好幾聲，廣播斷斷續續的。\n\n結束後，她坐在廣播室裡，覺得好丟臉。\n\n門被推開了。\n\n一個穿著黑色西裝的男人站在門口，手上拿著一杯{温かい|あたたかい}的蜂蜜水。\n\n「喝了。」\n\n小音嚇了一跳。她認得這張臉——公司的社長，霧生奏多。\n\n「社、社長？您怎麼會在這裡……」\n\n「妳的聲音不對。」他把杯子放在她面前，「今天回家休息。」\n\n---\n\n隔天，她的病{治る|なおる}了，廣播也恢復了正常。\n\n可是從那天起，每天早上廣播結束後，廣播室的門口，都會放著一樣有人特地{届ける|とどける}的東西。\n\n有時候是一顆喉糖，有時候是一張便條：「今天的語錄很好。」\n\n小音開始在廣播裡，{たまに}放一兩句只有那個人聽得懂的話。\n\n「今天東京有點冷。請大家多穿一件外套，特別是……每天開會到很晚的人。」\n\n隔天，便條上的{返事|へんじ}是：「穿了。」\n\n---\n\n一個月後，小音被調職，要{移る|うつる}別的分公司。\n\n最後一次廣播的早上，她念完天氣和行程，停了很久。\n\n「這是我最後一次廣播了。」她說，「謝謝每天早上，有一個人在聽。」\n\n「我{毎朝|まいあさ}都很期待，門口會出現什麼。」\n\n「再見。」\n\n她關掉麥克風，眼淚掉了下來。\n\n---\n\n她走出廣播室的時候，霧生奏多站在走廊上。\n\n「調職的事，」他說，「我取消了。」\n\n「咦？」\n\n「是我讓人事部調妳走的。」他說，「我以為，只要不聽到妳的聲音，就能專心工作。」\n\n「結果，我一個字都寫不出來。」\n\n他走過來，看著她。\n\n「我每天早上七點，都會打開廣播。」他說，「聽完妳的聲音，才開始工作。已經一年了。」\n\n「其實，」他說，「我等這個聲音，等了三年。」\n\n「三年？可是我才進公司一年……」\n\n「三年前，妳在大學的電台當主持人。」他說，「我偶然聽到一次，就再也忘不了。後來，我讓人事部去學校招人。」\n\n小音的臉一下子紅透了。\n\n「[[〈毎朝:まいあさ〉、〈君:きみ〉の〈声:こえ〉を〈聞:き〉くようにしている。::我每天早上，都會聽妳的聲音。]]」\n\n「這是我的{習慣|しゅうかん}。」他說，「戒不掉了。因為我喜歡妳。」\n\n他低頭吻住她，很輕，很溫柔。\n\n「[[これからは、〈俺:おれ〉だけに〈話:はな〉せ。::以後，只對我一個人說話。]]」\n\n「那……廣播呢？」\n\n「照常。」他說，「不過最後一句語錄，要念給我聽。」\n\n隔天早上七點，廣播準時響起。\n\n「今天也辛苦了。最後一句——」\n\n「我也很喜歡你。」\n\n頂樓的社長室裡，有人輕輕地笑了。", "blurb": "每天早上三分鐘的晨間廣播，社長一集都沒漏聽。", "gram": {"pt": "〜ようにしている", "mean": "刻意做到～、養成～的習慣", "how": "動詞辭書形＋ようにしている（聞く→聞くようにしている）", "ex": "〈毎朝:まいあさ〉、〈君:きみ〉の〈声:こえ〉を〈聞:き〉くようにしている。", "exzh": "我每天早上，都會固定聽妳的聲音。"}, "boss": {"name": "霧生奏多", "yomi": "きりゅう かなた", "mark": "奏", "c1": "#22202c", "c2": "#8a80b0"}}, {"id": "A45", "title": "總裁的鸚鵡", "band": "N5-N4", "text": "林小蘋搬進新公寓的第一個晚上，就被吵醒了。\n\n凌晨兩點，隔壁的陽台傳來一個奇怪的聲音：\n\n「小蘋——小蘋——」\n\n她嚇得一下子坐了起來。\n\n是誰在叫她的名字？\n\n---\n\n隔天早上，她鼓起勇氣去敲隔壁的門。\n\n開門的是一個穿著白襯衫的男人，頭髮有點亂，看起來剛起床。\n\n「請問……昨天{夜中|よなか}，是你在叫我的名字嗎？」\n\n男人愣了一下，然後回頭看了看客廳。\n\n一隻綠色的鸚鵡站在架子上，歪著頭，對她叫了一聲：「小蘋！」\n\n小蘋目瞪口呆。\n\n「抱歉。」男人揉了揉眉心，「牠叫小綠，是我{飼う|かう}的。牠最近不知道從哪裡學了這個名字，一直叫。」\n\n「可、可是這是我的名字……」\n\n「我知道。」男人說，「所以我也很困擾。」\n\n---\n\n男人叫宗方陸，是附近一間公司的社長。\n\n從那天起，小蘋每天晚上都會聽到小綠在隔壁叫她的名字。\n\n她去{文句|もんく}了三次。第三次，宗方陸站在門口，表情有點尷尬。\n\n「我會教牠別的話。」他說，「給我一點時間。」\n\n一週後，小綠學會了新的話。\n\n「小蘋——早安——」\n\n小蘋在陽台上笑到蹲下去。\n\n---\n\n那天傍晚，下起了大雨。\n\n隔壁突然{騒ぐ|さわぐ}起來。小蘋打開門，看見宗方陸衝出來，臉上寫滿了{心配|しんぱい}。\n\n「小綠{逃げる|にげる}了。」他說，「我開窗戶的時候，牠飛出去了。」\n\n小蘋二話不說，抓起雨傘，跟出去{手伝う|てつだう}。\n\n他們在雨裡{探す|さがす}了一個小時。公園、停車場、大樓的{屋上|おくじょう}，都沒有。\n\n「小綠——」宗方陸的聲音越來越啞。\n\n小蘋站在路邊，突然想到一件事。\n\n她深吸一口氣，大聲喊：「小綠！早安！」\n\n不遠處的一棵樹上，傳來一個熟悉的聲音：\n\n「小蘋——早安——」\n\n小綠站在一根細細的{枝|えだ}上，全身{濡れる|ぬれる}了，翅膀一直在發抖，好像隨時會掉下來。\n\n宗方陸爬上樹，小心翼翼地伸出手，終於{捕まえる|つかまえる}了牠。\n\n---\n\n回到公寓，兩個人都濕透了。\n\n小綠在毛巾裡縮成一團，很快就睡著了。\n\n宗方陸替小蘋倒了一杯熱茶，坐在她對面，很久沒有說話。\n\n「其實，」他終於開口，「我有一件事，一直沒說實話。」\n\n「什麼事？」\n\n「小綠的{発音|はつおん}，」他說，「是我教的。」\n\n小蘋愣住了。\n\n「妳搬來的第一天，在電梯裡跟我打招呼。」他的耳朵紅了，「我回家以後，一直在練習妳的名字。練了一整晚。」\n\n「結果，小綠先{覚える|おぼえる}了。」\n\n小蘋的臉一下子燒了起來。\n\n「所以，那些晚上……」\n\n「是小綠替我叫的。」他說，「我自己，叫不出口。」\n\n他放下茶杯，看著她。\n\n「[[〈俺:おれ〉のことが〈好:す〉きかどうか、〈教:おし〉えてくれ。::告訴我，妳喜不喜歡我。]]」\n\n小蘋想了很久。\n\n然後，她笑了：「這個{答え|こたえ}，你要自己來聽。」\n\n她靠過去，在他的臉頰上親了一下。\n\n他整個人僵住了。然後，他把她拉進懷裡，低頭吻住她。\n\n毛巾裡的小綠醒了，歪著頭看著他們，大聲地叫了一句：\n\n「小蘋——喜歡——」\n\n兩個人都笑了出來。\n\n「[[〈今度:こんど〉は、〈俺:おれ〉が〈呼:よ〉ぶ。::這次，換我來叫妳。]]」他在她耳邊說，「小蘋。」", "blurb": "半夜隔壁陽台有人叫她的名字，原來是社長的鸚鵡。", "gram": {"pt": "〜かどうか", "mean": "是否～", "how": "普通形＋かどうか（好きだ→好きかどうか）", "ex": "〈俺:おれ〉のことが〈好:す〉きかどうか、〈教:おし〉えてくれ。", "exzh": "告訴我，妳喜不喜歡我。"}, "boss": {"name": "宗方陸", "yomi": "むなかた りく", "mark": "陸", "c1": "#1a2a20", "c2": "#5f9a6a"}}, {"id": "A46", "title": "總裁的深夜電話", "band": "N5-N4", "text": "凌晨一點，客服中心的電話響了。\n\n「您好，這裡是客服中心，敝姓周，請問有什麼可以幫您？」\n\n電話那頭，安靜了很久。\n\n「……我睡不著。」一個低沉的男聲說。\n\n周小晴愣了一下。她是{夜中|よなか}值班的客服，接過很多{変|へん}的電話，可是這種的，還是第一次。\n\n「先生，這裡是家電的客服專線……」\n\n「我知道。」對方說，「我的{冷蔵庫|れいぞうこ}{故障|こしょう}了。」\n\n「請問是什麼樣的故障呢？」\n\n「它太安靜了。」男人說，「整個房子，太安靜了。」\n\n小晴沉默了一下：「先生，如果睡不著，可以跟我聊聊天。」\n\n---\n\n從那天起，那個男人每天凌晨一點都會打來。\n\n有時候說燈沒有{点く|つく}，有時候說{冷房|れいぼう}的聲音太大。每次問題都很小，每次都要講半個小時。\n\n小晴發現，他其實不是要{直す|なおす}東西。\n\n他只是想找人說話。\n\n她開始陪他聊。聊天氣，聊電視，聊她在台灣的家，聊她第一次來東京時，在車站迷路的事。\n\n他很少說自己的事。只有一次，他說：「我的工作，是讓很多人過得更好。可是我自己，好像忘了怎麼好好{生きる|いきる}。」\n\n---\n\n一個月後的凌晨一點，電話沒有響。\n\n小晴等了一整晚，越等越{心配|しんぱい}。\n\n隔天，也沒有。\n\n第三天，她在客服系統裡，找到了那支電話的地址。她知道這樣不對，可是她很擔心。\n\n下班後，她搭了第一班電車，找到了那棟高級公寓。\n\n管理員說：「早坂先生，三天前在家裡{倒れる|たおれる}，已經{入院|にゅういん}了。」\n\n---\n\n小晴在醫院找到他的時候，他正半躺在病房裡看{書類|しょるい}。\n\n「早坂先生？」\n\n他抬起頭，愣住了。\n\n「妳……怎麼會在這裡？」\n\n「你三天沒打電話。」小晴的眼眶紅了，「我很擔心。」\n\n早坂涼看著她，很久沒有說話。\n\n「我是早坂電機的社長。」他終於說，「那條客服專線，是我們公司的。」\n\n「我知道。」小晴說，「我{調べる|しらべる}過了。」\n\n「剛開始，我只是想聽聽看，客服的人是怎麼應對的。」他說，「可是第一天晚上，妳說，『先生，如果睡不著，可以跟我聊聊天』。」\n\n「從那天起，我每天都在{待つ|まつ}凌晨一點。」\n\n小晴的眼淚掉了下來。\n\n「笨蛋。」她說，「你只要好好吃飯、好好{眠る|ねむる}，就不會倒下了。」\n\n「嗯。」他說，「所以，我需要有人看著我。」\n\n他伸出手，握住她的手。\n\n「[[〈入院:にゅういん〉している〈間:あいだ〉に、〈仕事:しごと〉を〈全部:ぜんぶ〉〈片付:かたづ〉けた。::住院的這段時間，我把工作全都安排好了。]]」\n\n「什麼工作？」\n\n「這三天，我躺在這裡，一直在想妳。」他說，「所以這三天，我把下個月的工作，全部安排好、交給副社長了。」\n\n「下個月，」他看著她，「我想陪妳回台灣，看看妳說的那個家。」\n\n小晴哭著笑了。\n\n他把她拉近，輕輕吻了她。\n\n「[[〈今夜:こんや〉から、〈電話:でんわ〉はいらない。::從今晚開始，不需要電話了。]]」\n\n「為什麼？」\n\n「因為，」他說，「妳就在我身邊。」", "blurb": "凌晨一點的客服專線，那個睡不著的男人每晚都打來。", "gram": {"pt": "〜間に", "mean": "在～期間", "how": "動詞普通形（ている形）＋間に（入院している→入院している間に）", "ex": "〈入院:にゅういん〉している〈間:あいだ〉に、〈仕事:しごと〉を〈全部:ぜんぶ〉〈片付:かたづ〉けた。", "exzh": "住院的這段時間，我把工作全都安排好了。"}, "boss": {"name": "早坂涼", "yomi": "はやさか りょう", "mark": "涼", "c1": "#14202a", "c2": "#5a8aa8"}}, {"id": "A47", "title": "總裁的鄰桌", "band": "N5-N4", "text": "交往三週年的晚上，林小雨坐在東京最高級的法式餐廳裡。男朋友已經遲到了一個小時。\n\n這間餐廳很難訂。她提前兩個月就{予約|よやく}了靠窗的{席|せき}，想給男朋友一個驚喜。\n\n晚上八點，男朋友傳來一則訊息：\n\n「對不起，我不會去了。我們{別れる|わかれる}吧。」\n\n小雨看著手機，整個人僵住了。\n\n她被{振る|ふる}了。在三週年的晚上，用一則訊息。\n\n---\n\n服務生走過來，小心地問：「小姐，請問要點餐了嗎？」\n\n「……再等一下。」\n\n她不知道自己在等什麼。\n\n隔壁桌坐著一個男人，一個人在吃飯。黑色西裝，安靜，冷淡，從頭到尾都沒有抬頭。\n\n小雨低下頭，看著手上那個準備送給男朋友的小盒子。裡面是一對{指輪|ゆびわ}。\n\n她突然覺得很可笑。\n\n她站起來，走到窗邊，打開窗戶，把盒子用力{投げる|なげる}了出去。\n\n「啊。」\n\n盒子撞到窗框，彈了回來，掉在隔壁桌的地上。\n\n那個男人彎下腰，把它{拾う|ひろう}了起來。\n\n---\n\n「妳的東西。」他把盒子放在她桌上。\n\n「……謝謝。」小雨的臉燒得發燙，「對不起，我不是故意的。」\n\n男人看了看她對面的空椅子，又看了看她發紅的眼睛。\n\n「一個人？」\n\n「……剛剛被甩了。」她自嘲地笑，「在三週年紀念日。」\n\n男人沉默了一下，然後拉開她對面的椅子，坐下了。\n\n「那就跟我吃。」\n\n「咦？」\n\n「這間店的牛排，」他說，「一個人吃，太浪費了。」\n\n---\n\n那頓晚餐，他們聊了很久。\n\n他叫三条雅人，說自己是做生意的。他很少笑，可是聽她說話的時候很認真。\n\n她說她為了這個晚上，存了三個月的錢。他說：「那今天，妳一塊錢都不用{払う|はらう}。」\n\n她說她其實很想{怒る|おこる}，可是又覺得是自己不夠好。他說：「錯的是他，不是妳。」\n\n她喝了{一杯|いっぱい}紅酒，眼淚終於掉了下來。他什麼也沒說，只是把手帕推到她面前。\n\n晚餐結束，他送她到車站。\n\n「今天謝謝你。」小雨說，「要不是你，我今天大概會{泣く|なく}著回家。」\n\n「{今度|こんど}，」他說，「再一起吃飯。」\n\n「這是客套話吧？」\n\n「不是。」他說，「下週六，同一間店。」\n\n---\n\n下週六，小雨半信半疑地來到那間餐廳。\n\n服務生笑著帶她到靠窗的位子。三条雅人已經坐在那裡了。\n\n「你真的來了……」\n\n「[[〈席:せき〉は〈予約:よやく〉しておいた。::位子，我已經訂好了。]]」他說，「上週就訂了。」\n\n小雨愣住了：「上週？我們吃完飯，你就訂了？」\n\n「嗯。」他說，「怕晚了，就沒辦法{間に合う|まにあう}。」\n\n她笑了出來：「這間店不是很難訂嗎？」\n\n「{確か|たしか}很難。」他面不改色，「所以我買下來了。」\n\n「……什麼？」\n\n「這間餐廳，」他說，「從這個月開始，是三条集團的。」\n\n小雨目瞪口呆。\n\n他從口袋裡拿出那個她差點丟掉的小盒子。\n\n「上週，妳忘了帶走。」\n\n「那、那是要送給前男友的……」\n\n「我知道。」他打開盒子，拿出其中一枚戒指，「所以，換個人戴吧。」\n\n小雨的臉紅透了。\n\n「你、你才認識我一個禮拜……」\n\n「一個禮拜，」他說，「夠我決定了。」\n\n他把戒指放在她手心，低頭吻了她的手指。\n\n「[[〈来週:らいしゅう〉も、〈再来週:さらいしゅう〉も、〈俺:おれ〉と〈食:た〉べろ。::下週、下下週，都跟我吃飯。]]」\n\n小雨笑著，終於點了點頭。\n\n「{是非|ぜひ}。」她說。", "blurb": "三週年被放鴿子，鄰桌的冷面男人說：那就跟我吃。", "gram": {"pt": "〜ておく", "mean": "事先做好～", "how": "動詞て形＋おく（予約する→予約しておいた）", "ex": "〈席:せき〉は〈予約:よやく〉しておいた。", "exzh": "位子，我已經訂好了。"}, "boss": {"name": "三条雅人", "yomi": "さんじょう まさと", "mark": "雅", "c1": "#2a1a22", "c2": "#a06a86"}}, {"id": "A48", "title": "總裁的家長會", "band": "N5-N4", "text": "秋天的家長會，教室裡坐滿了媽媽。\n\n只有一個位子，坐著一個穿著深灰色西裝的男人。他坐得筆直，一句話也不說，在一群媽媽中間，安靜得很突兀。\n\n他是八神宗介，八神集團的社長，也是班上最安靜的學生——八神小樹的監護人。\n\n小學老師沈小葵走到他面前：「八神先生，謝謝您特地來。」\n\n「小樹在學校，」他問，「有沒有給老師添{迷惑|めいわく}？」\n\n「沒有。小樹很乖，就是……」小葵猶豫了一下，「他從來不交作業的『我的家人』作文。」\n\n八神宗介的表情，第一次動了一下。\n\n---\n\n家長會結束後，他留下來，跟小葵說了實話。\n\n小樹是他姊姊的{息子|むすこ}。一年前，姊姊和姊夫出了交通{事故|じこ}，小樹就交給他{世話|せわ}了。\n\n「我很忙，」他說，「每天很晚回家。我不會做{料理|りょうり}，不會講故事，也不知道怎麼跟小孩說話。」\n\n「我想，他大概不知道要寫誰。」\n\n小葵看著這個冷淡的男人，突然覺得，他比誰都還要{頑張る|がんばる}。\n\n「八神先生，」她說，「下週六，學校有親子活動。請您{是非|ぜひ}要來。」\n\n---\n\n週六，是學校的運動日。\n\n小樹和舅舅一起參加了兩人三腳的比賽。\n\n八神宗介一點也不擅長運動。第一次跑，兩個人就一起{転ぶ|ころぶ}了。\n\n小樹趴在地上，以為舅舅會{叱る|しかる}他。\n\n可是八神宗介爬起來，拍掉他身上的沙，說：「再來一次。」\n\n第二次，他們跑到了一半。第三次，他們跑到了終點。\n\n小樹第一次{喜ぶ|よろこぶ}得笑了。\n\n小葵在旁邊看著，眼眶有點熱。\n\n---\n\n那天晚上，小樹交了作文。\n\n標題是「我的舅舅」。\n\n「我的舅舅很忙。他不會做{弁当|べんとう}，煮的蛋都是焦的。他畫的{絵|え}很醜，講故事的時候常常講錯。」\n\n「可是他每天晚上都會來看我睡著了沒有。今天他陪我跑了三次，跌倒了兩次，都沒有生氣。」\n\n「我想，我很喜歡我的舅舅。」\n\n小葵讀完，悄悄地把作文影印了一份。\n\n---\n\n隔週，她把影印的作文放在八神宗介面前。\n\n他讀了很久。讀完以後，他用手遮住了眼睛。\n\n「謝謝妳，沈老師。」他的聲音有點啞，「這一年來，我第一次覺得，自己沒有做錯。」\n\n「是您一直都很{一生懸命|いっしょうけんめい}。」小葵說，「小樹都看在眼裡。」\n\n他放下手，看著她。\n\n「其實，我還有一件事想說。」\n\n「什麼事？」\n\n「我開始學做菜了。」他說，「是因為小樹說，老師的便當看起來很好吃。」\n\n小葵愣了一下，笑了：「那您要不要，{今度|こんど}{昼休み|ひるやすみ}來學校跟我們一起吃飯？」\n\n「好。」他頓了一下，「不過，我想問的不是午餐。」\n\n他站起來，走到她面前。\n\n「這兩個星期，小樹每天都在說『沈老師』。」他說，「後來我發現，我也一樣。」\n\n小葵的臉一下子紅了。\n\n「[[〈君:きみ〉を〈両親:りょうしん〉に〈紹介:しょうかい〉しようと〈思:おも〉う。::我打算把妳介紹給我的父母。]]」\n\n「這、這也太快了吧！」\n\n「不快。」他說，「小樹已經同意了。」\n\n窗外，下課鈴{鳴る|なる}了。一個小小的身影從走廊跑過來，趴在門口，大聲說：\n\n「舅舅，你說了嗎？」\n\n八神宗介轉過頭，難得地笑了。\n\n「[[〈今:いま〉、〈言:い〉ったところだ。::我剛剛說了。]]」", "blurb": "家長會上，一群媽媽中間坐著一位西裝社長。", "gram": {"pt": "〜ようと思う", "mean": "打算～", "how": "動詞意向形＋と思う（紹介する→紹介しようと思う）", "ex": "〈君:きみ〉を〈両親:りょうしん〉に〈紹介:しょうかい〉しようと〈思:おも〉う。", "exzh": "我打算把妳介紹給我的父母。"}, "boss": {"name": "八神宗介", "yomi": "やがみ そうすけ", "mark": "宗", "c1": "#1e1e1e", "c2": "#8a8a8a"}}, {"id": "A49", "title": "總裁的笑法", "band": "N5-N4", "text": "天王寺集團的社長天王寺隆，有一個奇怪的{規則|きそく}。\n\n每週五下午三點，所有部門經理都要{集まる|あつまる}到頂樓的會議室，聽一場三十分鐘的「笑話課」。\n\n講師是一個新來的女生，叫宋笑笑。她本來是一個小劇場的喜劇演員，因為劇場倒閉，才來應徵公司的行政工作。\n\n社長{面接|めんせつ}她的時候，只問了一個問題：「妳會講笑話嗎？」\n\n---\n\n{最初|さいしょ}上課的時候，會議室裡坐著二十個西裝筆挺的經理，每個人都一臉{真面目|まじめ}。\n\n笑笑講了第一個笑話。沒有人笑。\n\n第二個。還是沒有人笑。\n\n第三個講完，坐在最後一排的社長，咳了一聲。\n\n笑笑以為自己要被開除了。\n\n可是課後，社長只留下了一張便條：「下週繼續。」\n\n---\n\n就這樣，笑話課一週一週地上下去。\n\n慢慢地，{皆|みな}開始笑了。財務經理笑得最大聲，業務經理笑到拍桌子。\n\n只有社長，從來沒有笑過。\n\n他每次都坐在最後一排，{腕|うで}抱在胸前，面無表情，聽完就走。\n\n笑笑開始覺得很{悔しい|くやしい}。\n\n她{調べる|しらべる}了社長的資料，研究他對什麼有{興味|きょうみ}，每天晚上練習新的笑話，就為了讓他笑一次。\n\n---\n\n第十週，她換了一個方式。\n\n她不講笑話了。她講了一個故事——一個小女孩，在醫院的病房裡，每天講笑話給生病的媽媽聽。\n\n「那個女孩，就是我。」她說，「媽媽說，聽我講笑話，是她每天最{楽しみ|たのしみ}的事。」\n\n「後來，媽媽走了。可是我一直記得她笑的樣子。」\n\n「所以我想讓更多人笑。」\n\n會議室裡很安靜。\n\n最後一排，社長站了起來，走到她面前。\n\n「宋小姐。」\n\n「是……」\n\n「妳的笑話，其實我每次都覺得很好笑。」他難得地{褒める|ほめる}了她。\n\n笑笑愣住了。\n\n「我只是，」他頓了一下，「不太會笑。」\n\n「從我父親{亡くなる|なくなる}，我接下這間公司開始，就沒有人在我面前開過{冗談|じょうだん}。」他說，「我一直在想，要怎麼讓公司的氣氛{変わる|かわる}一點。」\n\n「所以，才有了這堂課。」\n\n「可是後來，」他看著她，「我每週五都在等三點。」\n\n笑笑的臉一下子紅了。\n\n他看著她，嘴角慢慢地、有些僵硬地揚了起來。\n\n那是一個很不自然的笑。笑笑卻覺得，那是她看過最好看的笑容。\n\n「社長……您笑了。」\n\n「嗯。」他說，「是妳教的。」\n\n「[[〈君:きみ〉の〈笑:わら〉い〈方:かた〉が〈好:す〉きだ。::我喜歡妳笑的樣子。]]」\n\n他低頭，輕輕吻了她。\n\n會議室外面，二十個經理擠在門口偷看，有人吹起了口哨。\n\n社長回頭，冷冷地看了他們一眼。\n\n「下週的課，」他說，「取消。」\n\n「為什麼？」\n\n「因為講師，」他牽起笑笑的手，「從今天起，只講給我一個人聽。」", "blurb": "社長規定經理們每週上笑話課，自己卻一次都沒笑過。", "gram": {"pt": "〜方", "mean": "～的方式", "how": "動詞ます形＋方（笑う→笑い方）", "ex": "〈君:きみ〉の〈笑:わら〉い〈方:かた〉が〈好:す〉きだ。", "exzh": "我喜歡妳笑的樣子。"}, "boss": {"name": "天王寺隆", "yomi": "てんのうじ たかし", "mark": "隆", "c1": "#2c2010", "c2": "#c09040"}}, {"id": "A50", "title": "總裁的最後一班飛機", "band": "N5-N4", "text": "下週一，白小夢就要去法國{留学|りゅうがく}了。\n\n這是她從小的夢想。為了這一天，她已經{貯金|ちょきん}三年了，每天下班後去學法文，週末還在咖啡廳做{アルバイト}。\n\n今天，是她在公司的最後一天。\n\n同事們替她辦了一場小小的送別會。大家輪流跟她合照，{写す|うつす}了好多張，送她卡片和小禮物。\n\n只有一個人沒來。\n\n社長，槙村大和。\n\n---\n\n小夢在這間公司當了兩年的秘書。\n\n槙村大和是個很{厳しい|きびしい}的人。報告錯一個字，他會退回給她；會議{遅れる|おくれる}一分鐘，他會冷冷地看她一眼。\n\n可是他也是那個，在她{熱|ねつ}到三十九度的時候，讓司機送她回家的人；在她第一次被客戶{叱る|しかる}到哭的時候，站出來說「錯的是我們公司」的人。\n\n她一直很怕他。\n\n後來，她發現自己好像不只是怕他。\n\n可是她什麼都沒說。\n\n因為他是社長，她只是秘書。而且，她就要走了。\n\n---\n\n送別會結束，她一個人回到社長室，把最後一份資料放在他的桌上。\n\n桌上，放著一個白色的信封。\n\n上面寫著她的名字。\n\n她打開。裡面是一封信，字寫得很工整：\n\n「白小夢：\n\n這兩年，謝謝妳。\n\n妳的報告，是公司裡最{真面目|まじめ}的。妳泡的咖啡，是我喝過最好喝的。\n\n我知道妳一直很{頑張る|がんばる}，為了去法國。所以，我不能留妳。\n\n可是我想讓妳知道一件事。\n\n我每天早上來公司，第一件想做的事，是聽妳說『社長早安』。\n\n這句話，我本來想等妳回來再說。\n\n可是我怕，等不到那一天。\n\n——槙村」\n\n小夢拿著信，眼淚一滴一滴掉在紙上。\n\n---\n\n週一早上，成田{空港|くうこう}。\n\n小夢拖著行李，站在出境大廳。\n\n她看了一眼手機。沒有新的訊息。\n\n她給社長傳了一則訊息，寫了又刪，刪了又寫，最後只留下一句：「謝謝您的信。」\n\n廣播響起，她的班機開始登機了。\n\n她深吸一口氣，轉過身——\n\n一個人影從人群裡衝了過來。\n\n是槙村大和。他的西裝亂了，頭髮也亂了，像是一路跑過來的。\n\n「社長？您怎麼……」\n\n「{急行|きゅうこう}停在{途中|とちゅう}。」他喘著氣，「我換了計程車，還是差點沒{間に合う|まにあう}。」\n\n他站在她面前，看著她。\n\n「[[もっと〈早:はや〉く〈言:い〉えばよかった。::我應該早點說出口的。]]」\n\n「我喜歡妳。」\n\n小夢的眼淚又掉下來了。\n\n「我不會叫妳不要去。」他說，「法國是妳的夢，我不想變成妳{後悔|こうかい}的理由。」\n\n「可是，」他從口袋裡拿出一張機票，「我下個月，要去巴黎出差。」\n\n「出、出差？」\n\n「嗯。」他說，「出差一年。」\n\n小夢愣住了，然後笑了出來，笑到眼淚止不住。\n\n「你……騙人。」\n\n「沒有騙人。」他說，「巴黎的分公司，我上週剛決定開的。」\n\n他伸手，把她拉進懷裡，低頭吻住她。\n\n廣播又響了，是最後一次登機通知。\n\n「去吧。」他在她耳邊說，「一個月後，換妳來機場{迎える|むかえる}我。」\n\n「[[〈向:む〉こうで〈待:ま〉っていろ。::在那邊等我。]]」", "blurb": "出發去法國那天，社長衝進機場，說出了那句話。", "gram": {"pt": "〜ばよかった", "mean": "早知道～就好了", "how": "動詞ば形＋よかった（言う→言えばよかった）", "ex": "もっと〈早:はや〉く〈言:い〉えばよかった。", "exzh": "我應該早點說出口的。"}, "boss": {"name": "槙村大和", "yomi": "まきむら やまと", "mark": "和", "c1": "#141e2c", "c2": "#5878a8"}}, {"id": "B1", "title": "總裁的逃婚新娘", "band": "N3-N2", "text": "京都，婚禮前一小時。\n\n沈若溪提著白紗裙擺，從飯店後門跑了出來——白紗太{目立つ|めだつ}，她不敢走正門。父親為了救公司，把她嫁給一個從沒見過面的日本財閥繼承人。關於那個男人，她只聽過一個傳聞：冷血、無情，從不准任何人{逆らう|さからう}他。\n\n這是一場契約婚姻，要把她{縛る|しばる}一輩子。而她，不想再{我慢|がまん}了。\n\n後門停著一輛黑色轎車。她拉開車門就鑽進後座：「麻煩快開車，有人在追我！」\n\n這是她人生第一次逃跑。她{慌てる|あわてる}得連鞋都跑掉了一隻。\n\n駕駛座上的男人沒動。後照鏡裡，一雙狹長的眼睛慢慢抬起來。\n\n「沈小姐，」他的中文帶著一點日本腔，低沉得好聽，「穿著婚紗上陌生人的車，妳對自己的安全，未免太不負責了。」\n\n「你怎麼知道我姓沈？」\n\n他沒回答，只是按下中控鎖。喀嚓一聲，在安靜的車廂裡格外清楚。\n\n「讓我下車！」她{怒鳴った|どなった|怒鳴る}。她用力扳著門把，指尖都發白了。\n\n「{慌てる|あわてる}什麼？」男人終於轉過頭。他的西裝領口別著一朵白玫瑰——和婚禮請帖上，新郎的胸花一模一樣，「別白費力氣了，{諦めろ|あきらめろ|諦める}。」\n\n沈若溪的心跳停了一拍。\n\n「一ノ瀬蓮。」他自我介紹得慢條斯理，「妳今天的新郎。」\n\n---\n\n她被帶回了飯店，卻沒有被押進禮堂。\n\n一ノ瀬蓮把她關進頂樓套房，扯下領帶扔在沙發上，像在談一筆生意：「我們重新{話し合い|はなしあい}一次。」\n\n「我跟你沒什麼好談的。」\n\n「妳父親的公司欠了三十億，」他淡淡地說，「婚禮取消，明天銀行就會抽貸。這不是威脅，是現實。」\n\n沈若溪咬著唇，眼眶發紅。{悔しい|くやしい}——她恨這種被人捏在手心裡的感覺。\n\n「那你呢？你為什麼要娶一個連面都沒見過的女人？」\n\n他看著她，眼底閃過一絲她看不懂的情緒。「{条件|じょうけん}很簡單。」他伸出三根手指，「第一，婚後一年，妳住在我家。第二，不准對別的男人笑。第三——」\n\n「第三是什麼？」\n\n「等妳愛上我的那天，要親口告訴我。」\n\n她氣笑了：「你也太有自信了吧？開什麼{冗談|じょうだん}。」\n\n「我從不開{冗談|じょうだん}。[[〈逃:に〉がすわけにはいかない。::我不可能放妳走。]]」他俯身，把一枚戒指套進她的無名指，尺寸剛剛好，「沈若溪，我{誓う|ちかう}，我是{真剣|しんけん}的。」\n\n---\n\n婚後的日子，比她想像中奇怪。\n\n一ノ瀬蓮在外人面前冷得像一座冰山，回到家卻記得她不吃香菜、怕打雷。她夜裡被雷聲驚醒，總會發現他坐在床邊的椅子上，手裡拿著一份沒翻幾頁的文件。\n\n「你在這裡做什麼？」\n\n「這是我家。」他{図々しい|ずうずうしい}地說。\n\n「我不想給你添麻煩……」\n\n「妳是我的{花嫁|はなよめ}，」他頭也不抬，「妳的事，從來不是麻煩。」\n\n她以為自己會一直討厭他。直到那天在酒會上，一位姓藤原的學長走過來，笑著和她聊了幾句。\n\n回家的車上，一ノ瀬蓮一句話都沒說。\n\n進門的瞬間，他把她按在玄關的牆上，聲音冷得像冰：「第二條{条件|じょうけん}，妳忘了？」\n\n「我只是跟學長打招呼——」\n\n「妳對他笑了三次。」他低頭逼近，鼻尖幾乎碰到她，「妳以為我真的不會吃醋？對我{素直|すなお}一點，說，妳心裡到底有沒有我。」\n\n「是又怎麼樣，不是又怎麼樣？」她嘴硬。\n\n「是，我就吻妳；不是，我就吻到妳承認為止。」\n\n她心跳亂成一團：「你為什麼……這麼執著？」\n\n他沉默片刻，終於從西裝內袋拿出一張泛黃的舊照片。照片上是十二歲的她，在台北的醫院走廊裡，替一個哭著找媽媽的日本男孩擦眼淚。\n\n「這是我藏了十年的秘密。」他的聲音第一次有了裂縫，「這門婚事，不是妳父親求來的。是我花了十年，才終於有資格去提親。」\n\n沈若溪的眼淚掉了下來。原來那些偶然——雷雨夜的守候、餐桌上消失的香菜、剛剛好的戒指尺寸——全都不是巧合。\n\n「所以，」他抬手擦掉她的眼淚，語氣又恢復了那股不講理的強勢，「第三條，妳什麼時候要履行？」\n\n她紅著臉{睨む|にらむ}他：「你這個{憎らしい|にくらしい}的人！」\n\n「嗯，我是。」他毫不否認，低頭吻住她，吻得又深又慢，直到她揪著他的襯衫、忘了呼吸。\n\n「說。」他抵著她的唇，低聲命令。\n\n她終於投降：「……我愛上你了。」\n\n一ノ瀬蓮笑了，那是她第一次看見這座冰山真正地笑。\n\n「[[〈覚悟:かくご〉しろ。::做好覺悟吧。]]一ノ瀬太太。」他在她耳邊{囁いた|ささやいた|囁く}，「這輩子，妳都別想再逃了。」", "blurb": "婚禮前一小時逃婚，卻鑽進了新郎的車。「別白費力氣了，妳今天的新郎是我。」", "gram": {"pt": "〜わけにはいかない", "mean": "（因為情理、立場）不能～", "how": "動詞辭書形＋わけにはいかない", "ex": "〈逃:に〉がすわけにはいかない。", "exzh": "我不可能放妳走。"}, "boss": {"name": "一ノ瀬蓮", "yomi": "いちのせ れん", "mark": "蓮", "c1": "#101f45", "c2": "#3a5dc2"}}, {"id": "B2", "title": "總裁的離婚協議書", "band": "N3-N2", "text": "結婚三週年的紀念日，蘇晚把一份{書類|しょるい}放在久我征司的辦公桌上。\n\n離婚協議書。她已經簽好了名字。\n\n三年前，為了救父親的工廠，她嫁給了這個東京最年輕的財閥總裁。說好是一場三年的契約婚姻，他給錢，她扮演一個安靜的妻子。\n\n三年來，他對她{相変わらず|あいかわらず}冷淡。他晚歸、不解釋，還一副{平気|へいき}的樣子，她傳的訊息總是被他{無視|むし}。這個月，八卦雜誌更是登滿了他和女明星深夜出入飯店的照片。\n\n她已經{我慢|がまん}了三年，不想再當一個透明人了。\n\n久我征司低頭看著那份{書類|しょるい}，看了很久，久到辦公室的空氣都快凝固。\n\n然後，他把它撕成兩半。\n\n「你做什麼！」\n\n「[[〈離婚:りこん〉なんか、するものか。::離婚？我才不會答應。]]」他把碎紙丟進垃圾桶，語氣平靜得可怕，「契約上寫的是三年，不是三年就結束。」\n\n「你這也太{強引|ごういん}了！」\n\n「是。」他承認得毫不猶豫。\n\n---\n\n蘇晚搬回了娘家。\n\n第一天，他的車停在她家門口。第二天，她最愛的那家甜點店，把整間店的蛋糕都送到了她家。第三天，他親自來{出迎える|でむかえる}她，站在門外，從天亮站到天黑。\n\n她從窗簾縫裡看著他，心亂成一團。其實她{恋しい|こいしい}得要命。她不懂，一個從不{頼る|たよる}任何人、也從不讓任何人{頼る|たよる}的男人，為什麼要做到這種地步。\n\n「蘇小姐，」管家終於看不下去，「先生其實……」\n\n「我不想聽。」她打斷他，「我已經下定決心要離開他了。」\n\n---\n\n第七天晚上，她收到一個地址。\n\n是她母親生前開的那間小食堂。五年前，因為欠債被拍賣，她以為這輩子再也回不去了。\n\n推開門，裡面的桌椅、牆上的菜單、媽媽最喜歡的那盞黃色吊燈，全都和記憶裡一模一樣。\n\n久我征司站在櫃檯後面。\n\n「這是……」\n\n「這三年，我花了很多時間，一間一間找回被賣掉的東西。」他說，「那個女明星是我表妹，她認識這間店現在的屋主，幫我談了半年。每天晚歸，是因為我在這裡，一塊一塊地把它修回原來的樣子。」\n\n蘇晚的眼淚掉了下來：「那你為什麼不說？」\n\n「說了，就不是驚喜了。」他走過來，「我本來想在今天的紀念日送給妳。結果妳送了我一份離婚協議書。」\n\n「是你不解釋，我才會{誤解|ごかい}……」\n\n「對，是我的錯。」他把她逼到牆邊，一手撐在她耳側，低頭看她，眼神卻一點也不像在認錯，「但是蘇晚，妳{勘違い|かんちがい}了一件事。」\n\n「什麼？」\n\n「那份契約，從第一天開始，就是我設計的。」他的聲音壓得很低，「工廠的債，是我讓人放出風聲，妳父親才會來找我。我等的，從來不是三年。」\n\n她{呆れた|あきれた|呆れる}得瞪大了眼睛：「你、你這個騙子！」\n\n「嗯。」他毫不{悔やむ|くやむ}，低頭吻住她，吻得又凶又深，像要把這七天的思念全部討回來。\n\n吻完，他抵著她的額頭，用日文說：「[[お〈前:まえ〉はどこにも〈行:い〉かせない。::我哪裡都不會讓妳去。]]」\n\n「如果我還是要走呢？」\n\n「那我就買下妳要去的每一個地方。」他{誓った|ちかった|誓う}，「{結局|けっきょく}，妳還是會回到我身邊。」\n\n蘇晚哭著笑了。他們終於{仲直り|なかなおり}了。黃色的吊燈下，一切都和記憶裡一樣溫暖，只是多了一個不講理的男人。", "blurb": "契約婚姻三週年，她遞上離婚協議書。他撕成兩半：「離婚？我才不會答應。」", "gram": {"pt": "〜ものか", "mean": "才不～！（強烈否定，男性口氣）", "how": "動詞辭書形／な形容詞な＋ものか；女性口語多用「〜もんか」", "ex": "〈離婚:りこん〉なんか、するものか。", "exzh": "離婚？我才不會答應。"}, "boss": {"name": "久我征司", "yomi": "くが せいじ", "mark": "征", "c1": "#0c2a3d", "c2": "#2b7199"}}, {"id": "B3", "title": "總裁的勝負遊戲", "band": "N3-N2", "text": "江知夏是東京業界最難約的{通訳|つうやく}。\n\n一場跨國併購談判，她站在甲方老闆身邊，把對手公司的每一句話翻得精準又漂亮。對面坐著的，是霧島集團的總裁——霧島響。\n\n傳聞裡，他二十八歲就吞下三家公司，是業界最可怕的{相手|あいて}。\n\n談判進行到一半，霧島響忽然放下文件，不看她的老闆，只{見詰める|みつめる}她：「妳，開個價。」\n\n全場安靜。\n\n「霧島先生，請您專心談生意。」知夏面不改色。\n\n「我很專心。」他靠回椅背，嘴角微微上揚，「我看上的交易，是妳。年薪，是妳現在的三倍。」\n\n「我{断る|ことわる}。」\n\n---\n\n接下來一個月，霧島響挖了她三次，她{断る|ことわる}了三次。\n\n第四次，他直接出現在她的翻譯教室門口，穿著深灰色西裝，手裡拿著兩杯咖啡。\n\n「江小姐，來一場{勝負|しょうぶ}吧。」\n\n「我沒興趣。」\n\n「妳怕輸？」\n\n這三個字，精準地踩中了她的自尊心。這是明目張膽的挑釁，她不想{ためらう|ためらう}。知夏轉過身，抬起下巴：「比什麼？」\n\n「下週的國際論壇，妳替我翻譯。只要我挑出妳一個錯，妳就來當我的專屬口譯。」\n\n「如果你挑不出來呢？」\n\n「那我這輩子不再出現在妳面前。」\n\n這個男人太{生意気|なまいき}了。知夏冷笑：「成交。」\n\n---\n\n論壇那天，霧島響故意講得又快又難，夾雜大量專業術語和冷門成語。知夏連喝水的時間都沒有，卻翻得{見事|みごと}，一個字都沒有漏掉。\n\n散場時，台下響起{拍手|はくしゅ}。\n\n她走下台，得意地看著他：「霧島先生，你輸了。」\n\n他卻笑了：「{惜しい|おしい}。妳最後一句，把『我願意』翻成了『我同意』。」\n\n「那句話根本……」她愣住了。最後一句，是他突然加上的。\n\n——「如果有一天，我向一個女人求婚，我希望她說：我願意。」\n\n她確實譯成了「我同意」。\n\n「妳的本事，我很{評価|ひょうか}。」霧島響慢慢{迫ってきた|せまってきた|迫る}，把她逼到講台後面的布幕旁，一手撐在她耳邊，「可是，[[〈負:ま〉けたからには、〈約束:やくそく〉は〈守:まも〉ってもらう。::既然輸了，就得遵守約定。]]」\n\n「你耍賴！這是陷阱！」\n\n「商場上，只看結果。」他低頭看她，眼神燙得驚人，「我從三年前第一次聽妳翻譯，就{狙う|ねらう}妳了。」\n\n知夏的臉一下子燒起來：「你到底想怎樣？」\n\n「我想要的，從來不是一個{通訳|つうやく}。」他的聲音壓得很低，「[[お〈前:まえ〉の〈本音:ほんね〉が〈聞:き〉きたい。::我想聽妳的真心話。]]妳真的那麼討厭我？」\n\n她咬著唇，{強引|ごういん}的男人她見多了，卻第一次答不出來。\n\n如果真的討厭，她為什麼每一次都{断る|ことわる}，卻每一次都忍不住等他出現？\n\n「不說話，就是不討厭。」他得寸進尺，低頭吻住她。這個吻帶著勝利者的強勢，也帶著一點小心翼翼，像在{確かめる|たしかめる}她會不會推開。\n\n她沒有推開。\n\n很久以後，他才放開她，在她耳邊低聲說：「下次，記得翻對。」\n\n「哪一句？」\n\n「『我願意』。」他笑了，「我會讓妳說的。」", "blurb": "拒絕他三次的王牌口譯，答應了一場勝負。「既然輸了，就得遵守約定。」", "gram": {"pt": "〜からには", "mean": "既然～就（一定要）～", "how": "動詞普通形＋からには，後面接決心、義務或要求", "ex": "〈負:ま〉けたからには、〈約束:やくそく〉は〈守:まも〉ってもらう。", "exzh": "既然輸了，就得遵守約定。"}, "boss": {"name": "霧島響", "yomi": "きりしま ひびき", "mark": "響", "c1": "#0e1730", "c2": "#3d4f8f"}}, {"id": "B4", "title": "總裁的失憶妻子", "band": "N3-N2", "text": "葉初醒來的時候，第一眼看見的，是一個陌生的男人。\n\n他坐在病床邊，西裝皺了，下巴冒出青色的鬍渣，一雙眼睛紅得像三天沒睡。\n\n「妳醒了。」他的聲音沙啞得厲害。\n\n「請問……你是誰？」\n\n男人的身體僵住了。\n\n醫生說，一場小小的交通事故，讓她失去了最近三年的{記憶|きおく}。她只記得自己二十二歲，剛從台北來東京念研究所。\n\n而眼前這個男人，東條集團的總裁東條朔，說他是她的丈夫。\n\n「不可能。」葉初搖頭，「我怎麼可能嫁給一個{他人|たにん}？我們以前是戀人嗎？」她覺得這個男人很{怪しい|あやしい}。\n\n東條朔{見詰めた|みつめた|見詰める}她，眼底有什麼東西碎掉了。\n\n---\n\n出院後，她被帶回一棟大得像美術館的房子。衣櫃裡掛著她的衣服，浴室裡擺著她慣用的洗髮精，客廳的牆上掛著兩個人的婚紗照。\n\n照片裡的她，笑得很幸福。\n\n洗髮精的味道有點{懐かしい|なつかしい}，可是她一點也想不起來，腦中一片空白。這種感覺讓她很不安，好像住在別人的人生裡。\n\n「我想搬出去住一陣子。」第三天晚上，她{ためらう|ためらう}了很久，才鼓起勇氣{言い出した|いいだした|言い出す}，「在{状況|じょうきょう}弄清楚以前……」\n\n東條朔放下手中的文件，{振り向いた|ふりむいた|振り向く}。\n\n「不行。」\n\n「這是我的自由！」\n\n他站起來，一步一步把她逼到牆邊。她的背貼上冰涼的牆，他的手撐在她耳側，把她困在他的氣息裡。\n\n「[[〈全部:ぜんぶ〉〈忘:わす〉れたとしても、お〈前:まえ〉は〈俺:おれ〉の〈妻:つま〉だ。::就算妳全都忘了，妳還是我的妻子。]]」他低頭看她，眼神霸道又痛苦，「妳要{確かめる|たしかめる}什麼，我都陪妳。但是，不准離開這個家。」\n\n---\n\n那天晚上，她在書房的抽屜裡，找到一本日記。\n\n是她自己的字。\n\n「今天，東條朔又冷著一張臉來圖書館。他說只是路過，可是他已經『路過』了四十七次。」\n\n「他向我告白了。用一種很不講理的方式：『我不接受拒絕。』」\n\n「我好像，真的愛上這個霸道的男人了。」\n\n一頁一頁翻下去，{思い出|おもいで}像潮水一樣湧回來。最後一頁，日期是車禍的前一天：\n\n「明天要告訴他一個{秘密|ひみつ}。一定能{驚かす|おどろかす}他。」\n\n葉初的手開始發抖。\n\n---\n\n書房的門被推開，東條朔站在門口，看見她手上的日記，整個人僵住了。\n\n「妳……想起來了？」\n\n她看著他，眼淚一顆一顆掉下來：「東條朔，你這個笨蛋。我忘了你，你為什麼不直接把日記給我看？」\n\n「因為我想證明一件事。」他走過來，聲音啞得不像話，「就算沒有過去，妳也會再一次愛上我。」\n\n「如果我沒有呢？」\n\n「那我就再追妳四十七次。」他抬起她的下巴，「[[もう〈一度:いちど〉、〈俺:おれ〉を〈好:す〉きになれ。::再愛上我一次。]]這是命令。」\n\n她破涕為笑，踮起腳尖，先吻了他。\n\n東條朔只愣了一秒，就反客為主，緊緊抱住她，吻得又深又重，像要把這幾天的恐懼全部吞下去。\n\n她輕輕{慰めた|なぐさめた|慰める}他：「我回來了。」\n\n「對了，」她靠在他胸口，小聲說，「日記裡寫的那件事，你想知道嗎？」\n\n「說。」\n\n「我想跟你，再辦一次婚禮。」她紅著臉，「這次，我要{正直|しょうじき}地告訴所有人——是我先愛上你的。」\n\n東條朔笑了。那是她醒來以後，第一次看見他笑。", "blurb": "車禍醒來忘了三年，陌生的總裁說是她丈夫：「就算妳全都忘了，妳還是我的妻子。」", "gram": {"pt": "〜としても", "mean": "就算～也～（假設讓步）", "how": "普通形＋としても", "ex": "〈全部:ぜんぶ〉〈忘:わす〉れたとしても、お〈前:まえ〉は〈俺:おれ〉の〈妻:つま〉だ。", "exzh": "就算妳全都忘了，妳還是我的妻子。"}, "boss": {"name": "東條朔", "yomi": "とうじょう さく", "mark": "朔", "c1": "#13284a", "c2": "#6a8ed6"}}, {"id": "B5", "title": "總裁的冷面律師", "band": "N3-N2", "text": "東京丸之內，氷室法律事務所。\n\n葉以晴來上班的第一天，就聽說了老闆的外號——「冰室的閻王」。\n\n氷室慧，三十二歲，打贏過九十九場官司，從沒輸過。金框眼鏡後面那雙眼睛，看人的時候像在審判。\n\n「葉以晴。」他頭也不抬，「妳的{書類|しょるい}有三個錯字。」\n\n「對不起！我馬上改——」\n\n「在我這裡，」他終於抬起頭，眼神{険しい|けわしい}得讓她發冷，「沒有『馬上』，只有『已經』。」\n\n---\n\n以晴從小就{憧れる|あこがれる}當律師。可是家裡沒錢，她只能先當助理，一邊工作一邊準備考試。\n\n在氷室事務所的每一天都{慌ただしい|あわただしい}。她整理資料到深夜，為了辦{手続き|てつづき}跑遍半個東京，連吃飯都站著吃。\n\n氷室慧從不誇她。他只會在她交出文件時，用紅筆圈出問題，冷冷地說：「不准{怠る|おこたる}。」\n\n可是她漸漸發現，每次她加班到最後，他辦公室的燈也從來沒有熄過。\n\n---\n\n那天，一份大案子文件的{締め切り|しめきり}是下午五點。\n\n四點半，以晴發現自己弄丟了一份關鍵證據的影本。她翻遍整間辦公室，咬著{唇|くちびる}，手抖得連抽屜都拉不開。\n\n「怎麼了？」氷室慧站在門口。\n\n「我……我把證據影本弄丟了。」她的聲音在發抖，「我完全沒有{心当たり|こころあたり}……」\n\n她以為他會大發雷霆。\n\n可是他只是走過來，從她身邊的櫃子最下層，抽出一個資料夾。\n\n「昨天妳放錯地方了。我替妳收好了。」他看了一眼手錶，「還有二十八分鐘。去送件。」\n\n以晴抱著資料夾衝出去，五點前一分鐘，成功送達。\n\n---\n\n那天晚上，辦公室只剩他們兩個人。\n\n「為什麼幫我？」以晴忍不住問，「你明明說過，在你這裡，沒有失誤的空間。」\n\n氷室慧摘下眼鏡，揉了揉眉心。沒有眼鏡的他，看起來不那麼像閻王了。\n\n「妳每天最早來、最晚走。妳整理的東西，連我都挑不出毛病。」他站起來，一步一步{近寄る|ちかよる}，「[[〈認:みと〉めざるを〈得:え〉ない。〈君:きみ〉は〈優秀:ゆうしゅう〉だ。::我不得不承認，妳很優秀。]]」\n\n以晴的心跳亂成一團，往後退，背卻碰到了書架。\n\n他一手撐在書架上，低頭{見下ろす|みおろす}她。那雙總是審判別人的眼睛，此刻只裝著她一個人。\n\n「所以，妳這個錯，我來{補う|おぎなう}。」他說，「以後妳每一個錯，都由我來補。」\n\n「你……你對每個助理都這樣嗎？」\n\n「妳覺得呢？」他抬起手，輕輕{撫でる|なでる}過她的頭髮。\n\n「我、我反應很{鈍い|にぶい}，你直接說清楚……」\n\n氷室慧笑了。那是她第一次看見閻王笑。\n\n「那我就說清楚。」他低頭吻住她，吻得很克制，卻在她揪住他領帶的那一刻，徹底失了控。\n\n很久以後，他才抵著她的額頭，聲音沙啞：「[[〈俺:おれ〉の〈側:そば〉を〈離:はな〉れるな。::不准離開我身邊。]]這是我這輩子，唯一一場不打算贏的官司。」\n\n「什麼意思？」\n\n「我願意輸給妳。」\n\n她再也{堪える|こらえる}不住，笑出了眼淚。原來閻王，也可以這麼{頼もしい|たのもしい}。", "blurb": "冷面律師從不誇她，卻在她闖禍時默默收拾。「我不得不承認，妳很優秀。」", "gram": {"pt": "〜ざるを得ない", "mean": "不得不～（雖不情願也只能）", "how": "動詞ない形去ない＋ざるを得ない（認めない→認めざるを得ない；する→せざるを得ない）", "ex": "〈認:みと〉めざるを〈得:え〉ない。〈君:きみ〉は〈優秀:ゆうしゅう〉だ。", "exzh": "我不得不承認，妳很優秀。"}, "boss": {"name": "氷室慧", "yomi": "ひむろ けい", "mark": "慧", "c1": "#0b1a2e", "c2": "#35588f"}}, {"id": "B6", "title": "總裁的替身未婚妻", "band": "N3-N2", "text": "「只要演三個小時。」\n\n鳳条玲司把一張支票推到程小蔓面前，金額多到她數了兩次零。\n\n「今晚是我祖母的八十大壽。她最大的心願，就是看我{婚約|こんやく}。」他說，「妳只要扮演我的未婚妻，{上品|じょうひん}地{振舞う|ふるまう}，三個小時後，我們就是陌生人。」\n\n小蔓是個跑了三年龍套、連台詞都沒有的小演員。她看著那張支票，又看看眼前這個冷得像冰雕的男人。\n\n「成交。」\n\n---\n\n宴會廳的水晶燈，把每個人都{照らす|てらす}得閃閃發亮。\n\n小蔓穿著他準備的深藍色禮服，戴著一條{宝石|ほうせき}項鍊，挽著鳳条玲司的手臂走進去的那一刻，全場的目光都集中過來。\n\n「那就是玲司少爺的未婚妻？」「從沒聽過這號人物……」竊竊私語像潮水一樣湧來。\n\n她的手心冒汗。下一秒，鳳条玲司把她的手握得更緊，低頭在她耳邊{囁いた|ささやいた|囁く}：「別怕。妳只要看著我。」\n\n整晚，他把她{甘やかす|あまやかす}得不像話。替她剝蝦、替她擋酒、在她被親戚刁難時，不動聲色地把話接過去。\n\n連祖母都笑著說：「玲司從小就冷冰冰的，我第一次看他這麼{可愛がる|かわいがる}一個人。」\n\n小蔓知道這都是{演技|えんぎ}。可是心跳，好像不太聽話。\n\n---\n\n宴會結束，車停在她家樓下。\n\n「三個小時到了。」她把項鍊拿下來遞給他，臉上{浮かべる|うかべる}一個職業級的笑容，「謝謝你的支票，鳳条先生。我們就當不認識——」\n\n她的手腕被抓住了。\n\n鳳条玲司沒有接項鍊，而是傾身過來，一手撐在她身後的車窗上，把她困在座椅和他之間。\n\n「誰准妳走了？」\n\n「契約只到今晚——」\n\n「[[〈君:きみ〉は〈俺:おれ〉に〈惚:ほ〉れているに〈違:ちが〉いない。::妳一定是愛上我了。]]」他看著她，「不然，妳剛才為什麼不敢看我的眼睛？」\n\n「你、你也太{厚かましい|あつかましい}了吧！」\n\n「嗯。」他毫不否認，「我還有一件更{厚かましい|あつかましい}的事要告訴妳。」\n\n「什麼？」\n\n「今晚的宴會，不是為了讓祖母安心。」他的聲音低下來，「三個月前，我在一部爛片裡看到一個跑龍套的女孩。她只有一個鏡頭，卻是整部片裡唯一{本物|ほんもの}的東西。」\n\n小蔓愣住了。\n\n「我找了妳三個月，不打算再{逃がす|にがす}妳。」他說，「這張支票不是片酬，是我想{引き止める|ひきとめる}妳的手段。」\n\n「你這是……{冗談|じょうだん}吧？」\n\n「我不開{冗談|じょうだん}。」\n\n她的眼眶紅了：「可是我們之間，從頭到尾都是假的。」\n\n「[[〈偽物:にせもの〉でも〈構:かま〉わない。::就算是假的也無所謂。]]」他低頭吻住她，吻得又深又霸道，像要把今晚所有的演技都變成真的。\n\n「從今天起，」他抵著她的{唇|くちびる}說，「我會讓它一天比一天{本物|ほんもの}。」\n\n那條{宝石|ほうせき}項鍊，最後還是戴回了她的脖子上。\n這一次，沒有劇本。", "blurb": "只要演三小時的假未婚妻，他卻不肯放她走。「就算是假的也無所謂。」", "gram": {"pt": "〜に違いない", "mean": "一定是～（有把握的推測）", "how": "普通形＋に違いない（な形容詞、名詞不加だ）", "ex": "〈君:きみ〉は〈俺:おれ〉に〈惚:ほ〉れているに〈違:ちが〉いない。", "exzh": "妳一定是愛上我了。"}, "boss": {"name": "鳳条玲司", "yomi": "ほうじょう れいじ", "mark": "鳳", "c1": "#14213f", "c2": "#5577c9"}}, {"id": "B7", "title": "總裁的初戀重逢", "band": "N3-N2", "text": "十年後再見到柊誠，是在兩家公司的合併記者會上。\n\n林晚晴站在台下，{見上げる|みあげる}著台上那個西裝筆挺的男人，手裡的筆差點掉在地上。\n\n十年前，他是學校裡人人{羨む|うらやむ}的學長，也是她偷偷喜歡了三年的人。\n\n畢業那天，她鼓起勇氣寫了一封信，約他在車站見面。她在月台上等到最後一班電車，他卻沒有來。\n\n隔天，她聽到一個{噂|うわさ}：他全家搬去了國外。沒有道別，沒有回信。\n\n她{恨む|うらむ}過他很多年。\n\n---\n\n記者會結束，晚晴想趁人多從後門離開。\n\n「林晚晴。」\n\n那個聲音在走廊{響いた|ひびいた|響く}。十年了，她還是一聽就認得出來。他的出現，{却って|かえって}讓她更想逃。\n\n她沒有回頭，加快腳步往電梯走。身後的腳步聲卻{追いかけて|おいかけて|追いかける}上來。\n\n電梯門正要關上，一隻手擋住了門。柊誠走進來，按下關門鍵。\n\n狹小的空間裡，只剩下他們兩個人。\n\n「好久不見。」他說。\n\n「我們認識嗎？」她看著樓層數字，聲音冷得像冰。\n\n他沉默了一下，忽然伸手，把她困在電梯角落。\n\n「妳一直{思い込んで|おもいこんで|思い込む}，我那天是故意不來的？」\n\n「難道不是嗎？」她終於抬起頭，眼眶發紅，「我等到最後一班車！」\n\n「我知道。」他的聲音啞了，「因為那天晚上，我就站在對面的月台上。」\n\n晚晴愣住了。\n\n「我父親的公司破產，我們必須連夜離開。我想過去找妳，可是我什麼都給不了妳。」他說，「所以我只能在對面，{見送る|みおくる}妳搭上最後一班車。」\n\n原來一道月台，{隔てた|へだてた|隔てる}了他們十年。\n\n---\n\n她的{涙|なみだ}一下子掉了下來。\n\n「那你為什麼不寫信？為什麼十年都不聯絡？」\n\n「我寫了。」他從西裝內袋拿出一疊泛黃的信封，每一封都{重ねて|かさねて|重ねる}綁得整整齊齊，「一百二十封。一個月一封，全部沒有寄出去，因為我發誓，要等到有資格站在妳面前的那一天。」\n\n「……你這個笨蛋。」\n\n「嗯。」他抬手擦掉她的眼淚，「所以這次合併，是我主動提的。我{改めて|あらためて}來追妳。」\n\n「如果我已經不喜歡你了呢？」\n\n他低頭看著她，眼神霸道得一如十年前：「[[お〈前:まえ〉を〈忘:わす〉れるわけがない。::我怎麼可能忘了妳。]]妳也一樣。」\n\n「你憑什麼這麼肯定？」\n\n「因為妳剛才在台下，一直盯著我看。」\n\n她{黙る|だまる}了，咬著唇，終究還是心軟了。\n\n電梯到了一樓，門打開又關上，他卻沒有放開她。\n\n「十年前我沒能赴的那個約，」他低頭吻住她，吻得又深又急，像要把這十年全部補回來，「[[もう〈二度:にど〉と〈離:はな〉さない。::我再也不會放開妳。]]」\n\n原來那些她以為斷掉的線，從來都沒有斷。他們一直{繋がる|つながる}著。", "blurb": "十年前沒赴約的學長，成了合併公司的總裁。「我怎麼可能忘了妳。」", "gram": {"pt": "〜わけがない", "mean": "不可能～、怎麼會～（強烈否定）", "how": "普通形＋わけがない（な形容詞＋な／名詞＋の）", "ex": "お〈前:まえ〉を〈忘:わす〉れるわけがない。", "exzh": "我怎麼可能忘了妳。"}, "boss": {"name": "柊誠", "yomi": "ひいらぎ まこと", "mark": "柊", "c1": "#141c3a", "c2": "#4a5fae"}}, {"id": "B8", "title": "總裁的秘書試用期", "band": "N3-N2", "text": "「三個月。」神楽坂煌把合約丟在桌上，「撐得過試用期，就留下。撐不過，就走。」\n\n周以安是第十三任秘書。前面十二個，全都撐不住，{潰れて|つぶれて|潰れる}走了。\n\n神楽坂集團的年輕總裁，出了名的難伺候。他從不{威張る|いばる}，因為他根本不需要——只要一個眼神，整層樓都會安靜下來。沒有人能{逆らう|さからう}他的決定。\n\n第一天，以安{張り切って|はりきって|張り切る}提早兩小時到公司。\n\n第二天，她就{躓く|つまずく}了：會議資料少了一頁，被他當著所有人的面退回。\n\n「妳以為這裡是學校？」他冷冷地說，「我不需要會犯錯的人。」\n\n---\n\n以安沒有哭，也不肯{諦める|あきらめる}。她把每份文件檢查三遍，把他的行程背得滾瓜爛熟，連他的咖啡要幾度都記在本子上。她從不{怠る|おこたる}。\n\n一個月後，她{気付いた|きづいた|気付く}了一件事：神楽坂煌說「隨便」的時候，代表他很在意。\n\n兩個月後，公司一個大案子出了問題，所有人都在推卸責任，只有以安一個人{背負った|せおった|背負う}下來。她熬了三個通宵，把上百份文件全部{揃えた|そろえた|揃える}。\n\n會議結束後，神楽坂煌看了她很久，第一次開口：「……我對妳{見直した|みなおした|見直す}。」\n\n---\n\n試用期的最後一天，以安在茶水間聽見一個{噂|うわさ}。\n\n「總裁好像要她走。聽說他已經在找下一任了。」「她以為自己是誰？」\n\n她握著杯子的手微微發抖。也對，她本來就不是{恵まれた|めぐまれた|恵まれる}的人。\n\n她回到座位，把辭職信放在桌上，開始收拾東西。\n\n「妳在做什麼？」\n\n神楽坂煌站在她身後，手裡拿著那封辭職信，臉色難看得嚇人。\n\n「試用期結束了。我知道您在找下一任秘書——」\n\n他沒聽完，把辭職信撕成兩半，{強引|ごういん}地拉著她的手腕走進總裁室，反手鎖上門。\n\n「我在找的，不是秘書。」他把她按在門上，低頭逼近，「是能接替妳工作的人。」\n\n「什……什麼意思？」\n\n「因為我不想再讓妳當我的秘書。」他的聲音低下來，「當秘書，妳會一直叫我總裁。我想聽妳叫我的名字。」\n\n以安的臉一下子紅透了。她下意識想逃，他卻收緊了手臂。\n\n「[[〈好:す〉きなくせに、〈逃:に〉げるな。::明明喜歡我，就別逃。]]」\n\n「誰、誰喜歡你了！」\n\n「妳的本子上，記了我喝咖啡的溫度、我討厭的食物、我每次皺眉的原因。」他毫不留情地拆穿她，「這叫不喜歡？」\n\n她答不出來。\n\n他低頭吻住她，吻得霸道又不容拒絕：「[[お〈前:まえ〉は〈俺:おれ〉が〈選:えら〉んだ〈女:おんな〉だ。::妳是我選的女人。]]三個月前就是了。」\n\n原來這場試用期，被{試す|ためす}的從來不是她。是他在等，等她願意留下來。", "blurb": "撐過三個月試用期的第十三任秘書，總裁卻在找人接替她。「明明喜歡我，就別逃。」", "gram": {"pt": "〜くせに", "mean": "明明～卻～（帶責備語氣）", "how": "普通形＋くせに（な形容詞＋な／名詞＋の：好きなくせに）", "ex": "〈好:す〉きなくせに、〈逃:に〉げるな。", "exzh": "明明喜歡我，就別逃。"}, "boss": {"name": "神楽坂煌", "yomi": "かぐらざか こう", "mark": "煌", "c1": "#101a33", "c2": "#40549a"}}, {"id": "B9", "title": "總裁的倫敦時差", "band": "N3-N2", "text": "宗像恭介被調去倫敦的那天，成田機場下著小雨。\n\n「一年。」他在出境口前說，「最多一年，我就回來。」\n\n蘇念念用力點頭，笑著揮手，{見送る|みおくる}他的背影消失在人群裡，然後蹲在地上，哭得像個孩子。\n\n---\n\n東京和倫敦，{隔てる|へだてる}著九千六百公里，和九個小時的時差。\n\n她早上起床的時候，他剛要睡。她下班的時候，他才開始一天的工作。兩個人的時間，像永遠對不上的齒輪。\n\n念念學會了{我慢|がまん}。學會不在半夜打電話吵他，學會把想念{蓄える|たくわえる}起來，留到週末的視訊。\n\n可是想念越存越多。他越來越{恋しい|こいしい}。\n\n她開始習慣看倫敦的天氣預報，習慣在手機裡設兩個時鐘，習慣在每一則訊息來的瞬間，心跳漏掉一拍。\n\n季節{巡って|めぐって|巡る}，東京下起了第一場雪。\n\n---\n\n第八個月，他的工作{長引いた|ながびいた|長引く}。\n\n「可能要再延半年。」視訊裡，宗像恭介的眼下有很深的黑眼圈，「抱歉。」\n\n「沒關係呀，」念念笑著說，「工作重要嘛。」\n\n掛掉電話，她一個人坐在漆黑的房間裡，{堪えて|こらえて|堪える}了很久的眼淚，終於掉了下來。\n\n那天是她的生日。他忘了。\n\n---\n\n隔天早上，門鈴響了。\n\n念念頂著哭腫的眼睛去開門，然後整個人僵在原地。\n\n宗像恭介站在門外，西裝皺巴巴的，手裡提著行李箱，頭髮上還沾著雪，手指{凍えて|こごえて|凍える}發紫。\n\n「你、你不是在倫敦——」\n\n話還沒說完，她就{飛び込んだ|とびこんだ|飛び込む}他的懷裡，被他抱得幾乎喘不過氣。\n\n「我搭了十四個小時的飛機。」他的聲音啞得厲害，「只能待二十四小時，然後就要{引き返す|ひきかえす}。」\n\n「那你為什麼要回來？」\n\n「因為昨天是妳的生日。」他把臉埋在她的頸窩，「視訊裡妳在笑，可是我看得出來，妳哭過。」\n\n念念再也忍不住，把臉埋進他胸口，{思い切り|おもいきり}地哭了出來。\n\n他把她抱得更緊：「[[お〈前:まえ〉に〈会:あ〉いたくてたまらなかった。::我想見妳，想得快瘋了。]]每一天都是。」\n\n---\n\n那天晚上，他們窩在小小的沙發上，窗外的雪靜靜地下著，整座城市都{静まった|しずまった|静まる}。\n\n「延長的半年，我拒絕了。」他忽然說。\n\n「什麼？可是你的工作……」\n\n「我跟董事會談好了，倫敦的案子，三個月內結束。」他捏起她的下巴，眼神霸道得一如往常，「[[〈距離:きょり〉なんて、〈俺:おれ〉が〈縮:ちぢ〉める。::距離這種東西，我來縮短。]]」\n\n「如果做不到呢？」\n\n「那我就把總公司搬到倫敦，」他說，「然後把妳一起帶走。」\n\n她笑出了眼淚。\n\n他低頭吻住她，吻得很慢，像要把這八個月的空白一點一點{埋めて|うめて|埋める}。\n\n「{間もなく|まもなく}，」他抵著她的額頭說，「我們就不用再看兩個時鐘了。」", "blurb": "東京和倫敦隔著九小時時差，他在她生日隔天出現在門口。「我想見妳，想得快瘋了。」", "gram": {"pt": "〜てたまらない", "mean": "～得受不了、非常～", "how": "い形容詞去い＋くて＋たまらない（動詞たい形同樣變化：会いたい→会いたくて）；な形容詞＋で＋たまらない", "ex": "お〈前:まえ〉に〈会:あ〉いたくてたまらなかった。", "exzh": "我想見妳，想得快瘋了。"}, "boss": {"name": "宗像恭介", "yomi": "むなかた きょうすけ", "mark": "恭", "c1": "#0e2742", "c2": "#3d79b5"}}, {"id": "B10", "title": "總裁的求婚花束", "band": "N3-N2", "text": "白芷的花店開在銀座一條安靜的巷子裡，小到只放得下三張椅子。\n\n每個星期一早上九點，同一個男人會推開店門。\n\n深灰色大衣，冷峻的眉眼，聲音低沉：「一束花。讓收花的人開心就好。」\n\n對一間小花店來說，這樣的常客實在很{有難い|ありがたい}。白芷每次都很用心：春天是鈴蘭，夏天是向日葵，秋天是滿天星。她把每一束花都包得{生き生き|いきいき}的，像把整個季節裝進他懷裡。\n\n她一直在猜，那個收花的人，是什麼樣的女孩。\n\n---\n\n第五十二個星期一，男人沒有來。\n\n白芷站在門口等到中午，手裡那束玫瑰慢慢{萎む|しぼむ}。\n\n她告訴自己，他大概是告白成功了，不需要再買花了。可是心裡空空的，像被什麼挖走了一塊。她甚至想{憎む|にくむ}他，卻怎麼也恨不起來。\n\n下午，一位律師走進店裡。\n\n「白小姐，鷲尾先生被大雪困在北海道的機場。」他說，「他交代，一定要把這個交給妳。」\n\n律師{預かる|あずかる}的是一個小盒子。盒子裡是五十一張卡片，每一張都寫著一個日期，和一句話。\n\n「今天的鈴蘭，跟她的笑容很像。」\n「她說向日葵代表『我只看著你』。她不知道，我說的就是她。」\n「今天她剪到手指，我差點衝進去。」\n\n白芷的手開始{震える|ふるえる}。\n\n那五十一束花，從來沒有送給任何人。他每次都帶回辦公室，一束一束地插起來，看著它們慢慢{枯れる|かれる}，再在下個星期一，回來買新的。\n\n---\n\n傍晚，店門被推開了。店裡一下子{静まった|しずまった|静まる}。\n\n鷲尾薫站在門口，大衣上全是雪，頭髮亂了，呼吸急促，像是一路跑過來的。\n\n「抱歉。」他說，「第五十二個星期一，我遲到了。」\n\n白芷努力撐住的表情一下子{崩れた|くずれた|崩れる}，眼淚掉了下來：「你這個騙子……那些花，根本沒有收花的人。」\n\n「有。」他走進來，一步一步把她逼到花架前。滿屋子的玫瑰{匂う|におう}著，濃得讓人頭暈。\n\n「收花的人，一直都是妳。」他低頭{見詰める|みつめる}她，「一年前我路過這裡，只是想買一束花送給客戶。可是看見妳的那一刻，我的心就被{奪われた|うばわれた|奪う}，再也回不來。」\n\n「那你為什麼不直接說？」\n\n「因為我怕。」這個冷了一輩子的男人，聲音第一次在發抖，「怕我一開口，妳就不肯再對我笑了。」\n\n他捧起她的{頬|ほお}：「[[〈君:きみ〉に〈会:あ〉わずにはいられなかった。::我就是忍不住想來見妳。]]一個星期一次，已經是我能{堪える|こらえる}的極限。」\n\n他從大衣口袋拿出一枚戒指，單膝跪在一地{散った|ちった|散る}的花瓣上。\n\n「白芷。」他說，「[[〈俺:おれ〉と〈結婚:けっこん〉しろ。::跟我結婚。]]不是請求，是命令。」\n\n她哭著笑了：「哪有人這樣求婚的……」\n\n「我只會這樣。」他站起來，吻住她，吻得又深又霸道，像要把這一年的等待一次討回來。\n\n那天晚上，花店的燈亮到很晚。第五十二束花，終於有了收花的人。", "blurb": "每週一來買花的男人，五十一束花從沒送出去。「跟我結婚。不是請求，是命令。」", "gram": {"pt": "〜ずにはいられない", "mean": "忍不住～、不由得～", "how": "動詞ない形去ない＋ずにはいられない（会わない→会わずにはいられない；する→せずには）", "ex": "〈君:きみ〉に〈会:あ〉わずにはいられなかった。", "exzh": "我就是忍不住想來見妳。"}, "boss": {"name": "鷲尾薫", "yomi": "わしお かおる", "mark": "薫", "c1": "#1a1d3f", "c2": "#5a63b8"}}, {"id": "B11", "title": "總裁的逃跑新娘", "band": "N3-N2", "text": "契約婚姻滿一年的那天，夏知微逃走了。\n\n她留下一枚婚戒和一張紙條：「契約到期，祝你幸福。」然後拖著一只行李箱，坐上了往北海道的最後一班列車。\n\n她知道神宮寺凜不愛她。這一年，他忙得像一陣風，她只是他應付家族的擋箭牌。與其等他開口趕她走，不如自己先走。\n\n---\n\n三個月後，北海道一個下雪的小鎮。\n\n知微在一間老{温泉|おんせん}旅館打工。她換了名字，剪短了頭髮，每天鋪床、端茶、打掃浴場，忙到{深夜|しんや}才能休息。\n\n老闆娘常說：「小薇啊，妳{一旦|いったん}忙起來，就會忘記自己有多累。」\n\n她只是笑笑。忙一點好，忙起來，就不會想起東京那個人。\n\n---\n\n那天晚上，外面下起了{吹雪|ふぶき}。\n\n知微去後院收毛巾，雪地上卻有一串陌生的{足跡|あしあと}，一路延伸到她房間的窗下。\n\n她心裡一緊。身後傳來一點{気配|けはい}。\n\n「找到妳了。」\n\n那個聲音，她死也不會認錯。\n\n她猛地回頭。神宮寺凜站在{薄暗い|うすぐらい}的走廊燈下，黑色大衣上積滿了雪，臉色比雪還冷。\n\n知微轉身就跑。\n\n她衝進員工更衣室，想趁他不注意，從後門溜出去。可是還沒找到{隙|すき}，手腕已經被他一把抓住。\n\n「[[〈逃:に〉げようとしても〈無駄:むだ〉だ。::就算妳想逃，也沒用。]]」\n\n---\n\n「放開我！」她甩開他的手，「契約已經結束了，你來做什麼？」\n\n「契約？」他冷笑，「妳以為我找了妳三個月，是為了一張紙？」\n\n「那是為了什麼？」\n\n「為了問妳一句話。」他向前一步，「妳為什麼走？」\n\n她猶豫了一下，還是說了實話：「因為你不愛我。」\n\n神宮寺凜的表情，像是被人狠狠打了一拳。\n\n「這一年，我每天工作到深夜，是為了提早結束家族的權力鬥爭。」他說，「我不想讓妳捲進來，所以什麼都沒說。結果妳連一個解釋的機會都不給我。」\n\n「我{隠れる|かくれる}了三個月，你為什麼現在才來？」\n\n「因為妳把線索藏得太好。」他咬牙，「每次我快要{追い付く|おいつく}的時候，妳已經換了地方。」\n\n他從口袋裡拿出那枚婚戒，握住她冰冷的手。\n\n「先{着替える|きがえる}，妳的衣服都濕了。」他說，「然後跟我回去。」\n\n「我不要。」\n\n「好。」他毫不猶豫，「那我留下來。」\n\n「你、你留下來做什麼？東京的公司怎麼辦？」\n\n「說要來北海道出差，只是{口実|こうじつ}。」他低頭看她，「我來，是因為我沒有妳不行。」\n\n---\n\n隔天早上，老闆娘目瞪口呆地看著一個穿著西裝的男人，在玄關笨拙地掃雪。\n\n「小薇，那位客人說，他要打工到妳答應回去為止。」\n\n知微輕輕{ため息|ためいき|溜息}，眼眶卻紅了。\n\n她走出去，從背後抱住了他。\n\n神宮寺凜的身體僵了一下，然後轉過身，把她緊緊壓進懷裡，在大雪裡吻住她，吻得又深又急，像要把三個月的不安全部討回來。\n\n「我{後悔|こうかい}了。」她小聲說，「我不該不告而別。」\n\n「知道就好。」他抵著她的額頭，終於{落ち着く|おちつく|落着く}下來，「[[〈一緒:いっしょ〉に〈帰:かえ〉るぞ。::跟我一起回家。]]這次，不是契約。」", "blurb": "契約到期，她逃到北海道的溫泉旅館。暴風雪夜，雪地上出現了他的腳印。", "gram": {"pt": "〜ようとする", "mean": "想要～、試圖～", "how": "動詞意向形＋とする（逃げる→逃げよう→逃げようとしても＝就算想逃）", "ex": "〈逃:に〉げようとしても〈無駄:むだ〉だ。", "exzh": "就算妳想逃，也沒用。"}, "boss": {"name": "神宮寺凜", "yomi": "じんぐうじ りん", "mark": "凜", "c1": "#0e2240", "c2": "#3d6fae"}}, {"id": "B12", "title": "總裁的古董茶碗", "band": "N3-N2", "text": "京都的老街盡頭，有一間不起眼的修復工作室。\n\n招牌上只有兩個字：「寧修」。主人是一個叫沈寧的台灣女生，專門修復破損的陶瓷器。\n\n那天下午，一個穿著黑色西裝的男人推門進來。他把一個木盒放在桌上，打開，裡面是一只碎成五片的茶碗。\n\n「修得好嗎？」\n\n沈寧戴上手套，拿起其中一片，對著光{眺める|ながめる}了很久。茶碗邊緣{欠ける|かける}了一角，碎片上還積著一層薄薄的{埃|ほこり}。\n\n「這是江戶時代的東西。」她說，「很有{価値|かち}。」\n\n「我不在乎它值多少錢。」男人說，「這是我祖母留給我的。」\n\n他遞出名片——西園寺集團社長，西園寺湊。\n\n---\n\n修復這只茶碗，需要兩個月。\n\n西園寺湊每週都來看進度。一開始，他只是站在門口看，後來開始坐在她旁邊，一看就是一下午。\n\n「你一個大社長，這麼閒嗎？」\n\n「我是{素人|しろうと}。」他說，「想學。」\n\n沈寧只好教他。怎麼用軟布{拭く|ふく}掉碎片上的灰，怎麼一點一點{懸命|けんめい}地{削る|けずる}掉多餘的漆，怎麼在接縫處撒上金粉。\n\n「這叫金繼。」她說，「不把裂痕藏起來，而是讓它變成最美的地方。」\n\n他看著她專注的側臉，很久沒有說話。\n\n---\n\n一天晚上，沈寧加班到{深夜|しんや}。\n\n工作室的門被推開，西園寺湊拎著兩碗熱騰騰的拉麵進來。{湯気|ゆげ}模糊了她的眼鏡。\n\n「妳的手也要休息。」他說，「吃飯。」\n\n她邊吃邊問：「為什麼這只茶碗對你這麼重要？」\n\n他沉默了一下：「小時候，我只要考不好，父親就會罵我。只有祖母，會用這只茶碗泡一杯熱抹茶給我。」\n\n「她走的那天，我太難過，把它摔碎了。」\n\n「之後二十年，我沒有再讓任何人靠近我。」\n\n沈寧放下筷子。她第一次發現，這個冷冰冰的男人，心裡也有一道裂痕。\n\n---\n\n兩個月後，茶碗修好了。\n\n金色的線，像一條河，流過碗身。\n\n西園寺湊捧著它，{感激|かんげき}得雙手有點發抖。\n\n「謝謝妳。」他說，聲音啞了，「比原來更美。」\n\n「是你自己的功勞。」她{謙虚|けんきょ}地說，「最後那幾道金線，都是你畫的。」\n\n他放下茶碗，突然走過來，把她逼到工作台邊。\n\n「沈寧，我{率直|そっちょく}地說。」他低頭看她，「我不是來學金繼的。」\n\n「那你是來做什麼的？」\n\n「第一次見面，妳對著光看碎片的樣子，很{純粋|じゅんすい}。」他說，「那天我就知道，我{割る|わる}掉的東西，只有妳修得好。」\n\n他抬起她的下巴，吻了她。很慢，很輕，像在修一件最珍貴的東西。\n\n「[[〈俺:おれ〉の〈心:こころ〉も〈直:なお〉してくれ。::把我的心也修好吧。]]」\n\n沈寧紅著臉：「這個……很{重たい|おもたい}耶。」\n\n「我知道。」他笑了，「[[〈君:きみ〉さえいれば、ほかには〈何:なに〉もいらない。::只要有妳在，我什麼都不需要。]]」\n\n她{修繕|しゅうぜん}過無數件破碎的東西。這是第一次，她想好好守護一個人。", "blurb": "京都修復工作室，總裁捧來一只碎成五片的茶碗。「把我的心也修好吧。」", "gram": {"pt": "〜さえ〜ば", "mean": "只要～就～", "how": "名詞＋さえ＋假定形（いる→いれば＝只要有）", "ex": "〈君:きみ〉さえいれば、ほかには〈何:なに〉もいらない。", "exzh": "只要有妳在，我什麼都不需要。"}, "boss": {"name": "西園寺湊", "yomi": "さいおんじ みなと", "mark": "湊", "c1": "#22304f", "c2": "#7a92c4"}}, {"id": "B13", "title": "總裁的競標對手", "band": "N3-N2", "text": "整個東京的建築業都知道，今年最大的案子，是臨海新城的開發權。\n\n而最後只剩兩家公司。\n\n一家是業界龍頭，鷹司集團，總裁鷹司玲。\n\n另一家，是一間只有三十個人的小事務所。負責企劃的，是剛滿二十七歲的溫言。\n\n---\n\n第一次在說明會上見面，鷹司玲就走到她桌前。\n\n「妳就是溫言？」他居高臨下地看她，「我看過妳的提案。」\n\n「然後呢？」\n\n「很漂亮。」他說，「可惜，[[〈俺:おれ〉が〈勝:か〉つに〈決:き〉まっている。::贏的一定是我。]]」\n\n溫言氣得握緊了筆。\n\n這個男人，又{強気|つよき}又{ずるい|ずるい|狡い}。\n\n---\n\n接下來一個月，兩家公司的{対立|たいりつ}越來越激烈。\n\n鷹司集團資金雄厚，條件明顯{有利|ゆうり}。溫言的事務所人少錢少，處處{不利|ふり}。\n\n可是她不服輸。她帶著團隊熬了無數個夜，研究對方的{弱点|じゃくてん}，一條一條擬定{対策|たいさく}。\n\n「我們不跟他們比錢。」她對團隊說，「我們把{重点|じゅうてん}放在居民身上。」\n\n她跑遍了臨海區的每一條街，問每一個老人想要什麼樣的家。\n\n---\n\n到了最後的{段階|だんかい}，評審委員會{指定|してい}兩家公司在同一天簡報。\n\n簡報前一晚，溫言在會場外遇到了鷹司玲。\n\n「妳很拚。」他說，「我聽說妳去了臨海區四十幾次。」\n\n「你在調查我？」\n\n「我只是對有趣的對手比較{慎重|しんちょう}。」他向她{接近|せっきん}一步，「溫言，我們打個賭吧。」\n\n「賭什麼？」\n\n「如果我贏了，」他低頭看她，眼神燙得驚人，「[[〈負:ま〉けたら、〈俺:おれ〉のものになれ。::妳輸了，就成為我的人。]]」\n\n「你、你瘋了嗎？」她的臉一下子紅了，「如果我贏了呢？」\n\n「那妳想要什麼，都可以。」他一臉從容。\n\n「好。」她咬牙，「我賭。」\n\n---\n\n隔天，溫言站上台，把四十幾個老人的故事一個一個說給評審聽。\n\n會場安靜得連針掉在地上都聽得見。\n\n結束時，{真っ先|まっさき}站起來鼓掌的，是坐在第一排的鷹司玲。\n\n結果出爐——溫言的事務所，贏了。\n\n---\n\n散場後，他在停車場等她。\n\n「恭喜。」他說，「妳贏了。說吧，妳想要什麼？」\n\n溫言看著他，突然發現一件事：「你的簡報……{焦点|しょうてん}根本不對。你故意的？」\n\n鷹司玲沒有否認：「我看了妳的提案以後，就知道，那塊地應該是妳的。」\n\n「為什麼？」\n\n「因為這次的{主役|しゅやく}是妳。」他說，「我只想站在最近的地方看妳發光。」\n\n溫言的心跳亂成一團：「那個賭……」\n\n「妳贏了，所以妳說了算。」\n\n她深吸一口氣，抓住他的領帶，把他拉低，吻了上去。\n\n鷹司玲只愣了一秒，就扣住她的後腦，吻得又深又重，霸道得不給她退路。\n\n「這是妳要的？」他啞著聲音問。\n\n「嗯。」她紅著臉，「我要你。」\n\n「早說。」他笑了，「我忍著不{催促|さいそく}妳，等了一個月。」", "blurb": "競標場上的死對頭，跟她打了一個賭。「妳輸了，就成為我的人。」", "gram": {"pt": "〜に決まっている", "mean": "一定是～", "how": "普通形＋に決まっている（勝つ→勝つに決まっている）", "ex": "〈俺:おれ〉が〈勝:か〉つに〈決:き〉まっている。", "exzh": "贏的一定是我。"}, "boss": {"name": "鷹司玲", "yomi": "たかつかさ れい", "mark": "玲", "c1": "#0f1f3d", "c2": "#4a74c0"}}, {"id": "B14", "title": "總裁的過勞秘書", "band": "N3-N2", "text": "柳葉是如月集團總裁室的首席秘書。\n\n她每天第一個到公司，最後一個離開。總裁如月朔的行程、文件、會議、應酬，全部由她一手打理。\n\n全公司都說，柳秘書是一台不會停的機器。\n\n只有她自己知道，她已經三個月沒好好睡過一覺了。\n\n---\n\n那天早上，她照常替各部門{配る|くばる}會議資料。走到一半，眼前突然一黑。\n\n醒來的時候，她躺在總裁室的沙發上，身上蓋著一件西裝外套。\n\n如月朔{腰掛ける|こしかける}在旁邊，臉色難看得可怕。\n\n「醫生說妳{睡眠|すいみん}不足，{栄養|えいよう}不良。」他冷冷地說，「柳葉，妳到底在做什麼？」\n\n「對不起，我馬上回去工作——」\n\n她想坐起來，被他一隻手按回沙發上。\n\n「[[〈君:きみ〉は〈俺:おれ〉を〈頼:たよ〉るべきだ。::妳應該依賴我。]]」他說，「而不是一個人撐著。」\n\n---\n\n當天下午，人事部收到一份總裁親自簽名的命令：柳葉秘書，即日起強制{休暇|きゅうか}兩週。\n\n「這太誇張了！」柳葉衝進總裁室，「下週還有和大阪的會議——」\n\n「我會自己處理。」\n\n「可是你連咖啡要加幾顆糖都不知道！」\n\n如月朔抬起頭：「那妳就在旁邊看著我學。」\n\n---\n\n於是第二天，柳葉發現自己被帶到了總裁的私人別墅。\n\n他在榻榻米上替她{敷く|しく}好了被子，煮了一碗不怎麼好吃的粥，還笨手笨腳地替她{揉む|もむ}僵硬的{肩|かた}。\n\n「你……不用做到這種地步。」\n\n他停下手，看她有沒有{嫌がる|いやがる}的樣子：「不舒服就說。」\n\n「不是……」她小聲說，「只是不習慣。」\n\n他的手停了一下：「這三年，妳{絶えず|たえず}照顧我。現在換我。」\n\n---\n\n休假的第五天晚上，她忍不住偷偷打開筆電，想回幾封郵件。\n\n電腦被他一把闔上。\n\n「柳葉。」他把她從椅子上抱起來，放到窗邊的沙發上，「[[〈今日:きょう〉はもう〈働:はたら〉くな。::今天不准再工作了。]]」\n\n「我只是想……」\n\n「我知道妳一直{懸命|けんめい}地工作。」他壓低身子，雙手撐在她兩側，「可是妳有沒有想過，為什麼妳的工作永遠做不完？」\n\n她愣住了。\n\n「因為我故意的。」他說，「我把所有事情都交給妳，只是想讓妳一直待在我身邊。」\n\n「結果，我差點毀了妳。」他的聲音啞了，「是我的錯。我會{改める|あらためる}。」\n\n柳葉的眼眶紅了。\n\n---\n\n休假結束那天，她回到公司，發現總裁室多了兩個新秘書。\n\n「從今天起，妳只負責一件事。」如月朔說。\n\n「什麼事？」\n\n「每天陪我吃午餐，晚上六點準時下班。」他頓了一下，「然後，陪我回家。」\n\n「這是工作嗎？」\n\n「不是。」他把她拉進懷裡，「這是求婚。」\n\n全公司的人都看呆了。財務部的{苦情|くじょう}信箱，當天收到了三十封抗議：「總裁太閃了。」\n\n柳葉笑著，第一次在上班時間，主動吻了她的總裁。\n\n他扶正她的{姿勢|しせい}，抱得更緊，吻得又深又甜，像要把三年來欠她的溫柔，一次還給她。\n\n「晚上的粥，要我先{温める|あたためる}嗎？」他啞著聲音問。\n\n「……下班再說。」", "blurb": "三個月沒睡好的首席秘書昏倒了，總裁下令強制休假。「妳應該依賴我。」", "gram": {"pt": "〜べきだ", "mean": "應該～", "how": "動詞辭書形＋べきだ（頼る→頼るべきだ）", "ex": "〈君:きみ〉は〈俺:おれ〉を〈頼:たよ〉るべきだ。", "exzh": "妳應該依賴我。"}, "boss": {"name": "如月朔", "yomi": "きさらぎ さく", "mark": "朔", "c1": "#172848", "c2": "#5a86c8"}}, {"id": "B15", "title": "總裁的搶婚", "band": "N3-N2", "text": "婚禮在東京最大的教堂舉行。\n\n白色的婚紗，白色的玫瑰，白色的鋼琴。一切都很完美，除了{花嫁|はなよめ}本人。\n\n紀晴站在鏡子前，看著自己，覺得很陌生。\n\n新郎是她父親替她選的，一個她只見過三次面的銀行家之子。這場婚禮，是為了救家裡的公司。\n\n她早就說服自己接受了。可是今天早上，她還是哭了。\n\n---\n\n三年前，她愛過一個人。\n\n他叫桐生蒼，是她大學時打工的咖啡店裡，那個總是坐在角落的男人。冷淡、話少，卻會在她下班時，默默送她到車站。\n\n後來他去了美國，她才知道，他是桐生集團的繼承人。\n\n他走的那天，她沒有去送他。因為她父親說：「桐生家的人，不會要我們這種人。」\n\n那是她這輩子最痛的{失恋|しつれん}。\n\n---\n\n管風琴響起，教堂的門打開了。\n\n紀晴挽著父親的手，一步一步走向祭壇。\n\n神父問：「有沒有人反對這場婚禮？」\n\n教堂裡一片安靜。\n\n然後，門被推開了。\n\n「我反對。」\n\n一個男人站在教堂入口，黑色西裝，呼吸{荒い|あらい}，像是一路跑過來的。\n\n紀晴手上的捧花掉在了地上。\n\n是他。\n\n---\n\n教堂裡一下子{騒がしい|さわがしい}起來。新郎的家人站起來大喊，幾個保全衝上前想{押さえる|おさえる}他。\n\n「別{乱暴|らんぼう}！」紀晴脫口而出。\n\n桐生蒼甩開保全，大步走過紅毯，在她面前停下。\n\n「你、你來做什麼……」她的聲音在發抖。\n\n「來帶妳走。」他說得理所當然，「[[どんな〈手:て〉を〈使:つか〉ってでも、〈君:きみ〉を〈取:と〉り〈戻:もど〉す。::不管用什麼手段，我都要把妳搶回來。]]」\n\n「你父親呢？你們家……」\n\n「三年前，是妳父親去美國找我。」他看向她父親，眼神冷得像冰，「他說妳已經不愛我了。那句話，成了我放手的{きっかけ|きっかけ|切っ掛け}。」\n\n紀晴轉頭看向父親。父親臉色發白，什麼也說不出來。\n\n「我一直{恨む|うらむ}自己，為什麼那時候相信了。」桐生蒼說，「所以這三年，我把桐生集團拿到手，買下了妳們家公司的所有債。」\n\n他看著新郎：「這場婚禮，已經沒有存在的理由了。」\n\n新郎的父親威脅道：「你這樣{暴れる|あばれる}，我會告你！」\n\n「請便。」他連看都沒看一眼。\n\n---\n\n他向紀晴伸出手。\n\n「紀晴，這不是電影{台詞|せりふ}。」他說，「妳願不願意跟我走？」\n\n她的眼淚掉了下來。\n\n她提起婚紗，{掴む|つかむ}住他的手。\n\n他一把把她{引っ張る|ひっぱる}進懷裡，在所有人面前，低頭吻住她，吻得又深又狠，像要把三年的思念全部吞下去。\n\n教堂裡有人尖叫，有人拍手，有人在哭。\n\n「[[〈俺:おれ〉と〈来:こ〉い。::跟我走。]]」他抵著她的額頭說。\n\n她笑著點頭，{感激|かんげき}得說不出話。\n\n兩個人跑出教堂，外面陽光燦爛。\n\n「我們要去哪裡？」\n\n「去辦一場真正的婚禮。」他說，「這一次，我要所有人都來{祝う|いわう}我們。」\n\n那天，紀晴第一次覺得，當一個新娘，是一件值得{誇り|ほこり}的事。", "blurb": "她穿著婚紗走向祭壇，教堂的門被推開。「不管用什麼手段，我都要把妳搶回來。」", "gram": {"pt": "〜てでも", "mean": "就算要～也～", "how": "動詞て形＋でも（使う→使ってでも）", "ex": "どんな〈手:て〉を〈使:つか〉ってでも、〈君:きみ〉を〈取:と〉り〈戻:もど〉す。", "exzh": "不管用什麼手段，我都要把妳搶回來。"}, "boss": {"name": "桐生蒼", "yomi": "きりゅう あおい", "mark": "蒼", "c1": "#0c1d38", "c2": "#3b6db5"}}, {"id": "B16", "title": "總裁的臥底記者", "band": "N3-N2", "text": "許知夏是一名{ジャーナリスト}。\n\n三個月前，她收到一封匿名信：黑崎集團的總裁黑崎凱，涉嫌非法收購土地，逼走了一整條老街的居民。\n\n信的最後寫著：「只有妳能揭穿他的真面目。」\n\n為了{探る|さぐる}真相，她換了名字，應徵成為黑崎凱的私人助理。\n\n---\n\n黑崎凱是個很難應付的男人。\n\n他冷淡、挑剔，說話總是帶著{皮肉|ひにく}。她泡的咖啡太燙，他說：「妳是想燙死我，還是想燙死自己？」她排的行程太滿，他說：「我不是機器人。」\n\n可是她發現，這個人比{噂|うわさ}中更難懂。\n\n他每天加班到深夜，卻會記得替清潔阿姨叫計程車。他對下屬嚴厲，卻從不在大家面前罵人。\n\n她告訴自己：不能{油断|ゆだん}。這個人很{怪しい|あやしい}，他一定在{隠す|かくす}什麼。\n\n---\n\n那天晚上，她趁他去開會，{こっそり}{侵入|しんにゅう}了總裁室。\n\n書桌的抽屜鎖著。她用髮夾撬開，裡面是一疊厚厚的文件——老街的土地合約。\n\n她拿出手機，一頁一頁{撮影|さつえい}。\n\n可是越看，她越覺得不對勁。\n\n合約上的價格，是市價的三倍。每一戶居民，都另外拿到了一筆安置費。最後一頁，是一份計畫書：老街要改建成社區，原來的居民優先回來住。\n\n這和匿名信說的，完全對不上。\n\n「找到妳要的東西了嗎？」\n\n門口傳來一個聲音。\n\n她猛地回頭。黑崎凱靠在門框上，雙手插在口袋裡，神情冷淡。\n\n---\n\n「你……什麼時候回來的？」\n\n「從妳撬抽屜開始。」他走進來，關上門，「許知夏，東洋週刊的記者。妳以為換個名字，我就不知道妳的{正体|しょうたい}？」\n\n她的背貼上冰冷的書櫃，無路可退。\n\n「那你為什麼不揭穿我？」\n\n「因為我想知道，妳會不會照實寫。」他一步一步走近，「大部分記者，只會寫他們想寫的東西。」\n\n「那封匿名信呢？」\n\n「是我的競爭對手寄的。」他說，「他想{騙す|だます}妳，讓妳寫一篇假新聞毀掉我。很{卑怯|ひきょう}的手段。」\n\n「你早就知道了？」\n\n「知道。」他低頭看她，「所以我把真正的合約，放在妳一定找得到的地方。」\n\n知夏愣住了。這個男人，從頭到尾都在等她{自ら|みずから}發現真相。\n\n「現在妳打算怎麼辦？」他把她困在書櫃和他之間，「回去寫報導？還是繼續當我的助理？」\n\n「我……我要走。」\n\n她試著從他手臂下面的{隙間|すきま}鑽出去，卻被他一把攔住。\n\n「[[〈逃:に〉げられるものなら〈逃:に〉げてみろ。::有本事妳就逃逃看。]]」\n\n---\n\n一週後，東洋週刊刊出了一篇報導。\n\n標題是：〈被誤解的總裁：老街重生的真相〉。\n\n署名，許知夏。\n\n那天晚上，她在公司樓下被一輛黑色的車攔住。車窗搖下來，是黑崎凱。\n\n「寫得很好。」他說，「只有一個地方寫錯了。」\n\n「哪裡？」\n\n「妳說我只是個精明的生意人。」他下車，把她拉進懷裡，「可是我這三個月，每天都在想一個臥底的女人。」\n\n她笑了，眼淚卻掉了下來。\n\n他低頭吻住她，吻得又深又狠，像是要懲罰她這一週的不告而別。\n\n「[[お〈前:まえ〉の〈負:ま〉けだ。::是妳輸了。]]」他抵著她的額頭說，「以後，我是妳唯一的獨家新聞。」\n\n她追尋的真相，原來一直在她身邊。", "blurb": "臥底當總裁助理的記者，撬開抽屜那晚被抓個正著。「有本事妳就逃逃看。」", "gram": {"pt": "〜ものなら", "mean": "如果能～的話（就試試看）", "how": "動詞可能形＋ものなら（逃げられる→逃げられるものなら）", "ex": "〈逃:に〉げられるものなら〈逃:に〉げてみろ。", "exzh": "有本事妳就逃逃看。"}, "boss": {"name": "黒崎凱", "yomi": "くろさき がい", "mark": "凱", "c1": "#0d1d36", "c2": "#3a62a6"}}, {"id": "B17", "title": "總裁的調香師", "band": "N3-N2", "text": "沈香是一名調香師。她從小就{憧れる|あこがれる}這份工作。\n\n她在藤原集團的香氛部門工作了五年。公司最暢銷的那支{香水|こうすい}「月下」，就是她調出來的。\n\n可是在發表會上，站在台上接受掌聲的，是她的上司。功勞就這樣被{奪う|うばう}了。\n\n「新人的才華，需要時間培養。」上司在慶功宴上拍拍她的肩，「妳還太年輕了。」\n\n那天晚上，她{悔しい|くやしい}得睡不著，寫好了辭職信。\n\n她想自立門戶，開一間自己的小工作室。\n\n---\n\n辭職信交出去的第二天，她被叫進了總裁室。\n\n藤原雅臣坐在辦公桌後面，手上拿著她的信。\n\n他是個出了名難搞的人。據說他的鼻子比任何調香師都靈，公司每一支香水上市前，都要經過他親自{嗅ぐ|かぐ}過。\n\n「理由。」他說。\n\n「我想做自己的香水。」\n\n「在這裡也可以做。」\n\n「在這裡，我做出來的東西，永遠不會掛我的名字。」\n\n藤原雅臣抬起眼睛，看著她，看了很久。\n\n「『月下』是妳做的。」他說，「不是妳的上司。」\n\n沈香愣住了。\n\n「我第一次聞到它，就知道了。」他說，「那個男人調不出這種{さわやか}又寂寞的味道。」\n\n---\n\n「為什麼你沒有說？」\n\n「因為我在等。」他站起來，繞過桌子，「等妳自己站出來說，這是我的作品。」\n\n「可是妳沒有。妳選擇了逃走。」\n\n「我沒有逃走！」她紅著眼睛說，「我只是……不想再待在一個看不見我的地方。」\n\n「誰說我看不見妳？」\n\n他走到她面前，從西裝口袋裡拿出一個小小的玻璃瓶。\n\n「打開。」\n\n她打開瓶蓋。一股熟悉又陌生的香味，慢慢{あふれる}，充滿了整個房間。\n\n是茉莉，和雨後青草的{香り|かおり}。\n\n「這是……」\n\n「妳三年前，在實驗室裡做失敗的那一支。」他說，「妳把它丟進垃圾桶，我撿回來了。」\n\n「為什麼？」\n\n「因為它很像妳。」他{見詰める|みつめる}她的{瞳|ひとみ}，「表面安靜，其實很倔強。這才是妳{本来|ほんらい}的樣子。」\n\n---\n\n一個月後，藤原集團{発売|はつばい}了一支新香水。\n\n瓶身上，第一次印上了調香師的名字：沈香。\n\n評論家們說，這是今年最好的作品。她的上司，在同一天被調去了別的部門。\n\n發表會結束後，她在後台找到藤原雅臣。\n\n「你為什麼要做到這種地步？」\n\n「因為妳有{素質|そしつ}，我對妳的{評価|ひょうか}從來沒變過。」他說，「好東西，就應該被看見。」\n\n「只是這樣？」\n\n他沉默了一下，然後低頭靠近她，近到她能聞到他身上淡淡的雪松味。\n\n「辭職信，我還沒有批。」他在她耳邊{囁く|ささやく}，「[[〈辞表:じひょう〉は〈破:やぶ〉った。::辭職信，我已經撕了。]]」\n\n「你憑什麼——」\n\n「憑我是這個世界上，最懂妳的香味的人。」他說，「[[〈俺:おれ〉から〈離:はな〉れられっこない。::妳不可能離得開我。]]」\n\n「真{図々しい|ずうずうしい}。」她小聲說。\n\n他笑了，低頭吻住她。吻裡有茉莉，也有雨後的青草。\n\n「下一支香水，」他抵著她的額頭說，「調給我一個人。」\n\n她想了想，竟然點了點頭。\n\n那是她找了很久，終於找到的歸屬。", "blurb": "作品被上司搶功的調香師遞出辭呈，總裁卻撕了它。「妳不可能離得開我。」", "gram": {"pt": "〜っこない", "mean": "絕不可能～", "how": "動詞ます形去ます＋っこない（離れられます→離れられっこない）", "ex": "〈俺:おれ〉から〈離:はな〉れられっこない。", "exzh": "妳不可能離得開我。"}, "boss": {"name": "藤原雅臣", "yomi": "ふじわら まさおみ", "mark": "雅", "c1": "#1c2546", "c2": "#6b7cc2"}}, {"id": "B18", "title": "總裁的雪山小屋", "band": "N3-N2", "text": "十二月，長野。\n\n攝影師顧雪跟著一個登山團上山，要拍日出時的雲海。\n\n出發的時候，天氣還很好。走到半路，天色卻{いきなり}變了。\n\n風雪來得又急又猛。能見度不到五公尺，她和隊伍走散了。\n\n她一個人在雪地裡摸索，腳下一滑，從斜坡上滾了下去。\n\n---\n\n醒來的時候，窗外一片{真っ暗|まっくら}。\n\n她躺在一間小木屋裡，衣服還有些{湿る|しめる}，身上蓋著兩條{毛布|もうふ}，腳踝纏著{包帯|ほうたい}。屋子正中央，一盞小小的油燈亮著，光線{薄暗い|うすぐらい}。\n\n一個男人坐在油燈旁邊，正在往暖爐裡加柴。\n\n「醒了？」他回頭看她。\n\n冷峻的臉，濃眉，眼神像這座山一樣冷。\n\n「你是……」\n\n「綾瀬零。」他說，「妳掉進了山溝，我剛好路過。」\n\n「我的隊伍……」\n\n「他們應該已經下山到{麓|ふもと}了。」他說，「這場雪會下到明天。在那之前，誰也走不了。」\n\n---\n\n小屋很小，只有一張床，一個暖爐。\n\n暴風雪把門口{塞ぐ|ふさぐ}了一半。外面的風聲，像是野獸在叫。\n\n到了半夜，暖爐的柴燒完了。屋裡的溫度一點一點往下掉。\n\n顧雪蜷縮在毛布裡，冷得全身縮成一團，{震える|ふるえる}個不停。她的體溫越來越低，意識也開始模糊。\n\n「別睡。」他的聲音在耳邊響起。\n\n「好冷……」\n\n下一秒，她被拉進一個溫熱的懷抱。他脫下外套，把她整個人裹住，用自己的體溫{温める|あたためる}她。\n\n「你……」她的臉燒了起來。\n\n「別亂動。」他的聲音很低，「現在不是害羞的時候。」\n\n「[[〈目:め〉を〈閉:と〉じるな。::不准閉上眼睛。]]」\n\n---\n\n那一夜很長。\n\n為了讓她保持清醒，他一直跟她說話。\n\n他說，他其實是一間大公司的社長。每年冬天，他都會一個人來這座山上住一週。\n\n「為什麼？」\n\n「十年前，我在這座山上也遇過一場{吹雪|ふぶき}。」他說，「我差點死在{峠|とうげ}上。」\n\n「是一個女孩子救了我。她跟著父親在這裡經營山屋，看到我在雪地裡{這う|はう}，硬是把我拖了回來。」\n\n顧雪的心跳漏了一拍。\n\n十年前，她的父親確實在這裡經營過山屋。那年冬天，她和父親一起，從雪地裡拖回了一個快要{凍える|こごえる}的少年。\n\n「是……是你？」\n\n他低頭看她，眼神第一次變得溫柔。\n\n「我找了妳十年。」他說，「沒想到，是妳自己掉到我面前。」\n\n「今天在山溝裡看到妳的時候，」他的聲音啞了，「我以為，又要錯過妳一次。」\n\n顧雪的眼淚掉了下來。\n\n「[[〈俺:おれ〉が〈生:い〉きている〈限:かぎ〉り、〈君:きみ〉を〈離:はな〉さない。::只要我還活著，就不會放開妳。]]」\n\n他低頭吻住她。冰冷的空氣裡，只有他的吻是燙的。\n\n---\n\n天亮的時候，雪停了。\n\n救援隊的直升機在山頂盤旋。他把她背在背上，一步一步走出小屋。\n\n陽光照在雪地上，亮得刺眼。\n\n「{せめて}，」她趴在他背上，小聲說，「讓我拍一張日出。」\n\n「先讓我把妳送下山。」他說，「以後，每年冬天，我陪妳來拍。」\n\n她笑著，把臉埋進他的肩膀。\n\n那年的雲海，她沒有拍到。\n\n可是她拍到了，比雲海更美的東西。", "blurb": "暴風雪中跌落山溝的攝影師，醒來在一間小屋裡。「只要我還活著，就不會放開妳。」", "gram": {"pt": "〜限り", "mean": "只要～（就一直）", "how": "動詞辭書形／ている形＋限り（生きている→生きている限り）", "ex": "〈俺:おれ〉が〈生:い〉きている〈限:かぎ〉り、〈君:きみ〉を〈離:はな〉さない。", "exzh": "只要我還活著，就不會放開妳。"}, "boss": {"name": "綾瀬零", "yomi": "あやせ れい", "mark": "零", "c1": "#0f2238", "c2": "#4c7aa8"}}, {"id": "B19", "title": "總裁的分手支票", "band": "N3-N2", "text": "「這是五千萬。」\n\n二階堂夫人把一張支票推到桌子對面，笑容優雅又冰冷。\n\n「離開惣一。」她一臉{呆れる|あきれる}的表情看著唐微，彷彿在看一個不懂事的孩子，「妳和他的身分，差太多了。」\n\n唐微坐在那裡，手心全是汗，{堪える|こらえる}著不讓自己發抖。\n\n她是一間小書店的店員，平凡得不能再平凡。和二階堂惣一交往一年，她一直知道，自己配不上他。\n\n「如果我不呢？」\n\n「那妳父親在醫院的治療費，」夫人輕輕地說，「下個月開始，就沒有人付了。」\n\n「還有，惣一下個月要接任社長。董事會那些{親類|しんるい}，正在找他的把柄。一個背景不明的女人，就是最好的理由。」\n\n唐微的手開始發抖。\n\n---\n\n那天晚上，她在公寓樓下等他。\n\n二階堂惣一下了車，看見她，冷峻的臉上{たちまち}露出一點笑意。\n\n「怎麼不上樓等？外面冷。」\n\n「惣一。」她深吸一口氣，「我們分手吧。」\n\n他的笑容停住了。\n\n「妳說什麼？」\n\n「我收了你母親的錢。」她拿出那張支票，在他面前晃了晃，「五千萬。比起你，我更喜歡這個。」\n\n她特地擦了鮮紅色的{口紅|くちべに}，穿上了她最不喜歡的高跟鞋。這是她這輩子最用力的一場{芝居|しばい}。\n\n她笑著說：「{どうせ}我們不會有結果的。」\n\n二階堂惣一看著她，很久很久。\n\n「好。」他說。\n\n她轉身就走。走到街角，她才{立ち止まる|たちどまる}，靠在牆上，哭得喘不過氣。\n\n她覺得自己好{みじめ}。\n\n---\n\n三個月後，唐微的父親順利出院了。\n\n醫院說，有人一次付清了所有費用，還指定了最好的醫生。\n\n她以為是夫人的支票。可是那張支票，她一直沒有去兌現。\n\n那天晚上，她回到書店，發現店門口站著一個人。\n\n是他。\n\n他瘦了，眼神卻比以前更深。\n\n「你、你怎麼……」\n\n「支票，妳沒有兌現。」他說，「我母親的帳戶，我查過了。」\n\n她想{打ち消す|うちけす}，卻說不出話來。\n\n「妳父親的治療費，是我付的。」他走近一步，「董事會的那些人，我也都處理完了。社長的位子，我拿到了。」\n\n「從今天起，再也沒有人可以用任何東西威脅妳。」\n\n唐微的眼淚掉了下來。\n\n「你應該覺得我很{憎い|にくい}才對。我{裏切る|うらぎる}了你。」\n\n「是。」他說，「我很生氣。」\n\n他把她逼到書架前，雙手撐在她兩側，低頭看她。\n\n「[[〈好:す〉きだからこそ、〈許:ゆる〉せない。::正因為喜歡，我才不能原諒。]]」\n\n「不能原諒妳一個人扛著所有事。不能原諒妳以為，我會讓我母親決定我要愛誰。」\n\n「那天晚上妳轉身以後，」他的聲音啞了，「我在原地站了一個小時。我知道妳在演戲。妳說謊的時候，左手會一直摸耳朵。」\n\n唐微哭著笑了。\n\n「所以那天……你說『好』……」\n\n「是為了讓妳放心。」他說，「然後我花了三個月，把擋在我們中間的東西，全部清掉。」\n\n他低頭吻住她，吻得又深又重，像要把這三個月的思念全部討回來。\n\n「我們的{縁|えん}，」他抵著她的額頭{誓う|ちかう}，「不是一張支票就能斷的。」\n\n「[[もう〈二度:にど〉と〈別:わか〉れるなんて〈言:い〉うな。::不准再說要分手。]]」\n\n她靠在他胸口，輕輕{うなずく}。\n\n窗外，書店的招牌亮了起來。她知道，這一次，他們再也不會分開了。", "blurb": "為了保護他，她收下五千萬支票演了一場背叛。「正因為喜歡，我才不能原諒。」", "gram": {"pt": "〜からこそ", "mean": "正因為～才～", "how": "普通形＋からこそ（好きだ→好きだからこそ）", "ex": "〈好:す〉きだからこそ、〈許:ゆる〉せない。", "exzh": "正因為喜歡，我才不能原諒。"}, "boss": {"name": "二階堂惣一", "yomi": "にかいどう そういち", "mark": "惣", "c1": "#18213f", "c2": "#5a6fb8"}}, {"id": "B20", "title": "總裁的冒牌未婚妻", "band": "N3-N2", "text": "「只要三個月。」\n\n天羽昴把一份合約放在桌上，語氣冷淡得像在談生意。\n\n「當我的未婚妻。三個月後，契約結束，妳拿到一千萬，我擺脫家族安排的婚事。」\n\n坐在對面的蘇念念，是一間花店的老闆娘。她的店快倒了，房租已經欠了兩個月。\n\n「為什麼是我？」\n\n「因為妳{手頃|てごろ}。」他說，「沒有背景，沒有麻煩，三個月後消失也不會有人在意。」\n\n念念氣得想把咖啡潑到他臉上。可是她想到那家小花店，還是簽了名。\n\n---\n\n扮演未婚妻，比她想像的難。\n\n天羽家的家族聚會上，每個人都用打量的眼光看她。他的姑姑{皮肉|ひにく}地問她會不會茶道，嫌她沒有{行儀|ぎょうぎ}；他的表妹{意地悪|いじわる}地把紅酒灑在她的裙子上，還說她{厚かましい|あつかましい}。\n\n念念從頭到尾都{上品|じょうひん}地笑著，得體地{振舞う|ふるまう}。她一直{我慢|がまん}，不想讓他丟臉。\n\n宴會結束，坐進車裡，她才發現自己的手一直在抖。\n\n天羽昴看了她一眼，什麼也沒說。\n\n第二天，他的表妹被調去了海外分公司。\n\n---\n\n一個月過去了。\n\n念念發現，這個冷冰冰的男人，有很多她不知道的地方。\n\n他不吃青椒，卻會把她不愛吃的香菜，一根一根挑出來吃掉。\n\n他工作到深夜，卻會在她的花店關門前，特地繞過來接她。\n\n他總是{甘やかす|あまやかす}她，嘴上卻說「我們只是契約關係」。她感冒的時候，他整夜守在床邊，用冰毛巾替她{冷やす|ひやす}額頭，{看病|かんびょう}到天亮。\n\n她開始害怕。三個月結束的那一天，她{果たして|はたして}笑得出來嗎？\n\n---\n\n契約的最後一天，他把一千萬的支票放在她面前。念念把它推了回去。\n\n「這個，我不要了。」\n\n「為什麼？」\n\n「因為我沒辦法只把它當生意。」她低著頭，「我好像……喜歡上你了。所以我不能拿這個錢。」\n\n「這樣也好，契約結束了，我們就當作——」\n\n她還沒說完，手腕就被他抓住了。\n\n「妳以為，」他的聲音很低，「我是真的隨便找了一個人？」\n\n「你說我很手頃……」\n\n「那是{口実|こうじつ}。」他把她拉到面前，「三年前，我母親過世的那天，我在醫院門口的一間小花店，買了一束白色的花。」\n\n「店員是一個女生。她看我一直不說話，多送了我一枝向日葵。她說：『難過的時候，看看黃色的花，心情會好一點。』」\n\n念念愣住了。\n\n她記得那天。那是她剛開店的第一個月。\n\n「三年來，我每個月都去那間花店。」他說，「只是妳從來沒有注意到我。」\n\n「家族安排的婚事是真的。可是選妳，從來不是因為妳手頃。」\n\n他捧起她的臉。\n\n「你明明一直覺得我很麻煩。」她小聲說。\n\n「妳以為，我討厭妳？」他低聲說。\n\n念念的眼淚掉了下來。\n\n「[[〈嫌:きら〉いどころか、〈夢中:むちゅう〉だ。::別說討厭了，我根本為妳著迷。]]」\n\n他低頭吻住她，吻得很慢，很深。\n\n「契約，」他抵著她的額頭說，「改成一輩子。」\n\n「[[〈俺:おれ〉の〈本当:ほんとう〉の〈婚約者:こんやくしゃ〉になれ。::成為我真正的未婚妻。]]」\n\n她笑著點頭。\n\n第二天，他叫人把花店的招牌換成了新的，旁邊多了一行小字：「本店不再缺錢。老闆娘已有主。」\n\n那行字，是他{自ら|みずから}寫的。字很醜，她卻{朗らか|ほがらか}地笑了很久。", "blurb": "三個月的契約未婚妻，到期那天她把支票還了回去。「別說討厭了，我根本為妳著迷。」", "gram": {"pt": "〜どころか", "mean": "別說～，反而～", "how": "名詞／な形容詞語幹＋どころか（嫌い→嫌いどころか）", "ex": "〈嫌:きら〉いどころか、〈夢中:むちゅう〉だ。", "exzh": "別說討厭了，我根本為妳著迷。"}, "boss": {"name": "天羽昴", "yomi": "あもう すばる", "mark": "昴", "c1": "#132748", "c2": "#5b8ad0"}}, {"id": "B21", "title": "總裁的酒後婚約", "band": "N3-N2", "text": "許小滿醒來的時候，頭痛得像要裂開。\n\n她在一間陌生的臥室裡醒來，身上穿著一件男人的{寝間着|ねまき}，床頭放著一杯水和兩顆頭痛藥。\n\n昨晚的記憶，斷斷續續。\n\n公司的尾牙。被灌了很多酒。有人起鬨要她和年輕的社長乾杯。然後……\n\n然後她就什麼都不記得了。\n\n---\n\n臥室的門打開，一個男人走了進來。\n\n東堂冬馬。東堂集團最年輕的社長，全公司最不能惹的人。\n\n他穿著白襯衫，袖子捲到手肘，手上拿著一張紙。\n\n「醒了？」他把紙放在她面前，「這是妳昨晚簽的。」\n\n是一張結婚登記表。\n\n妻子欄，寫著她的名字。字歪歪扭扭的，旁邊還蓋著她的{判子|はんこ}。\n\n「這、這是{冗談|じょうだん}吧！」\n\n「結婚登記。」他說得很平靜，「昨天半夜，我已經投進{役所|やくしょ}的夜間收件口了。」\n\n小滿{慌てる|あわてる}得差點摔下床。\n\n「你瘋了嗎？我{酔う|よう}得連自己是誰都不知道！這根本不算數！」\n\n「妳昨晚很清醒。」他說，「妳抓著我的領帶說，『社長，你每天都板著臉，是不是沒有人愛你？那我來愛你好了。』」\n\n「然後妳自己從包包裡拿出印章。」\n\n小滿把臉埋進棉被裡，想死的心都有了。\n\n---\n\n「我要{取り消す|とりけす}！」她從棉被裡探出頭，「我們去辦離婚！」\n\n「可以。」他說，「不過，役所今天休息。」\n\n「那明天！」\n\n「明天我要出差。」\n\n「那後天！」\n\n「後天也要出差。」他看著她，「接下來三個月，我每天都要出差。」\n\n小滿瞪著他。這個男人，絕對是故意的。\n\n---\n\n接下來的日子，比她想像的還要混亂。\n\n她被迫搬進他的公寓。每天早上，她都{朝寝坊|あさねぼう}，他卻總是比她早起，在廚房煮好味噌湯。\n\n「說好的出差呢？」她問。\n\n「改成線上了。」他面不改色。她{呆れる|あきれる}得瞪著他，這個男人真{図々しい|ずうずうしい}。\n\n她的東西{散らかる|ちらかる}得到處都是，他從不抱怨，只是默默地收好。\n\n公司裡開始有人叫她「社長夫人」。她想解釋，又不知道怎麼解釋。\n\n她發現，這個冷冰冰的男人，其實很溫柔。\n\n---\n\n三個月過去了。\n\n那天晚上，她拿出一張離婚協議書，放在他面前。\n\n「你說過，三個月後就有空了。」她低著頭，「我已經簽好名了。」\n\n東堂冬馬看著那張紙，很久沒有說話。\n\n然後，他把它撕成了兩半。\n\n「你——」\n\n「許小滿。」他站起來，把她逼到牆邊，「妳真的以為，那天晚上，我也醉了嗎？」\n\n她愣住了。\n\n「我沒有喝酒。」他說，「我很清醒地，讓妳簽下了那張紙。」\n\n「為什麼？」\n\n「因為我喜歡妳兩年了。」他的聲音很低，「從妳第一天進公司，在電梯裡對我說『社長早安』開始。」\n\n「我一直在等一個機會。那天晚上，妳自己送上門來了。」\n\n「你……你這個騙子！」\n\n「嗯。」他毫不心虛，「[[〈俺:おれ〉の〈妻:つま〉になった〈以上:いじょう〉、もう〈逃:に〉がさない。::既然成了我的妻子，我就不會再讓妳逃。]]」\n\n他低頭吻住她，吻得又深又霸道。\n\n「妳的{名字|みょうじ}，」他抵著她的額頭{囁く|ささやく}，「以後就是東堂了。」\n\n「[[〈覚悟:かくご〉しろ。::給我做好心理準備。]]」\n\n小滿紅著臉，捶了他一下。\n\n可是她沒有再拿出第二張離婚協議書。\n\n隔天，她偷偷設了鬧鐘，想比他早起，替他煮一碗味噌湯。\n\n結果她還是睡過頭了。他在床邊看著她打{あくび}，笑得很溫柔。\n\n「不用逞強。」他說，「我們{夫婦|ふうふ}之間，誰煮都一樣。」", "blurb": "尾牙喝醉醒來，她發現自己已經和社長登記結婚了。「既然成了我的妻子，就別想逃。」", "gram": {"pt": "〜以上", "mean": "既然～就～", "how": "普通形＋以上（妻になった→妻になった以上）", "ex": "〈俺:おれ〉の〈妻:つま〉になった〈以上:いじょう〉、もう〈逃:に〉がさない。", "exzh": "既然成了我的妻子，我就不會再讓妳逃。"}, "boss": {"name": "東堂冬馬", "yomi": "とうどう とうま", "mark": "冬", "c1": "#10243f", "c2": "#4a76b0"}}, {"id": "B22", "title": "總裁的將棋老師", "band": "N3-N2", "text": "京都的老街上，有一間小小的將棋教室。\n\n教室的主人是二十六歲的林棋，從台灣來的。她的祖父是有名的將棋棋士，生前把這間教室留給了她。\n\n學生不多，大多是附近的小學生和退休的老人。房租快付不出來了，可是她捨不得關門。\n\n那天下午，教室的{障子|しょうじ}被拉開。\n\n一個穿著深灰色西裝的男人站在門口。他脫了鞋，走進來，在{座布団|ざぶとん}上坐下。\n\n「我要下一盤。」\n\n---\n\n他叫一条尊，一条集團的社長。\n\n他下棋很強，實力強得不像業餘的。第一盤，林棋險勝。\n\n「再一盤。」他說。\n\n第二盤，她輸了。她{悔しい|くやしい}得咬住嘴唇。\n\n「再一盤。」她說。\n\n第三盤，{引き分け|ひきわけ}。\n\n窗外的天色已經暗了。她努力保持{冷静|れいせい}，才沒有輸。一条尊站起來，整理了一下西裝。\n\n「明天我再來。」\n\n---\n\n從那天起，他每天下午都來。\n\n他總是坐在同一個位子，{足元|あしもと}放著公事包，安靜地等她教完小學生。然後，兩個人下一盤。\n\n他很{しつこい}。輸了一定要贏回來，贏了一定要再贏一次。\n\n「你一個大社長，每天跑來這裡，公司不會倒嗎？」\n\n「不會。」他頭也不抬，「我把會議都排在早上了。」\n\n有時候，下到一半，她的腿{しびれる}了，忍不住偷偷換姿勢。他會裝作沒看見，把自己的座布団推給她。\n\n有時候，她下了一步好棋，他會沉默很久，然後低聲說：「{見事|みごと}。」\n\n他是她見過最{生意気|なまいき}的對手，也是最{素直|すなお}的。\n\n---\n\n三個月後，房東通知她：大樓要拆了。\n\n林棋坐在空蕩蕩的教室裡，看著祖父留下來的棋盤，眼淚一滴一滴掉下來。\n\n「為什麼哭？」\n\n一条尊站在門口。\n\n「教室要沒了。」她擦掉眼淚，「祖父說過，將棋教的不只是{勝負|しょうぶ}，是怎麼面對輸。可是我連這間教室都守不住。」\n\n他走進來，在她對面坐下。\n\n「下一盤。」\n\n「現在？」\n\n「如果妳贏了，」他說，「這棟大樓，我買下來，送給妳。」\n\n「如果我輸了呢？」\n\n他看著她，沒有回答。\n\n---\n\n那一盤，下了兩個小時。\n\n她專心地盯著棋盤，一點也不敢{油断|ゆだん}。最後一步，她將死了他的王。\n\n林棋抬起頭，發現他在笑。\n\n「你……是故意輸的？」\n\n「不是。」他說，「我盡全力了。妳是真的贏了。」\n\n「那你剛才為什麼不回答——如果我輸了要怎麼樣？」\n\n「因為，不管輸贏，我要說的話都一樣。」\n\n他從西裝口袋裡拿出一個小盒子，放在棋盤上。\n\n「三年前，妳祖父的告別式上，我是來弔唁的人之一。他是我的老師。」他說，「他說，他有一個最{自慢|じまん}的孫女，下棋下得比他還好，就是太倔強了，請我替他照顧。」\n\n「我本來只是想來{稽古|けいこ}。」他低聲說，「可是後來，我每天來，只是想看妳下棋時的樣子。」\n\n林棋的眼淚又掉了下來。\n\n「[[〈気:き〉が〈変:か〉わらないうちに、〈返事:へんじ〉をしろ。::趁我還沒改變心意，快點回答我。]]」\n\n她笑著打開盒子，裡面是一枚戒指，戒台刻著一顆小小的將棋棋子。\n\n她點了點頭。\n\n他隔著棋盤，傾身吻住她。\n\n「教室，」他說，「以後我們一起守。妳當老師，我當徒弟。」\n\n「你這麼大的弟子，我不收。」\n\n「那就收一個丈夫。」他說，「[[〈一生:いっしょう〉、〈俺:おれ〉と〈指:さ〉せ。::這輩子，都跟我一起下棋。]]」", "blurb": "每天來將棋教室挑戰她的總裁，最後押上了一枚戒指。「趁我還沒改變心意，快回答。」", "gram": {"pt": "〜うちに", "mean": "趁～的時候", "how": "動詞ない形＋うちに（変わらない→変わらないうちに）", "ex": "〈気:き〉が〈変:か〉わらないうちに、〈返事:へんじ〉をしろ。", "exzh": "趁我還沒改變心意，快點回答我。"}, "boss": {"name": "一条尊", "yomi": "いちじょう たける", "mark": "尊", "c1": "#1a2440", "c2": "#61759f"}}, {"id": "B23", "title": "總裁的深夜電台", "band": "N3-N2", "text": "凌晨一點，東京的夜{更ける|ふける}了，整條街都{静まる|しずまる}下來。\n\n一間小小的電台裡，紀夜正對著麥克風說話。\n\n「晚安，還醒著的你。這裡是《一點鐘的書信》，我是夜。」\n\n她是這個深夜節目的主持人。節目很冷門，有人說它很{退屈|たいくつ}，收聽率低得可憐，每週只有幾封聽眾的來信。\n\n可是有一個聽眾，從來沒有缺席過。\n\n每週一，電台都會收到他寄來的信。白色的{便箋|びんせん}，工整的字，{宛名|あてな}寫著「夜小姐收」，署名只有一個字：「紫」。她一直很好奇，寫信的人是什麼樣的人。\n\n---\n\n「夜小姐，今天又是睡不著的一晚。」\n\n紀夜讀著他的信，聲音輕得像在{囁く|ささやく}。\n\n「我已經三年沒有好好睡過一覺了，每天都頭痛。醫生開的藥，藥局買的安眠藥，都沒有用。」\n\n「只有聽妳的節目的時候，我才能睡著一下子。」\n\n「妳說話的{響き|ひびき}，很像下雨的聲音。」\n\n那天，她在節目的最後說：「紫先生，如果你在聽，今天就早點睡吧。我會一直說話，直到你睡著為止。」\n\n那一晚，她講到了{明け方|あけがた}。\n\n---\n\n一個月後，電台的社長突然把她叫進辦公室。\n\n「節目要停了。」社長嘆氣，「收聽率太低，贊助商撤資了。」\n\n紀夜的腦中一片空白。\n\n最後一集，她準備了很久。\n\n「這是最後一次了。」她對著麥克風說，「謝謝每一個睡不著的你。」\n\n「紫先生，對不起。以後，你要{ぐっすり}地睡喔。」\n\n節目結束，她一個人坐在{薄暗い|うすぐらい}的錄音室裡，很久沒有動。\n\n門外傳來一點{物音|ものおと}，錄音室的門被推開了。\n\n一個穿著黑色大衣的男人站在門口。高大，臉色蒼白，眼睛下面有很深的黑眼圈，扶著門框。\n\n「妳就是夜？」\n\n她認得那個字。他手上拿著一封還沒寄出的信，白色的便箋，署名「紫」。\n\n---\n\n「白鷺紫苑。」他說，「白鷺集團的社長。」\n\n紀夜愣住了。那個每週寫信給她的聽眾，竟然是這種大人物。\n\n「三年前，我的公司差點倒閉。」他說，「從那天起，我就睡不著了。」\n\n「有一天晚上，我開車經過這附近，收音機剛好轉到妳的節目。妳在讀一封聽眾的{便り|たより}，是一個被裁員的上班族寫的。」\n\n「妳說：『睡不著也沒關係。天會亮的。』那句話{慰める|なぐさめる}了我。」\n\n「那是我三年來，第一次在車上睡著。」\n\n紀夜的眼眶紅了。\n\n「剛才，」他走近一步，「我把這間電台買下來了。」\n\n「什麼？」\n\n「節目不會停。」他說，「從下週開始，每天播。」\n\n「你、你為什麼要做到這種地步？」\n\n他{見詰める|みつめる}她，聲音很低。\n\n「[[お〈前:まえ〉のせいで、〈眠:ねむ〉れない。::都是妳害的，我睡不著。]]」\n\n「以前是因為工作。現在，是因為想見妳。」\n\n紀夜的心跳亂了。\n\n他把她逼到錄音室的玻璃牆邊，低頭看她，眼神燙得驚人。\n\n「妳說過，會一直說話，直到我睡著為止。」他說，「那就說到我睡著。每一天。」\n\n「這、這是要我當你的安眠藥嗎？」\n\n「不是。」他低頭吻住她，「是要妳當我的妻子。」\n\n吻很深，很慢，像一首在深夜裡播放的歌。\n\n那天以後，《一點鐘的書信》每天都播。\n\n只是在節目的最後，她總會{しみじみ}地多說一句：\n\n「晚安，紫。今天也要好好睡喔。」\n\n他總是在錄音室外面等她，等她下班一起回家。她在他懷裡輕聲說著話，他聽著聽著，就睡著了。", "blurb": "冷門深夜電台的女主持，每週都收到同一位失眠聽眾的信。「都是妳害的，我睡不著。」", "gram": {"pt": "〜せいで", "mean": "都怪～、因為～（壞結果）", "how": "名詞＋のせいで（お前→お前のせいで）", "ex": "お〈前:まえ〉のせいで、〈眠:ねむ〉れない。", "exzh": "都是妳害的，我睡不著。"}, "boss": {"name": "白鷺紫苑", "yomi": "しらさぎ しおん", "mark": "紫", "c1": "#1d1f45", "c2": "#7067c0"}}, {"id": "B24", "title": "總裁的老房子", "band": "N3-N2", "text": "輕井澤的森林深處，有一棟被遺忘的{別荘|べっそう}。\n\n木造的二層樓，紅色的{屋根|やね}已經褪成了粉色，院子裡的{植木|うえき}長得比人還高，{垣根|かきね}倒了一半，整片{敷地|しきち}都被雜草蓋住了。\n\n建築師溫知意第一次看到它的時候，覺得它像一個沉睡的老人。\n\n「我要妳把它修好。」\n\n委託人皇聖站在她身邊，看著那棟房子，表情冷淡。\n\n「拆掉重蓋比較便宜。」知意說，「這棟房子，地基已經{傾いて|かたむいて|傾く}了。」\n\n「我不要新的。」他說，「我要它原來的樣子。」\n\n---\n\n{工事|こうじ}開始了。\n\n知意每週都要從東京開車來。她量每一扇窗的{寸法|すんぽう}，找來最老派的{大工|だいく}師傅，一塊一塊地換掉腐爛的{材木|ざいもく}。\n\n皇聖也每週都來。\n\n他不太說話，總是站在院子裡，看著工人們爬上爬下。有時候，他會走進那個積滿灰塵的客廳，在壁爐前站很久。\n\n「這裡以前是誰住的？」她忍不住問。\n\n「我祖母。」他說，「我小時候，每年夏天都在這裡過。」\n\n「後來她過世了，家族的人說，這種老房子沒有價值，就把它放著不管。」\n\n「你為什麼現在才想修？」\n\n他沉默了一下：「因為我終於找到了，能讓它恢復原樣的人。」\n\n---\n\n三個月後，房子漸漸變回了原來的樣子。\n\n{煙突|えんとつ}重新冒出了煙。{日当たり|ひあたり}最好的那個房間，換上了新的榻榻米。地板的{凸凹|でこぼこ}，她請{職人|しょくにん}一寸一寸地磨平。\n\n那天傍晚，知意在閣樓裡發現了一本素描簿。\n\n裡面畫的，全是這棟房子。每一頁的角落，都寫著日期和一個名字：「聖，八歲」。\n\n最後一頁，畫的是一個女孩子，站在院子裡的樹下，對著畫的人笑。\n\n旁邊寫著：「隔壁的小知。她說，長大以後要當建築師，替我修好這棟房子。」\n\n知意的手開始發抖。\n\n她想起來了。\n\n小時候，她跟著當園丁的爸爸，在這附近住過一個夏天。她記得有一個總是板著臉的小男孩，每天都坐在這棟房子的走廊上畫畫。\n\n---\n\n「找到了？」\n\n皇聖站在閣樓的樓梯口。\n\n「你……早就知道是我？」\n\n「看到妳的履歷那天，就知道了。」他走上來，「妳的名字，我一看就認出來了。」\n\n「那你為什麼不說？」\n\n「因為我想看看，」他說，「妳是不是還記得那個約定。」\n\n「我……我忘了。」她的眼淚掉了下來，「對不起。」\n\n「沒關係。」他說，「妳修房子的樣子，跟妳八歲時說的一模一樣。」\n\n「這三個月，我每週都來。本來只是想看房子。」\n\n他把她拉進懷裡，聲音很低。\n\n「[[〈君:きみ〉を〈好:す〉きになる〈一方:いっぽう〉だ。::我只會越來越喜歡妳。]]」\n\n知意靠在他胸口，聽見他的心跳，又快又重。\n\n「房子修好以後，」他說，「我想請妳住進來。」\n\n「以什麼身分？」\n\n「這棟房子的女主人。」\n\n他低頭吻住她，在落滿夕陽的閣樓裡，吻得又深又慢。\n\n「[[ここで〈一緒:いっしょ〉に〈暮:く〉らそう。::我們一起住在這裡吧。]]」\n\n那年冬天，房子修好了。\n\n{懐かしい|なつかしい}的木頭味道，壁爐裡燒著柴火。門口的名牌上，第一次並排寫著兩個名字。", "blurb": "建築師修復森林裡被遺忘的老別墅，在閣樓找到一本畫著自己的素描簿。", "gram": {"pt": "〜一方だ", "mean": "越來越～（持續往一個方向變化，常帶負面語感）", "how": "動詞辭書形＋一方だ（好きになる→好きになる一方だ）", "ex": "〈君:きみ〉を〈好:す〉きになる〈一方:いっぽう〉だ。", "exzh": "我只會越來越喜歡妳。"}, "boss": {"name": "皇聖", "yomi": "すめらぎ ひじり", "mark": "聖", "c1": "#161e3c", "c2": "#5d6db3"}}, {"id": "B25", "title": "總裁的政治聯姻", "band": "N3-N2", "text": "九重家和葉家的婚約，是二十年前就定下的。\n\n那時候，九重京介十歲，葉恬五歲。兩家的老爺子在酒席上拍板：等孩子長大了，就結成親家。\n\n二十年後，葉家的公司經營不善，眼看就要{倒産|とうさん}。這場婚事，成了葉家最後的救命稻草。\n\n訂婚宴上，葉恬第一次見到她的未婚夫。\n\n九重京介穿著黑色西裝，站在宴會廳的正中央，被兩家的{重役|じゅうやく}們圍著。冷峻的臉上，沒有一絲笑意。\n\n他走過來，只看了她一眼。\n\n「[[〈婚約:こんやく〉なんて、〈形式:けいしき〉に〈過:す〉ぎない。::婚約這種東西，只不過是形式罷了。]]」\n\n他{囁く|ささやく}，聲音低得只有她聽得見。\n\n「妳不用期待什麼。這是一場只看{損得|そんとく}的婚姻，妳{勝手に|かってに}過妳的日子。」\n\n葉恬{呆れる|あきれる}得笑了：「正好，我也這麼想。」\n\n---\n\n婚後，他們真的各過各的。\n\n他住在主臥，她住在客房。他早出晚歸，她白天在一間小出版社當編輯。兩個人一週說不到十句話。\n\n她以為，日子就會這樣過下去。\n\n直到那天晚上，她加班到十一點，在公司樓下被一個{酔っ払い|よっぱらい}纏上。\n\n「小姐，一起喝一杯嘛……」\n\n她嚇得往後退，背撞上了一個人。\n\n一隻手伸過來，抓住了醉漢的{手首|てくび}，輕輕一{捻る|ひねる}。醉漢慘叫一聲，跌坐在地上。\n\n是九重京介。\n\n「你、你怎麼在這裡？」\n\n「路過。」他說。\n\n可是他的車，就停在她公司對面。引擎蓋是冰的，停了很久了。\n\n---\n\n從那天起，她開始{気付く|きづく}很多事——原來他一直在{甘やかす|あまやかす}她。\n\n她隨口說想吃的蛋糕，第二天就會出現在冰箱裡。\n\n她熬夜改{原稿|げんこう}，書房的門縫裡就會塞進一杯熱牛奶。\n\n她感冒的那一晚，迷迷糊糊中，有人替她換了額頭上的毛巾，整夜沒有離開。\n\n「你不是說，」她終於忍不住問他，「我們各過各的嗎？」\n\n九重京介放下手上的文件，{見詰める|みつめる}她很久。\n\n「葉恬。」他說，「妳記得二十年前的那場酒席嗎？」\n\n「我只有五歲，怎麼會記得。」\n\n「我記得。」他說，「那天，我被父親罵了，一個人躲在庭院裡哭。一個穿著粉紅色裙子的小女孩跑過來，把她手上的糖塞給我。」\n\n「她說：『哥哥不要哭。等我長大了，就嫁給你，每天給你糖吃。』」\n\n葉恬的{頬|ほお}一下子紅透了。\n\n「那時候，兩家老爺子剛好聽到了。」他說，「所以，這個婚約，其實是妳自己定的。」\n\n「那你訂婚宴上為什麼說……只是形式？」\n\n「因為我怕。」他站起來，一步一步走向她，「怕妳是為了葉家，才勉強嫁給我。」\n\n「我不想要一個因為責任而留在我身邊的妻子。」\n\n他把她逼到書架前，低頭看她，眼神第一次露出了溫度。\n\n「我收回那句話。」他說，「這場婚約，從來就不是形式。」\n\n「[[〈俺:おれ〉にとって、お〈前:まえ〉がすべてだ。::對我來說，妳就是一切。]]」\n\n葉恬的眼淚掉了下來。她踮起腳，吻了他。\n\n九重京介愣了一秒，然後扣住她的後腦，吻得又深又重，像是要把這半年的{我慢|がまん}全部討回來。\n\n「今晚開始，」他啞著聲音說，「搬進主臥。」\n\n「這是命令？」\n\n「是請求。」他頓了一下，「……也是命令。」", "blurb": "二十年前定下的政治聯姻，他在訂婚宴上說：「婚約只不過是形式。」", "gram": {"pt": "〜に過ぎない", "mean": "只不過是～", "how": "名詞＋に過ぎない（形式→形式に過ぎない）", "ex": "〈婚約:こんやく〉なんて、〈形式:けいしき〉に〈過:す〉ぎない。", "exzh": "婚約這種東西，只不過是形式罷了。"}, "boss": {"name": "九重京介", "yomi": "ここのえ きょうすけ", "mark": "京", "c1": "#121c36", "c2": "#4b66a3"}}, {"id": "B26", "title": "總裁的前夫", "band": "N3-N2", "text": "離婚三年後，夏芷第一次回到京都。\n\n她穿著外婆留下的浴衣，踩著一雙{下駄|げた}，走在夏日祭典的燈籠下。{人通り|ひとどおり}很多，到處都是笑聲。\n\n三年前，她也是在這裡，和那個人一起撈金魚。\n\n那時候，她以為他們會一輩子在一起。\n\n---\n\n「芷。」\n\n身後傳來一個低沉的聲音。\n\n她的心跳停了一拍。不用{振り向く|ふりむく}，她也知道是誰。\n\n黒瀬伊織。她的前夫。\n\n「好久不見。」她轉過身，努力讓自己的聲音聽起來很平靜，「黒瀬社長。」\n\n他穿著深藍色的浴衣，比三年前瘦了，眼神卻更深了。他看著她，看了很久，視線最後落在她的左手上。\n\n那裡什麼都沒有。三年前，她親手把婚戒{外す|はずす}，放在離婚協議書上。\n\n「妳還在{恨む|うらむ}我嗎？」\n\n「恨你做什麼。」她笑了笑，「都過去了。」\n\n---\n\n三年前，他突然提出離婚。\n\n沒有理由，沒有解釋。她哭著問他為什麼，他只說了一句：「我們不適合。」\n\n她搬回了台灣，花了一整年，才學會一個人睡覺。\n\n「妳現在過得好嗎？」他問。\n\n「很好。」她說謊了。\n\n神社那邊響起了鈴聲。她轉身想{引き返す|ひきかえす}，手腕卻被他一把抓住。\n\n「芷，我欠妳一個解釋。」\n\n---\n\n他們坐在神社後面的石階上，遠處的煙火一朵一朵綻開。\n\n「三年前，我的家族要我娶另一個財團的女兒。」他說，「我拒絕了。」\n\n「我父親說，如果我不離婚，就讓妳在日本待不下去。他會用各種手段，讓妳的工作、妳的朋友、妳的一切，都消失。」\n\n「我不能讓妳承受那些。」\n\n夏芷的手開始{震える|ふるえる}，她{堪える|こらえる}著不讓眼淚掉下來。\n\n「所以你就……一個人決定了一切？」\n\n「對。」他低下頭，「這是我這輩子做過最錯的決定。我好{悔やむ|くやむ}。」\n\n「這三年，我花了所有時間，把家族的權力全部拿到手。」他說，「現在，再也沒有人可以威脅我們了。」\n\n他轉過身，從浴衣的袖子裡拿出一個小盒子。\n\n裡面是那枚婚戒。\n\n「我一直帶在身上。」他說，「每天都像在{拝む|おがむ}一樣看著它，想著妳。」\n\n「芷，我是來向妳{詫びる|わびる}的。」\n\n她的眼淚掉了下來。\n\n「這三年，你知道我有多想你嗎？」\n\n「我知道。」他的聲音啞了，「因為我也一樣。」\n\n他握住她的左手，把戒指輕輕{はめる}進她的{薬指|くすりゆび}。\n\n「[[もう〈二度:にど〉と〈君:きみ〉を〈泣:な〉かせまい。::我絕不會再讓妳哭了。]]」\n\n煙火在他們頭上綻開，照亮了她滿是淚痕的{頬|ほお}。他低頭吻住她，吻得又深又重，像要把三年的思念全部吞下去。\n\n「[[もう〈一度:いちど〉、〈俺:おれ〉の〈妻:つま〉になれ。::再當一次我的妻子。]]」\n\n她哭著笑了，點了點頭。\n\n那天晚上，他們一起去撈金魚。他撈到了一條紅色的，小心地放進她手裡的袋子。\n\n「這次，」他說，「我們一起{改める|あらためる}過去的錯。」", "blurb": "離婚三年後的夏日祭典，前夫帶著那枚婚戒出現了。「我絕不會再讓妳哭。」", "gram": {"pt": "〜まい", "mean": "絕不～（決心）", "how": "五段動詞：辭書形＋まい；一段動詞：辭書形／ない形＋まい（泣かせる→泣かせまい）", "ex": "もう〈二度:にど〉と〈君:きみ〉を〈泣:な〉かせまい。", "exzh": "我絕不會再讓妳哭了。"}, "boss": {"name": "黒瀬伊織", "yomi": "くろせ いおり", "mark": "織", "c1": "#0d1d36", "c2": "#3a62a6"}}, {"id": "B27", "title": "總裁的末班車", "band": "N3-N2", "text": "深夜十二點，東京的地下鐵。\n\n辛小悅又坐過站了。\n\n她加班到十一點半，一上車就睡著了。醒來的時候，列車已經停在終點站，車廂裡只剩下她，和一個男人。\n\n男人坐在她對面，穿著黑色大衣，手上拿著一本記事本，正在寫什麼。\n\n「請問……這是哪一站？」\n\n男人抬起頭，一臉{呆れる|あきれる}的表情：「終點。妳{乗り越し|のりこし}了。」\n\n「完了……」小悅抱著頭，「這是最後一班車吧？」\n\n「嗯。」\n\n---\n\n他們一起走出{改札|かいさつ}。\n\n外面下著小雨。這是一個陌生的郊區小站，{人通り|ひとどおり}很少，{薄暗い|うすぐらい}的燈下，連計程車都沒有。\n\n小悅站在屋簷下，{ため息|ためいき|溜息}連連，手足無措。\n\n男人看了她一眼，脫下大衣，{被せる|かぶせる}到她頭上。\n\n「走吧。」\n\n「去、去哪裡？」\n\n「附近有一間二十四小時的咖啡店。」他說，「等第一班車。」\n\n---\n\n那一夜，他們在小小的咖啡店裡，聊了很久。\n\n他叫堂島静馬，說自己是做生意的，每天都忙到最後一班車。\n\n「每天？」\n\n「每天。」他說，「家裡沒有人等，回去也只是睡覺。」\n\n小悅笑了：「我也是。我來東京三年了，每天都是公司和家，{往復|おうふく}兩個地方。」\n\n「不覺得孤單嗎？」\n\n「孤單啊。」她說，「可是習慣了。」\n\n他看著她，很久沒有說話。\n\n天亮的時候，第一班車來了。他們在{待合室|まちあいしつ}道別。\n\n「謝謝你陪我。」小悅說，「你的大衣……」\n\n「下次再還我。」他說，「同一班車，同一個時間，我們{待ち合わせる|まちあわせる}。」\n\n---\n\n從那天起，小悅每天都搭最後一班車。\n\n他{相変わらず|あいかわらず}坐在同一個位子，手上拿著同一本記事本。她坐在他對面，有時候聊天，有時候各自發呆。\n\n可是一個月後，他不見了。\n\n一天，兩天，一個星期。他再也沒有出現。車廂裡，再也感覺不到他的{気配|けはい}。\n\n小悅坐在空蕩蕩的車廂裡，心裡空了一塊。她連他的電話都沒有。\n\n---\n\n兩週後，她被公司派去參加一場大型的商業簽約會。\n\n主位上坐著的，是業界最大集團的社長。\n\n她抬頭一看，手上的資料差點掉在地上。\n\n是他。堂島静馬。\n\n散會後，她在走廊上攔住他。\n\n「你……這三個禮拜，去哪裡了？」\n\n「出差。」他說，「去紐約，談這個案子。」\n\n「那你為什麼不說一聲？」她的眼眶紅了，{頬|ほお}上全是淚，「我每天都在等你。」\n\n他沉默了一下，從口袋裡拿出那本記事本，翻到最後一頁，遞給她。\n\n上面密密麻麻，寫滿了日期。每一個日期旁邊，都寫著一句話。\n\n「她今天笑了三次。」\n\n「她說她喜歡櫻花。」\n\n「她今天看起來很累。明天要小心一點，別讓她睡過站。」\n\n小悅看著那些字，再也{我慢|がまん}不住，眼淚掉了下來。\n\n「其實，我有司機。」他說，「我搭最後一班車，是為了見妳。」\n\n「[[〈君:きみ〉に〈会:あ〉わないことには、〈何:なに〉も〈始:はじ〉まらない。::不見到妳，什麼都開始不了。]]」\n\n他把她拉進懷裡，低頭吻住她。\n\n「今天，」他在她耳邊{囁く|ささやく}，「不用搭最後一班車了。」\n\n「[[〈俺:おれ〉が〈送:おく〉る。::我送妳回家。]]」", "blurb": "每晚末班車，坐在她對面的男人在手帳上寫滿了她。", "gram": {"pt": "〜ないことには", "mean": "不～的話就（無法）", "how": "動詞ない形＋ことには（会う→会わないことには）", "ex": "〈君:きみ〉に〈会:あ〉わないことには、〈何:なに〉も〈始:はじ〉まらない。", "exzh": "不見到妳，什麼都開始不了。"}, "boss": {"name": "堂島静馬", "yomi": "どうじま しずま", "mark": "静", "c1": "#1c2546", "c2": "#6b7cc2"}}, {"id": "B28", "title": "總裁的化妝師", "band": "N3-N2", "text": "「今天的拍攝，社長的妝交給妳。」\n\n攝影棚的總監{ため息|ためいき|溜息}，把一份行程表塞到溫若若手裡，語氣像在宣布死刑。\n\n若若是剛入行一年的化妝師。今天的拍攝對象，是商業雜誌的封面人物——冷泉集團的社長，冷泉環。\n\n聽說他很討厭被化妝。上一個化妝師，被他三句話罵到哭著{引っ込む|ひっこむ}後台。\n\n---\n\n冷泉環走進化妝間的時候，空氣都冷了三度。\n\n他在鏡子前坐下，看了她一眼：「妳是新人？」\n\n「是。」\n\n「{素人|しろうと}就別碰我的臉。」\n\n若若握緊了手上的刷子。她{堪える|こらえる}著不讓自己退縮。\n\n她{浮かべる|うかべる}職業的笑容：「社長，我知道您不喜歡化妝。我會很快，也會很自然，讓您看起來不像化過妝。」\n\n「如果您不滿意，我自己跟總監說，換人。」\n\n他{見詰める|みつめる}鏡子裡的她，沉默了幾秒：「{生意気|なまいき}的新人。」\n\n「五分鐘。」\n\n---\n\n她幹勁十足地開始工作。\n\n她的手指輕輕{撫でる|なでる}過他的臉，先替他整理了乾燥的皮膚，讓它多了一點{艶|つや}，再用最淡的粉，蓋住他眼下的黑眼圈。\n\n靠得很近的時候，她發現，這個男人的{まぶた}上，有一道很淺的疤。\n\n「這是怎麼弄的？」她忍不住問。\n\n「小時候的事。」他閉著眼睛，「不重要。」\n\n她沒有遮住那道疤，只是讓它變得柔和一點。\n\n五分鐘後，妝{仕上がる|しあがる}了。她退後一步。\n\n「好了。」\n\n冷泉環睜開眼睛，看著鏡子裡的自己，很久沒有說話。\n\n那是他，又不完全是他。少了平常的冷硬，多了一點溫度。\n\n「妳沒有把疤蓋掉。」\n\n「我覺得，那是您的一部分。」她說，「不需要藏起來。」\n\n---\n\n攝影棚的燈光{照らす|てらす}著他的臉，拍攝很順利。總監說，這是他拍過最好的一次封面。\n\n收工的時候，若若在化妝間收拾東西。冷泉環走了進來，關上門。\n\n「溫若若。」\n\n她嚇了一跳，手上的口紅掉在地上。\n\n「社、社長？有什麼不滿意的地方嗎？」\n\n他蹲下來，替她撿起那支口紅，放在她手心。\n\n「十五年前，」他說，「有一個小女孩，在醫院的走廊上，替一個眼睛受傷的男孩貼了一個卡通OK繃。」\n\n若若整個人{固まる|かたまる}了。\n\n「她說，『哥哥，疤痕不可怕，那是你勇敢過的證明。』」\n\n那是她八歲的時候。爸爸住院，她每天都在醫院走廊玩。\n\n「是……是你？」\n\n「我認出妳了。」他說，「其實，聽說化妝師是妳，我才答應來拍這個封面。」\n\n「[[あの〈日:ひ〉、〈君:きみ〉に〈出会:であ〉って〈以来:いらい〉、ずっと〈君:きみ〉を〈探:さが〉していた。::自從那天遇見妳，我就一直在找妳。]]」\n\n他站起來，靠近她，把她圈在化妝台前。\n\n若若的{頬|ほお}紅透了。\n\n她今天沒有化妝，素著一張臉，頭髮也有點亂。\n\n「我、我今天的樣子很{地味|じみ}……」\n\n「素顏的妳，最好看。」\n\n他低頭吻住她，吻得很慢，像在描一幅最細緻的妝。\n\n「[[〈明日:あした〉も〈俺:おれ〉の〈顔:かお〉に〈触:さわ〉れ。::明天也來碰我的臉。]]」\n\n「這是工作嗎？」\n\n「不是。」他說，「是命令。」", "blurb": "討厭化妝的冷面社長，只讓新人化妝師碰他的臉。", "gram": {"pt": "〜て以来", "mean": "自從～之後（一直）", "how": "動詞て形＋以来（出会う→出会って以来）", "ex": "あの〈日:ひ〉、〈君:きみ〉に〈出会:であ〉って〈以来:いらい〉、ずっと〈君:きみ〉を〈探:さが〉していた。", "exzh": "自從那天遇見妳，我就一直在找妳。"}, "boss": {"name": "冷泉環", "yomi": "れいぜい たまき", "mark": "環", "c1": "#0f2238", "c2": "#4c7aa8"}}, {"id": "B29", "title": "總裁的保鑣", "band": "N3-N2", "text": "「從今天起，他就是妳的保鑣。」\n\n父親的話，讓江瑤差點把咖啡杯摔了。\n\n站在客廳中央的男人，高大，沉默，穿著一身黑色西裝。左邊眉毛上有一道淺淺的疤，眼神冷得像刀。\n\n「我不需要保鑣！」\n\n「最近家裡很{物騒|ぶっそう}，收到了恐嚇信。家裡雖然裝了{防犯|ぼうはん}監視器，還是不夠。」父親說，「這件事沒有商量的餘地。」\n\n男人微微低頭：「鬼塚剛。從今天起，妳的安全由我負責。」\n\n---\n\n江瑤討厭他。\n\n她去上課，他跟在後面。她去逛街，他站在店門口。她去約會，他坐在隔壁桌，面無表情地喝著黑咖啡，把她的約會對象嚇跑了三個。\n\n「你可以不要跟這麼緊嗎？」\n\n「不行。」\n\n「我要去洗手間！」\n\n「我在門口等。」他一臉{呆れる|あきれる}的表情。\n\n她氣得想尖叫。\n\n可是，慢慢地，她發現了一些事。\n\n雨下得很大的時候，他手上的傘總是默默地偏向她那邊，自己的半邊肩膀濕透。\n\n她熬夜念書的時候，房門外會放著一杯熱牛奶。\n\n她不小心扭到腳，他二話不說，{背負う|せおう}著她走了兩公里的路。那個背影，很{頼もしい|たのもしい}。\n\n---\n\n那天晚上，她從補習班出來，街上{人通り|ひとどおり}很少，她總覺得背後有人的{気配|けはい}。\n\n一輛{怪しい|あやしい}的黑色廂型車突然停在她身邊。車門打開，兩個戴口罩的男人衝下來，{引っ張る|ひっぱる}她的手臂。\n\n「放開我！」\n\n下一秒，一個黑影從後面衝了過來。\n\n鬼塚剛一把把她拉到身後，飛快地擋在她前面。他的動作快得看不清，兩個男人轉眼就倒在地上。\n\n廂型車逃走了。\n\n江瑤全身{震える|ふるえる}，腿軟得站不住。\n\n他轉過身，一把抱住她。\n\n「沒事了。」他的聲音第一次有了溫度，「我在。」\n\n她把臉埋進他的胸口，終於哭了出來。\n\n---\n\n那天以後，警察抓到了寫恐嚇信的人。是父親公司的一個前員工。\n\n保鑣的合約，也到期了。\n\n鬼塚剛在玄關穿鞋，準備離開。\n\n「你……就這樣走了？」江瑤站在樓梯上。\n\n「任務結束了。」他沒有回頭。\n\n「可是我……」她咬著嘴唇，「我還是很怕。」\n\n他停下動作。\n\n「怕什麼？」\n\n「怕你不在。」她的聲音小得幾乎聽不見，「那天晚上，真的好{恐ろしい|おそろしい}。」\n\n鬼塚剛轉過身，{見詰める|みつめる}她很久。\n\n「江瑤，」他說，「妳知道我為什麼接下這份工作嗎？」\n\n「我本來是鬼塚保全的社長。這種案子，我從來不親自出馬。」\n\n「可是看到委託書上，妳的照片的時候，」他走上樓梯，一步一步靠近她，「我就決定自己來。」\n\n「三年前，在一場慈善晚會上，妳把自己的外套披在一個被雨淋濕的保全身上。妳不記得了吧。」\n\n「那個保全，是我。」\n\n江瑤的眼淚掉了下來。\n\n「[[〈好:す〉きな〈女:おんな〉は〈守:まも〉るものだ。::喜歡的女人，本來就該守護。]]」\n\n他低頭吻住她，吻得又深又狠，像是把這段時間{我慢|がまん}的感情全部放了出來。\n\n「合約結束了，」他在她耳邊{囁く|ささやく}，「從今天起，換一份新合約。」\n\n「什麼合約？」\n\n他看著她，像在{誓う|ちかう}一樣：「[[〈一生:いっしょう〉、お〈前:まえ〉を〈守:まも〉る。::一輩子守護妳。]]」", "blurb": "父親請來的冷面保鑣，緊跟著她嚇跑了所有約會對象。", "gram": {"pt": "〜ものだ", "mean": "本來就該～（理所當然）", "how": "動詞辭書形＋ものだ（守る→守るものだ）", "ex": "〈好:す〉きな〈女:おんな〉は〈守:まも〉るものだ。", "exzh": "喜歡的女人，本來就該守護。"}, "boss": {"name": "鬼塚剛", "yomi": "おにづか ごう", "mark": "剛", "c1": "#18213f", "c2": "#5a6fb8"}}, {"id": "B30", "title": "總裁的情敵", "band": "N3-N2", "text": "「西條社長，這是我的未婚夫。」\n\n慈善晚宴上，宋恩熙挽著一個男人的手臂，笑得很甜。\n\n西條玄端著酒杯，整個人{固まる|かたまる}在原地。他的臉上沒有表情，握著杯子的手指卻白了。\n\n宋恩熙是他的秘書。跟了他五年。\n\n五年來，她替他排行程、擋應酬、熬夜改企劃書。他從來不{素直|すなお}，連一句謝謝都沒說過，因為他以為，她會一直在。\n\n「恭喜。」他{一応|いちおう}裝作{平気|へいき}地說。\n\n---\n\n隔天，宋恩熙遞出了辭呈。\n\n「下個月結婚，」她說，「婚後要跟他去新加坡。」\n\n西條玄{見詰める|みつめる}辭呈，很久沒有說話。想到以後再也喝不到她泡的咖啡，他竟然覺得很{惜しい|おしい}。\n\n「那個男人，」他終於開口，「妳了解他多少？」\n\n「三個月。」她說，「可是他對我很好。」\n\n「三個月就決定嫁人？」\n\n「至少，」宋恩熙看著他，聲音有點啞，「他會說喜歡我。」\n\n西條玄的心臟，像被什麼東西狠狠揪住了。\n\n---\n\n他讓人查了那個男人。\n\n結果讓他的臉色一點一點變冷。那個男人果然很{怪しい|あやしい}。對方表面上是新加坡的創業家，實際上背了一大筆{借金|しゃっきん}，正在找有錢的對象。他{狙う|ねらう}的，是宋恩熙父親留給她的那塊地。\n\n西條玄拿著調查報告，衝進了宋恩熙的公寓。\n\n「妳不能嫁給他。」\n\n「為什麼？」\n\n「他在{騙す|だます}妳。」他把報告丟在桌上，「他接近妳，只是為了妳的土地。」\n\n宋恩熙看著報告，臉色慢慢發白。\n\n「你……{探る|さぐる}他的底細？」\n\n「對。」\n\n「你憑什麼？」她的眼淚掉了下來，「五年了，你連一句好聽的話都沒對我說過。現在，你憑什麼管我嫁給誰？」\n\n西條玄{黙る|だまる}了。\n\n然後，他走過去，把她拉進懷裡。\n\n「憑我喜歡妳。」\n\n宋恩熙愣住了。\n\n「這五年，我一直以為妳會在。」他的聲音啞了，「所以我什麼都沒說。我以為，總有一天，我會找到時機。」\n\n「結果，我差點來不及。我好{悔やむ|くやむ}。」\n\n「[[このままでは、〈君:きみ〉を〈奪:うば〉われかねない。::再這樣下去，妳可能會被搶走。]]」\n\n「所以我不等了。」\n\n---\n\n那天晚上，宋恩熙取消了婚約。\n\n那個{憎らしい|にくらしい}的男人氣得在她公寓樓下大吼，被西條玄的保全請走了。\n\n一週後，宋恩熙回到了公司。\n\n「辭呈，」西條玄把那封信撕成兩半，「我不收。」\n\n「那我要繼續當你的秘書嗎？」\n\n「不。」他站起來，走到她面前，「我要妳當西條夫人。」\n\n他單膝跪下，打開一個小盒子。\n\n「五年前就該說了。」他{囁く|ささやく}，「宋恩熙，嫁給我。」\n\n宋恩熙哭著笑了。\n\n「[[〈遅:おそ〉くなって、すまない。::對不起，我來晚了。]]」\n\n他站起來，吻住她。這一次，他再也不會放手。", "blurb": "跟了他五年的秘書突然要嫁人，社長終於慌了。", "gram": {"pt": "〜かねない", "mean": "很可能會～（壞結果）", "how": "動詞ます形去ます＋かねない（奪われます→奪われかねない）", "ex": "このままでは、〈君:きみ〉を〈奪:うば〉われかねない。", "exzh": "再這樣下去，妳可能會被搶走。"}, "boss": {"name": "西條玄", "yomi": "さいじょう げん", "mark": "玄", "c1": "#132748", "c2": "#5b8ad0"}}, {"id": "B31", "title": "總裁的燈塔", "band": "N3-N2", "text": "沖繩最南邊的{岬|みさき}上，有一座白色的燈塔。\n\n林海音在燈塔旁邊開了一間小咖啡店。窗外是{真っ青|まっさお}的海，和{透き通る|すきとおる}的天空。\n\n每年八月，都會有一個男人來。\n\n他總是坐在靠窗的位子，點一杯冰咖啡，{見詰める|みつめる}海，一坐就是一整個下午，直到夕陽{沈む|しずむ}進海裡。\n\n他不太說話。只有一次，他問她：「這裡的海，冬天也這麼藍嗎？」\n\n「冬天比較灰。」她說，「不過{嵐|あらし}過後的早上，最漂亮。」\n\n他點點頭，好像把這句話記住了。\n\n---\n\n第五年的八月，他沒有來。\n\n海音每天都看著門口。一直到夏天結束，那個位子都是空的。\n\n她不知道他的名字，也不知道他從哪裡來。可是她的心，好像少了一塊。\n\n---\n\n十月，一個颱風夜。\n\n雨{一段と|いちだんと}大了，變成了暴風雨，海浪拍打著岸邊的岩石。海音正要關店，燈塔的光{照らす|てらす}著翻騰的海面，她看見燈塔下面，有一個人影。\n\n有人站在岬角的邊緣，被風吹得搖搖晃晃。\n\n她抓起手電筒衝出去。\n\n「危險！快回來！」\n\n那人轉過身。是他。\n\n下一秒，一陣大浪打上來，他腳下一滑——\n\n海音想都沒想就衝過去，抓住了他的手。兩個人一起摔在濕透的岩石上，差點被浪捲進海裡。\n\n---\n\n小咖啡店裡，暖爐燒得很旺。\n\n他坐在她對面，渾身濕透，冷得{震える|ふるえる}，臉色蒼白。\n\n「你瘋了嗎？」海音一邊替他擦頭髮，一邊忍不住罵，「颱風天站在岬上，你想{溺れる|おぼれる}嗎？」\n\n「我想看看，」他輕聲說，「妳說的，暴風雨過後的海。」\n\n海音的手停住了。\n\n「我叫桜庭一真。」他說，「十年前，我的未婚妻在這片海上出了事。從那以後，我每年都來這裡，想陪她。」\n\n「可是三年前，我發現，我在等的，已經不是她了。」\n\n「我在等的是，每年八月，那杯讓人{懐かしい|なつかしい}的冰咖啡。」\n\n「今年夏天，我的公司出了大事，我走不開。」他看著她，「我一直很怕，妳會忘記我。」\n\n海音的眼淚掉了下來。\n\n「笨蛋……」她說，「我每天都在看門口。」\n\n他伸手，輕輕擦掉她的眼淚。\n\n「[[どれほど〈会:あ〉いたかったことか。::我是多麼想見妳啊。]]」\n\n他低頭吻住她。窗外的風雨聲好像都遠去了，只剩下兩個人的心跳。\n\n---\n\n隔天早上，颱風過去了，海面{静まる|しずまる}下來。\n\n天空藍得像洗過一樣，早上的{日差し|ひざし}照在海面上，閃閃{輝く|かがやく}。\n\n他們並肩坐在燈塔下，吹著海風。海面上{浮く|うく}著幾艘小船。\n\n「真的好漂亮。」他說。\n\n「我說過吧。」海音靠在他肩上。\n\n「[[〈来年:らいねん〉の〈夏:なつ〉も、〈再来年:さらいねん〉も、ここに〈来:く〉る。::明年夏天、後年夏天，我都會來。]]」\n\n「不，」她笑著說，「你不用來了。」\n\n他愣住了。\n\n「因為，」她握住他的手，「你可以不用走了。」", "blurb": "每年八月來燈塔咖啡店的男人，在颱風夜站上了岬角。", "gram": {"pt": "〜ことか", "mean": "多麼～啊（感嘆）", "how": "疑問詞＋普通形＋ことか（会いたかった→どれほど会いたかったことか）", "ex": "どれほど〈会:あ〉いたかったことか。", "exzh": "我是多麼想見妳啊。"}, "boss": {"name": "桜庭一真", "yomi": "さくらば かずま", "mark": "真", "c1": "#10243f", "c2": "#4a76b0"}}, {"id": "B32", "title": "總裁的農場", "band": "N3-N2", "text": "許念念被公司派到北海道的一座牧場出差。\n\n任務很簡單：說服牧場主人，把土地賣給公司蓋度假村。\n\n「聽說那個主人很難搞。」上司說，「已經{断る|ことわる}我們三次了。」\n\n---\n\n牧場在一座小山的{麓|ふもと}，四周是一望無際的草原，和一條長長的白樺{並木|なみき}。北海道的{日差し|ひざし}很溫柔。\n\n念念穿著高跟鞋，在泥巴路上走得跌跌撞撞。走到門口時，一頭牛突然從旁邊冒出來，嚇得她跌坐在地上。\n\n「穿這樣來牧場？」\n\n一個男人站在她面前，一臉{呆れる|あきれる}的表情，戴著草帽，穿著沾滿泥巴的工作服，手上拿著一把鏟子。\n\n「我、我是來找牧場主人的。」念念狼狽地站起來，「御堂先生在嗎？」\n\n男人看了她一眼：「我就是。」\n\n---\n\n御堂慎一點也不像鄉下的牧場主人。\n\n他說話很少，眼神很冷，可是對動物卻溫柔得不可思議。他會半夜起來替生病的小牛餵奶，會蹲在溫室裡，一株一株地檢查番茄苗。\n\n「我不賣。」他說。\n\n「我們可以出兩倍的價錢——」\n\n「不賣。」\n\n念念沒有放棄。她每天都來，說：「我雖然是{素人|しろうと}，可是我可以學。」\n\n第一週，她幫忙{耕す|たがやす}{畑|はたけ}，也跟著割草。第二週，她學會了擠牛奶。第三週，她已經可以一個人餵完所有的{餌|えさ}。她{懸命|けんめい}地學，還自己從{物置|ものおき}翻出一雙舊雨靴，每天從{井戸|いど}打水洗菜。\n\n她的皮膚曬黑了，手上長了繭，高跟鞋換成了雨靴。\n\n可是她發現，自己笑的次數，比在東京的時候{一段と|いちだんと}多了。\n\n---\n\n一個月後，收成的季節到了。\n\n樹上的蘋果一顆顆{実る|みのる}，整片果園都是甜甜的香味。\n\n念念摘下一顆蘋果，咬了一口，眼睛都亮了：「好甜！」\n\n御堂慎坐在樹下的{日陰|ひかげ}{涼む|すずむ}，看著她，嘴角第一次揚了起來。\n\n「妳知道我為什麼不賣嗎？」他說。\n\n「為什麼？」\n\n「這座牧場，是我父親留下的。」他說，「我本來在東京當社長，管理一間很大的公司。可是父親走了以後，我才發現，我從來沒有好好陪過他。」\n\n「所以我把公司交給別人，回來守著這裡。」\n\n念念的眼眶紅了。\n\n「那……我不會再勸你賣了。」她說，「我會回去跟公司說。」\n\n「不行。」\n\n「咦？」\n\n「妳回去的話，」他看著她，「誰幫我餵餌？」\n\n念念愣住了。\n\n他摘下草帽，走到她面前。\n\n「妳來的第一天，跌坐在牛旁邊，我就覺得這個女人很好笑。」他說，「可是後來，妳每天都來，從來沒有抱怨過。」\n\n「[[〈君:きみ〉は〈動物:どうぶつ〉たちばかりか、〈俺:おれ〉の〈心:こころ〉まで〈奪:うば〉った。::妳擄獲的不只是動物們，還有我的心。]]」\n\n「我原本的公司，」他說，「就是要買這塊地的那家。是我讓他們派人來的。」\n\n「我想看看，誰會留下來。」\n\n「結果，留下來的是妳。」\n\n念念又好氣又好笑，捶了他一下。他抓住她的手，把她拉進懷裡，在滿園的果香裡吻住她。\n\n「[[ここで〈一緒:いっしょ〉に〈暮:く〉らそう。::我們一起在這裡生活吧。]]」", "blurb": "被派去說服牧場主人賣地，她卻學會了擠牛奶。", "gram": {"pt": "〜ばかりか", "mean": "不只～，連～也", "how": "名詞＋ばかりか（動物たち→動物たちばかりか）", "ex": "〈君:きみ〉は〈動物:どうぶつ〉たちばかりか、〈俺:おれ〉の〈心:こころ〉まで〈奪:うば〉った。", "exzh": "妳擄獲的不只是動物們，還有我的心。"}, "boss": {"name": "御堂慎", "yomi": "みどう しん", "mark": "慎", "c1": "#1a2440", "c2": "#61759f"}}, {"id": "B33", "title": "總裁的星空", "band": "N3-N2", "text": "台北郊外的天文館，夜{更ける|ふける}以後，幾乎沒有人，整棟樓都{静まる|しずまる}了。\n\n蔣星是這裡的解說員。她最喜歡夜班，因為可以一個人，對著{屋根|やね}上的望遠鏡，{眺める|ながめる}一整晚的星星。\n\n那天晚上，下起了大雨。\n\n天文館的門被推開，一個男人走了進來，西裝濕透，頭髮還在滴水。\n\n「抱歉，」他說，「我只是躲雨。」\n\n「沒關係。」蔣星遞給他一條毛巾，「今天下雨，看不到星星。不過，如果您不介意，我可以帶您看宇宙的影片。」\n\n男人看了她一眼，沉默了一下：「好。」\n\n---\n\n那一晚，她帶他走遍了整座天文館。\n\n她說起星星的時候，眼睛會發光。她說，每一顆星星的光，都是很久很久以前發出來的。我們現在看到的，其實是它的過去。\n\n「有些星星，可能早就不在了。」她說，「可是它的光，還是一直{輝く|かがやく}著，跨越幾萬年，來到我們面前。」\n\n男人聽得很安靜。\n\n「妳很喜歡這份工作。」\n\n「嗯。」她笑了，「雖然薪水很少，天文館也快要關了。真{惜しい|おしい}。」\n\n「快要關了？」\n\n「營運的公司要把這塊地賣掉。」她說，「下個月就結束了。」\n\n男人沒有再說話。\n\n雨停的時候，他道了謝，離開了。\n\n---\n\n一週後，天文館的館長興奮地衝進辦公室。\n\n「不用關了！有一間大公司買下了這裡，要繼續經營！」\n\n蔣星愣住了。\n\n「是哪間公司？」\n\n「葛城集團。」館長說，「社長說，他只有一個條件。」\n\n「什麼條件？」\n\n「他要每週五晚上，包下天文館的屋頂。」\n\n---\n\n那個星期五，天氣很好，{透き通る|すきとおる}的夜空裡沒有一片雲，星星好亮。\n\n蔣星爬上屋頂，感覺到一個人的{気配|けはい}。她{振り向く|ふりむく}，那個男人已經站在望遠鏡旁邊了。\n\n「是你……」她{浮かべる|うかべる}了一個驚訝的笑容。\n\n「葛城鷹。」他說，「上次忘了自我介紹。」\n\n「你為什麼要買下這裡？」\n\n「因為妳說，星星的光，會跨越很久的時間，來到我們面前。」他說，「我小時候，母親常常帶我來這裡。她走了以後，我再也沒有來過。」\n\n「那天晚上，我只是想躲雨。可是聽妳說話，我覺得好{懐かしい|なつかしい}，好像又看到了她。」\n\n他{見詰める|みつめる}她，眼神很溫柔。\n\n「[[あの〈雨:あめ〉をきっかけに、〈君:きみ〉に〈出会:であ〉えた。::因為那場雨，我才遇見了妳。]]」\n\n「所以，」他說，「我想每週都來觀測。觀測星星，也觀測妳。」\n\n蔣星的臉一下子紅了。\n\n夜空中，一彎{三日月|みかづき}掛在天邊，月光{照らす|てらす}著屋頂。\n\n他從後面輕輕抱住她，在她耳邊{囁く|ささやく}：「教我找北極星。」\n\n她乖乖地握住他的手，指向北方。他低頭，吻了她的頭髮。\n\n「[[〈君:きみ〉は〈俺:おれ〉の〈星:ほし〉だ。::妳是我的星星。]]」", "blurb": "雨夜走進天文館躲雨的男人，買下了這裡的整片星空。", "gram": {"pt": "〜をきっかけに", "mean": "以～為契機", "how": "名詞＋をきっかけに（雨→あの雨をきっかけに）", "ex": "あの〈雨:あめ〉をきっかけに、〈君:きみ〉に〈出会:であ〉えた。", "exzh": "因為那場雨，我才遇見了妳。"}, "boss": {"name": "葛城鷹", "yomi": "かつらぎ たか", "mark": "鷹", "c1": "#1d1f45", "c2": "#7067c0"}}, {"id": "B34", "title": "總裁的蛋糕師", "band": "N3-N2", "text": "鳳誉是一個很難取悅的人。\n\n鳳集團的社長，業界有名的完美主義者。他的生日宴會，每年都要訂全東京最好的蛋糕。\n\n而每年，他都只吃一口，就放下叉子。\n\n「{味わう|あじわう}不出任何東西。」他總是這麼說。\n\n今年，訂單落到了一間小小的甜點店。店主是一個台灣女孩，叫甘糖。\n\n---\n\n甘糖接到訂單的那天，激動得睡不著。她的手很{器用|きよう}，可是這次，她緊張得手都在抖。\n\n她試做了十個蛋糕。她用磅秤量麵粉，比例調了又調，奶油打發的時間一秒一秒地計算，{溶かす|とかす}巧克力的溫度精確到一度，最後才把麵糊倒進{型|かた}裡。\n\n可是第十一個，她把它{焦がす|こがす}了。\n\n那天晚上，她坐在廚房裡，看著那個邊緣{焦げる|こげる}的蛋糕，眼淚一顆一顆掉下來。\n\n「為什麼哭？」\n\n店門口站著一個男人。黑色大衣，冷淡的臉。\n\n「對不起，今天打烊了……」\n\n男人沒有理她，{図々しい|ずうずうしい}地走進來，看著那個蛋糕。\n\n「這是失敗的？」\n\n「嗯。」她{堪える|こらえる}著眼淚，「是要給一位很重要的客人的。可是我搞砸了。」\n\n男人拿起叉子，切了一小塊焦掉的邊緣，放進嘴裡。\n\n他沉默了很久。\n\n「苦的。」他說。\n\n「我就說了嘛……」\n\n「可是，」他又切了一塊，「中間很甜。這個味道，很{懐かしい|なつかしい}。」\n\n---\n\n那天晚上，男人一直待到很晚。\n\n他看著她重新開始做蛋糕。看她把麵粉和雞蛋{混ぜる|まぜる}在一起，看她小心地把蛋糕放進烤箱，看{生地|きじ}一點一點{膨らむ|ふくらむ}起來，再看她把蛋糕拿出來慢慢{冷ます|さます}。\n\n「為什麼要這麼{懸命|けんめい}？」他問，「只是一個蛋糕而已。」\n\n「因為我媽媽說，蛋糕是讓人幸福的東西。」甘糖說，「如果吃的人不幸福，那就不是好蛋糕。」\n\n男人看著她，眼神慢慢變了。\n\n---\n\n生日宴會那天，甘糖親自把蛋糕送到了會場。\n\n壽星坐在主位上。她抬頭一看，差點把蛋糕摔了。\n\n是那天晚上的男人。\n\n鳳誉切下一塊蛋糕，放進嘴裡。\n\n全場的人都屏住呼吸。\n\n他吃了一口。又一口。然後，把整塊都吃完了。\n\n「這是我這十年來，吃過最好吃的蛋糕。」他說。\n\n---\n\n宴會結束，他在後台找到她。\n\n「你……那天晚上，是故意來的？」\n\n「不是。」他說，「我只是經過。看到店裡亮著燈，有一個女孩在哭。」\n\n「我很久沒有吃到有味道的東西了。」他看著她，「十年前，我母親過世以後，什麼東西吃起來都一樣。」\n\n「可是那天晚上，妳烤焦的蛋糕，我嘗到了苦，也嘗到了甜。」\n\n「[[〈君:きみ〉のおかげで、〈俺:おれ〉は〈変:か〉われた。::多虧了妳，我才能改變。]]」\n\n甘糖的眼淚又掉下來了。\n\n他伸手擦掉她的眼淚，然後低頭吻住她。\n\n他的嘴唇上，有淡淡的奶油香。\n\n「[[〈毎年:まいとし〉、〈俺:おれ〉のケーキを〈作:つく〉れ。::以後每年，都替我做蛋糕。]]」\n\n「只有每年嗎？」她{浮かべる|うかべる}笑容問。\n\n「不。」他說，「每天。」", "blurb": "吃什麼都沒味道的總裁，嘗了她烤焦的蛋糕。「中間很甜。」", "gram": {"pt": "〜おかげで", "mean": "多虧了～", "how": "名詞＋のおかげで（君→君のおかげで）", "ex": "〈君:きみ〉のおかげで、〈俺:おれ〉は〈変:か〉われた。", "exzh": "多虧了妳，我才能改變。"}, "boss": {"name": "鳳誉", "yomi": "おおとり ほまれ", "mark": "誉", "c1": "#161e3c", "c2": "#5d6db3"}}, {"id": "B35", "title": "總裁的契約繼承人", "band": "N3-N2", "text": "不破家的老爺子{葬式|そうしき}那天，京都下著細雨。\n\n古老的宅邸裡，所有的{親類|しんるい}都穿著黑色喪服，跪坐在{座敷|ざしき}裡。{襖|ふすま}緊閉，空氣沉重得讓人喘不過氣。\n\n林雨坐在最角落。她不是不破家的人，只是老爺子生前的看護。\n\n照顧了老爺子三年，她是唯一一個，每天陪他說話的人。\n\n---\n\n律師宣讀遺囑的時候，整個和室安靜了。\n\n「不破家{先祖|せんぞ}傳下來的所有財產，由長孫不破晶{相続|そうぞく}。」律師推了推眼鏡，「但是有一個條件。」\n\n「不破晶必須在一個月內，與林雨小姐結婚。」\n\n整個和室炸開了。\n\n「開什麼玩笑！」\n\n「一個看護而已，真{図々しい|ずうずうしい}！」\n\n「她一定用了什麼手段！」\n\n林雨坐在角落，臉色發白。她什麼都不知道。\n\n坐在最前面的男人，緩緩轉過身來。\n\n不破晶。不破集團的現任社長，老爺子的長孫。冷峻的臉上，看不出任何情緒。\n\n他{見詰める|みつめる}她很久。\n\n「我答應。」他說。\n\n---\n\n葬禮結束後，他在走廊上攔住她。\n\n「為什麼？」林雨的聲音在發抖，「你不需要答應的。」\n\n「如果我不答應，財產會全部被親戚瓜分。」他說，「祖父花了一輩子守住的東西，會在一年內被他們賣光。」\n\n「[[〈祖父:そふ〉の〈家:いえ〉を〈守:まも〉るには、こうするしかない。::要守住祖父的家，只能這麼做。]]」\n\n「可是……結婚不是遊戲。」\n\n「我知道。」他說，「所以，契約只有一年。一年後，妳可以離開。」\n\n林雨低下頭，很久，才乖乖地點了點頭。\n\n---\n\n婚後的日子，很安靜。\n\n他們住在老爺子的宅邸裡。他每天很晚回來，她每天替他留一盞燈，把他的衣服{畳む|たたむ}好。每天早上，她都會到老爺子的牌位前{拝む|おがむ}，她很想念老爺子。\n\n他從不說謝謝，可是每天早上，玄關都會放著一束當季的花。\n\n她從不問他的事，可是每天晚上，他書房的茶都是剛泡好的溫度。\n\n半年後的一個雨夜，雨下得很大。她在老爺子的書房裡，發現了一封信。\n\n是寫給不破晶的。\n\n「晶：\n\n如果你讀到這封信，代表我已經走了。\n\n我知道你這輩子不相信任何人。可是我希望你，至少相信一個人。\n\n那個女孩，三年來每天陪我說話。她會笑，會為一朵花開心好久。\n\n我看得出來，你每次來看我的時候，眼睛都在找她。\n\n所以，我替你做了這輩子最後一個決定。別怪我。」\n\n林雨拿著信，手在{震える|ふるえる}，她{堪える|こらえる}著眼淚。\n\n身後傳來腳步聲。她{振り向く|ふりむく}，不破晶站在門口。\n\n「你……早就知道了？」\n\n「知道。」他走進來，「祖父給我看過。」\n\n「那你為什麼——」\n\n「妳真{鈍い|にぶい}。」他說，「因為我怕妳覺得，是被逼的。所以我說，契約只有一年。」\n\n「這半年，我每天都在想，一年到了，妳會不會走。」\n\n他走到她面前，把她拉進懷裡。\n\n「[[〈契約:けいやく〉なんて、もういらない。::什麼契約，我已經不需要了。]]」\n\n他低頭吻住她，窗外的雨聲，溫柔得像一首歌。\n\n「留下來。」他在她耳邊{囁く|ささやく}，「不是因為遺囑，是因為我。」", "blurb": "老爺子的遺囑寫著：長孫必須娶他的看護，才能繼承一切。", "gram": {"pt": "〜しかない", "mean": "只能～", "how": "動詞辭書形＋しかない（する→こうするしかない）", "ex": "〈祖父:そふ〉の〈家:いえ〉を〈守:まも〉るには、こうするしかない。", "exzh": "要守住祖父的家，只能這麼做。"}, "boss": {"name": "不破晶", "yomi": "ふわ あきら", "mark": "晶", "c1": "#121c36", "c2": "#4b66a3"}}, {"id": "B36", "title": "總裁的布偶裝", "band": "N3-N2", "text": "八月，東京近郊的{遊園地|ゆうえんち}，熱得{物凄い|ものすごい}。\n\n田小薇穿著一套厚重的熊熊布偶裝，在入口發{風船|ふうせん}。頭頂的太陽{照る|てる}著，曬得人頭昏，汗水從頭頂一路流到腳底。\n\n這是她暑假打工的第十天。\n\n「熊熊！我要紅色的！」\n\n小孩子們圍著她，又叫又{跳ねる|はねる}，{喧しい|やかましい}得像一群小麻雀。她一邊笑，一邊在心裡數著還有幾個小時下班。\n\n---\n\n下午兩點，遊樂園裡發生了一件事。\n\n旋轉木馬前排著長長的{行列|ぎょうれつ}。一個小男孩在那裡哭得很大聲。他的手上抓著一顆氣球，身邊卻沒有大人。\n\n是{迷子|まいご}。\n\n小薇蹲下來，用熊熊的大手摸了摸他的頭。\n\n「別哭，熊熊陪你找媽媽。」\n\n她牽著小男孩，走到{売店|ばいてん}旁邊的廣播站，請工作人員廣播{呼び出す|よびだす}家長。\n\n等待的時候，小男孩一直抱著她不放。她熱得快要暈倒，卻還是蹲在那裡，替他{扇ぐ|あおぐ}風。\n\n十分鐘後，一個男人匆匆跑了過來。\n\n高大，穿著白襯衫，袖子捲到手肘，額頭上全是汗。\n\n「小翔！」\n\n小男孩撲進他懷裡：「舅舅！熊熊陪我！」\n\n男人用{力強い|ちからづよい}的手臂一把抱起孩子，看向那隻大熊。\n\n「謝謝妳。」他說，「真的很謝謝。」\n\n---\n\n那天傍晚，小薇脫下布偶裝，在員工休息室裡{一休み|ひとやすみ}。\n\n門被敲響了。\n\n站在門口的，是那個男人。他手上拿著兩罐冰咖啡。\n\n「我想當面謝謝熊熊。」他說。\n\n小薇愣住了：「你、你怎麼知道是我？」\n\n「我問了工作人員。」他說，「我叫獅子堂賢。這間遊樂園，是我們公司的。我是社長。」\n\n小薇手上的毛巾差點掉下去。\n\n「我外甥說，熊熊蹲下來的時候，一直在替他搧風。」他看著她，「可是熊熊自己，臉都熱紅了。」\n\n---\n\n從那天起，獅子堂賢每天傍晚都會出現在休息室門口。\n\n有時候帶冰淇淋，有時候帶西瓜。他總是說是「巡視」，可是每次都在她旁邊坐很久。\n\n他看起來很冷淡，說話的時候卻會不小心笑出來。他說自己工作很忙，卻每天都準時出現。\n\n一個月後，暑假的打工結束了。\n\n最後一天，她把布偶裝還回去，走出員工通道。\n\n他站在那裡，手上拿著一顆紅色的氣球。\n\n「這是什麼？」\n\n「熊熊每天都在送別人氣球。」他說，「今天，換人送熊熊。」\n\n小薇笑了出來：「社長，你真的很{呑気|のんき}耶。公司不忙嗎？」\n\n「忙。」他說，「可是比起工作，我更想見妳。」\n\n小薇的臉一下子紅了。\n\n「[[〈強:つよ〉がるわりに、〈泣:な〉き〈虫:むし〉だな。::妳看起來很逞強，其實很愛哭呢。]]」他伸手，擦掉她不知道什麼時候掉下來的眼淚。\n\n「我、我才沒有哭……」\n\n「熊熊的眼睛，」他說，「是紅的。」\n\n他低頭，輕輕吻了她。夕陽把整座遊樂園染成了橘色。\n\n這真是一個{思い掛けない|おもいがけない}的夏天。\n\n「[[〈来年:らいねん〉の〈夏:なつ〉も、ここに〈来:こ〉い。::明年夏天，也來這裡吧。]]」\n\n「以熊熊的身分嗎？」\n\n「不。」他說，「以我的女朋友的身分。」", "blurb": "穿著熊熊布偶裝發氣球的暑假，被一個白襯衫男人抓住了尾巴。", "gram": {"pt": "〜わりに", "mean": "雖然～卻", "how": "普通形＋わりに（強がる→強がるわりに）", "ex": "〈強:つよ〉がるわりに、〈泣:な〉き〈虫:むし〉だな。", "exzh": "妳看起來很逞強，其實很愛哭呢。"}, "boss": {"name": "獅子堂賢", "yomi": "ししどう けん", "mark": "賢", "c1": "#2a1c10", "c2": "#b07a3a"}}, {"id": "B37", "title": "總裁的書道課", "band": "N3-N2", "text": "有馬克己是個很難搞的學生。\n\n他是有馬集團的社長，四十歲以前，從來沒有拿過毛筆。上個月，他突然報名了{下町|したまち}一間小小的{書道|しょどう}教室。\n\n教室的老師，是二十八歲的林墨。\n\n第一堂課，他{腰掛ける|こしかける}在最後面，姿勢僵硬，握{筆|ふで}的手像在握鋼筆。\n\n「社長，{手首|てくび}放鬆。」林墨走到他身邊，輕輕調整他的手指，「筆要立起來，像這樣。」\n\n他的耳朵，好像紅了一點。\n\n---\n\n他的動作很{鈍い|にぶい}，學得很慢。\n\n一個「永」字，他寫了一個月。橫畫寫得{斜め|ななめ}，點畫太重，墨汁滴得滿紙都是。\n\n其他學生都笑他。他也不生氣，只是一張一張地重寫，慢慢{心得る|こころえる}了握筆的方法。他對林墨說話，總是用{敬語|けいご}，{言葉遣い|ことばづかい}很客氣。\n\n「為什麼要學書法？」有一天，林墨忍不住問他。\n\n他想了很久：「我父親生前，最喜歡書法。」\n\n「我小時候，他想教我，我說太無聊了。後來，我忙著工作，連他最後一面都沒見到。」\n\n「現在，我想試著了解他。」\n\n林墨沒有再問。\n\n那天，她留下來陪他多{稽古|けいこ}了一個小時。\n\n---\n\n三個月後，教室要辦一場小小的發表會。\n\n每個學生都要寫一幅作品。\n\n有馬克己寫了很多張{下書き|したがき}，最後才拿出一張，交給林墨。\n\n上面只寫了一個字：「心」。\n\n字不漂亮，可是每一筆都刻得很深，看得出來，寫的人{苦心|くしん}。\n\n「這個字，」林墨看著它，「很{清い|きよい}。」\n\n「清？」\n\n「很乾淨。」她說，「沒有多餘的東西。」\n\n他看著她，很久沒有說話。\n\n---\n\n發表會那天，他的作品掛在最角落。\n\n來看展的人不多。林墨站在他的作品前面，看了很久。\n\n他走到她身邊。\n\n「林老師。」\n\n「嗯？」\n\n「這三個月，我學到了一件事。」他說，「寫字的時候，心裡在想什麼，字就會變成什麼樣子。」\n\n「那你寫這個字的時候，在想什麼？」\n\n他沉默了一下。\n\n「在想妳。」\n\n林墨愣住了。\n\n「一開始，是為了我父親。」他說，「可是後來，每週來上課，是為了見妳。」\n\n他的鬢角已經有幾根白髮。「我知道，我年紀比妳大很多。」他低下頭，像是在{謙遜|
