けんそん}，又像是在請求，「所以，我想了很久。」\n\n「[[よく〈考:かんが〉えた〈上:うえ〉で、〈君:きみ〉を〈選:えら〉んだ。::我想清楚了，才選擇了妳。]]」\n\n林墨的眼淚掉了下來。\n\n「社長，」她小聲說，「你知道嗎，你寫的『心』，最後一點，偏了。」\n\n「……抱歉。」\n\n「偏向右邊。」她說，「偏向我站的地方。」\n\n他愣了一下，然後笑了。那是她第一次看見他笑。\n\n他伸手，輕輕擦掉她臉上的淚，低頭吻了她。\n\n「[[これからも、〈俺:おれ〉に〈教:おし〉えてくれ。::以後，也請妳繼續教我。]]」\n\n「教書法？」\n\n「教我，」他說，「怎麼好好愛一個人。」", "blurb": "四十歲才拿起毛筆的社長，只肯上一位老師的課。", "gram": {"pt": "〜上で", "mean": "在～之後", "how": "動詞た形＋上で（考えた→考えた上で）", "ex": "よく〈考:かんが〉えた〈上:うえ〉で、〈君:きみ〉を〈選:えら〉んだ。", "exzh": "我想清楚了，才選擇了妳。"}, "boss": {"name": "有馬克己", "yomi": "ありま かつみ", "mark": "克", "c1": "#18181c", "c2": "#6a6a7a"}}, {"id": "B38", "title": "總裁的占卜師", "band": "N3-N2", "text": "澀谷一條{薄暗い|うすぐらい}的小巷裡，有一間很小的占卜屋。\n\n店主是二十六歲的葉星。她不會用水晶球，也不會看手相，只會在紫色的桌布上，用一副舊塔羅牌，替人{占う|うらなう}。\n\n她說的話總能{当てる|あてる}。{絶えず|たえず}有人上門，門口常常排著長長的隊伍。\n\n那天晚上，店裡來了一個奇怪的客人。\n\n黑色西裝，冷淡的眼神，一進門就說：「這種東西很{怪しい|あやしい}，我不信。」\n\n「那您為什麼要來？」\n\n「我的秘書說，妳說的話{的確|てきかく}得可怕。」他{一応|いちおう}坐了下來，「我想看看，是不是騙人的。」他的{狙い|ねらい}，是揭穿她。\n\n---\n\n他叫宝生雅，是一間大公司的社長。\n\n葉星替他翻開了第一張牌。\n\n「您最近，」她說，「在做一個很大的決定。」\n\n「每個社長都在做決定。」\n\n「這個決定，會讓很多人失去工作。」\n\n宝生雅的眼神變了。\n\n「您的公司，有一間工廠要關掉。」她看著牌，「您已經{迷う|まよう}了三個月。」\n\n他沉默了很久：「……妳怎麼知道？」\n\n「牌告訴我的。」葉星笑了笑，「還有，您的領帶上，沾著工廠的{埃|ほこり}。」\n\n---\n\n從那天起，他每週都來。\n\n他從來不說是來占卜的。他會問一些奇怪的問題，例如：「如果一間工廠活下來的{確率|かくりつ}只有三成，該不該賭？」\n\n葉星每次都替他翻一張牌，然後說出自己的想法。\n\n她說：「{不運|ふうん}，不是放棄的理由。」\n\n她說：「真正的{災難|さいなん}，是因為害怕而什麼都不做。」\n\n她說：「您其實早就有答案了。您只是需要有人告訴您，可以這麼做。」\n\n三個月後，他決定不關工廠了。他投了一大筆錢，重新改造生產線。\n\n公司的人都說他瘋了。\n\n可是半年後，那間工廠的業績，翻了兩倍。\n\n---\n\n那天晚上，他又來了。\n\n這次，他沒有坐下，而是站在她面前，拿出一張牌。\n\n是一張「戀人」。\n\n「我在網路上買的。」他說，「我想請妳占卜一件事。」\n\n「什麼事？」\n\n「我喜歡的人，」他說，「會不會也喜歡我。」\n\n葉星的心跳漏了一拍。\n\n她拿起那張牌，看了很久。\n\n「這張牌，」她小聲說，「要看您問的那個人是誰。」\n\n宝生雅向她{迫る|せまる}，把她困在小小的桌子和他之間，{見下ろす|みおろす}著她。\n\n「我不信這種{迷信|めいしん}。」他說，「也從來不信占卜。」\n\n「[[〈予想:よそう〉に〈反:はん〉して、〈君:きみ〉に〈惚:ほ〉れてしまった。::出乎意料，我愛上妳了。]]」\n\n「我本來只是想揭穿妳的。」他低聲說，「結果每個星期，我都在等著週五來見妳。」\n\n葉星的臉一下子紅透了。\n\n「那您……想要什麼樣的答案？」\n\n「我不要牌給我答案。」他說，「我要妳給我。」\n\n她看著他，然後笑了。\n\n「牌說，」她把那張「戀人」翻過來，放在他手心，「答案是『是』。」\n\n他低頭吻住她，小小的占卜屋裡，蠟燭的火光輕輕地搖晃。\n\n「[[〈君:きみ〉の〈占:うらな〉いは、〈外:はず〉れない。::妳的占卜，從來不會失準。]]」", "blurb": "從不失準的占卜師，算不出這位社長的心。", "gram": {"pt": "〜に反して", "mean": "與～相反", "how": "名詞＋に反して（予想→予想に反して）", "ex": "〈予想:よそう〉に〈反:はん〉して、〈君:きみ〉に〈惚:ほ〉れてしまった。", "exzh": "出乎意料，我愛上妳了。"}, "boss": {"name": "宝生雅", "yomi": "ほうしょう みやび", "mark": "雅", "c1": "#241430", "c2": "#9a6ac0"}}, {"id": "B39", "title": "總裁的陶藝教室", "band": "N3-N2", "text": "京都郊外的{麓|ふもと}下，有一間小小的陶藝工房。\n\n主人是陶藝家的女兒，溫陶陶。父親過世後，她一個人守著這間工房，教附近的主婦和小孩捏{鉢|はち}和碗。\n\n那個週末，工房來了一個新學生。\n\n一身昂貴的西裝，雙手插在口袋裡，看著{戸棚|とだな}上的{瀬戸物|せともの}，一臉不感興趣。\n\n「我是被秘書逼來的。」他說，「她說我需要紓壓。」\n\n他叫月城那由多，是一間大公司的社長。\n\n---\n\n他捏的第一個碗，整個{斜め|ななめ}向一邊，活像一顆被{潰す|つぶす}的饅頭。\n\n第二個，底部整個{凹む|へこむ}了下去。\n\n第三個，那塊黏土在拉坯機上轉著轉著，整個飛了出去，黏在牆上。\n\n工房裡的主婦們笑成一團。\n\n溫陶陶忍著笑，走到他身邊：「月城先生，力氣太大了。」\n\n她把手覆在他的手上，帶著他慢慢地拉出碗的輪廓。\n\n「放輕一點。黏土是活的，你要順著它。」\n\n他的手{固まる|かたまる}了。\n\n---\n\n從那天起，他每週六都來，一來就{張り切る|はりきる}。\n\n他{相変わらず|あいかわらず}捏不好。可是他一次也沒有缺席，{懸命|けんめい}得讓人吃驚。他會{真似る|まねる}她的手勢，{繰り返す|くりかえす}練習。\n\n有時候，他會在工房待到很晚，看著她一個人在窯前燒陶。\n\n「為什麼要一個人守著這裡？」有一天，他問。\n\n「這是我父親留下來的。」溫陶陶說，「工房的地主要把地賣掉，下個月，這裡就要拆了。」\n\n「我知道守不住。可是，能守一天是一天。」\n\n月城那由多看著她，沒有說話。\n\n---\n\n一個月後，工房的拆除通知被{取り消す|とりけす}了。\n\n地主說，土地已經賣給了一間公司。新的地主，要求工房原封不動地留下來。\n\n溫陶陶拿著通知書，衝到那個每週六都會來的男人面前。\n\n「是你，對不對？」\n\n他正在拉坯機前，捏著一個小小的杯子。\n\n「嗯。」\n\n「為什麼？」\n\n「我在這裡，」他說，「學會了一件事。」\n\n他停下拉坯機，把那個{湯飲み|ゆのみ}輕輕地放在她手心。\n\n杯子不太圓，邊緣有一點歪。可是她看得出來，這是他捏得最好的一個。\n\n「[[〈君:きみ〉のことを〈考:かんが〉えっぱなしだ。::我滿腦子都是妳。]]」他說，「捏陶的時候，開會的時候，睡覺的時候。」\n\n「我本來，只是被秘書逼來的。」他說，「可是後來，每週六，是我最期待的日子。」\n\n溫陶陶的眼淚掉了下來，落在那個歪歪的茶杯裡。\n\n「這個杯子，」她小聲說，「可以給我嗎？」\n\n「本來就是給妳的。」他說，「我做壞了好幾個，才終於成功。」\n\n她笑了出來，眼淚卻停不下來。\n\n他伸手，把她拉進懷裡，低頭吻住她。滿是{泥|どろ}的手，弄髒了她的臉頰，他也不在乎。\n\n「[[〈一緒:いっしょ〉に、〈器:うつわ〉を〈作:つく〉ろう。::我們一起做陶吧。]]」\n\n「做多久？」\n\n「一輩子。」他說，「直到我捏出一個圓的杯子為止。」", "blurb": "山裡的陶藝工房，來了一個連泥都捏不圓的社長。", "gram": {"pt": "〜っぱなし", "mean": "一直～（某狀態持續、放著不管）", "how": "動詞ます形＋っぱなし（考える→考えっぱなし）", "ex": "〈君:きみ〉のことを〈考:かんが〉えっぱなしだ。", "exzh": "我滿腦子都是妳。"}, "boss": {"name": "月城那由多", "yomi": "つきしろ なゆた", "mark": "月", "c1": "#1c1a14", "c2": "#a08a5a"}}, {"id": "B40", "title": "總裁的新幹線", "band": "N3-N2", "text": "星期一早上六點，東京站。\n\n陳小涵穿著深藍色的制服，站在新幹線的月台上。她是這班列車的{車掌|しゃしょう}，負責東京到大阪的路線。\n\n每個星期一，她的車廂裡都會有同一位乘客。\n\n八號車，靠窗的位子。黑色西裝，筆電，咖啡，從東京坐到大阪，三個小時，一句話也不說。\n\n他遺落在座位上的{手帳|てちょう}上，寫著一個名字：真宮翔。\n\n---\n\n小涵其實很怕他。\n\n第一次查票的時候，他抬頭看了她一眼，那個眼神很{険しい|けわしい}，冷得像冰。\n\n可是有一次，列車在靜岡附近臨時停車，車廂裡的乘客都很焦躁。一個老太太因為趕不上{乗り換え|のりかえ}的電車，急得哭了出來。\n\n小涵蹲在老太太身邊，一直{慰める|なぐさめる}她，替她打電話聯絡家人。\n\n那時候，她感覺到有人在看她。\n\n是八號車的那個男人。\n\n列車重新開動後，他第一次開口跟她說話：「妳做得很好。」\n\n---\n\n從那天起，他每週一都會跟她說一句話。\n\n「早安。」\n\n「辛苦了。」\n\n「今天的富士山很{見事|みごと}。」\n\n小涵開始期待星期一。\n\n---\n\n二月的某個星期一，列車因為{吹雪|ふぶき}，在名古屋停了下來。\n\n{線路|せんろ}被大雪{埋める|うめる}了，除雪需要好幾個小時。乘客們被安排在車站的{待合室|まちあいしつ}等待。\n\n小涵忙了整整六個小時。安撫乘客、發{毛布|もうふ}、替乘客{払い戻す|はらいもどす}票錢。等到一切都{片付く|かたづく}，已經是晚上十點了。\n\n她坐在空蕩蕩的車廂裡，整個人都{くたびれる}了，一動也不想動。\n\n一杯熱咖啡放在了她面前。\n\n「真宮先生？您還沒走？」\n\n「等妳。」他說。\n\n他在她對面坐下。窗外，雪還在下。\n\n「我每週一搭這班車，是因為工作。」他說，「我在大阪的分公司，每週一要開會。」\n\n「可是後來，」他看著她，「我開始期待，在八號車廂見到妳。」\n\n小涵的心跳亂了。\n\n「妳在擠滿人的車廂裡，還是會蹲下來跟小孩說話。妳被乘客罵的時候，還是會笑著{詫びる|わびる}。」他說，「我在想，這個人，到底有多堅強。」\n\n「我其實……一點都不堅強。」小涵的聲音有點啞，「今天，我好幾次都想哭。」\n\n「我知道。」他說，「所以我留下來了。」\n\n他伸出手，輕輕握住她{凍える|こごえる}的手。\n\n「下週一，我不坐八號車了。」\n\n「咦？」\n\n「我想跟妳約在大阪見面。」他說，「[[〈仕事:しごと〉が〈終:お〉わり〈次第:しだい〉、〈迎:むか〉えに〈行:い〉く。::工作一結束，我就去接妳。]]」\n\n小涵笑了，眼淚卻掉了下來。\n\n他低頭，在空蕩蕩的車廂裡，輕輕吻了她。\n\n窗外的雪，靜靜地落在鐵軌上。\n\n「[[これからは、〈君:きみ〉の〈隣:となり〉に〈座:すわ〉る。::以後，我要坐在妳旁邊。]]」", "blurb": "每週一早上，八號車靠窗的位子都坐著同一個男人。", "gram": {"pt": "〜次第", "mean": "一～就～", "how": "動詞ます形＋次第（終わる→終わり次第）", "ex": "〈仕事:しごと〉が〈終:お〉わり〈次第:しだい〉、〈迎:むか〉えに〈行:い〉く。", "exzh": "工作一結束，我就去接妳。"}, "boss": {"name": "真宮翔", "yomi": "まみや しょう", "mark": "翔", "c1": "#141c2a", "c2": "#4a72b0"}}, {"id": "B41", "title": "總裁的出差定食", "band": "N3-N2", "text": "金澤的{下町|したまち}，有一間開了五十年的小食堂。\n\n現在掌廚的，是老闆的外孫女，許小鮮。她從台灣嫁到日本的媽媽，教了她一手好廚藝；日本的外公，教了她怎麼做北陸的家常菜。\n\n食堂很小，只有八個座位。每天中午，都坐滿了附近的{職人|しょくにん}和老人。\n\n那天中午，門口走進來一個格格不入的男人。\n\n深灰色西裝，皮鞋擦得發亮，手上拿著一個公事包。\n\n「一個人。」他說，「隨便給我一份。」\n\n---\n\n小鮮端上了今天的{献立|こんだて}：烤魚、煮物、一碗熱騰騰的味噌湯。\n\n男人{早速|さっそく}吃了一口煮物，停住了。\n\n「這個味道……好{懐かしい|なつかしい}。」\n\n「是外公的做法。」小鮮說，「用了金澤{名物|めいぶつ}的{調味料|ちょうみりょう}。」\n\n男人沒有說話，低頭慢慢{味わう|あじわう}，把整份定食吃完，連{汁|しる}都{残らず|のこらず}地喝光。\n\n他離開的時候，在桌上留下了一張名片。\n\n黒木集團，社長，黒木一輝。\n\n---\n\n從那天起，他每個月都會來金澤{出張|しゅっちょう}一次。\n\n每一次，他都會來食堂吃午餐。\n\n他總是坐在最角落的位子，點「隨便」，然後安靜地吃完。\n\n有時候，他會問一些奇怪的問題。\n\n「這道菜，可以做{塩辛い|しおからい}一點嗎？」\n\n「為什麼？」\n\n「我小時候，外婆做的，就是那個味道。」\n\n小鮮後來才知道，他的外婆，也是金澤人。他小時候在這裡住過幾年，後來搬去了東京，再也沒有回來過。\n\n「金澤是我的{古里|ふるさと}。」他說，「可是我已經忘了，它是什麼味道。」\n\n---\n\n那年冬天，食堂要收起來了。\n\n外公生病住院，{家主|やぬし}要把店面收回去。小鮮一個人撐不下去了。\n\n最後一天，她把店裡的{食器|しょっき}一個一個包好，準備搬走。\n\n門被推開了。\n\n是黒木一輝。可是今天不是他出差的日子。\n\n「你怎麼來了？」\n\n「出差。」他說，「臨時的。」\n\n「今天沒有營業喔。」小鮮勉強笑了笑，「最後一天了。」\n\n「我知道。」他說，「所以我才來。」\n\n他把一份文件放在桌上。是這間店面的買賣契約。\n\n「這間店，我買下來了。」他說，「條件只有一個——妳要繼續做下去。」\n\n小鮮愣住了。\n\n「為什麼……你要為我做到這種地步？」\n\n他沉默了很久。\n\n「我說我是來出差的。」他終於說，「那是騙人的。」\n\n「金澤這邊，根本沒有什麼生意要談。」\n\n「[[〈出張:しゅっちょう〉のついでに、〈君:きみ〉に〈会:あ〉いに〈来:き〉た。::我是趁出差，順便來見妳的。]]」他說，「不，應該說，我是為了見妳，才編了出差的{口実|こうじつ}。」\n\n小鮮的眼淚掉了下來。\n\n「笨蛋……」她說，「那你每次點『隨便』，是因為……」\n\n「因為妳做什麼，」他說，「我都想吃。」\n\n他走過來，把她拉進懷裡，低頭吻住她。\n\n廚房裡，還留著味噌湯的香味。\n\n「[[〈毎日:まいにち〉、〈君:きみ〉の〈料理:りょうり〉が〈食:た〉べたい。::我想每天都吃妳做的菜。]]」\n\n「那你，」她笑著說，「每天都要來金澤出差嗎？」\n\n「不。」他說，「我把總公司，搬過來。」", "blurb": "金澤的小食堂，每個月都有一位出差的社長來吃飯。", "gram": {"pt": "〜ついでに", "mean": "順便～", "how": "名詞の／動詞辭書形＋ついでに（出張→出張のついでに）", "ex": "〈出張:しゅっちょう〉のついでに、〈君:きみ〉に〈会:あ〉いに〈来:き〉た。", "exzh": "我是趁出差，順便來見妳的。"}, "boss": {"name": "黒木一輝", "yomi": "くろき かずき", "mark": "輝", "c1": "#1e1814", "c2": "#8a6a50"}}, {"id": "B42", "title": "總裁的弟弟", "band": "N3-N2", "text": "城ヶ崎家有兩個兒子。\n\n{長男|ちょうなん}瑠偉，三十二歲，城ヶ崎集團的社長，冷淡、嚴格，從不笑。\n\n{末っ子|すえっこ}拓真，二十五歲，個性{朗らか|ほがらか}，是公司裡最受歡迎的人。兄弟兩人從小就很{仲良し|なかよし}。\n\n而許小柚，是拓真大學時的學妹，透過他的介紹，進了城ヶ崎集團當秘書。\n\n她的上司，是瑠偉。\n\n---\n\n在瑠偉身邊工作的第一個月，小柚每天都很緊張。\n\n他說話很少，要求很高。報告一個數字錯了，他會退回來，讓她重新做到{深夜|しんや}。\n\n拓真常常來秘書室找她，帶著咖啡和點心。\n\n「我哥很可怕吧？」拓真笑著說，「別理他，他對誰都這樣。」\n\n小柚總是笑一笑，不說話。\n\n因為她發現，瑠偉其實不是那樣的人。\n\n他會在她加班的時候，{こっそり}把辦公室的空調調高一度。他會在她發燒還來上班的時候，把她的工作全部奪走，讓她回家休息。他會在拓真來找她的時候，從辦公室的玻璃後面，看很久。\n\n---\n\n那天，拓真把小柚約到公司的屋頂上，向她告白了。\n\n「我喜歡妳很久了。」他說，「從大學開始。」\n\n小柚{固まる|かたまる}了，不知道該怎麼回答。\n\n就在這時，屋頂的門被推開了。\n\n瑠偉站在門口，{睨む|にらむ}著拓真。\n\n「拓真，」他說，「下去。」\n\n「哥，你幹嘛——」\n\n瑠偉沒有{怒鳴る|どなる}，只是又說了一次：「我說，下去。」\n\n拓真看著哥哥，又看看小柚，似乎明白了什麼。他輕輕{ため息|ためいき|溜息}，笑了一下，有點苦：「原來如此。」\n\n他轉身走了。\n\n---\n\n屋頂上，只剩下兩個人。\n\n風很大，吹亂了小柚的頭髮。\n\n「社長，您為什麼……」\n\n「我不想跟拓真{争う|あらそう}妳。」瑠偉說，「他是我唯一的弟弟。」\n\n「從小，他想要什麼，我都{譲る|ゆずる}他。玩具、房間、父親的關注。」\n\n「我以為，這次也可以。」\n\n他看著她，聲音低了下去。\n\n「可是剛才在門後面，聽到他說喜歡妳，我才發現，我做不到。」\n\n小柚的心跳停了一拍。\n\n「[[〈君:きみ〉をめぐって、〈弟:おとうと〉と〈争:あらそ〉うつもりはない。::我不打算為了妳跟弟弟爭。]]」他說，「所以，我只問妳一次。」\n\n「妳選誰？」\n\n小柚看著他。這張{見慣れる|みなれる}的冷淡的臉，此刻的眼神，像是在等待一個判決。\n\n「社長，」她小聲說，「您知道嗎？每次您調高空調的時候，我都知道。」\n\n他愣住了。\n\n「我每天加班到深夜，」她說，「不是因為報告做不完。是因為，我想多看您一會兒。」\n\n瑠偉看著她，很久很久。\n\n然後，他走過去，一把把她抱進懷裡，把臉{近付ける|ちかづける}。\n\n「[[〈二度:にど〉と〈譲:ゆず〉らない。::我再也不會讓了。]]」\n\n他低頭吻住她，屋頂的風很冷，他的吻卻很燙。\n\n那天晚上，拓真傳來一則訊息：「哥，你終於{素直|すなお}了一次。恭喜。」\n\n瑠偉看著手機，難得地，笑了。", "blurb": "弟弟介紹進公司的秘書，讓從不笑的哥哥笑了。", "gram": {"pt": "〜をめぐって", "mean": "圍繞著～", "how": "名詞＋をめぐって（君→君をめぐって）", "ex": "〈君:きみ〉をめぐって、〈弟:おとうと〉と〈争:あらそ〉うつもりはない。", "exzh": "我不打算為了妳跟弟弟爭。"}, "boss": {"name": "城ヶ崎瑠偉", "yomi": "じょうがさき るい", "mark": "偉", "c1": "#1a1424", "c2": "#7a5aa8"}}, {"id": "B43", "title": "總裁的嫁衣", "band": "N3-N2", "text": "京都的老街上，有一間百年{和服|わふく}店。\n\n店主的孫女林千織，從十歲開始學{縫う|ぬう}和服。現在，她二十七歲，是店裡唯一的裁縫師。\n\n那年秋天，店裡接到了一筆大訂單。\n\n高遠家的長孫，高遠清貴，要在明年春天舉行婚禮。這是高遠家今年最大的{行事|ぎょうじ}。他們訂了一套新娘穿的白無垢，指定要千織親手縫。\n\n「這筆訂單，我們{承る|うけたまわる}了。」千織最{敬う|うやまう}的外婆深深地鞠躬，「一定讓高遠家滿意。」\n\n---\n\n高遠清貴第一次來店裡，是來量新娘的{寸法|すんぽう}。\n\n可是他一個人來的。\n\n「新娘呢？」千織問。\n\n「她很忙。」他說，「先量我的就好。」\n\n千織替他量了袖長、肩寬。他很高，她要踮起腳尖才搆得到他的肩膀。\n\n量完，他看了一眼店裡掛著的一件{紺|こん}色的舊和服。\n\n「那件，是誰的？」\n\n「是我外婆年輕時候穿的。」千織說，「上面的花紋，是她自己繡的。」\n\n他看了很久：「很美。」\n\n---\n\n之後，他每週都來看進度。\n\n他說是要確認新娘禮服的狀況，可是每次都只是安靜地坐在旁邊，看她一針一線地縫。\n\n他會問她古典和服的花紋代表什麼意思，會在她累的時候，替她泡一杯茶。\n\n千織發現，自己開始期待他來的日子。\n\n可是她告訴自己：不行。他是別人的新郎。\n\n---\n\n婚禮前一週，白無垢終於完成了。\n\n千織把它{広げる|ひろげる}在榻榻米上，用手輕輕撫平每一道摺痕。這是她做過最美的一件和服。\n\n只是她一直想不通：他給的新娘尺寸，竟和她自己的分毫不差。\n\n高遠清貴站在門口，看了很久。\n\n「你的新娘，」千織努力地笑，「一定會很漂亮。」\n\n「要不要試穿看看？」\n\n「我？」千織{恐縮|きょうしゅく}地往後退，「這是新娘的衣服……」\n\n「就是新娘的衣服。」他說，「所以，才要妳穿。」\n\n千織的心跳停了一拍。\n\n「你在開玩笑吧……」\n\n「我從來不開玩笑。」他走過來，「我家裡要我娶一個門當戶對的人。我說，我要娶一個會縫和服的人。」\n\n「他們說，你連人選都沒有。」\n\n「我說，有。」\n\n他看著她，眼神很認真。\n\n「我第一次來這間店，是十年前。那時候我十八歲，因為不想{継ぐ|つぐ}家業，離家出走。」他說，「下著大雨，我在這間店的屋簷下躲雨。一個十七歲的女生，拿了一條{手拭い|てぬぐい}給我，還說——『你的{帯|おび}綁反了喔』。」\n\n千織的眼淚掉了下來。她想起來了。\n\n「從那天起，我就決定了。」他說，「如果要結婚，就要跟那個女生。」\n\n「[[〈結婚:けっこん〉に〈際:さい〉して、〈一:ひと〉つだけ〈約束:やくそく〉してくれ。::在結婚之際，答應我一件事。]]」\n\n「什麼事？」\n\n「以後，」他說，「我的每一件和服，都由妳來縫。」\n\n千織哭著笑了，點了點頭。\n\n他把她拉進懷裡，低頭吻住她。\n\n三月的{祝日|しゅくじつ}，春分那天，京都下著淡淡的春雨。千織花了一個小時{着替え|きがえ}，穿上自己親手縫的白無垢，踩著新的{草履|ぞうり}，手上拿著外婆送的{扇子|せんす}，走進了神社。\n\n那場婚禮，很安靜，很美。\n\n外婆坐在第一排，笑著擦眼淚。\n\n「這孩子，」她小聲說，「總算把自己也縫進去了。」", "blurb": "百年和服店接下大訂單，新郎卻親自來量新娘的尺寸。", "gram": {"pt": "〜に際して", "mean": "在～之際", "how": "名詞＋に際して（結婚→結婚に際して）", "ex": "〈結婚:けっこん〉に〈際:さい〉して、〈一:ひと〉つだけ〈約束:やくそく〉してくれ。", "exzh": "在結婚之際，答應我一件事。"}, "boss": {"name": "高遠清貴", "yomi": "たかとお きよたか", "mark": "清", "c1": "#14202a", "c2": "#4a7a9a"}}, {"id": "B44", "title": "總裁的迷路", "band": "N3-N2", "text": "綾小路直哉，是業界有名的天才社長。\n\n他記得住上千個數字，看得懂最複雜的合約，三分鐘就能做出一個億的決定。\n\n可是，他是個超級路痴。\n\n---\n\n那天，他第一次來台北出差。\n\n秘書臨時生病，他一個人走出飯店，想去飯店{向かい|むかい}的會議中心。\n\n結果，他走了一個小時。\n\n{大通り|おおどおり}走錯了方向，小巷子越走越深。他拿著手機，看著地圖上不停轉圈的{矢印|やじるし}，額頭上冒出了汗。\n\n就在他站在巷子的{突き当たり|つきあたり}，不知道該往哪裡走的時候，一個女生從旁邊經過。\n\n「先生，您迷路了嗎？」\n\n她叫沈小路，是一個導遊。說一口流利的日文。\n\n「……我在找會議中心。」\n\n「會議中心？」小路愣了一下，「就在您飯店的對面啊。您走反了，而且走了快兩公里。」\n\n綾小路直哉的臉，有一點紅。\n\n---\n\n小路帶他回去。\n\n一路上，她把{道順|みちじゅん}一個一個告訴他，指著路邊的{目印|めじるし}和{標識|ひょうしき}：「看到那間紅色招牌的藥局了嗎？在那裡右轉。然後那個{街角|まちかど}的便利商店，左轉。」\n\n「藥局右轉，便利商店左轉。」他認真地記，「然後呢？」\n\n「然後{横断|おうだん}這條馬路，就到了。」她笑了，「很簡單吧。」\n\n他沉默了一下：「對我來說，不簡單。」\n\n到了會議中心門口，他遞給她一張名片。\n\n「明天，我還要去三個地方。」他說，「可以請妳當我的導遊嗎？」\n\n---\n\n那一週，小路帶他{一通り|ひととおり}走遍了台北。\n\n他還是記不住路。每次她說「左轉」，他都會往右邊{逸れる|それる}。她說「這個{方角|ほうがく}是北邊」，他會一臉認真地問「北邊是哪邊」。\n\n小路笑到肚子痛。\n\n可是她發現，他雖然不會認路，卻記得很多別的事。\n\n記得她說過喜歡吃芒果冰。記得她說過，她的夢想是開一間自己的旅行社。記得她說，她最喜歡台北的，是那條木棉{並木|なみき}。\n\n---\n\n出差的最後一天，他自己一個人出門，前往某個地方。\n\n小路在飯店大廳等了一個小時，打了十通電話，都沒有人接。\n\n她{慌てる|あわてる}得到處找，最後在那條木棉樹下，找到了他。\n\n他站在樹下，手上拿著一張皺巴巴的地圖，上面用筆畫滿了圈圈和箭頭。\n\n「你怎麼一個人跑來這裡！」小路氣喘吁吁，「你知道我有多擔心嗎？」\n\n「我想自己找到這裡。」他說，「妳說，這是妳最喜歡的地方。」\n\n「你……走了多久？」\n\n「三個小時。」他看起來{くたびれる}了，「{回り道|まわりみち}了好幾次。」\n\n小路愣住了。\n\n「[[さんざん〈迷:まよ〉ったあげく、ここに〈辿:たど〉り〈着:つ〉いた。::迷路了好幾次，最後終於走到了這裡。]]」\n\n他看著她，眼神很認真。\n\n「我這輩子，從來沒有為了一個地方，走這麼久的路。」\n\n「因為我想讓妳知道，我會記得。」他說，「妳喜歡的地方，妳喜歡的東西。」\n\n「就算我會迷路，我也會一直找，找到妳在的地方為止。」\n\n小路的眼淚掉了下來。\n\n他把她拉進懷裡，低頭吻住她。木棉花一朵一朵，從樹上輕輕地落下來。\n\n「[[これからは、〈君:きみ〉が〈俺:おれ〉の〈地図:ちず〉だ。::以後，妳就是我的地圖。]]」\n\n「那你要聽我的喔。」她笑著說，「我說左轉，就要左轉。」\n\n「嗯。」他說，「不過今天，我想往這邊。」\n\n他牽起她的手，往她家的方向走去。\n\n這一次，他沒有走錯。", "blurb": "記得住一千個數字的天才社長，在台北迷路了。", "gram": {"pt": "〜あげく", "mean": "～到最後（多指折騰後的結果）", "how": "動詞た形＋あげく（迷った→迷ったあげく）", "ex": "さんざん〈迷:まよ〉ったあげく、ここに〈辿:たど〉り〈着:つ〉いた。", "exzh": "迷路了好幾次，最後終於走到了這裡。"}, "boss": {"name": "綾小路直哉", "yomi": "あやのこうじ なおや", "mark": "直", "c1": "#1e1a14", "c2": "#9a8458"}}, {"id": "B45", "title": "總裁的電梯", "band": "N3-N2", "text": "晚上十一點，四十層的辦公大樓裡，只剩下一盞{蛍光灯|けいこうとう}還亮著。\n\n負責打掃的劉小靜推著清潔車，走進了電梯。\n\n電梯門要關的時候，一隻手伸了進來。\n\n「等一下。」\n\n走進來的男人穿著黑色西裝，領帶繫得很{緩い|ゆるい}，看起來很累。她認得他——這棟大樓的主人，藤ヶ谷集團的社長，藤ヶ谷侑。\n\n小靜趕緊把身子{縮める|ちぢめる}，躲到角落。\n\n電梯開始往下降。三十層，二十五層，二十層——\n\n突然，「喀」的一聲，整個電梯劇烈地晃了一下。\n\n燈熄了，電梯裡一片{真っ暗|まっくら}。\n\n電梯停住了。\n\n---\n\n黑暗中，小靜聽見一陣{荒い|あらい}的呼吸聲。\n\n她{呼び掛ける|よびかける}：「社、社長？您沒事吧？」\n\n沒有回答。\n\n她摸黑找到手機，打開手電筒。光照過去，她看見藤ヶ谷侑靠在電梯的牆上，臉色白得嚇人，額頭上全是汗。\n\n「我……沒事。」他的聲音在發抖。\n\n小靜愣住了。這個在新聞上永遠冷靜、永遠{完璧|かんぺき}的男人，現在看起來，像一個害怕的孩子。\n\n「您……怕密閉的地方嗎？」\n\n他沒有回答。可是他緊緊{握る|にぎる}著扶手的手，已經說明了一切。\n\n小靜深吸一口氣，拿起了電梯裡的緊急{受話器|じゅわき}。\n\n「喂？我們被困在電梯裡了，在二十樓附近。」\n\n對方說，負責{整備|せいび}的人員正在趕來，可能要等三十分鐘。\n\n---\n\n三十分鐘，在黑暗裡，很長。\n\n小靜在他身邊坐下。\n\n「社長，」她小聲說，「我小時候也很怕黑。我媽媽教了我一個方法。」\n\n「……什麼方法？」\n\n「說話。」她說，「一直說話，就不會想到害怕的事。」\n\n於是她開始說。說她從台灣來，說她在讀{夜間|やかん}部的大學，說她最喜歡的食物是她媽媽做的蘿蔔糕。\n\n說著說著，她發現他慢慢地{落ち着く|おちつく|落着く}下來了。\n\n「妳……為什麼要做清潔員？」他終於開口。\n\n「因為晚上的工作，白天可以上課。」她說，「我想當設計師。總有一天，我要設計一棟比這裡還漂亮的大樓。」\n\n黑暗裡，她好像聽見他輕輕地笑了一聲。\n\n---\n\n電梯門打開的那一刻，外面的燈光照了進來。\n\n維修人員、保全、秘書，一群人{一斉|いっせい}擁到門口。秘書剛才一直打{内線|ないせん}催管理室。\n\n小靜站起來，正要推著清潔車離開，{手首|てくび}卻被抓住了。\n\n是藤ヶ谷侑。\n\n「妳叫什麼名字？」\n\n「劉、劉小靜。」\n\n他看著她，眼神和剛才完全不一樣了。\n\n「[[〈君:きみ〉の〈声:こえ〉を〈聞:き〉いたとたん、〈怖:こわ〉くなくなった。::一聽到妳的聲音，我就不害怕了。]]」\n\n小靜的臉一下子紅了。\n\n「明天，」他說，「來我的辦公室。」\n\n「我、我做錯什麼了嗎？」\n\n「沒有。」他說，「我們公司在找一個實習設計師。」\n\n「可是我還沒畢業……」\n\n「那就邊讀邊做。」他說，「我想看看，妳要設計的那棟大樓。」\n\n一個月後，小靜在頂樓的設計部上班。\n\n有一天加班到很晚，她走進電梯，發現社長也在裡面。\n\n電梯門關上的時候，他牽起了她的手。\n\n「我現在不怕了。」他說，「只要妳在。」\n\n他低頭，在只有兩個人的電梯裡，輕輕吻了她。", "blurb": "深夜十一點，清潔員和社長被關在停電的電梯裡。", "gram": {"pt": "〜とたん", "mean": "剛～就", "how": "動詞た形＋とたん（聞いた→聞いたとたん）", "ex": "〈君:きみ〉の〈声:こえ〉を〈聞:き〉いたとたん、〈怖:こわ〉くなくなった。", "exzh": "一聽到妳的聲音，我就不害怕了。"}, "boss": {"name": "藤ヶ谷侑", "yomi": "ふじがや ゆう", "mark": "侑", "c1": "#141418", "c2": "#5a5a78"}}, {"id": "B46", "title": "總裁的灰姑娘", "band": "N3-N2", "text": "蘇小晨住在東京郊外一棟老舊的{団地|だんち}裡。\n\n五樓，沒有電梯，房間只有六坪。牆壁上的油漆被風雨剝落了好幾塊，冬天的風會從窗戶的{隙間|すきま}鑽進來。\n\n她白天在一間大公司當派遣員工，晚上在一間{酒場|さかば}打工。賺的錢，一半寄回台灣給生病的爸爸。\n\n---\n\n鷺沢圭吾是那間大公司的社長。\n\n他第一次注意到小晨，是在公司的茶水間。她拿著一支舊{箒|ほうき}，把地上的{屑|くず}掃得乾乾淨淨。那不是她的工作，可是她說：「看到髒了，就想掃。」\n\n第二次，是在大雨的夜裡。他的車經過一條小巷，看見她撐著一把破了洞的傘，一個人走在雨裡。\n\n他讓司機停車，送她回家。\n\n車子停在那棟老舊的公寓前面，他看著她爬上五樓，房間的燈亮起來，很久很久，才讓司機開走。\n\n---\n\n之後，他常常「順路」送她回家。\n\n她很少說自己的事。只有一次，她說：「我爸爸說，人窮，心不能窮。」\n\n他沒說話。可是那天晚上，他想了很久。\n\n他從小什麼都有。可是他從來不知道，什麼叫「心」。\n\n---\n\n三個月後，他們在一起了。\n\n消息傳到了鷺沢家。他的母親，鷺沢夫人，親自來到了小晨的{住まい|すまい}。\n\n「妳就是那個女孩？」夫人站在狹窄的玄關，用{見下す|みくだす}的眼神打量四周，表情像是看到了什麼{不潔|ふけつ}的東西。\n\n「一個住在這種地方的人，」她說，「配得上我們家嗎？」\n\n小晨低著頭，手緊緊握著{雑巾|ぞうきん}。\n\n「我知道我配不上。」她小聲說，「可是我沒有想要他的錢。」\n\n「每個人都這麼說。」夫人冷笑，「妳不過是個{欲張り|よくばり}的女人。」\n\n小晨覺得自己好{みじめ}，眼淚在眼眶裡打轉。\n\n就在這時，門被推開了。\n\n鷺沢圭吾站在門口。\n\n「母親，」他的聲音冷得像冰，「請回去。」\n\n「圭吾！你要為了這種女人，跟家裡作對嗎？」\n\n「她不是『這種女人』。」他走到小晨身邊，握住她的手，「她是我要娶的人。」\n\n---\n\n夫人走了以後，小晨蹲在玄關，哭了很久。\n\n「你不應該跟你媽媽吵架。」她說，「我不值得。」\n\n「妳錯了。」他蹲下來{慰める|なぐさめる}她，「是我不值得。」\n\n「我家的生意一直很{儲かる|もうかる}，我從小有用不完的{小遣い|こづかい}，可是從來沒有人，像妳這樣，把別人的地也掃乾淨。」\n\n「妳教會我，什麼叫『心』。」\n\n他捧起她的臉。\n\n「[[〈母:はは〉の〈反対:はんたい〉にもかかわらず、〈俺:おれ〉は〈君:きみ〉を〈選:えら〉んだ。::儘管母親反對，我還是選擇了妳。]]」\n\n小晨的眼淚掉了下來。他低頭吻住她，在那間只有六坪的小房間裡。\n\n窗外的風，好像沒那麼冷了。\n\n一個月後，鷺沢夫人再次來到那棟老公寓。\n\n這一次，她手上拿著一盒點心。\n\n「我調查過了。」她說，「妳把一半的薪水寄給妳父親，三年來沒有斷過。」\n\n「……是我{誤解|ごかい}了。」夫人別過頭，「下週日，來家裡吃飯吧。」", "blurb": "白天派遣、晚上酒館打工的她，被社長的母親找上門。", "gram": {"pt": "〜にもかかわらず", "mean": "儘管～", "how": "名詞＋にもかかわらず（反対→反対にもかかわらず）", "ex": "〈母:はは〉の〈反対:はんたい〉にもかかわらず、〈俺:おれ〉は〈君:きみ〉を〈選:えら〉んだ。", "exzh": "儘管母親反對，我還是選擇了妳。"}, "boss": {"name": "鷺沢圭吾", "yomi": "さぎさわ けいご", "mark": "圭", "c1": "#1a1a24", "c2": "#7070a0"}}, {"id": "B47", "title": "總裁的小指約定", "band": "N3-N2", "text": "二十年前，台北的一座小公園。\n\n噴水池旁邊，兩個小孩坐在{腰掛け|こしかけ}上。\n\n年幼的女孩拿著一本恐龍{図鑑|ずかん}，男孩拿著一盒{絵の具|えのぐ}。男孩是從{余所|よそ}搬來的日本孩子，一句中文都不會說，女孩就指著圖鑑，一個字一個字地教他。\n\n他們每天下午都在那裡見面。那是他們的{日課|にっか}。\n\n有一天，雨後的天空出現了一道{虹|にじ}。\n\n男孩用畫筆，把彩虹畫在女孩的手心。\n\n「以後，」他用剛學會的中文說，「我們結婚。」\n\n女孩笑著，伸出小指跟他打勾勾。\n\n隔週，男孩一家{引っ越し|ひっこし}回了日本。\n\n---\n\n二十年後，東京。\n\n林小虹在一間出版社當童書{編集|へんしゅう}。\n\n那天，她被叫進會議室。新的合作對象，是一間大型企業的社長，想出版一本給孩子看的童話。\n\n會議室的門打開，一個高大的男人走了進來。\n\n一ノ宮朔夜。冷淡、俐落，看起來不太好相處。\n\n「這就是負責的編輯？」他看著她，皺了一下眉。\n\n小虹覺得他有點眼熟，卻想不起來在哪裡見過。\n\n---\n\n接下來的幾個月，他們為了這本童話書，見了很多次面。\n\n他的要求很多，每一張插畫都要{繰り返す|くりかえす}修改。可是小虹發現，他對每一頁都很認真。\n\n他拿來的原稿上，故事是這樣的：一個從遠方來的男孩，在一座公園裡，遇見了一個教他說話的女孩。\n\n小虹越看，越覺得{懐かしい|なつかしい}，心跳得厲害。\n\n---\n\n最後一次開會的那天傍晚，外面下了一場{夕立|ゆうだち}。\n\n雨停的時候，{夕日|ゆうひ}照進會議室，窗外出現了一道彩虹。\n\n「彩虹。」小虹忍不住說。\n\n一ノ宮朔夜站在窗邊，看著那道虹，很久沒有說話。\n\n「林小姐，」他突然說，「妳小時候，是不是住在台北？」\n\n小虹愣住了。\n\n「妳是不是，有一本恐龍圖鑑？」\n\n這是她完全{思い掛けない|おもいがけない}的重逢。她的心跳停了一拍。\n\n她{ためらう}了一下：「你……是那個男孩？」\n\n他轉過身，看著她。那個冷淡的表情，第一次{崩れる|くずれる}了。\n\n「[[〈君:きみ〉、そんなに〈可愛:かわい〉かったっけ。::妳以前……有這麼可愛嗎？]]」\n\n小虹的眼淚一下子掉了下來，又哭又笑：「你這個人，見面第一句話就說這個？」\n\n「我找了妳二十年。」他說，「我只記得，妳叫『小虹』，住在有噴水池的公園旁邊。」\n\n「這本童話，」他說，「是我寫給妳的。我想，如果妳是童書編輯，總有一天會看到。」\n\n「結果，妳真的是。」\n\n他伸出手，拉起她的手。\n\n然後，他伸出小指。\n\n「二十年前的約定，」他說，「還算數嗎？」\n\n小虹看著那根小指，笑著，勾了上去。\n\n他把她拉進懷裡，低頭吻住她。窗外的虹，慢慢地淡了，可是兩個人，都沒有放開。\n\n「[[〈今度:こんど〉は、〈二度:にど〉と〈離:はな〉れない。::這一次，我再也不會離開。]]」", "blurb": "二十年前在噴水池邊打勾勾的男孩，回來了。", "gram": {"pt": "〜っけ", "mean": "是不是～來著", "how": "普通形＋っけ（可愛かった→可愛かったっけ）", "ex": "〈君:きみ〉、そんなに〈可愛:かわい〉かったっけ。", "exzh": "妳以前……有這麼可愛嗎？"}, "boss": {"name": "一ノ宮朔夜", "yomi": "いちのみや さくや", "mark": "朔", "c1": "#14142a", "c2": "#6060b0"}}, {"id": "B48", "title": "總裁的樂團", "band": "N3-N2", "text": "「我們{解散|かいさん}吧。」\n\n在小小的地下樂團練習室裡，主唱林聲聲說完這句話，練習室一下子{静まる|しずまる}了下來。\n\n樂團成立五年，演了上百場，{客席|きゃくせき}卻從來沒有坐滿過。貝斯手要回{古里|ふるさと}結婚，打鼓的團員找到了正職工作。\n\n「最後一場，」聲聲笑著說，「我們好好唱。」\n\n---\n\n最後一場表演，在一間只能容納五十人的小 Live House。\n\n{騒々しい|そうぞうしい}的音樂、汗水、大家的大喊聲。台下只有二十幾個人，可是聲聲唱得比任何一場都用力。\n\n唱到最後一首歌的時候，她看見台下最後一排，站著一個穿西裝、很{目立つ|めだつ}的男人。\n\n他沒有跟著喊，也沒有拍手，只是一直看著她。\n\n---\n\n表演結束，他在後台等她。\n\n「我是桐ヶ谷陽介。」他遞出{名刺|めいし}，「桐ヶ谷音樂的社長。」\n\n聲聲愣住了。那是全日本最大的唱片公司之一。\n\n「我想跟妳簽約。」他說，「只有妳一個人。」\n\n「我們樂團今天已經解散了。」\n\n「我知道。」他說，「所以我才今天來。」\n\n---\n\n她簽了約。\n\n接下來的一年，她每天都在錄音室裡錄音。桐ヶ谷陽介很嚴格，同一句歌詞，他會讓她{繰り返す|くりかえす}重唱，直到他滿意為止。\n\n可是他也是那個，在她唱到喉嚨沙啞的時候，默默遞上一杯蜂蜜水的人。\n\n在她想家想到哭的時候，帶她去吃台灣菜的人。\n\n她出道的第一場演唱會，觀眾席坐滿了三千人。\n\n謝幕的時候，她在後台{抱きしめる|だきしめる}他，哭得說不出話。\n\n「謝謝你。」\n\n他輕輕{撫でる|なでる}著她的背，什麼也沒說。\n\n---\n\n一個月後，她收到一封邀請。紐約的一間大公司，想邀請她去美國發展。\n\n「去吧。」桐ヶ谷陽介說，「這是很好的{切っ掛け|きっかけ}。」\n\n「可是……」\n\n「我不會{引き止める|ひきとめる}妳。」他說，「妳的{響き|ひびき}，應該被更多人聽見。去展現妳的才華。」\n\n出發那天，他沒有來送行。\n\n---\n\n一年後，紐約。\n\n聲聲在一間{酒場|さかば}的小舞台上唱完歌，下台時，看見一個熟悉的身影。\n\n桐ヶ谷陽介坐在吧台，手上拿著一杯酒，看起來比一年前瘦了很多。\n\n「你怎麼會在這裡？」\n\n「出差。」他說。\n\n她看著他，笑了：「你說謊的時候，耳朵會紅。」\n\n他沉默了很久。\n\n「[[〈手放:てばな〉したものの、〈一日:いちにち〉も〈忘:わす〉れられなかった。::雖然放了手，卻沒有一天忘得了妳。]]」\n\n「我以為，讓妳走，是對妳最好的事。」他說，「可是這一年，我每天都在{悔やむ|くやむ}。」\n\n「每天晚上，我都會聽妳的歌，聽到睡著。」\n\n聲聲的眼淚掉了下來。\n\n「笨蛋。」她說，「我在紐約唱的每一首歌，都是寫給你的。」\n\n他站起來，把她拉進懷裡，低頭吻住她。酒館裡的人吹起了口哨，有人拍手。\n\n「[[〈一緒:いっしょ〉に〈帰:かえ〉ろう。::我們一起回去吧。]]」\n\n「回東京？」\n\n「回我身邊。」他說。", "blurb": "樂團解散那晚，觀眾席最後一排，站著一個西裝男人。", "gram": {"pt": "〜ものの", "mean": "雖然～但是", "how": "動詞た形＋ものの（手放した→手放したものの）", "ex": "〈手放:てばな〉したものの、〈一日:いちにち〉も〈忘:わす〉れられなかった。", "exzh": "雖然放了手，卻沒有一天忘得了妳。"}, "boss": {"name": "桐ヶ谷陽介", "yomi": "きりがや ようすけ", "mark": "陽", "c1": "#2a1810", "c2": "#c0703a"}}, {"id": "B49", "title": "總裁的病", "band": "N3-N2", "text": "海堂壮從來不生病。\n\n他是海堂集團的社長，每天第一個{出勤|しゅっきん}，{絶えず|たえず}工作十六個小時，一年只休三天假。他的秘書說，他是一台不會停的機器。\n\n直到那天，他在會議中倒下了。\n\n---\n\n醒來的時候，他躺在醫院的病房裡。\n\n醫生拿著診斷書，{厳重|げんじゅう}地警告：「過勞。胃潰瘍。再這樣下去，會出大事。」\n\n「需要住多久？」\n\n「至少兩個星期。」\n\n「不行。」他想坐起來，「下週有重要的會議——」\n\n「海堂先生。」\n\n一個聲音打斷了他。\n\n站在門口的，是一個穿著白色制服的護理師，手上拿著消毒用的酒精棉。她看起來很年輕，眼神卻很{強気|つよき}。\n\n「您要是現在出院，」她說，「下次就不是住院這麼簡單了。」\n\n她叫葉晴，是這間醫院的護理師。\n\n---\n\n海堂壮是個很{我儘|わがまま}的病人。\n\n他{こっそり}在病房裡用筆電開會。葉晴奪走了他的電腦。\n\n他讓秘書偷偷送文件進來。葉晴站在門口，把門{塞ぐ|ふさぐ}。\n\n他沒有胃口，不肯吃醫院的飯，說吃飯很{面倒臭い|めんどうくさい}。葉晴就坐在床邊，一口一口地盯著他吃完。\n\n「妳是我見過最{厄介|やっかい}的護理師。」他說。\n\n「您是我見過最不聽話的病人。」她說。\n\n可是慢慢地，他開始習慣她了。\n\n習慣早上她拉開窗簾的聲音。習慣她量體溫時，冰涼的手指。習慣她坐在床邊，講一些醫院裡的小事。\n\n有一天晚上，他問她：「妳為什麼要當護理師？」\n\n葉晴{黙る|だまる}了一下。\n\n「我爸爸，以前也是一個工作到倒下的人。」她說，「他的{寿命|じゅみょう}，比醫生說的短了很多。」\n\n「我那時候在想，如果有人能早一點讓他停下來，就好了。」\n\n海堂壮看著她，很久沒有說話。\n\n---\n\n兩週後，他出院了。\n\n出院那天，葉晴到醫院門口{見送る|みおくる}他。\n\n「以後，要好好吃飯。」她說，「要早點睡。不要再倒下了。」\n\n「嗯。」\n\n他上了車。車子開了一段路，又停了下來。\n\n他下車，{引き返す|ひきかえす}醫院門口。\n\n「葉晴。」\n\n「還有什麼事嗎？」\n\n「這兩週，」他說，「是我這十年來，第一次好好休養。我的{心身|しんしん}，都輕鬆了。」\n\n「我一直以為，工作就是我的全部。」他看著她，「直到我倒下，才知道，原來我一直在失去什麼。」\n\n「[[〈失:うしな〉ってはじめて、〈大切:たいせつ〉なものに〈気:き〉づいた。::直到失去，我才發現什麼是重要的。]]」\n\n「健康，時間，還有……」他頓了一下，「一個會盯著我吃飯的人。」\n\n葉晴的臉一下子紅了。\n\n「所以，」他說，「我想請妳，繼續盯著我。」\n\n「這是什麼意思？」\n\n「每天。」他說，「一輩子。」\n\n他伸出手，輕輕把她拉進懷裡，低頭吻了她。\n\n醫院門口的櫻花開了，花瓣{散る|ちる}在兩個人的肩上。\n\n「[[〈俺:おれ〉の〈健康:けんこう〉は、〈君:きみ〉に〈任:まか〉せる。::我的健康，就交給妳了。]]」", "blurb": "從不生病的社長倒下了，醒來第一眼看見的是她。", "gram": {"pt": "〜てはじめて", "mean": "直到～才", "how": "動詞て形＋はじめて（失う→失ってはじめて）", "ex": "〈失:うしな〉ってはじめて、〈大切:たいせつ〉なものに〈気:き〉づいた。", "exzh": "直到失去，我才發現什麼是重要的。"}, "boss": {"name": "海堂壮", "yomi": "かいどう そう", "mark": "壮", "c1": "#0e1e26", "c2": "#3a8aa8"}}, {"id": "B50", "title": "總裁的日出", "band": "N3-N2", "text": "十月的北阿爾卑斯山，{紅葉|もみじ}染遍了整片山坡。\n\n林朝陽是這座山的登山嚮導。她從小在山腳下長大，閉著眼睛都能走完這條路。\n\n那天，她接到一個奇怪的委託。\n\n「一位客人，要包下三天的行程。」山屋的老闆說，「他說，只想看一次日出。」\n\n---\n\n客人叫鷲宮伊吹。\n\n他穿著全新的登山裝備，背包裡的裝備準備得很{整う|ととのう}，可是一看就知道，是個從來沒有爬過山的{素人|しろうと}。\n\n「為什麼想看日出？」朝陽問。\n\n他沉默了一下：「我母親生前說過，這座山的{日の出|ひので}，是她這輩子看過最美的。」\n\n「我想替她再看一次。」\n\n---\n\n第一天，他走了不到兩個小時，就喘得呼吸都接不上。\n\n朝陽沒有{催促|さいそく}他。她放慢腳步，陪他一步一步地走，告訴他路邊每一種植物的名字。\n\n「這叫花楸，秋天的葉子會變成紅色。」\n\n「那個是白樺。夏天的時候，樹葉{茂る|しげる}得連陽光都照不進來。」\n\n他聽得很認真。\n\n晚上，他們住在半山腰的小屋裡。他坐在窗邊，看著遠處的山，很久沒有說話。\n\n「你在想什麼？」朝陽問。\n\n「在想，」他說，「我已經很多年，沒有這樣{悠々|ゆうゆう}地走路了。」\n\n他告訴她，他是一間大公司的社長。母親過世以後，他把自己埋在工作裡，連{葬式|そうしき}後的第一個週末，都在開會。\n\n「我一直往上爬。」他說，「爬到了公司的頂端，卻覺得什麼都沒有。」\n\n朝陽看著他，輕聲說：「山頂的風景，要一個人看，很寂寞。」\n\n---\n\n第二天{夜明け|よあけ}前，凌晨三點，他們出發了。\n\n天還是黑的。山路上起了{霧|きり}，冷得手指都{しびれる}了。\n\n他走得很吃力，好幾次{足元|あしもと}一滑，差點跌倒。每一次，朝陽都會伸手拉住他。\n\n快到山頂的時候，他停下來，喘著氣說：「我好像，走不動了。」\n\n「再一下就好。」朝陽握住他的手，「我陪你。」\n\n---\n\n清晨快六點，他們站上了山頂。\n\n霧散了，空氣{透き通る|すきとおる}。\n\n遠方的地平線上，一道金色的光，慢慢地升了起來。\n\n整片雲海被染成了金色，紅葉在晨光裡{輝く|かがやく}著。\n\n鷲宮伊吹看著那片光，眼淚無聲地掉了下來。\n\n「好美。」他說。\n\n「嗯。」朝陽說，「你母親說得沒錯。」\n\n他轉過頭，看著她。陽光{照らす|てらす}在她的臉上，比日出還要耀眼。\n\n「[[〈君:きみ〉がいてこそ、この〈景色:けしき〉が〈見:み〉られた。::有妳在，我才看得到這片風景。]]」\n\n「一個人來的話，我第一天就放棄了。」\n\n朝陽的臉紅了。\n\n「我母親還說過一句話，」他說，「她說，『如果你遇到一個願意陪你走慢一點的人，就不要放手。』」\n\n他握住她的手，低頭吻了她。山頂的風很冷，他的吻很暖。\n\n「[[〈来年:らいねん〉も、〈君:きみ〉と〈登:のぼ〉りたい。::明年，我還想跟妳一起爬山。]]」\n\n「只有明年嗎？」\n\n「每一年。」他說，「直到我們都走不動為止。」", "blurb": "包下三天登山行程的神祕客人，只想看一次日出。", "gram": {"pt": "〜てこそ", "me function streak(){let n=0,d=new Date(); const has=x=>P.days.includes(x.toISOString().slice(0,10));
  const f=x=>{const y=new Date(x.getTime()-x.getTimezoneOffset()*6e4);return has(y)};
  if(!f(d)) d.setDate(d.getDate()-1); while(f(d)){n++; d.setDate(d.getDate()-1)} return n}

/* ---------- 文字呈現 ---------- */
const disp=k=>D[k].w||k;
const kanaLine=t=>t.replace(RB,(m,a,r)=>r);

function wordHTML(s,r,k){
  const e=D[k]; const g = e.zh===s||e.zh===k ? '' : `<span class="g">（${e.zh}）</span>`;
  const inner = !r ? s : P.mode==='kana' ? r : `<ruby>${s}<rt>${r}</rt></ruby>`;
  return `<span class="w${P.book.includes(k)?' saved-w':''}" tabindex="0" role="button" data-k="${k}" data-s="${esc(s)}">${inner}</span>${g}`;
}
function renderBody(txt){
  return txt.split(/\n\s*\n/).map((p,i)=>{
    if(p.trim()==='---') return '<hr>';
    let h=''; let last=0; const re=/\[\[(.+?)::(.+?)\]\]|\{([^{}|]+)(?:\|([^{}|]+))?(?:\|([^{}|]+))?\}/g; let m;
    while((m=re.exec(p))){ h+=esc(p.slice(last,m.index)); last=re.lastIndex;
      if(m[1]) h+=`<span class="jl" role="button" tabindex="0" data-say="${esc(kanaLine(m[1]))}">${rubyLine(m[1])}</span><span class="jlz">（${esc(m[2])}）</span>`;
      else h+=wordHTML(m[3],m[4],m[5]||m[3]); }
    h+=esc(p.slice(last));
    return `<p data-p="${i}">${h}</p>`;
  }).join('');
}
function wordsOf(s){const o=[];for(const m of s.text.matchAll(TOK)){const k=m[3]||m[1]; if(!o.includes(k)) o.push(k)} return o}
function linesOf(s){return [...s.text.matchAll(JA)].map(m=>({ja:m[1],zh:m[2]}))}

/* ---------- 動詞變化 ---------- */
const A={'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
const I={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
const TE={'う':'って','つ':'って','る':'って','む':'んで','ぶ':'んで','ぬ':'んで','く':'いて','ぐ':'いで','す':'して'};
function conj(w,vt){const st=w.slice(0,-1),u=w.slice(-1);
  if(vt==='v1') return {'ます形':st+'ます','て形':st+'て','ない形':st+'ない','た形':st+'た'};
  const te=(w==='行く')?st+'って':st+TE[u];
  return {'ます形':st+I[u]+'ます','て形':te,'ない形':st+A[u]+'ない','た形':te.replace(/て$/,'た').replace(/で$/,'だ')};}

/* ---------- 語音 ---------- */
let VO=[];
function loadV(){try{VO=speechSynthesis.getVoices()}catch(e){VO=[]}}
loadV(); try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
const rank=v=>(/natural|online|google|neural|premium|enhanced/i.test(v.name)?0:1)+(/kyoko|nanami|haruka|otoya|mizuki|ayumi/i.test(v.name)?-0.5:0);
function voiceFor(lang){loadV(); const L=VO.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang)); return L.sort((a,b)=>rank(a)-rank(b))[0]||null}
function jaVoice(){return voiceFor('ja')}
function zhVoice(){return voiceFor('zh-tw')||voiceFor('zh-hk')||voiceFor('zh')}
function utt(text,lang,rate){const u=new SpeechSynthesisUtterance(text); u.rate=rate||.9;
  if(lang==='ja'){u.lang='ja-JP'; const v=jaVoice(); if(v) u.voice=v} else {u.lang='zh-TW'; const v=zhVoice(); if(v) u.voice=v}
  return u}
function noJa(){ if(jaVoice()) return false; showTip(); return true }
function sayJa(t){ try{ stopRead(); speechSynthesis.cancel(); if(noJa()) return; speechSynthesis.speak(utt(t,'ja',.85)) }catch(e){} }

/* 全文朗讀：中文用中文語音、日文用日文語音（讀假名，確保讀音正確） */
let RD=null;
function segs(s){const out=[]; s.text.split(/\n\s*\n/).forEach((p,i)=>{ if(p.trim()==='---') return;
  const re=/\[\[(.+?)::(.+?)\]\]|\{([^{}|]+)(?:\|([^{}|]+))?(?:\|([^{}|]+))?\}/g; let m,last=0;
  const push=(t,l)=>{t=t.replace(/[「」『』——…]/g,' ').trim(); if(t) out.push({t,l,p:i})};
  while((m=re.exec(p))){ push(p.slice(last,m.index),'zh'); last=re.lastIndex;
    if(m[1]) push(kanaLine(m[1]),'ja'); else push(m[4]||m[3],'ja'); }
  push(p.slice(last),'zh'); }); return out}
function startRead(){ if(noJa()) return; const s=S.find(x=>x.id===st.sid); stopRead();
  RD={q:segs(s),i:0,on:true}; gcEv('jp-read-'+s.id); P.heard[s.id]=1; save(); next(); player()}
function next(){ if(!RD||!RD.on) return; if(RD.i>=RD.q.length){stopRead(); render(); return}
  const g=RD.q[RD.i]; document.querySelectorAll('.story p').forEach(p=>p.classList.toggle('reading',+p.dataset.p===g.p));
  const u=utt(g.t,g.l,g.l==='ja'?.85:1.05); u.onend=()=>{if(RD&&RD.on){RD.i++; next()}}; u.onerror=u.onend;
  try{speechSynthesis.speak(u)}catch(e){} }
function stopRead(){ if(RD){RD.on=false; RD=null} try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll('.story p.reading').forEach(p=>p.classList.remove('reading')); player()}
function player(){ $('#playerRoot').innerHTML = RD? `<div class="player"><div>🔊 朗讀中…<button id="stopR">停止</button></div></div>`:'' }

/* ---------- 單字卡（遺忘曲線） ---------- */
const IV=[1,3,14];      // 可選的複習間隔（天）
const GRAD=28;         // 間隔 ≥28 天算熟記
function nextIv(c,g){const d=IV[g-1]; return (g===3&&c&&c.iv>=14)?c.iv*2:d}
const NEW_PER_DAY=20;
const LVNAME={'N5-N4':'N5–N4 新進員工','N3-N2':'N3–N2 總裁夫人候選'};
function addDays(n){const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function deckWords(lv){const o=[]; const seen=new Set();
  const rd=lvStories(lv).filter(s=>P.done[s.id]||P.quiz[s.id]), un=lvStories(lv).filter(s=>!(P.done[s.id]||P.quiz[s.id]));
  P.book.forEach(k=>{ if(D[k]&&!seen.has(k)&&lvStories(lv).some(s=>wordsOf(s).includes(k))){seen.add(k);o.push(k)} });
  [...rd,...un].forEach(s=>wordsOf(s).forEach(k=>{ if(D[k]&&!seen.has(k)){seen.add(k);o.push(k)} }));
  return o}
function deckStat(lv){const t=today(), W=deckWords(lv); let due=0,learned=0,grad=0;
  W.forEach(k=>{const c=P.srs[k]; if(!c) return; learned++; if(c.iv>=GRAD) grad++; if(c.due<=t) due++});
  const nd=(P.srsNew[lv]&&P.srsNew[lv].d===t)?P.srsNew[lv].n:0;
  const fresh=Math.min(NEW_PER_DAY-nd, W.filter(k=>!P.srs[k]).length);
  return {total:W.length,due,learned,grad,fresh:Math.max(0,fresh)}}
let FC=null;
function startDeck(lv){const t=today(), W=deckWords(lv);
  const due=W.filter(k=>P.srs[k]&&P.srs[k].due<=t).sort((a,b)=>P.srs[a].due<P.srs[b].due?-1:1);
  const st0=deckStat(lv); const fresh=W.filter(k=>!P.srs[k]).slice(0,st0.fresh);
  FC={lv,q:[...shuffle(due),...fresh],i:0,flip:false,done:0,again:0,total:due.length+fresh.length};
  st.view='cards'; gcEv('jp-cards-'+lv); render(); window.scrollTo(0,0)}
function gradeCard(g){const k=FC.q[FC.i]; const t=today(); const c=P.srs[k]||{b:0,iv:0,due:t,n:0}; const isNew=!P.srs[k];
  if(isNew){ const r=P.srsNew[FC.lv]; P.srsNew[FC.lv]=(r&&r.d===t)?{d:t,n:r.n+1}:{d:t,n:1} }
  c.n++;
  if(g===0){ c.b=0; c.iv=0; c.due=t; FC.q.push(k); FC.again++ }
  else { c.iv=nextIv(c,g); c.b=g; c.due=addDays(c.iv) }
  P.srs[k]=c; save(); FC.i++; FC.flip=false; if(g>0) FC.done++;
  if(FC.i>=FC.q.length) checkin();
  render()}
function deckBox(lv){const x=deckStat(lv), n=x.due+x.fresh;
  return `<div class="deck"><b>${LVNAME[lv].split(' ')[0]}</b><small>${LVNAME[lv].split(' ')[1]}・${x.total} 字</small>
    <div class="nums"><span>待複習<br><em>${x.due}</em></span><span>新卡<br><em>${x.fresh}</em></span><span>已熟記<br><em>${x.grad}</em></span></div>
    <button class="go2" data-deck="${lv}"${n?'':' disabled'}>${n?'開始複習 ›':'今天背完了'}</button></div>`}
function cardsView(){
  if(!FC){st.view='book'; return bookView()}
  const head=`<button class="back" data-tab="book">‹ 回生字本</button>`;
  if(FC.i>=FC.q.length){
    $('#app').innerHTML=`${head}<div class="emptyboss"><img class="${iflip('hero')}" src="${isrc('hero')}" alt=""><b style="color:var(--ink);font-size:18px">${FC.total?'不錯。今天的份，背完了。':'今天沒有要背的。'}</b>
      <span>${FC.total?`複習 ${FC.total} 張${FC.again?`，按了 ${FC.again} 次再複習也都補回來了`:''}。時間到了我會再考妳。`:'去讀一篇新故事，我再幫妳排新卡。'}</span>
      <button class="btn" data-tab="book">回生字本</button></div>`; return}
  const k=FC.q[FC.i], e=D[k], pct=Math.round(FC.i/FC.q.length*100);
  const word=P.mode==='kana'?esc(e.r):`<ruby>${esc(disp(k))}<rt>${esc(e.r)}</rt></ruby>`;
  const front=P.mode==='kana'?esc(e.r):esc(disp(k));
  $('#app').innerHTML=`${head}
  <div class="fcbar"><span>${LVNAME[FC.lv].split(' ')[0]}</span><span class="prog"><i style="width:${pct}%"></i></span><span>${FC.i+1} / ${FC.q.length}</span></div>
  <div class="fc">${FC.flip?`<div class="big">${word}</div><div class="zh">${esc(e.zh)}</div><div class="pos">${esc(e.pos)}・${esc(e.lv)}</div>
      <button class="fcsay" data-say="${esc(e.r)}">🔊 聽發音</button>
      <div class="ex">${rubyEx(e.ex)}<small>${esc(e.exzh)}</small></div>`
    :`<div class="pos">這個字，什麼意思？</div><div class="big">${front}</div><button class="fcsay" data-say="${esc(e.r)}">🔊</button>`}</div>
  ${FC.flip?`<div class="grade"><button class="g0" data-grade="0">再複習<small>這輪再考</small></button><button class="g1" data-grade="1">1 天<small>明天再考</small></button><button class="g2" data-grade="2">3 天<small>3 天後</small></button><button class="g3" data-grade="3">${(()=>{const n=nextIv(P.srs[k],3);return n+' 天<small>'+(n>14?'越記越久':'兩週後')+'</small>'})()}</button></div>`
    :`<button class="btn flipb" id="fcFlip">翻面看答案</button>`}`;
}

const SITE='https://boss-nihongo.github.io/';
let SH=null;
function bossList(){const o=[]; S.forEach(s=>linesOf(s).forEach(l=>o.push({s,l}))); return o}
function pickBoss(sid,avoid){const all=bossList(); let c=all.filter(x=>(!sid||x.s.id===sid)&&x!==avoid); if(!c.length) c=all.filter(x=>x!==avoid);
  return c[Math.floor(Math.random()*c.length)]}
function nextBoss(){const all=bossList(); const others=all.filter(x=>x.s.id!==SH.cur.s.id); return others[Math.floor(Math.random()*others.length)]}
function rtoks(t){const o=[]; let last=0; t.replace(/〈([^:〉]+):([^〉]+)〉/g,(m,a,r,i)=>{ for(const ch of t.slice(last,i)) o.push({t:ch}); o.push({t:a,r}); last=i+m.length; return m});
  for(const ch of t.slice(last)) o.push({t:ch}); return o}
function wrapR(ctx,toks,fs,max){ctx.font=`700 ${fs}px "Shippori Mincho B1","Noto Serif CJK JP",serif`; const rf=Math.round(fs*.36);
  const L=[[]]; let w=0; for(const k of toks){ const tw=ctx.measureText(k.t).width; ctx.font=`500 ${rf}px "Noto Sans TC",sans-serif`;
    const rw=k.r?ctx.measureText(k.r).width:0; ctx.font=`700 ${fs}px "Shippori Mincho B1","Noto Serif CJK JP",serif`;
    const kw=Math.max(tw,rw); if(w+kw>max && L[L.length-1].length && !/^[。、」]$/.test(k.t)){L.push([]); w=0} L[L.length-1].push({...k,tw,kw}); w+=kw }
  return {L,rf}}
async function drawCard(cur){
  try{await Promise.all(['800 80px "Shippori Mincho B1"','700 60px "Shippori Mincho B1"','500 30px "Noto Sans TC"','700 30px "Noto Sans TC"'].map(f=>document.fonts.load(f,'霸總日本語あ')))}catch(e){}
  const W=1080,H=1350,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); const b=cur.s.boss;
  const g=x.createLinearGradient(0,0,W*.6,H); g.addColorStop(0,b.c1); g.addColorStop(1,b.c2); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(255,255,255,.07)'; x.lineWidth=4;
  for(let yy=80;yy<H+80;yy+=80) for(let xx=(yy/80%2)*80;xx<W+160;xx+=160) for(const r of [36,54,72]){x.beginPath(); x.arc(xx,yy,r,Math.PI,2*Math.PI); x.stroke()}
  x.fillStyle='rgba(255,255,255,.10)'; x.font='800 640px "Shippori Mincho B1","Noto Serif CJK JP",serif'; x.textAlign='right'; x.textBaseline='alphabetic'; x.fillText(b.mark,W+40,700);
  try{ const im=new Image(); im.src=isrc(cur.s.id); await im.decode(); const h=640, w=im.width*h/im.height; x.save(); x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=30; if(iflip(cur.s.id)){x.translate(990,0); x.scale(-1,1); x.drawImage(im,0,40,w,h)} else x.drawImage(im,990-w,40,w,h); x.restore() }catch(e){}
  x.textAlign='left'; x.fillStyle='#fff';
  x.font='700 30px "Noto Sans TC",sans-serif'; const tag='霸總教你背日本語'; const tw=x.measureText(tag).width;
  x.strokeStyle='rgba(255,255,255,.9)'; x.lineWidth=3; x.beginPath(); x.roundRect(84,80,tw+56,62,31); x.stroke(); x.fillText(tag,112,122);
  x.font='500 32px "Noto Sans TC",sans-serif'; x.globalAlpha=.85; x.fillText('今天教你日文的霸總',84,260); x.globalAlpha=1;
  x.font='800 96px "Shippori Mincho B1","Noto Serif TC",serif'; x.fillText(b.name,84,370);
  if(b.yomi){x.font='500 34px "Noto Sans TC",sans-serif'; x.fillStyle='#bcd6f7'; x.fillText(b.yomi,88,425)}
  // 台詞卡
  const bx=84,by=500,bw=W-168; let fs=72; let lay; do{lay=wrapR(x,rtoks(cur.l.ja),fs,bw-112); fs-=4}while(lay.L.length>2&&fs>44); fs+=4;
  const lh=fs*1.95, bh=110+lay.L.length*lh+70;
  x.fillStyle='rgba(255,255,255,.97)'; x.shadowColor='rgba(0,0,0,.25)'; x.shadowBlur=50; x.shadowOffsetY=24; x.beginPath(); x.roundRect(bx,by,bw,bh,32); x.fill(); x.shadowColor='transparent';
  let yy=by+60+fs*1.25;
  for(const line of lay.L){ let xx=bx+56; for(const k of line){ x.fillStyle='#0e1d36'; x.font=`700 ${fs}px "Shippori Mincho B1","Noto Serif CJK JP",serif`; x.fillText(k.t,xx+(k.kw-k.tw)/2,yy);
      if(k.r){x.fillStyle='#3b7bc9'; x.font=`500 ${lay.rf}px "Noto Sans TC",sans-serif`; const rw=x.measureText(k.r).width; x.fillText(k.r,xx+(k.kw-rw)/2,yy-fs*.98)}
      xx+=k.kw } yy+=lh }
  x.fillStyle='#1d5fbf'; x.font='700 40px "Noto Sans TC",sans-serif'; x.fillText(cur.l.zh,bx+56,by+bh-56);
  // 出處
  x.fillStyle='#fff'; x.font='500 32px "Noto Sans TC",sans-serif'; x.globalAlpha=.9;
  x.fillText(`出自《${cur.s.title}》・${LV[cur.s.band][0]}`,84,by+bh+80); x.globalAlpha=1;
  x.font='500 34px "Noto Sans TC",sans-serif'; x.globalAlpha=.8; let ln='',ly=by+bh+150, n=0;
  for(const ch of cur.s.blurb){ if(x.measureText(ln+ch).width>W-168){ if(n<2&&ly<H-262) x.fillText(ln,84,ly); ln=ch; ly+=52; n++ } else ln+=ch }
  if(n<3&&ly<H-262) x.fillText(ln,84,ly); x.globalAlpha=1;
  // 底部
  x.fillStyle='rgba(255,255,255,.96)'; x.beginPath(); x.roundRect(84,H-230,W-168,140,26); x.fill();
  x.fillStyle='#4a5d78'; x.font='500 28px "Noto Sans TC",sans-serif'; x.fillText('看霸總小說，背日檢單字・免費閱讀',124,H-176);
  x.fillStyle='#0f3f86'; x.font='800 46px "Noto Sans TC",sans-serif'; x.fillText(SITE.replace('https://','').replace(/\/$/,''),124,H-118);
  return c}

document.addEventListener('click',ev=>{
  const sa=ev.target.closest('[data-shch]'); if(sa){gcEv('jp-share-'+sa.dataset.shch); return}
  const t=ev.target.closest('button,[data-k],[data-say],[data-close]'); if(!t) return;
  const d=t.dataset;
  if(d.close!==undefined){closeSheet(); return}
  if(d.say){ sayJa(d.say); if(d.g&&!P.gram[st.sid]){} return }
  if(d.save){const k=d.save; P.book=P.book.includes(k)?P.book.filter(x=>x!==k):[...P.book,k]; save(); closeSheet(); render(); return}
  if(d.k){sheet(d.k,d.s); return}
  if(d.tab){stopRead(); st.view=d.tab; QZ=null; if(d.tab!=='cards') FC=null; render(); window.scrollTo(0,0); return}
  if(d.lv){P.lv=d.lv; save(); render(); return}
  if(d.mode){P.mode=d.mode; save(); render(); return}
  if(d.gl){P.gl=d.gl==='1'; save(); render(); return}
  if(d.gltog!==undefined){P.gl=!P.gl; save(); render(); return}
  if(d.filter){st.filter=d.filter; render(); return}
  if(d.deck){startDeck(d.deck); return}
  if(d.grade!==undefined&&FC){gradeCard(+d.grade); return}
  if(d.sid){gcEv('jp-open-'+d.sid); st.sid=d.sid; st.view='reader'; QZ=null; render(); return}
  if(d.opt){ if(QZ.ans) return; const q=QZ.qs[QZ.i]; QZ.ans=d.opt; const ok=d.opt===q.k; if(ok) QZ.ok++; else if(!P.book.includes(q.k)){P.book.push(q.k); save()}
     quiz(S.find(x=>x.id===st.sid)); setTimeout(()=>{QZ.i++; QZ.ans=null;
       if(QZ.i>=QZ.qs.length && QZ.ok===3){P.quiz[st.sid]=1; P.done[st.sid]=today(); checkin(); gcEv('jp-done-'+st.sid)}
       quiz(S.find(x=>x.id===st.sid))},900); return }
  switch(t.id){
    case 'back': stopRead(); st.view='home'; render(); break;
    case 'readAll': RD? stopRead() : startRead(); break;
    case 'stopR': stopRead(); break;
    case 'gramOk': P.gram[st.sid]=1; save(); t.textContent='✓ 已學會這個句型'; break;
    case 'addAll': {const s=S.find(x=>x.id===st.sid); wordsOf(s).forEach(k=>{if(!P.book.includes(k)) P.book.push(k)}); save(); render(); break}
    case 'sayAll': sayWords(wordsOf(S.find(x=>x.id===st.sid))); break;
    case 'sayBook': sayWords(P.book.filter(k=>D[k])); break;
    case 'shareBtn': openShare(st.sid); break;
    case 'shareHome': openShare(null); break;
    case 'shNext': SH.cur=nextBoss(); renderShare(); break;
    case 'shImg': shareImg(); break;
    case 'shCopy': copyShare(); break;
    case 'markRead': if(P.done[st.sid]){delete P.done[st.sid]} else {P.done[st.sid]=today(); checkin(); gcEv('jp-mark-'+st.sid)} save(); {const y=window.scrollY; render(); window.scrollTo(0,y)} break;
    case 'fcFlip': FC.flip=true; render(); break;
    case 'qAgain': QZ=null; quiz(S.find(x=>x.id===st.sid)); break;
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape') closeSheet();
  if(ev.key==='Enter'&&ev.target.dataset){ if(ev.target.dataset.k) sheet(ev.target.dataset.k,ev.target.dataset.s); else if(ev.target.dataset.say) sayJa(ev.target.dataset.say) }
});
render();
</script>
