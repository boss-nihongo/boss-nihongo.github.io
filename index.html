<style>
/* Layout: 單欄閱讀 App＋底部分頁；藍色調（藍染＋和紙） */
:root{
  --bg:#eef3f9; --paper:#fbfdff; --ink:#14233a; --mute:#5d6f88; --line:#d6e1ee;

  --ok:#1f8a5b; --sheet:#ffffff; --shadow:0 8px 24px rgba(20,50,100,.10);

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ok:#5fd29c; --sheet:#15223a; --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1524; --paper:#121e33; --ink:#e3ecf8; --mute:#93a6c2; --line:#22324d;
  --accent:#6aa8ff; --accent-2:#a9ccff; --soft:#1a2c4b; --rt:#8ab9f5; --chip:#1a2741;
  --ok:#5fd29c; --sheet:#15223a; --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.w:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}

.hero{display:grid;gap:6px;padding-block:6px 14px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,7.5vw,38px);line-height:1.2;margin:0}
h1 rt{font-size:.3em;color:var(--rt);font-family:var(--f-ui);font-weight:500;letter-spacing:.1em}
.tag{font-size:14px;color:var(--mute)}
.sec{display:grid;gap:10px;margin-block:18px}
.sec>h3{margin:0;font-size:13px;letter-spacing:.12em;color:var(--mute);font-weight:700}

.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.modebox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.modebox .lab{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.demo{font-family:var(--f-read);font-size:16px}

.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.lv b{font-family:var(--f-disp);font-size:22px}
.lv span{font-size:12px;color:var(--mute)}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.lv[aria-pressed="true"] b{color:var(--accent)}

.today{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:16px;padding:16px;display:grid;gap:8px;box-shadow:var(--shadow)}
:root[data-theme="dark"] .today{color:#0c1524}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .today{color:#0c1524}}
.today small{opacity:.85;font-size:12px;letter-spacing:.1em}
.tboss{position:absolute;right:-6px;bottom:0;height:112%;max-width:46%;object-fit:contain;object-position:bottom right;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));pointer-events:none}
.herobox{position:relative;min-height:250px;display:grid;align-content:center}
.herobox .txt{max-width:58%;display:grid;gap:8px;position:relative;z-index:1}
.heroimg{position:absolute;right:-8px;bottom:0;height:270px;max-width:46%;object-fit:contain;object-position:bottom right;pointer-events:none}
.bubble{position:absolute;right:30%;top:4px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:7px 12px;border-radius:14px 14px 4px 14px;z-index:2;box-shadow:var(--shadow);white-space:nowrap}
.flip{transform:scaleX(-1)}
.shoplogo{display:flex;justify-content:center;opacity:.8;font-size:12px;color:var(--mute);margin-top:22px}
.shoplogo a{display:inline-flex;align-items:center;gap:6px;color:inherit;text-decoration:none}
.shoplogo a:hover{text-decoration:underline}
.shoplogo img{border-radius:5px}
.herobox{padding-top:44px}.herobox .bubble{top:48px}
.toEn{position:absolute;top:6px;right:12px;z-index:3;background:rgba(255,255,255,.92);color:var(--ac,#2a5bd7);font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sharebox{display:grid;gap:12px;text-align:center;background:linear-gradient(135deg,#e8f0ff,#f7f9ff)}.sharebox b{display:block;font-size:17px;margin-bottom:4px}.sharebox span{font-size:14px;opacity:.8}
.sharebig{width:100%;padding:16px;font-size:17px}
.readbox{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.ava{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 4%;background:var(--soft);border:2px solid var(--line);flex:none}
.cardrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.bossbar{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end;background:linear-gradient(135deg,var(--soft),transparent);border-radius:16px;padding:10px 14px 0;margin-bottom:14px;overflow:hidden}
.bossbar img{height:150px;width:auto;object-fit:contain;display:block}
.bossbar .nm{font-family:var(--f-disp);font-size:24px;font-weight:800}
.bossbar .ym{color:var(--rt);font-size:13px}
.bossbar .ln{font-size:14px;color:var(--mute);padding-bottom:14px}
.qres{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.qres img{height:150px;width:auto}
.emptyboss{display:grid;justify-items:center;gap:8px;padding:20px 0;color:var(--mute);text-align:center}
.emptyboss img{height:200px}
@media (max-width:380px){.herobox .txt{max-width:64%}.bubble{right:22%}}
.today h2{margin:0;font-family:var(--f-disp);font-size:22px}
.today p{margin:0;font-size:14px;opacity:.92}
.today .go{justify-self:start;background:rgba(255,255,255,.95);color:#0f3f86;border:0;border-radius:99px;padding:8px 18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:12px;color:var(--mute)}
.how{display:grid;gap:6px;font-size:14px;color:var(--mute);margin:0;padding-left:20px}

.list{display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:grid;gap:6px}
.card h3{margin:0;font-family:var(--f-disp);font-size:19px}
.card p{margin:0;color:var(--mute);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;background:var(--chip);border-radius:99px;padding:2px 10px;color:var(--mute)}
.pill.ok{color:var(--ok);font-weight:700}
.pill.ac{color:var(--accent);background:var(--soft);font-weight:700}

/* 課表 */
.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.day .n{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--mute);font-size:12px;line-height:1.1;text-align:center}
.day.cur{border-color:var(--accent)} .day.cur .n{background:var(--accent);color:#fff}
.day.done .n{background:var(--soft);color:var(--ok)}
.day h4{margin:0;font-family:var(--f-disp);font-size:17px}
.tasks{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.tasks i{font-style:normal}
.tasks .y{color:var(--ok)}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.cal .hd{display:flex;justify-content:space-between;font-weight:700}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.grid7 .wd{color:var(--mute)}
.grid7 .d{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;max-width:100%}
.grid7 .d.on{background:var(--accent);color:#fff;font-weight:700}
.grid7 .d.td{outline:1.5px solid var(--accent)}

/* reader */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .row{display:flex;align-items:center;gap:8px}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.sp{flex:1}
.tg{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.story h2{font-family:var(--f-disp);font-size:27px;margin:4px 0 2px}
.story .sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.story p{font-family:var(--f-read);font-size:17px;line-height:2.2;margin:0 0 14px;border-radius:8px;transition:background .2s}
.story p.reading{background:var(--soft)}
.story hr{border:0;text-align:center;margin:20px 0}
.story hr::after{content:"◆ ◆ ◆";color:var(--accent);letter-spacing:.4em;font-size:10px}
.w{color:var(--accent);font-weight:600;cursor:pointer;border-bottom:1.5px dotted var(--accent);padding:0 1px}
.w rt,.jl rt,.ja rt{font-size:.55em;color:var(--rt);font-weight:500;font-family:var(--f-ui)}
.g{color:var(--mute);font-size:.82em}
.hide-g .g,.hide-g .jlz{display:none}
.saved-w{background:var(--soft)}
.jl{display:inline;background:var(--chip);border-radius:6px;padding:2px 6px;color:var(--accent-2);font-weight:600;cursor:pointer}
.jlz{color:var(--mute);font-size:.82em}

.box{margin-top:20px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.box h4{margin:0;font-family:var(--f-disp);font-size:18px;display:flex;align-items:center;gap:8px}
.box h4 .pill{font-family:var(--f-ui)}
.gram .pt{font-family:var(--f-disp);font-size:20px;color:var(--accent)}
.gram .how{font-size:14px;color:var(--mute)}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.ja{font-family:var(--f-read);font-size:17px;line-height:2}
.zh{color:var(--mute);font-size:14px}
.say{border:1px solid var(--line);background:var(--paper);border-radius:99px;width:38px;height:38px;display:grid;place-items:center;font-size:15px}
.vlist{display:grid}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border:0;border-top:1px solid var(--line);text-align:left;background:none}
.vrow:first-child{border-top:0}
.vrow .jp{font-family:var(--f-disp);font-size:18px;min-width:5.5em}
.vrow .jp small{display:block;font-size:11px;color:var(--rt);font-family:var(--f-ui)}
.vrow .lvp{font-size:11px;color:var(--mute)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.q{display:grid;gap:8px}
.q .qw{font-family:var(--f-disp);font-size:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;text-align:center}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:#c0392b;color:#c0392b}
.player{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.player>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 10px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:13px}
.player button{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:5px 12px;font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,35,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;display:grid;gap:10px;max-height:86vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.story p{transition:none}}
.sh-top{display:flex;align-items:flex-start;gap:10px}
.sh-word{font-family:var(--f-disp);font-size:34px;line-height:1.2}
.sh-read{color:var(--rt);font-size:15px}
.sh-zh{font-size:20px;font-weight:700}
.sh-ex{background:var(--chip);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.note{font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:8px 10px}
.conj{width:100%;border-collapse:collapse;font-size:14px}
.conj td{border-top:1px solid var(--line);padding:5px 4px}
.conj td:first-child{color:var(--mute);width:5.5em}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--mute);line-height:1}
.tip ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:5px max(8px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:150px;background:none;border:0;padding:6px 4px;border-radius:10px;font-weight:600;color:var(--mute);font-size:12px;display:grid;justify-items:center;gap:1px}
.tab b{font-size:18px;line-height:1.1;font-weight:400}
.tab[aria-selected="true"]{color:var(--accent);background:var(--soft)}
.empty{color:var(--mute);text-align:center;padding:40px 0;font-size:14px}
.foot{font-size:12px;color:var(--mute);text-align:center;margin-top:24px}
/* ---- 單字卡（遺忘曲線） ---- */
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px}
.deck b{font-family:var(--f-disp);font-size:17px}
.deck small{color:var(--mute);font-size:12px}
.deck .nums{display:flex;gap:10px;font-size:12px;color:var(--mute)}
.deck .nums em{font-style:normal;font-weight:700;color:var(--accent);font-size:16px;font-variant-numeric:tabular-nums}
.deck .go2{margin-top:4px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px;font-weight:700}
.deck .go2[disabled]{background:var(--chip);color:var(--mute)}
.fc{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:300px;padding:22px 18px;display:grid;align-content:center;justify-items:center;gap:12px;text-align:center}
.fc .big{font-family:var(--f-disp);font-size:40px;line-height:1.3}
.fc .big rt{font-size:.38em;color:var(--rt)}
.fc .rd{font-size:18px;color:var(--rt)}
.fc .zh{font-size:22px;font-weight:700}
.fc .pos{font-size:12px;color:var(--mute)}
.fc .ex{font-size:15px;line-height:1.9;border-top:1px dashed var(--line);padding-top:10px;width:100%}
.fc .ex rt{font-size:.55em;color:var(--rt)}
.fc .ex small{display:block;color:var(--mute)}
.fcbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:10px 0}
.fcbar .prog{flex:1;height:6px;background:var(--chip);border-radius:3px;margin:0 10px;overflow:hidden}
.fcbar .prog i{display:block;height:100%;background:var(--accent)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grade button{border:0;border-radius:12px;padding:12px 4px;font-weight:700;display:grid;gap:2px;color:#fff}

.curve{font-size:13px;color:var(--mute);line-height:1.7}
</style>

 "exzh": "他突然不說話了。", "vt": "v5", "lvsrc": "list"}}, "stories": [{"id": "A1", "title": "社長的遲到懲罰", "band": "N5-N4", "text": "東京，早上九點零三分。\n\n許念抱著一疊文件衝進九條集團的{会社|かいしゃ}大廳，高跟鞋在大理石地板上敲得又急又亂。來日本{仕事|しごと}的第一天，她就{遅刻|ちこく}了。\n\n電梯門打開，裡面只站著一個男人。\n\n黑色西裝，銀色袖扣，眉眼冷得像剛下過雪。他抬起手腕看了一眼{時計|とけい}，聲音不高，卻讓整個電梯降了三度：「三分鐘。」\n\n「對、對不起！我是新來的翻譯，許念——」\n\n「妳的{名前|なまえ}我知道。」男人往前一步，她下意識後退，背脊撞上冰涼的電梯{壁|かべ}。他單手撐在她耳側，低頭看她，「我是九條司，這間{会社|かいしゃ}的{社長|しゃちょう}。在我這裡，[[〈遅刻:ちこく〉は〈許:ゆる〉さない。::遲到，我不允許。]]第一次{遅刻|ちこく}，要受罰。」\n\n許念嚥了口口水。員工私下都說，九條社長是全東京最{怖い|こわい}的男人，三年開除了十七個助理。\n\n「什、什麼懲罰？」\n\n「從今天起，妳調到頂樓，當我的專屬翻譯。」他鬆開手，替她按下最高樓層，「{毎日|まいにち}早上八點，我要在辦公室看到妳，和一杯不加糖的{コーヒー}。」\n\n---\n\n頂樓的{仕事|しごと}比她想像中難上許多。\n\n九條司開{会議|かいぎ}從不看稿，日文、英文、中文來回切換，她翻得滿頭大汗；他卻總能在她卡住的那一秒，用筆尖輕敲她的{机|つくえ}，低聲提示一個字。\n\n「為什麼幫我？」有一次她忍不住問。\n\n「因為妳出錯，丟的是我的臉。」他頭也不抬。\n\n可那天晚上下起大雨，她站在公司門口等計程車，一把黑色的{傘|かさ}忽然遮到她頭頂。九條司的西裝肩膀溼了一半，語氣依舊冷淡：「上車。」\n\n「不用了，社長，我自己叫車就——」\n\n「{だめ}。」他打開車門，「我不說第二次。」\n\n車裡很安靜。雨刷一下一下地擺動，她偷偷看他的{顔|かお}，發現這個男人不說話的時候，其實比傳聞{優しい|やさしい}一點點。\n\n只有一點點。\n\n---\n\n一個月後，許念在茶水間聽見同事的閒話。\n\n「聽說社長只是拿她當擋箭牌，下個月就要跟大阪的千金訂婚了。」\n\n她握著杯子的手指發白。原來那些深夜的熱湯、雨天的傘，全都只是演給別人看的戲。\n\n當晚，她把辭職信放在九條司的桌上，用剛學會的日文，一字一字地說：「{辞めます|やめます|辞める}。」\n\n九條司看著那封信，沉默了很久，久到她以為他會簽字。\n\n然後他站起來，繞過辦公桌，把她逼到落地窗前。玻璃外是整個東京的夜景，玻璃內是他越來越近的呼吸。\n\n「誰准妳走了？」\n\n「社長要訂婚了，不需要擋箭牌——」\n\n「訂婚？」他低笑一聲，眼神卻危險得嚇人，「那是我母親安排的，我上週就拒絕了。妳寧願相信茶水間的{嘘|うそ}，也不肯來問我一句？」\n\n「我……」\n\n「許念，妳以為妳為什麼會被調到頂樓？」他捏住她的下巴，逼她抬頭，「三年前在台北的書展，妳替一個迷路的日本人翻譯了一整個下午。那個人是我。」\n\n她愣住了。\n\n「我等了妳三年，等到妳自己走進我的{会社|かいしゃ}。」他的聲音壓得很低，「妳現在說要走，我不{許す|ゆるす}。」\n\n「你這是……強迫。」\n\n「對。」他毫不心虛，「所以，給我一個{返事|へんじ}。留下來，當我的女人——還是讓我吻到妳點頭為止？」\n\n許念的臉一下子紅透了。她還沒開口，他已經低頭吻了上來，霸道、強勢，卻在最後一秒放輕了力道，像怕把她弄碎。\n\n很久以後，他才抵著她的額頭，用日文說出那句話：\n\n「[[ずっと〈前:まえ〉から〈好:す〉きだった。::我很早以前就喜歡妳了。]]」\n\n窗外的雨停了。許念聽懂了——那是她來日本後學會的、最想聽見的一句話。", "blurb": "來東京上班第一天就遲到三分鐘，冷血社長把她壁咚在電梯裡：「第一次遲到，要受罰。」", "gram": {"pt": "〜ない（否定形）", "mean": "不～；表示否定", "how": "五段動詞：う段→あ段＋ない（許す→許さない）；一段動詞：去る＋ない（食べる→食べない）", "ex": "〈遅刻:ちこく〉は〈許:ゆる〉さない。", "exzh": "遲到，我不允許。"}, "boss": {"name": "九條司", "yomi": "くじょう つかさ", "mark": "司", "c1": "#0b2550", "c2": "#1d5fbf"}}, {"id": "A2", "title": "社長住在我隔壁", "band": "N5-N4", "text": "搬到東京的第一晚，林小滿就被鄰居投訴了。\n\n她的新{部屋|へや}只有六坪，一張床、一張小桌子，還有一臺會嗡嗡叫的{冷蔵庫|れいぞうこ}。晚上十一點，她正跟著手機{歌う|うたう}，門鈴響了。\n\n門外站著一個男人。白襯衫，袖子捲到手肘，頭髮還滴著水，臉色比東京十一月的夜晚還冷。\n\n「{隣|となり}的。」他只說了三個字，接著用日文補上一句：「[[〈静:しず〉かにしてください。::請安靜一點。]]」\n\n「啊，對不起！」小滿慌張地鞠躬。男人看了她一眼，關上了門。\n\n---\n\n接下來一個禮拜，小滿每天都很小心，整層樓{静か|しずか}得可怕。一個人在東京，其實有點{寂しい|さびしい}。\n\n週五晚上，她發燒了。{熱|ねつ}來得又急又猛，{薬|くすり}剛好吃完，便利商店在八百公尺外，她連站都站不穩。\n\n她扶著牆走出門，下一秒，整個人撞進一個硬邦邦的懷裡。\n\n「妳要去哪裡？」是隔壁的男人。\n\n「買{薬|くすり}……」\n\n他摸了一下她的額頭，眉頭立刻皺起來：「這叫{大丈夫|だいじょうぶ}？」\n\n不等她回答，他直接把她抱回{部屋|へや}，放回床鋪：「躺好，不准動。要不要去看{医者|いしゃ}？」\n\n「不用……睡一覺就好。」\n\n二十分鐘後，他提著一袋藥和食材回來，在她那間小小的廚房裡煮了一鍋粥。{料理|りょうり}的香味飄滿整個房間。\n\n「你為什麼對我這麼好？」\n\n「妳太吵了。」他把湯匙塞進她手裡，「{病気|びょうき}的時候更吵。」\n\n可是那一夜，他一直坐在床邊，直到她睡著。隔天早上，桌上放著一份還溫熱的{朝ご飯|あさごはん}，和一張紙條：「不准再半夜出門。」\n\n---\n\n星期一，小滿第一次走進新公司的會議室，差點把手上的資料掉在地上。\n\n坐在主位上、被所有人稱為「鷹野社長」的男人，正是她的隔壁鄰居。\n\n散會後，他把她叫進辦公室，關上門。\n\n「社長，週末的事……謝謝您。」她低著頭，「我找到新房子了，下個月就搬走，不會再吵到您。您不用{心配|しんぱい}。」\n\n鷹野湊的眼神一下子沉了。他走過來，一手撐在她身後的門上，把她困在門和他之間。\n\n「搬走？」他重複這兩個字，聲音危險得讓人發抖，「誰准了？」\n\n「那是我的自由——」\n\n「那棟公寓是我的。」他低頭，近到她能看見他睫毛的影子，「妳以為，看得到東京鐵塔的房間，房租為什麼那麼便宜？」\n\n小滿愣住了。\n\n「半年前，妳在面試時說，想住在看得到東京鐵塔的地方。」他說，「我把頂樓那間空下來，等了妳半年。結果妳搬來第一天，就在我隔壁唱了三個小時的歌。」\n\n她的{顔|かお}紅得像要燒起來：「那、那你可以直接告訴我……」\n\n「告訴妳，妳會跑。」他捏起她的下巴，「就像現在這樣。」\n\n然後他吻了她。很輕，卻不容拒絕，像那晚他一口一口餵她喝粥一樣，溫柔得霸道。\n\n「[[もう〈逃:に〉がさない。::我不會再讓妳逃走了。]]」他抵著她的額頭，「妳房間的{鍵|かぎ}，我也有一把。以後不准半夜唱歌——除非，唱給我一個人聽。」", "blurb": "半夜唱歌被隔壁投訴，發燒時卻是他抱她回房煮粥。星期一，她發現鄰居就是自家社長。", "gram": {"pt": "〜てください", "mean": "請～（請求、指示）", "how": "動詞て形＋ください（する→して→してください）", "ex": "〈静:しず〉かにしてください。", "exzh": "請安靜一點。"}, "boss": {"name": "鷹野湊", "yomi": "たかの みなと", "mark": "湊", "c1": "#0b3346", "c2": "#1f86a8"}}, {"id": "A3", "title": "總裁的蛋糕考驗", "band": "N5-N4", "text": "京都，鴨川旁邊有一間小小的{喫茶店|きっさてん}。\n\n陳小柔在這裡打工三個月，最怕的不是洗碗，而是那個男人。\n\n他{毎朝|まいあさ}八點準時出現，永遠坐靠窗的同一個{席|せき}，點一杯黑咖啡和一塊店裡最{高い|たかい}的草莓蛋糕。然後吃一口，皺眉，放下叉子。\n\n「太{甘い|あまい}。」\n\n連續三十天，同一句話。\n\n第三十一天，小柔終於忍不住了。她把蛋糕重重放在他面前：「客人，嫌{甘い|あまい}的話，可以不要點。」\n\n男人抬起頭。西裝筆挺，眼神冷淡，薄唇勾起一點點弧度：「妳做的？」\n\n「……是。」\n\n「那我更要點。」他把整塊蛋糕推回她面前，「做到我說{美味しい|おいしい}為止。」\n\n---\n\n從那天起，小柔每天下班都留在店裡練習。少放一點{砂糖|さとう}，多加一點{牛乳|ぎゅうにゅう}，烤壞了就重來。手被烤盤燙得好{痛い|いたい}，她也不肯停。\n\n她不知道，{毎晩|まいばん}，那個男人都坐在對街的車裡，看著店裡那盞最晚熄的燈。\n\n第六十天，她端出一塊淡粉色的蛋糕。\n\n男人吃了一口，沉默很久。\n\n「怎麼樣？」她緊張得手心冒汗。\n\n他放下叉子，聲音很低：「{美味しい|おいしい}。」\n\n那一瞬間，小柔{嬉しい|うれしい}得差點跳起來，對他露出了一個大大的笑容。\n\n男人愣了一下，耳朵慢慢紅了。\n\n---\n\n可是隔天，一個年輕的大學生來店裡，跟小柔聊了好久的蛋糕，她也{笑う|わらう}得很開心。\n\n靠窗的{席|せき}上，那個男人的咖啡一口都沒喝。\n\n打烊的時候，店門被推開。男人走進來，把「本日包場」的牌子掛在門上，反手鎖門。\n\n「客人，我們打烊了——」\n\n「這間店，」他一步一步走過來，把她逼到吧檯後面，雙手撐在她身體兩側，「上個月我已經買下來了。今天起，妳只能做蛋糕給我一個人吃。」\n\n「你、你說什麼？」\n\n「妳對那個學生笑了十一次。」他低頭看她，眼神黑得嚇人，「[[〈君:きみ〉の〈笑顔:えがお〉は〈俺:おれ〉だけのものだ。::妳的笑容，只屬於我。]]」\n\n小柔的心跳快得不像話：「你憑什麼……」\n\n他從西裝口袋拿出一個小小的{箱|はこ}，放在吧檯上。裡面是一條項鍊，墜子是一塊小小的草莓蛋糕。\n\n「今天是妳的{誕生日|たんじょうび}。」他說，「三個月前，妳在店門口{泣く|なく}，說來京都的第一個生日，沒有人記得。」\n\n小柔的眼眶一下子紅了。原來他每天早上來，不是為了蛋糕。\n\n「所以，」他抬起她的下巴，語氣又霸道起來，「以後的每一個{誕生日|たんじょうび}，都由我來記。[[〈君:きみ〉が〈作:つく〉ったケーキが〈食:た〉べたい。::我想吃妳做的蛋糕。]]一輩子。」\n\n她紅著{顔|かお}，還沒想好怎麼回答，他已經低頭吻了下來。\n\n那個吻，帶著一點點草莓的香味。\n\n一點也不膩——是剛剛好的甜。", "blurb": "每天早上準時來嫌蛋糕太甜的男人，在她生日那天包下整間店：「妳的笑容只屬於我。」", "gram": {"pt": "〜たい", "mean": "想要～", "how": "動詞ます形去ます＋たい（食べます→食べたい）；想要的東西可用「が」", "ex": "〈君:きみ〉が〈作:つく〉ったケーキが〈食:た〉べたい。", "exzh": "我想吃妳做的蛋糕。"}, "boss": {"name": "咖啡廳的總裁", "yomi": "", "mark": "甘", "c1": "#1e2a5c", "c2": "#5b6fd3"}}, {"id": "A4", "title": "總裁的北海道導遊", "band": "N5-N4", "text": "二月的北海道，{雪|ゆき}下得像不會停。\n\n周以寧在新千歲{空港|くうこう}舉著牌子，等她這次的客人。{飛行機|ひこうき}晚了一個小時，她要接的是——白石集團的總裁，白石嶺。旅行社的主管再三交代：「他很難搞，千萬不要惹他生氣。」\n\n一個穿黑色大衣的男人推著{荷物|にもつ}走出來，看了一眼她手上的牌子，又看了一眼她。\n\n「妳就是導遊？」\n\n「是的！白石先生，接下來五天的{予定|よてい}我都排好了——」\n\n「我不需要{予定|よてい}。」他把行李交給她，「我去哪裡，妳跟著就好。」\n\n---\n\n第一天，她攤開{地図|ちず}想介紹景點，他卻把她排好的行程全部跳過，只讓她{案内|あんない}一條沒有遊客的小路。\n\n第二天，他在小樽運河邊站了一個小時，什麼也不做，只叫她站在旁邊。\n\n「白石先生，這裡很{寒い|さむい}，我們要不要先進去？」\n\n他看了她凍紅的手一眼，把自己的{手袋|てぶくろ}脫下來，丟給她：「戴上。」\n\n「那你呢？」\n\n「我不冷。」\n\n明明他的手指也凍得發白。\n\n---\n\n第三天，暴風雪來了。\n\n往札幌的{電車|でんしゃ}全部停駛，{駅|えき}裡擠滿了人。以寧急得一直打電話，終於訂到附近一間小旅館——只剩一間房。\n\n「我睡大廳的沙發就好！」她說。\n\n「妳敢。」白石嶺接過{鍵|かぎ}，「這種天氣，女生一個人睡大廳太{危ない|あぶない}了。」\n\n那天晚上，他把床讓給她，自己靠在窗邊的椅子上。窗外是滿天的{星|ほし}，雪停了，世界安靜得只剩下兩個人的呼吸。\n\n「你為什麼要來北海道？」她忍不住問，「你明明不想看景點。」\n\n他沉默了很久，才從手機裡翻出一張{写真|しゃしん}。\n\n照片上是十年前的小樽運河。一個穿著高中制服的女孩，把自己的圍巾圍在一個坐在路邊、{疲れる|つかれる}到睡著的少年身上。\n\n「那天我離家出走，身上一毛錢都沒有。」他說，「醒來的時候，只有一條圍巾，和一張寫著『加油』的紙條。」\n\n以寧睜大了眼睛。那條圍巾，是她媽媽織的，她找了好久。\n\n「我找了妳十年。」白石嶺站起來，走到床邊，「上個月，終於在旅行社的網站上看到妳的照片。」\n\n「所以……你指定我當導遊？」\n\n「不然呢？」他低頭看她，眼神燙得驚人，「妳以為我是來看{雪|ゆき}的？」\n\n她往後縮，背卻碰到了冰冷的牆。他單手撐在她耳邊，把她圈在自己的影子裡。\n\n「白石先生，我們的合約只有五天……」\n\n「那就改。」他說，「[[〈俺:おれ〉から〈離:はな〉れないで。::不准離開我身邊。]]這不是請求，是命令。」\n\n她的心跳亂得一塌糊塗。\n\n他低頭吻住她，吻得很慢，像要把這十年的等待一次討回來。\n\n吻完，他握住她冰涼的手，十指緊扣。他的掌心很{暖かい|あたたかい}。「[[〈寒:さむ〉いなら、〈俺:おれ〉の〈手:て〉を〈握:にぎ〉っていろ。::冷的話，就握緊我的手。]]」\n\n窗外，北海道的雪又開始下了。這一次，她一點也不覺得{寒い|さむい}。", "blurb": "暴風雪困住北海道，只剩一間房。難搞的總裁客人說：「妳以為我是來看雪的？」", "gram": {"pt": "〜ないで", "mean": "不要～（請求對方別做）", "how": "動詞ない形＋で（離れる→離れない→離れないで）", "ex": "〈俺:おれ〉から〈離:はな〉れないで。", "exzh": "不准離開我身邊。"}, "boss": {"name": "白石嶺", "yomi": "しらいし れい", "mark": "嶺", "c1": "#16385e", "c2": "#5d9fd8"}}, {"id": "A5", "title": "總裁的中文家教", "band": "N5-N4", "text": "東京，六本木最高的那間{レストラン}。\n\n林知恩坐在靠窗的位子，緊張得一直喝水。她是來面試的——工作內容是「{毎週|まいしゅう}兩次，教一位企業家中文」，時薪高得離譜。\n\n對面的男人慢慢搖晃著{ワイン}杯。黑色西裝，領口鬆開一顆扣子，眼神慵懶又危險。\n\n「神崎遼。」他說，「從今天起，妳是我的中文{先生|せんせい}。」\n\n「請、請多指教！」她站起來鞠躬，差點打翻杯子。\n\n他看著她，嘴角勾起一點：「[[〈隣:となり〉に〈座:すわ〉ってもいいか。::可以坐妳旁邊嗎？]]」\n\n還沒等她回答，他已經坐到她身邊了。\n\n---\n\n{授業|じゅぎょう}比想像中難。\n\n不是因為神崎遼學得慢，而是他太常{間違える|まちがえる}。「謝謝」說成「寫寫」，「老師」說成「老婆」。\n\n「是老師，不是老婆。」知恩紅著臉糾正，「這兩個字的{意味|いみ}差很多！」\n\n「哪裡不一樣？」他一臉認真地問。\n\n「老婆是……妻子的意思。」她的聲音越來越小，{恥ずかしい|はずかしい}得想鑽進地洞。\n\n「喔。」他點點頭，「那我沒說錯。」\n\n她一口水差點噴出來。\n\n每天晚上，她都在家{練習|れんしゅう}怎麼把課教得更好。而每次{授業|じゅぎょう}結束，他都會出一份{宿題|しゅくだい}給她——不是他寫，是她寫：「明天晚上七點，陪我吃飯。」\n\n「這不是{宿題|しゅくだい}！」\n\n「是{約束|やくそく}。」他說，「{先生|せんせい}不能遲到。」\n\n---\n\n三個月後，知恩發現了一件事。\n\n那天她提早到公司，聽見神崎遼在會議室裡，跟台灣客戶用中文談了整整一小時的合約。他的中文，{上手|じょうず}得不可思議。\n\n一個「寫寫」都沒有。\n\n她站在門外，手裡的課本掉到地上。\n\n會議結束，神崎遼走出來，看見她，腳步頓了一下。\n\n「你……你根本就會說中文！」她氣得聲音發抖，「那我這三個月在教什麼？」\n\n他沒解釋，只是把她拉進旁邊的空會議室，反手關上門，一手撐在她身後的白板上。\n\n「生氣了？」\n\n「當然生氣！你騙我！」\n\n「對。」他低頭看她，眼神第一次不再慵懶，而是{本当|ほんとう}的認真，「[[〈間違:まちが〉えたのは、わざとだ。::我是故意說錯的。]]」\n\n「為什麼？」\n\n「因為只有我說錯的時候，妳才會一直看著我。」他說，「{簡単|かんたん}的道理。」\n\n知恩的臉一下子燒起來。\n\n「一年前，妳在神保町的書店打工。我想買一本中文詩集，妳用{下手|へた}的日文，花了二十分鐘向我解釋一首詩。」他的聲音低下來，「那首詩最後一句是『我想你』。我記到現在。」\n\n「所以……」\n\n「所以我想了一個最笨的辦法，讓妳每週來見我兩次。」\n\n他捏起她的下巴，用標準得過分的中文說：「林老師，今天的{授業|じゅぎょう}，換我來{教える|おしえる}。」\n\n「教什麼？」\n\n「教妳，」他低頭吻住她，吻得又慢又深，「什麼叫做{欲しい|ほしい}。」\n\n吻完，他抵著她的額頭，終於用中文、一字一字地說：\n\n「我、想、妳。」\n\n這一次，一個字都沒有{間違える|まちがえる}。", "blurb": "她是總裁的中文家教，他卻總把「老師」說成「老婆」。「我是故意說錯的。」", "gram": {"pt": "〜てもいい", "mean": "可以～嗎／～也沒關係（許可）", "how": "動詞て形＋もいい（座る→座って→座ってもいい）", "ex": "〈隣:となり〉に〈座:すわ〉ってもいいか。", "exzh": "可以坐妳旁邊嗎？"}, "boss": {"name": "神崎遼", "yomi": "かんざき りょう", "mark": "遼", "c1": "#1a1f4d", "c2": "#4b5fc7"}}, {"id": "A6", "title": "總裁的便當小偷", "band": "N5-N4", "text": "會計部的吳小晴，每天中午都在頂樓的小花園，一個人吃自己做的{弁当|べんとう}。\n\n那是她在東京唯一的小確幸：一份煎得剛剛好的玉子燒、三種顏色的{野菜|やさい}、媽媽教她的滷肉。\n\n直到那天，她的便當不見了。\n\n隔天又不見了。第三天，她決定躲在花園的柱子後面，抓住這個小偷。\n\n十二點零五分，一個穿著深灰色條紋西裝的男人走上頂樓，熟門熟路地打開她的便當盒，拿起她的{箸|はし}，一口一口吃了起來。\n\n小晴衝出去：「抓到了！你這個便當小偷——」\n\n男人抬起頭。\n\n她的聲音卡在喉嚨裡。那張臉，她只在公司年報上看過——朝霧集團的總裁，朝霧透。\n\n---\n\n「社、社長？」\n\n「{味|あじ}太淡。」朝霧透面不改色地放下{箸|はし}，「明天多放一點醬油。」\n\n「那是我的午餐！」\n\n「現在是我的。」他站起來，比她高了一個頭，伸手指著她的鼻尖，「[[〈明日:あした〉も〈作:つく〉らなければならない。::明天也得做。]]」\n\n「憑什麼？」\n\n「憑我{お腹|おなか}{空く|すく}。」\n\n小晴氣得說不出話。她想{怒る|おこる}，可是看著他吃得乾乾淨淨的便當盒，她又有點說不出的開心。\n\n---\n\n從那天起，她每天{作る|つくる}兩份{弁当|べんとう}。\n\n他從不說謝謝，只會挑剔：「{野菜|やさい}太多。」「玉子燒太甜。」「明天要有肉。」\n\n她嘴上{文句|もんく}一堆，手卻誠實地照做。\n\n直到某天中午，朝霧透沒有出現。\n\n第二天也沒有。第三天，她在會議室外聽到部長說：「社長這週都在大阪，聽說{忙しい|いそがしい}到連飯都沒時間吃。」\n\n她握著兩個早就{冷たい|つめたい}的便當盒，心裡空空的。原來，習慣一個人等另一個人，是這麼{寂しい|さびしい}的事。\n\n---\n\n週五晚上，小晴加班到九點。走出辦公室時，電梯門一打開，朝霧透站在裡面。\n\n他瘦了一點，眼睛下面有淡淡的青色。\n\n「我的{弁当|べんとう}呢？」他第一句話就問。\n\n「你三天沒來，我……」她忽然說不下去了，「我以為你吃膩了。」\n\n朝霧透看著她泛紅的眼眶，眉頭一下子皺起來。他跨出電梯，把她逼到走廊的牆邊，一手撐在她耳側。\n\n「誰准妳亂想的？」\n\n他從西裝口袋裡拿出一張摺得小小的紙條——是她第一天貼在便當盒上的：「今天也要加油喔。」\n\n「這個，我一直{隠す|かくす}在身上。」他說，「三年來，沒有人對我說過這句話。」\n\n小晴愣住了。\n\n「大阪的工作，我三天做完了五天的份。」他的聲音很低，「吃不到妳的飯，我很{困る|こまる}。」\n\n「所以，」他低頭看她，眼神霸道又溫柔，「[[お〈前:まえ〉の〈料理:りょうり〉しか〈食:た〉べない。::我只吃妳做的菜。]]這輩子都是。」\n\n「你這是要我當你的廚師嗎？」\n\n「不是廚師。」他吻住她，吻得很輕，像在嚐一道很{大切|たいせつ}的菜。\n\n「是社長夫人。」\n\n那天晚上，他們在公司樓下的便利商店，分著吃了一個飯糰。小晴覺得，那是她吃過最{美味しい|おいしい}的晚餐。", "blurb": "每天偷吃她便當的男人，竟然是總裁。「明天也得做。我只吃妳做的菜。」", "gram": {"pt": "〜なければならない", "mean": "必須～、得～", "how": "動詞ない形去い＋ければならない（作らない→作らなければならない）", "ex": "〈明日:あした〉も〈作:つく〉らなければならない。", "exzh": "明天也得做。"}, "boss": {"name": "朝霧透", "yomi": "あさぎり とおる", "mark": "透", "c1": "#0f2f4f", "c2": "#3a86c8"}}, {"id": "A7", "title": "總裁的晨跑約定", "band": "N5-N4", "text": "每天{朝|あさ}六點，蘇小荷都會在代代木公園跑步。\n\n這是她來東京之後唯一的堅持。工作再累，不管{天気|てんき}好不好，她都會穿上那雙舊舊的白色{靴|くつ}，繞著公園{走る|はしる}三圈。\n\n直到那個男人出現。\n\n黑色運動服，黑色{帽子|ぼうし}壓得很低。他每天都在同一個轉角超過她，跑得又輕又{速い|はやい}，連頭都不回。\n\n第五天，小荷不服氣了。她咬著牙加速，跟在他身後整整一圈，跑到最後雙腿{重い|おもい}得像鉛，{疲れた|つかれた|疲れる}得差點倒在地上。\n\n男人終於停下來，回頭看她。帽簷下是一張好看得過分的臉。\n\n「妳跑得太{遅い|おそい}，還硬要追。」他遞給她一瓶水，「先{休む|やすむ}。不准逞強。」\n\n她氣得說不出話，只能大口大口地喝著水。\n\n---\n\n從那天起，他們每天早上一起跑。\n\n他話很少，卻會記得她的配速，在她跑不動的時候放慢腳步，在她的{汗|あせ}流進眼睛的時候，把毛巾丟到她頭上。\n\n「你為什麼每天都來？」她問。\n\n「{運動|うんどう}。」他回答得很簡短。\n\n「那你為什麼都在等我？」\n\n他沉默了一下，沒有回答，只說了一句：「[[〈明日:あした〉も、ここで〈待:ま〉っている。::明天，我也會在這裡等妳。]]」\n\n---\n\n一個月後，小荷的公司被併購了。新社長上任第一天，全體員工在大廳集合。\n\n她站在最後一排，看見台上的男人時，整個人僵住了。\n\n西裝筆挺，頭髮梳得一絲不苟——是每天早上跟她一起跑步的那個人。新社長，早瀬隼。\n\n會後，她被叫進社長室。\n\n「社長，你、你早就知道我是誰了？」\n\n「嗯。」早瀬隼關上門，一步一步走近她，「我知道妳每天六點跑步，知道妳在{晴れ|はれ}的早上跑三圈，下雨天也不肯偷懶。」\n\n她往後退，背貼上了冰涼的門。\n\n他一手撐在她耳邊，低頭看她：「[[〈恋:こい〉をしたことがあるか。::妳談過戀愛嗎？]]」\n\n「什、什麼？」\n\n「我沒有。」他說，「所以我不知道，每天五點{起きる|おきる}，提早一小時到公園，只為了超過一個女孩，算不算。」\n\n小荷的心跳快得像剛跑完十公里。\n\n「你……一直在等我追上你？」\n\n「對。」他的聲音低下來，「妳終於追上了。」\n\n然後他吻了她。很慢，很溫柔，卻一點也不給她逃跑的機會。\n\n「明天早上六點，」他抵著她的額頭說，「不准遲到。我會{頑張る|がんばる}跑慢一點。」", "blurb": "每天早上在公園超過她的男人，竟是公司的新社長。「妳談過戀愛嗎？」", "gram": {"pt": "〜たことがある", "mean": "曾經～過（經驗）", "how": "動詞た形＋ことがある（する→した→したことがある）", "ex": "〈恋:こい〉をしたことがあるか。", "exzh": "妳談過戀愛嗎？"}, "boss": {"name": "早瀬隼", "yomi": "はやせ じゅん", "mark": "隼", "c1": "#10314a", "c2": "#3f8fc4"}}, {"id": "A8", "title": "總裁的圖書館戀人", "band": "N5-N4", "text": "{夜|よる}九點，市立{図書館|としょかん}只剩下一個客人。\n\n何雨萱在這裡當夜班管理員兩年了，從沒見過這麼奇怪的人。\n\n他{毎晩|まいばん}八點準時出現，穿著昂貴的深色西裝，坐在靠窗的同一張{椅子|いす}上，借同一本書——一本厚厚的日文{辞書|じしょ}。\n\n「先生，」第十天，雨萱終於忍不住了，「這本辭典，你已經{借りた|かりた|借りる}十次了。」\n\n男人抬起頭。金絲{眼鏡|めがね}後面，一雙眼睛冷淡又好看。\n\n「嗯。」他說，「因為還沒{読む|よむ}完。」\n\n「那是辭典！不是{小説|しょうせつ}！」\n\n他沒回答，只是低下頭，繼續翻頁。\n\n---\n\n接下來的日子，雨萱開始偷偷觀察他。\n\n他看書的時候很{静か|しずか}，可是每次她推著書車經過，他翻頁的手就會停下來。她在櫃檯打瞌睡的時候，醒來總會發現身上多了一件西裝外套。\n\n有一天，她在他{返す|かえす}的辭典裡，發現了一張紙條。\n\n上面只有一行很漂亮的{字|じ}：「妳今天笑了三次。」\n\n雨萱的臉一下子紅了。\n\n---\n\n那天晚上，九點到了。她走過去提醒他：「先生，我們要{閉める|しめる}門了。」\n\n{図書館|としょかん}的{電気|でんき}一盞一盞熄滅，只剩下他桌上那一盞。\n\n男人站起來，把那本辭典放回書架，然後轉過身，把她困在書架和他之間。\n\n「你、你要做什麼？」\n\n「黒川律。」他說，「我叫黒川律。明天起，這間圖書館的所有新書，都由黒川集團捐贈。」\n\n「為什麼？」\n\n「因為我想每天光明正大地來。」他低頭看她，「[[〈本:ほん〉を〈読:よ〉みに〈来:き〉たんじゃない。〈君:きみ〉に〈会:あ〉いに〈来:き〉た。::我不是來讀書的，是來見妳的。]]」\n\n雨萱的心跳亂成一團：「那、那本辭典……」\n\n「我一頁都沒讀進去。」他承認得毫不心虛，「[[〈君:きみ〉を〈見:み〉ながら〈読:よ〉む〈本:ほん〉が、〈一番:いちばん〉〈面白:おもしろ〉い。::一邊看著妳一邊讀的書，最有趣。]]」\n\n{暗い|くらい}的圖書館裡，他低頭吻住她。很輕，很安靜，像怕吵醒滿屋子的書。\n\n「明天，」他在她耳邊說，「我還會來。這一次，我會真的讀一本書——讀妳。」", "blurb": "每晚借同一本辭典的西裝男人，一頁都沒讀過。「比起書，我是來見妳的。」", "gram": {"pt": "〜ながら", "mean": "一邊～一邊～", "how": "動詞ます形去ます＋ながら（見ます→見ながら）", "ex": "〈君:きみ〉を〈見:み〉ながら〈読:よ〉む〈本:ほん〉が、〈一番:いちばん〉〈面白:おもしろ〉い。", "exzh": "一邊看著妳一邊讀的書，最有趣。"}, "boss": {"name": "黒川律", "yomi": "くろかわ りつ", "mark": "律", "c1": "#18203f", "c2": "#566bb8"}}, {"id": "A9", "title": "總裁的颱風夜", "band": "N5-N4", "text": "{台風|たいふう}十九號登陸的那天晚上，張若晴還在公司加班。\n\n窗外的{風|かぜ}像野獸一樣吼叫，大樓的玻璃被雨打得劈啪作響。電車全部停駛，她沒辦法{帰る|かえる}。整層樓只剩下她——還有走廊盡頭那間辦公室。\n\n結城蒼，設計部的新總監，也是公司出了名的「冰山」。他上任一個月，已經退回她七次稿子。\n\n晚上十點，突然「啪」的一聲，所有的燈都{消えた|きえた|消える}。\n\n辦公室一片{暗い|くらい}。\n\n若晴從小就覺得黑夜很{怖い|こわい}。她縮在桌子底下，聽著窗外越來越大的{音|おと}，手抖得連手機都拿不穩。\n\n一道光照了過來。\n\n「張若晴。」是結城蒼的聲音，冷冷的，卻帶著一點急，「妳在哪裡？」\n\n---\n\n他找到她的時候，她正抱著膝蓋發抖。\n\n結城蒼蹲下來，把手機的光轉向旁邊，沒有直接照她的臉。\n\n「{大丈夫|だいじょうぶ}？」\n\n「我、我沒事……」話還沒說完，窗外一道{雷|かみなり}劈下來，她尖叫一聲，整個人撞進他懷裡。\n\n他僵了一秒，然後把她抱緊。\n\n「[[〈怖:こわ〉いなら、〈俺:おれ〉につかまっていろ。::怕的話，就抓緊我。]]」\n\n---\n\n那一夜很長。\n\n他從辦公室拿來一條{毛布|もうふ}裹住她，自己只穿著襯衫，坐在她旁邊。\n\n「你不{寒い|さむい}嗎？」\n\n「不冷。」他說完，打了一個噴嚏。\n\n若晴忍不住笑了。黑暗裡，她第一次覺得這座冰山好像沒那麼冷。\n\n「你為什麼一直退我的稿？」她小聲問。\n\n結城蒼沉默了很久。\n\n「因為妳每次改稿，都會來我辦公室找我。」他的聲音很低，「退七次，就能見妳七次。」\n\n若晴愣住了。\n\n「我知道這很幼稚。」他轉過頭看她，在手機微弱的光裡，他的眼神燙得驚人，「可是我不知道，還有什麼辦法能讓妳注意到我。」\n\n她的心跳亂成一團。\n\n「今晚就在這裡{泊まる|とまる}吧，」他說，「我陪妳。」\n\n窗外的風雨還在怒吼，他卻低頭，在她的額頭落下一個很輕的吻。\n\n「[[〈雨:あめ〉が〈止:や〉んだら、〈一緒:いっしょ〉に〈帰:かえ〉ろう。::雨停了的話，我們一起回家。]]」他說，「以後每一個颱風夜，我都會在。」\n\n天色漸漸{明るく|あかるく|明るい}起來的時候，雨停了。若晴醒來，發現自己靠在他肩上，身上蓋著他的西裝。\n\n而他一夜沒{眠る|ねむる}，只是{心配|しんぱい}地看著她。", "blurb": "颱風夜停電，退了她七次稿的冰山總監找到縮在桌下的她。「怕的話，就抓緊我。」", "gram": {"pt": "〜たら", "mean": "～的話、～之後（條件）", "how": "動詞た形＋ら（止んだ→止んだら）；い形容詞→かったら；な形容詞・名詞→だったら", "ex": "〈雨:あめ〉が〈止:や〉んだら、〈一緒:いっしょ〉に〈帰:かえ〉ろう。", "exzh": "雨停了的話，我們一起回家。"}, "boss": {"name": "結城蒼", "yomi": "ゆうき あおい", "mark": "蒼", "c1": "#0c2238", "c2": "#2f6f9f"}}, {"id": "A10", "title": "總裁的沖繩假期", "band": "N5-N4", "text": "公司員工旅遊，目的地是沖繩的一座小{島|しま}。\n\n江小魚站在沙灘上，看著眼前一望無際、{青い|あおい}的{海|うみ}，心裡只有一個念頭——千萬不要被叫下水。\n\n她名字叫小魚，卻完全不會{泳ぐ|およぐ}。\n\n同事們忙著拍照，一道低沉的聲音從身後傳來：「江小魚。」\n\n她一回頭，就看見穿著白襯衫、戴著墨鏡的社長——獅堂航。他是全公司最難親近的人，連笑都很少笑。\n\n「社、社長好！」\n\n「妳為什麼不下水？」\n\n「我……我怕{暑い|あつい}。」她隨便找了個藉口。\n\n獅堂航看了一眼她發抖的手指，什麼也沒說，只把自己的{帽子|ぼうし}戴到她頭上：「{太陽|たいよう}很大。別曬傷了。」\n\n---\n\n下午，同事們玩起了香蕉船。小魚被起鬨推上船，還沒反應過來，船就翻了。\n\n{冷たい|つめたい}的海水瞬間淹過頭頂。她拚命掙扎，卻越沉越深——\n\n下一秒，一隻手緊緊抓住了她。\n\n獅堂航把她抱上岸，臉色難看得嚇人：「不會游泳為什麼不說？」\n\n「我、我怕被大家笑……」她咳著水，眼淚掉了下來。\n\n他沉默地看著她，然後用力把她抱進懷裡，聲音第一次在發抖：「[[〈俺:おれ〉の〈手:て〉を〈離:はな〉すな。::不准放開我的手。]]以後不管去哪裡，都不准。」\n\n---\n\n{夕方|ゆうがた}，同事們去參加烤肉派對，小魚一個人坐在沙灘上。\n\n獅堂航走過來，在她身邊坐下。\n\n「海，還{怖い|こわい}嗎？」\n\n「有一點。」\n\n「那我{教える|おしえる}妳。」他說，「{毎日|まいにち}教一個小時，教到妳不怕為止。」\n\n「為什麼？社長你明明很忙……」\n\n他摘下墨鏡。那雙總是冷淡的眼睛，此刻映著整片橘紅色的{空|そら}。\n\n「三年前的面試，妳說妳的{夢|ゆめ}是有一天能在沖繩看夕陽。」他說，「這趟員工旅遊的地點，是我選的。」\n\n小魚愣住了。\n\n「我等這一天，等了三年。」他握住她的手，十指緊扣，「江小魚，[[ずっと〈俺:おれ〉のそばにいてほしい。::我希望妳一直待在我身邊。]]」\n\n腳下的{砂|すな}還留著太陽的溫度，海浪一陣一陣湧上來。他低頭吻住她，吻得很深，帶著海風的鹹味。\n\n那天晚上，滿天的{星|ほし}下，他教會了她一件事——\n\n原來被一個人緊緊抱著的時候，就算沉進海裡，也不會害怕。", "blurb": "不會游泳的她在沖繩翻船，救她上岸的是冷淡的社長。「不准放開我的手。」", "gram": {"pt": "〜てほしい", "mean": "希望（對方）～", "how": "動詞て形＋ほしい（いる→いて→いてほしい）", "ex": "ずっと〈俺:おれ〉のそばにいてほしい。", "exzh": "我希望妳一直待在我身邊。"}, "boss": {"name": "獅堂航", "yomi": "しどう わたる", "mark": "航", "c1": "#0d3550", "c2": "#2f9ac9"}}, {"id": "A11", "title": "總裁的遺失錢包", "band": "N5-N4", "text": "早上八點，新宿{駅|えき}人擠人。\n\n許若安{急ぐ|いそぐ}著跑向月台。今天是她新工作的第一天，絕對不能{遅れる|おくれる}。\n\n可是到了剪票口，她才發現——她的{財布|さいふ}不見了。\n\n裡面有她的{切符|きっぷ}、她的信用卡，還有媽媽留給她的唯一一張{写真|しゃしん}。\n\n她翻遍了包包，蹲在地上，眼淚差點掉下來。\n\n「在{探す|さがす}這個嗎？」\n\n一個穿著深藍色西裝的男人站在她面前，手裡拿著她的錢包。\n\n「我在樓梯那裡{拾う|ひろう}到的。」\n\n「謝、謝謝您！」她接過錢包，打開一看，照片還在。她鬆了一口氣，抬頭想好好道謝，男人已經轉身走了。\n\n只留下一句：「下次小心一點。」\n\n---\n\n九點整，若安衝進新公司的會議室。\n\n「抱、抱歉，我遲到了……」\n\n她的聲音停住了。坐在主位上的，正是早上那個男人。\n\n「新來的？」他看了她一眼，「我是社長，久遠樹。」\n\n整個早上，若安都不敢看他。\n\n---\n\n下班時，她在辦公桌上發現一張便條，和她的員工證。\n\n「掉在{電車|でんしゃ}上的。妳今天掉了兩次東西。——久遠」\n\n她紅著臉跑到社長室：「社長，謝謝您又幫我{届ける|とどける}東西……」\n\n「第三次，」他抬起頭，「妳打算掉什麼？」\n\n「我、我不會再掉了！」\n\n「是嗎。」他站起來，慢慢走到她面前，把她逼到門邊，「可是我已經撿到一樣，不打算還妳了。」\n\n「什麼？」\n\n「妳。」他低頭看她，「[[〈君:きみ〉を〈返:かえ〉すつもりはない。::我沒打算把妳還回去。]]」\n\n若安的心跳一下子亂了。\n\n「早上在月台，妳蹲在地上找照片的樣子，我一直忘不了。」他說，「所以我打{電話|でんわ}給人事部，問了妳的{名前|なまえ}和{番号|ばんごう}。」\n\n「你……這樣不太好吧。」\n\n「我知道。」他毫不心虛，「所以我現在親自來說。[[〈駅:えき〉まで〈送:おく〉る。::我送妳到車站。]]」\n\n她還沒回答，他已經低頭吻了她的額頭，很輕。\n\n「以後{毎朝|まいあさ}八點，」他說，「我在{交番|こうばん}前面等妳。這樣妳就不會再掉東西了。」\n\n若安{嬉しい|うれしい}得忍不住笑了。", "blurb": "新工作第一天弄丟錢包，撿到它的是冷淡的社長。「我撿到的，不打算還妳。」", "gram": {"pt": "〜つもり", "mean": "打算～", "how": "動詞辭書形／ない形＋つもり（返す→返すつもりはない＝沒打算還）", "ex": "〈君:きみ〉を〈返:かえ〉すつもりはない。", "exzh": "我沒打算把妳還回去。"}, "boss": {"name": "久遠樹", "yomi": "くおん いつき", "mark": "樹", "c1": "#14305e", "c2": "#4f86d8"}}, {"id": "A12", "title": "總裁的料理教室", "band": "N5-N4", "text": "每週六下午，林小雪都會去一間小小的料理教室上課。\n\n她的{料理|りょうり}很爛。煎蛋會焦，煮湯會太鹹，切{野菜|やさい}還曾經切到手。可是她想學會做一桌菜，給遠在台灣的媽媽看。\n\n這學期，教室來了一個新{生徒|せいと}。\n\n高大，冷淡，穿著白襯衫，袖子捲到手肘。他{切る|きる}菜的速度快得像職業廚師，卻總是站在她旁邊。\n\n「{塩|しお}放太多了。」他說。\n\n「{火|ひ}太大了。」\n\n「{卵|たまご}打得太用力。」\n\n「鍋子很{熱い|あつい}，手拿開。」\n\n小雪氣得想把鍋鏟丟過去：「你是{先生|せんせい}嗎？」\n\n「不是。」他面無表情，「我只是看不下去。」\n\n---\n\n那天，她的{指|ゆび}又被刀劃了一下，紅了一小塊。\n\n他立刻抓住她的手，放到水龍頭下面{洗う|あらう}。\n\n「{痛い|いたい}？」\n\n「還好……」\n\n他低著頭，替她貼上OK繃，動作溫柔得不像同一個人。\n\n「為什麼你每次都站在我旁邊？」她忍不住問。\n\n他沉默了一下：「因為只有站在妳旁邊，我才能吃到妳做的菜。」\n\n「我做的菜很難吃耶。」\n\n「嗯。」他誠實地點頭，「可是我喜歡。」\n\n---\n\n最後一堂課，老師說要辦一場小小的試吃會。\n\n小雪做了一道滷{肉|にく}，是媽媽的味道。\n\n一個同班的男生走過來，笑著說：「好香！可以讓我吃一口嗎？」\n\n她還沒回答，一隻手已經把她的{皿|さら}端走了。\n\n是他。\n\n「不行。」他冷冷地說，把男生擋在外面，然後低頭看她，眼神燙得驚人，「[[ほかの〈男:おとこ〉に〈食:た〉べさせてはいけない。::不准給別的男人吃。]]」\n\n「你、你憑什麼……」\n\n「憑我是柏木悠真。」他說，「這間料理教室的老闆。」\n\n小雪愣住了。\n\n「我在這裡上課三個月，」他說，「只是為了每週六，能站在妳旁邊。」\n\n他吃了一口她的滷肉，閉上眼睛。\n\n「{味|あじ}很好。」他說，「[[〈毎日:まいにち〉、〈俺:おれ〉のために〈作:つく〉ってくれ。::以後每天，都做給我吃。]]」\n\n然後他低頭吻住她，吻裡帶著一點{甘い|あまい}的醬油香。", "blurb": "料理很爛的她，旁邊總站著一個挑剔的男人。「不准給別的男人吃。」", "gram": {"pt": "〜てはいけない", "mean": "不可以～", "how": "動詞て形＋はいけない（食べさせる→食べさせてはいけない）", "ex": "ほかの〈男:おとこ〉に〈食:た〉べさせてはいけない。", "exzh": "不准給別的男人吃。"}, "boss": {"name": "柏木悠真", "yomi": "かしわぎ ゆうま", "mark": "悠", "c1": "#2a2f55", "c2": "#6c7fd6"}}, {"id": "A13", "title": "總裁的鋼琴演奏會", "band": "N5-N4", "text": "周小音是一間小{音楽|おんがく}教室的鋼琴老師。\n\n她{弾く|ひく}得很好，卻從來不敢上台。只要台下有人看，她的{指|ゆび}就會發抖。\n\n直到那天，一位客人推開了教室的門。\n\n「下個月，我公司要辦一場慈善音樂會。」他遞出一張名片——雨宮集團總裁，雨宮奏。「我想請妳來彈。」\n\n「我不行，我會緊張——」\n\n「我{聞いた|きいた|聞く}過妳彈琴。」他打斷她，「每天晚上九點，這間教室的{窓|まど}都會傳出同一首曲子。」\n\n小音愣住了。那是她每天{練習|れんしゅう}的曲子，媽媽最喜歡的一首。\n\n---\n\n接下來一個月，雨宮奏{毎晩|まいばん}都來。\n\n他坐在教室最後一排的{席|せき}上，什麼也不說，只是{静か|しずか}地聽。\n\n有時候她彈錯了，他會說：「再一次。」\n\n有時候她彈得很好，他會說：「{上手|じょうず}。」\n\n---\n\n演奏會那天晚上，{舞台|ぶたい}很大，台下坐滿了人。\n\n小音站在後台，手抖得連樂譜都拿不穩。\n\n雨宮奏走過來，握住她冰冷的手。\n\n「[[〈緊張:きんちょう〉するなら、〈俺:おれ〉だけを〈見:み〉たほうがいい。::緊張的話，妳最好只看著我。]]」他說，「我會坐在第一排，正中間。」\n\n演奏{始まった|はじまった|始まる}。\n\n她坐在鋼琴{椅子|いす}上，抬起頭。第一排正中間，那個男人正看著她，眼神安靜又堅定。\n\n她開始彈。一個音、兩個音……台下的人好像都消失了，只剩下他。\n\n最後一個音結束，全場安靜了三秒，然後響起如雷的{拍手|はくしゅ}。\n\n---\n\n散場後，後台堆滿了{花|はな}。\n\n最大的一束，附著一封{手紙|てがみ}：「給我最喜歡的鋼琴家。」\n\n雨宮奏站在門口，把她拉進懷裡。\n\n「你為什麼對我這麼好？」她問。\n\n「三年前，我人生最糟的那天晚上，經過這間教室。」他說，「窗戶裡傳出這首曲子。我在門外站了一個小時。」\n\n「後來，我每天都來聽。妳彈了三年，我就聽了三年。」\n\n小音的眼淚掉了下來。\n\n他低頭吻住她，吻得很慢，像一首溫柔的曲子。\n\n「[[〈君:きみ〉の〈音:おと〉が、〈一番:いちばん〉〈好:す〉きだ。::我最喜歡妳的琴聲。]]」他抵著她的額頭說，「以後，只彈給我聽。」", "blurb": "不敢上台的鋼琴老師，台下第一排坐著聽了她三年的總裁。「妳最好只看著我。」", "gram": {"pt": "〜ほうがいい", "mean": "最好～", "how": "動詞た形＋ほうがいい（見る→見たほうがいい）", "ex": "〈緊張:きんちょう〉するなら、〈俺:おれ〉だけを〈見:み〉たほうがいい。", "exzh": "緊張的話，妳最好只看著我。"}, "boss": {"name": "雨宮奏", "yomi": "あまみや かなで", "mark": "奏", "c1": "#1b2c4a", "c2": "#5b8fc9"}}, {"id": "A14", "title": "總裁的狗", "band": "N5-N4", "text": "陳暖暖在{公園|こうえん}旁邊開了一間小小的寵物美容店。\n\n她最喜歡的客人，是一隻叫「小黑」的大{犬|いぬ}。{黒い|くろい}毛，圓圓的眼睛，每次來都會撲到她身上，舔她的{顔|かお}。\n\n可是小黑的主人，她一次也沒見過。每次都是一位老管家帶牠來。\n\n---\n\n那天傍晚，下起了大{雨|あめ}。\n\n店門被推開，小黑全身濕透地衝進來，脖子上的項圈不見了。\n\n暖暖嚇了一跳，趕緊拿毛巾替牠擦乾。小黑一直發抖，小聲地{鳴く|なく}。\n\n「別怕，我陪你。」\n\n她抱著小黑，打了好多通{電話|でんわ}，終於聯絡上那位管家。\n\n一個小時後，一輛黑色的車停在店門口。下車的，是一個高大的男人，西裝被雨淋濕了一半。\n\n「小黑！」\n\n小黑從她懷裡跳出去，撲向那個男人。男人緊緊抱住牠，抬起頭，看向暖暖。\n\n「謝謝妳{見つける|みつける}牠。」他說，「我是牠的主人，神崎蓮。」\n\n---\n\n從那天以後，帶小黑來店裡的，變成了神崎蓮本人。\n\n他每週都來，有時候一週來三次。\n\n「小黑的毛已經很乾淨了。」暖暖忍不住說。\n\n「牠喜歡妳。」他面不改色。\n\n「那你可以帶牠去{散歩|さんぽ}啊，一直來洗澡不太好吧？」\n\n「好。」他點頭，「那妳陪我們一起去。」\n\n---\n\n於是，每天傍晚，公園裡多了一幅奇怪的畫面。\n\n小黑在前面{走る|はしる}，暖暖在中間笑，神崎蓮在後面，安靜地看著她。\n\n小黑喜歡在草地上和別的{動物|どうぶつ}{遊ぶ|あそぶ}，跑{疲れた|つかれた|疲れる}了就躺在暖暖腳邊。\n\n「牠好{可愛い|かわいい}。」暖暖摸著小黑的頭。\n\n「嗯。」神崎蓮看著的卻不是狗，「很可愛。」\n\n---\n\n一個月後，暖暖在店裡收到一個大{箱|はこ}。\n\n裡面是一個新的項圈，上面刻著兩個名字：小黑，和暖暖。\n\n「這是什麼意思？」她叫住正要離開的神崎蓮。\n\n他停下腳步，轉過身，一步一步走回來，把她逼到櫃台邊。\n\n「意思是，」他低頭看她，「小黑需要一個新的家人。」\n\n「我、我只是幫牠洗澡的……」\n\n「[[〈君:きみ〉は〈俺:おれ〉のことが〈好:す〉きだと〈思:おも〉う。::我覺得妳喜歡我。]]」他說，「因為我每次來，妳都笑得比對小黑還甜。」\n\n暖暖的臉一下子{赤い|あかい}了。\n\n「那天下大雨，小黑其實不是走丟的。」他終於承認，「是牠自己跑來找妳。牠比我還早知道，我想見妳。」\n\n小黑在旁邊「汪」了一聲，像是在幫主人說話。\n\n他低頭吻住她，很輕，很溫柔。\n\n「[[〈俺:おれ〉の〈家:いえ〉に〈来:こ〉い。::來我家吧。]]」他說，「小黑在{待つ|まつ}妳，我也是。」", "blurb": "雨夜裡走丟的大黑狗，帶來了牠冷淡的主人。「我覺得妳喜歡我。」", "gram": {"pt": "〜と思う", "mean": "我覺得～", "how": "普通形＋と思う（好きだ→好きだと思う）", "ex": "〈君:きみ〉は〈俺:おれ〉のことが〈好:す〉きだと〈思:おも〉う。", "exzh": "我覺得妳喜歡我。"}, "boss": {"name": "神崎蓮", "yomi": "かんざき れん", "mark": "蓮", "c1": "#10263f", "c2": "#3f7fbf"}}, {"id": "A15", "title": "總裁的聖誕禮物", "band": "N5-N4", "text": "東京的{冬|ふゆ}，街上到處都是燈。\n\n宋可可在銀座一間小小的蛋糕{店|みせ}打工。聖誕節前一週，店裡忙得不得了，她每天要做一百個草莓蛋糕。\n\n那天{夜|よる}裡，店快打烊時，進來一位客人。\n\n黑色大衣，灰色圍巾，冷著一張臉。\n\n「還有蛋糕嗎？」\n\n「只剩最後一個了。」可可指著櫥窗，「是我自己做的，草莓放得有點歪……」\n\n「我要了。」他說，「幫我寫一句話。」\n\n「寫什麼？」\n\n「『聖誕快樂』。」他頓了一下，「給一個人在東京的人。」\n\n---\n\n第二天晚上，他又來了。\n\n第三天，第四天，第五天，他每天都在打烊前出現，{買う|かう}走她做的最後一個蛋糕。\n\n「你家人很多嗎？」可可忍不住問。\n\n「{家族|かぞく}不在身邊。」他說，「我{一人|ひとり}住。」\n\n「那你每天吃一整個蛋糕？」\n\n他沉默了一下：「……嗯。」\n\n可可忍不住{笑う|わらう}了出來。這個冷冰冰的男人，原來是一個愛吃{甘い|あまい}東西的人。\n\n---\n\n平安夜，{雪|ゆき}下得很大。\n\n整條街都是{白い|しろい}的。可可在店裡忙到十點，出來的時候，手已經{冷たい|つめたい}得沒有感覺了。\n\n一輛車停在她面前。車窗搖下來，是那個男人。\n\n「上車。」\n\n「我、我不認識你……」\n\n「東雲司。」他說，「東雲集團社長。現在認識了。」\n\n---\n\n他帶她去了東京鐵塔的頂樓。\n\n整個東京在他們腳下閃閃發光，一棵巨大的聖誕樹立在中間，上面掛滿了{赤い|あかい}和金色的燈。\n\n「為什麼帶我來這裡？」\n\n他從大衣口袋裡拿出一個小盒子，{渡す|わたす}給她。\n\n「{開ける|あける}看看。」\n\n裡面是一條項鍊，墜子是一顆小小的草莓。\n\n「第一天那個蛋糕上，妳寫的是『一個人在東京的人，聖誕快樂』。」他說，「我那天才剛被家族逼著訂婚，一個人站在雪裡，想不到誰會跟我說這句話。」\n\n「然後，我吃到妳的蛋糕。」\n\n「我本來只想再吃一次。結果每天都想來，想看妳笑。」\n\n他走近一步，把她圈在懷裡，替她戴上項鍊。\n\n「婚約，我已經推掉了。」他低聲說，「[[〈好:す〉きになってしまった。::我已經喜歡上妳了。]]」\n\n可可的{涙|なみだ}掉了下來。\n\n「別哭。」他擦掉她的淚，語氣霸道又溫柔，「今年的聖誕禮物，妳收下了。明年，後年，以後的每一年——」\n\n「[[〈来年:らいねん〉も〈俺:おれ〉と〈一緒:いっしょ〉にいろ。::明年也要跟我在一起。]]」\n\n雪落在他們身上，他低頭吻住她，甜得像那個歪歪的草莓蛋糕。", "blurb": "每天買走最後一個蛋糕的男人，在聖誕夜把她帶上東京鐵塔。「我已經喜歡上妳了。」", "gram": {"pt": "〜てしまう", "mean": "（不小心／已經）～了", "how": "動詞て形＋しまう（好きになる→好きになってしまった）", "ex": "〈好:す〉きになってしまった。", "exzh": "我已經喜歡上妳了。"}, "boss": {"name": "東雲司", "yomi": "しののめ つかさ", "mark": "司", "c1": "#1d2a52", "c2": "#6b8be0"}}, {"id": "A16", "title": "總裁的駕訓班", "band": "N5-N4", "text": "二十八歲的許晴，終於下定決心去考駕照。\n\n她的{運転|うんてん}爛得出名。第一堂課就把油門當煞車{踏む|ふむ}下去，教練嚇得臉都白了。\n\n第三堂課，教練換人了。\n\n坐進副駕駛座的，是一個穿著深灰色西裝的男人。冷淡，好看，手腕上的錶一看就很貴。\n\n「新教練？」許晴愣住。\n\n「暫時的。」他繫上安全帶，「開車。」\n\n---\n\n他教得很嚴。\n\n方向盤握太緊，他會冷冷地{注意|ちゅうい}。轉彎太急，他會皺眉。上{坂|さか}的時候車子往後滑，他一隻手按住她的手，聲音卻很冷靜：「別慌，慢慢來。」\n\n許晴緊張得全身都是{汗|あせ}。\n\n「你為什麼不{叱る|しかる}我？」她小聲問，「前一個教練說，我是他見過最不會開車的人。」\n\n「因為妳很{一生懸命|いっしょうけんめい}。」他說，「這種人，罵了也沒用。」\n\n她不知道這算不算稱讚。\n\n---\n\n一個月後，她漸漸{慣れる|なれる}了。\n\n不過有一件事，她一直學不會——倒車入庫。\n\n每次到了{駐車場|ちゅうしゃじょう}，她就手忙腳亂，不是壓線就是撞到三角錐，已經重來了二十次。\n\n「我不行了。」她趴在方向盤上，「我永遠拿不到{免許|めんきょ}了。」\n\n他沉默了一下，下了車，繞到駕駛座旁邊。\n\n「下來。」\n\n「做什麼？」\n\n「[[〈俺:おれ〉が〈教:おし〉えてあげる。::我來教妳。]]」他坐進駕駛座，把她拉到自己身前，兩個人擠在同一個位子上。他的手覆在她的手上，一起轉動方向盤。\n\n「看後照鏡。左邊。慢一點。」\n\n他的聲音就在她耳邊，近得她心跳都亂了。車子穩穩地停進了格子裡。\n\n「看，」他說，「妳可以的。」\n\n---\n\n考試那天，許晴一次就過了。\n\n她拿著駕照衝出考場，想第一個告訴他。可是駕訓班的櫃檯說，那位教練已經不來了。\n\n「他本來就不是教練。」櫃檯小姐笑著說，「他是我們集團的社長，篠宮迅。」\n\n許晴愣在原地。\n\n這時，一輛黑色的車停在她面前。車窗搖下來，是他。\n\n「恭喜。」篠宮迅說，「上車。」\n\n「你、你為什麼要假裝教練？」\n\n「三個月前，妳在我們公司樓下，差點被一台{急|きゅう}轉彎的車撞到。」他說，「是我拉住妳的。妳不記得了？」\n\n她想起來了。那天，有人從後面拉住了她的手臂，她連那人的臉都沒看清楚，只說了一聲謝謝。\n\n「後來我聽說，妳因為那件事，一直覺得開車很{怖い|こわい}，連方向盤都不敢碰。」他看著她，「所以我想，至少要親眼看著妳學會。」\n\n「為了{守る|まもる}妳。」他頓了一下，「也為了能每天見到妳。」\n\n許晴的臉燒了起來。\n\n「上次是我教妳。」他把車鑰匙放進她手心，「這次，換妳載我。[[〈俺:おれ〉の〈隣:となり〉はお〈前:まえ〉の〈席:せき〉だ。::我身邊的位置，是妳的。]]」\n\n她開著車，他坐在副駕駛座。{途中|とちゅう}停紅燈的時候，他忽然傾身過來，在她臉頰上落下一個吻。\n\n「專心開車。」他說。\n\n「是你害的！」\n\n他低低地笑了。那是她第一次聽見他笑。\n\n最後，她穩穩地把車停好。他拍拍她的頭，難得{褒める|ほめる}了她一句：「很好。」", "blurb": "開車爛到出名的她，副駕駛座上來了一個冷淡的新教練。「我來教妳。」", "gram": {"pt": "〜てあげる", "mean": "（我）為你做～", "how": "動詞て形＋あげる（教える→教えてあげる）；對長輩直接說會顯得高高在上", "ex": "〈俺:おれ〉が〈教:おし〉えてあげる。", "exzh": "我來教妳。"}, "boss": {"name": "篠宮迅", "yomi": "しのみや じん", "mark": "迅", "c1": "#13294d", "c2": "#4f7fc4"}}, {"id": "A17", "title": "總裁的地震夜", "band": "N5-N4", "text": "凌晨兩點，整棟大樓突然開始{揺れる|ゆれる}。\n\n蘇小夏從夢裡驚醒。{本棚|ほんだな}上的書一本一本掉下來，廚房傳來杯子{割れる|われる}的聲音。\n\n是{地震|じしん}。\n\n她抱著頭縮在床邊，全身抖個不停。來東京半年，她一個人住，常常覺得{寂しい|さびしい}。這是她第一次遇到這麼大的地震。\n\n停電了。手機的訊號也斷了。{周り|まわり}一片漆黑。\n\n---\n\n搖晃停下來的時候，門外傳來急促的敲門聲。\n\n「蘇小夏！開門！」\n\n是住在隔壁的男人。\n\n她只知道他姓天城，每天早上七點出門，晚上十一點回家，西裝永遠燙得筆挺。兩個人在電梯裡碰過幾次面，他從來沒笑過。\n\n她摸黑打開門。手電筒的光照進來，照在她蒼白的臉上。\n\n「有沒有受傷？」他的聲音很急，看起來比她還{心配|しんぱい}。\n\n「沒、沒有……」\n\n他的視線落在她光著的腳上，地上全是碎玻璃。\n\n他二話不說，把她打橫抱起來。\n\n---\n\n天城颯的房子很大，很空，像沒有人住過一樣。\n\n他把她放在沙發上，替她蓋上{毛布|もうふ}，又倒了一杯熱水給她。\n\n「你家怎麼什麼都沒有{倒れる|たおれる}？」\n\n「我把所有的家具都固定在牆上了。」他說，「這裡是地震國家。」\n\n她捧著杯子，手還在抖，{気持ち|きもち}怎麼也靜不下來。\n\n「我好怕。」她小聲說，「我一個人在這裡，連要{連絡|れんらく}誰都不知道。」\n\n他沉默了很久。\n\n然後，他從抽屜裡拿出一張名片，在背面寫下一串號碼，放進她手心。\n\n「以後遇到任何事，」他說，「[[〈俺:おれ〉を〈呼:よ〉べば、すぐ〈行:い〉く。::只要妳叫我，我馬上就到。]]」\n\n---\n\n那一晚，餘震一次又一次。\n\n每次{揺れる|ゆれる}，她都會抓緊他的袖子。他沒有推開她，只是安靜地坐在旁邊，一直到天亮。\n\n「你不睡嗎？」\n\n「妳睡吧。」他說，「我看著。天亮以後，我陪妳{戻る|もどる}。」\n\n她不知道什麼時候睡著了。醒來的時候，身上多了一件他的外套，桌上放著一份早餐，和一張紙條：「妳家的碎玻璃，我已經{片付ける|かたづける}好了。」\n\n---\n\n一週後，她在公司的會議上，又看見了他。\n\n坐在最前面，被所有人稱作「天城社長」的人，正是她的鄰居。\n\n散會後，他把她叫進社長室。\n\n「那天晚上，」她紅著臉，「謝謝你……」\n\n「不用謝。」他走過來，把她困在門和他之間，「我只是很後悔。」\n\n「後悔什麼？」\n\n「後悔住在妳隔壁半年，卻連一句話都不敢跟妳說。」他低頭看她，「要不是那場地震，我大概到現在都只會在電梯裡偷看妳。」\n\n小夏的心跳，比那晚的地震還要{激しい|はげしい}。\n\n他捧起她的臉，輕輕吻了她。\n\n「[[もう〈一人:ひとり〉で〈震:ふる〉えるな。::不要再一個人發抖了。]]」他說，「以後，有我在。」\n\n她終於{安心|あんしん}地笑了。", "blurb": "半夜大地震，抱她離開滿地碎玻璃的，是從不笑的鄰居。「只要妳叫我，我馬上就到。」", "gram": {"pt": "〜ば", "mean": "如果～就～", "how": "動詞假定形＋ば（呼ぶ→呼べば）", "ex": "〈俺:おれ〉を〈呼:よ〉べば、すぐ〈行:い〉く。", "exzh": "只要妳叫我，我馬上就到。"}, "boss": {"name": "天城颯", "yomi": "あまぎ はやて", "mark": "颯", "c1": "#102a45", "c2": "#3c7bb8"}}, {"id": "A18", "title": "總裁的夏日祭典", "band": "N5-N4", "text": "七月最後一個週末，京都有一場很大的{お祭り|おまつり}。\n\n林夏穿著外婆留給她的{着物|きもの}，一個人去了。這是她來日本留學的第一個夏天，她想看看外婆說過的那條燈籠街。\n\n可是她沒想到，人會這麼多。\n\n{神社|じんじゃ}前面的路{込む|こむ}得連轉身都很難。她被人潮推著走，一回頭，已經不知道自己在哪裡了。\n\n手機沒電。她站在路邊，突然覺得自己像個{迷子|まいご}。\n\n---\n\n「妳的木屐帶子斷了。」\n\n一個低沉的聲音從頭上傳來。\n\n她抬頭，看見一個穿著深藍色浴衣的男人。高大，冷淡，在一片熱鬧的燈火裡，安靜得很突兀。\n\n他蹲下來，從口袋裡拿出一條手帕，三兩下替她把帶子綁好。\n\n「謝謝……」\n\n「一個人？」\n\n「嗯。我跟朋友走散了。」\n\n他站起來，看了看四周的人潮，伸出手。\n\n「抓著。」\n\n「咦？」\n\n「[[〈二度:にど〉と〈迷:まよ〉わないように、〈手:て〉を〈離:はな〉すな。::為了不讓妳再走丟，別放開我的手。]]」\n\n他的手很大，很暖。林夏的臉一下子紅了。\n\n---\n\n那一晚，他陪她走完了整條燈籠街。\n\n他們看了街頭的人跳舞。林夏也跟著{踊る|おどる}了幾步，跳得亂七八糟，他在旁邊看著，嘴角好像動了一下。\n\n她撈到一條金魚，{喜ぶ|よろこぶ}得像個孩子。他們又吃了蘋果糖。她的{着物|きもの}袖子不小心{汚れる|よごれる}了，他二話不說，拿手帕替她擦乾淨。\n\n「你好像對這裡很熟。」\n\n「我小時候每年都來。」他說，「長大以後，每年也來，只是都一個人，有點{寂しい|さびしい}。」\n\n「為什麼一個人？」\n\n他沉默了一下：「因為想一起來的人，一直沒有出現。」\n\n---\n\n最後，他帶她走到神社後面的一棵大樹下。\n\n樹上掛滿了寫著{願い|ねがい}的木牌。\n\n「在這裡許願，很靈。」他說。\n\n林夏閉上眼睛，雙手合十，認真地{祈る|いのる}。\n\n「妳許了什麼願？」\n\n「說出來就不靈了。」她笑著說，「那你呢？」\n\n他看著她，沒有回答。\n\n---\n\n{帰り|かえり}的路上，人潮漸漸散了，只剩燈籠還在{光る|ひかる}。\n\n在車站前，他終於停下腳步。\n\n「我叫御影朝陽。」他說，「東京御影集團的社長。」\n\n林夏瞪大了眼睛：「社、社長？那你怎麼會一個人來祭典？」\n\n「因為十年前，有一個穿著和服的小女孩，也在這裡走丟了。」他說，「是我{連れる|つれる}她去找她外婆的。她說，等她長大了，要再來這裡找我。」\n\n林夏愣住了。那年她才十歲，跟外婆來京都玩，在祭典上走丟過一次。她只記得自己哭得很慘，卻不記得是誰牽著她回去的。\n\n「我每年都來等。」他說，「今年，終於等到了。」\n\n「這種事……也太不可思議了吧。」她的眼眶紅了。\n\n「所以我剛才許的願，」他把她拉進懷裡，「就是不要再讓妳走丟。」\n\n他低頭吻住她。遠處，夏夜的鐘聲{鳴る|なる}了起來。\n\n「[[〈来年:らいねん〉も、〈俺:おれ〉と〈来:こ〉い。::明年，也跟我一起來。]]」\n\n這一次，她緊緊握住他的手，再也沒有放開。\n\n那件{着物|きもの}很{似合う|にあう}她。他在心裡想，這十年，等得值得。", "blurb": "京都夏日祭典，木屐帶子斷了的她，被一個陌生男人牽住了手。「別放開我的手。」", "gram": {"pt": "〜ないように", "mean": "為了不～", "how": "動詞ない形＋ように（迷う→迷わないように）", "ex": "〈二度:にど〉と〈迷:まよ〉わないように、〈手:て〉を〈離:はな〉すな。", "exzh": "為了不讓妳再走丟，別放開我的手。"}, "boss": {"name": "御影朝陽", "yomi": "みかげ あさひ", "mark": "陽", "c1": "#1a2c55", "c2": "#6a8fd8"}}, {"id": "A19", "title": "總裁的病房鄰居", "band": "N5-N4", "text": "周小語是因為發燒進醫院的。\n\n連續加班三個禮拜，{熱|ねつ}高達三十九度，{喉|のど}痛得連水都吞不下去。醫生看了一眼她的檢查報告，直接開了單子：「{入院|にゅういん}。」\n\n單人病房很安靜。安靜得讓人想哭。\n\n她從小父母就不在身邊，一個人在台灣長大，一個人來東京工作，連生病都是一個人。\n\n---\n\n第二天下午，病房的門被推開。\n\n一個男人拄著拐杖站在門口。病人服穿在他身上，竟然像訂做的西裝一樣好看。\n\n「走錯了。」他說。\n\n第三天，他又走錯了。\n\n第四天，他乾脆不解釋了，直接坐到她床邊的椅子上。\n\n「你到底是誰？」小語忍不住問。\n\n「隔壁的。」他舉起打著石膏的右腳，「骨頭{折れる|おれる}了，要住兩週。」\n\n「那你為什麼一直來我這裡？」\n\n「妳的病房，窗外的{景色|けしき}比較好。」\n\n小語看了看窗外——對面是一堵灰色的牆。\n\n---\n\n從那天起，他每天都來。\n\n護理師來{注射|ちゅうしゃ}的時候，她覺得很{怖い|こわい}，閉上眼睛。他會若無其事地握住她的手。\n\n藥太{苦い|にがい}，她不想吃。他把藥和一顆糖一起放在她手心：「吃完才有糖。」\n\n半夜她發燒，手腳{冷える|ひえる}，迷迷糊糊地喊冷。醒來的時候，身上多了一條毯子，他靠在椅子上睡著了，眉頭還皺著。\n\n「你不{眠い|ねむい}嗎？」她問。\n\n「習慣了。」他揉揉眼睛，「公司的事比較讓人睡不著。」\n\n她這才知道，他叫高嶺暁人，是一間大公司的社長。\n\n---\n\n一週後，她的{具合|ぐあい}好多了。\n\n可是她發現，自己開始期待每天下午三點，那陣拐杖敲在地板上的聲音。\n\n那天，三點過了，他沒有來。\n\n四點，五點，他還是沒有來。\n\n小語抱著膝蓋，看著門口，心裡空空的。她到現在才發現，自己好{寂しい|さびしい}。\n\n六點，門終於被推開了。\n\n他沒有拄拐杖，手裡捧著一束花。\n\n「醫生說妳明天可以{退院|たいいん}了。」他說，「所以我去買了這個。」\n\n「你的腳……」\n\n「還沒好。」他面不改色，「我只是不想拄著拐杖來說這種話。」\n\n「什麼話？」\n\n他把花放在她手上，看著她。\n\n「[[〈今:いま〉にも〈泣:な〉きそうな〈顔:かお〉だな。::妳一副快要哭出來的樣子。]]」他說，「是因為我晚來了嗎？」\n\n小語{我慢|がまん}了一整天的眼淚，終於掉下來了。\n\n「我以為……你出院了，就不會再來了。」\n\n「笨蛋。」他用拇指擦掉她的眼淚，「我每天走錯病房，走了七天。妳以為我是真的迷路？」\n\n他低頭，輕輕吻了她的額頭。\n\n「出院以後，換我來照顧妳。」他頓了一下，「不准再一個人生病，也不准再加班到倒下。」\n\n「這是命令嗎？」\n\n「對。」他說，「[[〈早:はや〉く〈元気:げんき〉になれ。::快點好起來。]]」\n\n小語破涕為笑。她靠在他肩上，聞到淡淡的消毒水味，覺得自己的心好像也被治癒了。\n\n他的手輕輕拍著她的{背中|せなか}，像在哄一個小孩。\n\n「還有，」他說，「妳{痩せる|やせる}太多了。出院第一件事，跟我去吃飯。」", "blurb": "發燒住院的她，每天都有一個「走錯病房」的男人來報到。「妳一副快哭的樣子。」", "gram": {"pt": "〜そうだ（樣態）", "mean": "看起來好像要～", "how": "動詞ます形去ます＋そうだ（泣きます→泣きそうな顔）", "ex": "〈今:いま〉にも〈泣:な〉きそうな〈顔:かお〉だな。", "exzh": "妳一副快要哭出來的樣子。"}, "boss": {"name": "高嶺暁人", "yomi": "たかね あきと", "mark": "暁", "c1": "#172a48", "c2": "#5585c4"}}, {"id": "A20", "title": "總裁的十年之約", "band": "N5-N4", "text": "高二那年冬天，江晚收到一張紙條。\n\n「星期六下午兩點，市立美術館門口。我等妳。——久世」\n\n寫紙條的人，是快要{卒業|そつぎょう}、大她一屆的{先輩|せんぱい}，久世晴臣。全校最冷淡、也最受歡迎的男生。\n\n她一整晚沒睡。換了五套衣服，最後穿上媽媽買給她的白色大衣。\n\n可是那個星期六，她沒有去。\n\n那天早上，爸爸的公司倒了。全家人連夜收拾行李，{引っ越す|ひっこす}到外婆住的鄉下。她連一句再見都沒來得及說。\n\n---\n\n十年後，東京。\n\n江晚在一間小小的翻譯社上班。某天，社長拿著一份合約衝進辦公室：「大案子！久世集團指定要妳去口譯！」\n\n會議室的門一打開，她手上的資料差點掉在地上。\n\n坐在長桌盡頭的男人，眉眼和{昔|むかし}一模一樣，只是更成熟，也更冷了。\n\n「{久しぶり|ひさしぶり}。」久世晴臣說，「江晚。」\n\n---\n\n整場會議，他一次都沒有看她。\n\n散會後，所有人都走了。她收拾東西的手在{震える|ふるえる}。\n\n「{先輩|せんぱい}……」\n\n「十年了。」他靠在門邊，聲音很平靜，「妳欠我一個{訳|わけ}。」\n\n她低下頭：「那天，我家出了事。我們連夜搬走了，我不知道你的{住所|じゅうしょ}，也沒有辦法{連絡|れんらく}你……」\n\n「我知道。」\n\n她猛地抬頭。\n\n「我後來去找過妳。」他說，「妳家的房子空了，鄰居說你們搬走了，沒有人知道去了哪裡。」\n\n「對不起。」她的眼淚掉了下來，「我真的很想去。那件白色大衣，我到現在都還留著。」\n\n他看著她，很久很久。\n\n「[[〈待:ま〉っていたのに、なぜ〈来:こ〉なかった。::我明明一直在等，妳為什麼沒來？]]」\n\n那句話很輕，卻像一根針，扎在她心上。\n\n「那天，我在美術館門口，從兩點等到閉館。」他說，「警衛來趕人，我說，再等五分鐘。」\n\n「後來，我每年那天都去。十年，一次都沒有缺席。」\n\n江晚哭得說不出話。\n\n---\n\n他走過來，把她逼到會議桌邊，低頭看她。\n\n「妳知道，這次的口譯，我為什麼指定妳嗎？」\n\n她搖頭。\n\n「三個月前，我在一場研討會上聽見一個聲音。」他說，「隔了十年，我還是一下子就認出來了。」\n\n「我讓秘書{調べる|しらべる}了半個月，才找到妳的公司。」\n\n「為什麼不直接來找我？」\n\n「因為我還在{怒る|おこる}。」他說，「該{謝る|あやまる}的人，應該是妳。」\n\n江晚破涕為笑：「那現在呢？」\n\n「現在，」他捧起她的臉，「我不想再等了。」\n\n他吻住她，吻得很深，像要把十年的等待一次討回來。\n\n吻完，他從口袋裡拿出兩張票。\n\n「這次，我們重新{約束|やくそく}。下週六，下午兩點。」他說，「市立美術館。這次的{展覧会|てんらんかい}，是我們公司辦的。」\n\n「[[〈今度:こんど〉は〈必:かなら〉ず〈来:こ〉い。::這一次，妳一定要來。]]」\n\n江晚笑著點頭，眼淚又掉了下來。\n\n那個週六，她穿著那件白色大衣，提早一個小時到了。大衣還是很{似合う|にあう}她。\n\n他已經在那裡了。\n\n「{残念|ざんねん}，」他說，「這次還是我先到。」", "blurb": "十年前她失約的那場美術館約會，他每年都去等。「我明明一直在等。」", "gram": {"pt": "〜のに", "mean": "明明～卻～", "how": "普通形＋のに（待っていた→待っていたのに）", "ex": "〈待:ま〉っていたのに、なぜ〈来:こ〉なかった。", "exzh": "我明明一直在等，妳為什麼沒來？"}, "boss": {"name": "久世晴臣", "yomi": "くぜ はるおみ", "mark": "臣", "c1": "#14284a", "c2": "#4d7fc0"}}, {"id": "A21", "title": "總裁的屋頂花園", "band": "N5-N4", "text": "早川綠是一個園藝師。\n\n她最喜歡的工作，是替大樓的{屋上|おくじょう}種花。每次看到灰色的水泥頂樓，一點一點變成綠色，她就覺得很幸福。\n\n這次的客人，是一棟四十層的辦公大樓。\n\n「社長的要求只有一個。」秘書遞給她一張紙，「讓頂樓變成一座森林。」\n\n「森林？在頂樓？」\n\n「是的。預算沒有上限。」\n\n---\n\n工作開始的第一天，她在頂樓遇見了一個男人。\n\n他站在欄杆旁邊，西裝外套搭在手臂上，看著遠方發呆。\n\n「這裡是施工區域，請小心——」\n\n他回過頭，冷冷地看她一眼：「妳是園藝師？」\n\n「是。」\n\n「這裡以前什麼都沒有。」他說，「只有風。」\n\n她後來才知道，他就是這棟大樓的社長，桐谷澄人。\n\n從那天起，他每天中午都會上來。\n\n她{植える|うえる}樹，他在旁邊看。她剪{枝|えだ}，他替她撿起掉在地上的葉子。她{運ぶ|はこぶ}泥土，他默默接過袋子。她蹲在地上抓{虫|むし}，他皺著眉頭站得遠遠的。\n\n「你很怕蟲？」\n\n「……不怕。」\n\n她笑了。她第一次覺得，這個冷冰冰的男人，有點可愛。\n\n---\n\n三個月後，頂樓真的變成了一座小森林。\n\n{美しい|うつくしい}的櫻花樹、楓樹、一片小小的{芝生|しばふ}，還有一個她親手做的鳥屋。春天的時候，第一隻小鳥飛來了。樹葉在風裡輕輕{揺れる|ゆれる}。\n\n「好{珍しい|めずらしい}，」她{喜ぶ|よろこぶ}地說，「這麼高的地方，也會有鳥來。」\n\n男人看著她，沒有看鳥。\n\n工程結束的那天，她來做最後的檢查。\n\n頂樓的正中央，多了一張白色的長椅。長椅旁邊，種著一棵她沒有種過的樹。\n\n「這是什麼？」\n\n「茉莉花。」他說，「妳說過，妳外婆家的院子裡有一棵。」\n\n她{驚く|おどろく}得說不出話。她只在某天中午，隨口提過一次。\n\n---\n\n「為什麼要蓋這座森林？」她問。\n\n他沉默了很久。\n\n「我母親生前最喜歡花。」他說，「她說，等我長大了，要帶她去一個看得見整個城市、又開滿花的地方。」\n\n「可是我太忙了。等我終於有時間的時候，她已經{亡くなる|なくなる}了。」\n\n「所以，我{決める|きめる}了，要親手{育てる|そだてる}滿園的花。」\n\n早川綠的眼眶紅了。\n\n「那你一開始，為什麼要找我？」\n\n「兩年前，我在醫院的頂樓，看見一個女生在替病人種花。」他說，「那是我母親住過的醫院。」\n\n「她說，就算只剩下一點點時間，也想讓人看見花開。」\n\n他轉過身，看著她：「那個人是妳。」\n\n她說不出話來。\n\n他走過來，把她輕輕拉進懷裡。\n\n「[[〈君:きみ〉のために〈作:つく〉った。::這是為妳打造的。]]」他低聲說，「一開始是為了我母親。後來，是為了妳。」\n\n「每天中午上來，不是為了看景色。」\n\n「是為了看妳。」\n\n她仰起臉。他低頭吻住她，茉莉花的{匂い|におい}在風裡散開。\n\n「[[ここは〈君:きみ〉だけの〈場所:ばしょ〉だ。::這裡，是只屬於妳的地方。]]」\n\n那天以後，頂樓的森林，一年四季都{咲く|さく}著不一樣的花。\n\n而那張白色長椅上，總是坐著兩個人。", "blurb": "園藝師把總裁的頂樓變成一座森林，才發現那是為她蓋的。「這是為妳打造的。」", "gram": {"pt": "〜ために", "mean": "為了～", "how": "名詞＋のために（為了某人）／動詞辭書形＋ために（目的）", "ex": "〈君:きみ〉のために〈作:つく〉った。", "exzh": "這是為妳打造的。"}, "boss": {"name": "桐谷澄人", "yomi": "きりたに すみと", "mark": "澄", "c1": "#1b3046", "c2": "#4f8f9e"}}, {"id": "A22", "title": "總裁的氣象主播", "band": "N5-N4", "text": "早上五點四十五分，電視台的攝影棚燈火通明。\n\n新人氣象主播葉小晴，正在做{天気予報|てんきよほう}前的最後準備。\n\n她的{夢|ゆめ}是當一個{アナウンサー}。可是進電視台一年，她只拿到清晨六點，三分鐘的氣象時段。\n\n「今天下午會轉晴……」她對著鏡子小聲練習，「不對，是多雲……」\n\n「緊張？」\n\n身後傳來一個聲音。她回頭，看見一個穿著黑色大衣的男人，靠在門邊。\n\n「你是……新來的工作人員嗎？」\n\n男人看了她一眼，沒有回答，轉身走了。\n\n---\n\n那天的{放送|ほうそう}，她犯了一個大{ミス}。\n\n她把「颱風會轉向」，說成了「颱風會登陸」。\n\n直播結束後，製作人{怒る|おこる}得把稿子摔在桌上：「沒經驗不是藉口！妳不適合這個工作！」\n\n小晴躲在樓梯間哭。\n\n那個男人又出現了。他遞給她一杯熱咖啡。\n\n「哭完了嗎？」\n\n「你是來看我笑話的嗎？」她{慌てる|あわてる}地擦掉眼淚。\n\n「不是。」他在她旁邊的台階坐下，「我只是想{伝える|つたえる}妳一件事。今天早上，有一位老先生打電話來。」\n\n「他說，他每天早上都看妳的氣象。因為妳講話的樣子，很像他已經過世的女兒。」\n\n小晴愣住了。\n\n「他說，今天妳說錯的時候，臉紅的樣子很可愛。」他頓了一下，「我也這麼覺得。」\n\n---\n\n從那天起，那個男人每天早上都會出現在攝影棚的角落。\n\n她說得好，他會{褒める|ほめる}她一句。她說錯了，他會在下班後，{熱心|ねっしん}地陪她一句一句檢討。\n\n「{台風|たいふう}的路線，要先說結論。」\n\n「妳的笑容很重要。觀眾早上第一個看到的人是妳。」\n\n她慢慢不再{間違える|まちがえる}了。\n\n一個月後，製作人突然通知她：下個月開始，她可以主持晚間七點的氣象{番組|ばんぐみ}。\n\n「怎麼會……」\n\n「上面的人親自指名的。」製作人說，「社長說，妳將來很有可能性。」\n\n---\n\n第一次晚間直播結束，她在後台見到了社長。\n\n是那個男人。\n\n「你……你是社長？」她{驚く|おどろく}得說不出完整的話。\n\n「有栖川瑛。」他說，「電視台是我們集團的。」\n\n「那你每天早上都來攝影棚……」\n\n「為了看妳的天氣預報。」他說得理所當然，「我每天早上六點，一定會看完妳的三分鐘，才開始工作。」\n\n「為什麼？」\n\n他走近一步，把她圈在牆和他之間。\n\n「一年前，妳第一次播報。」他說，「那天下大雨，妳說：『今天出門的人，請記得帶傘。不要淋濕了，大家都辛苦了。』」\n\n「那天我剛失去一個很重要的案子，心情很糟。可是聽完妳那句話，我竟然笑了。」\n\n「從那天起，我就想，」他低頭看她，「[[〈好:す〉きになったかもしれない。::我好像喜歡上妳了。]]」\n\n小晴{恥ずかしい|はずかしい}得臉一下子紅透了。\n\n「不、不是『好像』嗎？」\n\n「現在不是了。」他捧起她的臉，「是確定。」\n\n他吻住她，攝影棚外的燈一盞一盞熄滅。\n\n「[[〈明日:あした〉は〈晴:は〉れる。〈俺:おれ〉が〈保証:ほしょう〉する。::明天會放晴。我保證。]]」\n\n這是她聽過，最不專業、也最讓人心動的天氣預報。", "blurb": "播錯颱風路線的新人氣象主播，被每天看她三分鐘的社長看上了。", "gram": {"pt": "〜かもしれない", "mean": "也許～", "how": "普通形＋かもしれない（好きになった→好きになったかもしれない）", "ex": "〈好:す〉きになったかもしれない。", "exzh": "我好像喜歡上妳了。"}, "boss": {"name": "有栖川瑛", "yomi": "ありすがわ えい", "mark": "瑛", "c1": "#162b52", "c2": "#5e88d6"}}, {"id": "A23", "title": "總裁的新秘書", "band": "N5-N4", "text": "進公司第三個月，林可欣終於明白，自己被{いじめる}了。\n\n她的資料常常不見，最後在垃圾桶裡找到，被人{捨てる|すてる}了。\n\n她的茶杯被人{割る|わる}了，沒有人{謝る|あやまる}。\n\n午休的時候，同事們聚在一起說笑。她一走過去，大家就安靜了。\n\n帶頭的是營業部的{課長|かちょう}，一個總是化著精緻妝容的女人。\n\n「台灣來的？」課長第一天就笑著說，「聽說妳是靠關係進來的？」\n\n可欣不懂，自己是一關一關考進來的。\n\n可是，沒有人聽她解釋。\n\n---\n\n那天晚上九點，辦公室只剩下她一個人。\n\n課長下班前，把一整疊明天要用的資料丟到她桌上：「全部重新做。」\n\n她一邊打字，一邊{我慢|がまん}著眼淚。\n\n「這麼晚還{残る|のこる}？」\n\n一個低沉的聲音在背後響起。她嚇了一跳，回頭看見一個高大的男人，西裝外套搭在手臂上，大概是別的部門的人。\n\n「我……明天開會要用。」\n\n男人拿起那疊資料翻了翻，眉頭皺了起來：「這些不是妳的工作。」\n\n「沒關係，我做得完。」\n\n男人沒有走。他拉了一張椅子坐到她旁邊，拿起一半資料。\n\n「我{手伝う|てつだう}。」\n\n「不、不用了，這樣會給你添{迷惑|めいわく}……」\n\n「少廢話。」\n\n那一晚，他們做到十二點。他打字很快，比她快兩倍。\n\n---\n\n從那天起，那個男人常常在深夜出現。\n\n他從不說自己是誰。她只知道，他喜歡黑咖啡，不喜歡說話，每次都會在她哭之前，剛好出現。\n\n有一次，她終於忍不住問：「你為什麼要幫我？」\n\n他想了一下：「因為妳做的資料，很{丁寧|ていねい}。」\n\n「丁寧？」\n\n「我看得出來，」他說，「妳是一個{真面目|まじめ}的人。」\n\n那是她進公司以後，第一次有人{褒める|ほめる}她。\n\n---\n\n一週後的全體會議上，社長第一次在員工面前露面。\n\n可欣抬起頭，差點把手上的筆掉在地上。\n\n站在台上的，正是那個深夜陪她加班的男人。伊集院翼，伊集院集團社長。\n\n會議的最後，他突然說：「營業部課長，請留下來。」\n\n整個會議室安靜了。\n\n「這三個月，」他{怒る|おこる}得聲音都冷了，看著課長，「把別人的資料丟掉、把別人的杯子打破、把自己的工作推給新人。需要我一件一件說明嗎？」\n\n課長臉色發白。\n\n「我{注意|ちゅうい}妳一次。」他說，「[[〈君:きみ〉を〈泣:な〉かせるやつは〈許:ゆる〉さない。::讓妳哭的人，我絕不放過。]]」\n\n後面那句，他是看著可欣說的。\n\n---\n\n散會後，他把她叫進社長室。\n\n「為什麼不早點告訴我你是社長？」她紅著眼睛問。\n\n「因為妳會躲著我。」他走過來，把她逼到門邊，「就像現在這樣。」\n\n「我、我沒有……」\n\n「而且，」他低頭看她，「我不想讓妳覺得，我只是因為同情才幫妳。」\n\n「那是因為什麼？」\n\n他沒有回答，低頭吻了她。很輕，卻不容拒絕。\n\n「[[〈今日:きょう〉から、〈俺:おれ〉の〈秘書:ひしょ〉になれ。::從今天起，當我的秘書。]]」\n\n「這、這是命令嗎？」\n\n「對。」他說，「這樣，妳每天加班，我{決して|けっして}不會缺席。」\n\n可欣笑了出來，眼淚卻掉了下來。\n\n她終於不再委屈了。", "blurb": "被課長欺負的新人，深夜總有一個陌生男人陪她加班。「讓妳哭的人，我絕不放過。」", "gram": {"pt": "〜させる（使役）", "mean": "讓～", "how": "動詞使役形（泣く→泣かせる）", "ex": "〈君:きみ〉を〈泣:な〉かせるやつは〈許:ゆる〉さない。", "exzh": "讓妳哭的人，我絕不放過。"}, "boss": {"name": "伊集院翼", "yomi": "いじゅういん つばさ", "mark": "翼", "c1": "#112440", "c2": "#3f73b5"}}, {"id": "A24", "title": "總裁的替身相親", "band": "N5-N4", "text": "「拜託妳，就這一次！」\n\n姊姊抓著宋恩恩的手，眼淚汪汪：「爸媽逼我去相親，可是我已經有男朋友了！妳替我去，坐一個小時就好！」\n\n「我們長得又不{似る|にる}！」\n\n「放心，這次是媽媽的朋友{紹介|しょうかい}的，對方沒看過我的照片。」姊姊說，「妳只要表現得很糟，讓他{断る|ことわる}就好。」\n\n就這樣，恩恩換上姊姊的洋裝，走進了銀座一間高級日本料理店。\n\n---\n\n包廂裡已經坐著一個男人。\n\n黑色西裝，坐姿端正，冷淡的臉上沒有一點表情。\n\n「榊原千景。」他站起來，很{丁寧|ていねい}地{挨拶|あいさつ}，「今天請多指教。」\n\n恩恩照著計畫，故意把茶杯放得很大聲。\n\n「我很不會做菜。」她說。\n\n「沒關係，我會。」\n\n「我很愛花錢。」\n\n「沒關係，我很會賺。」\n\n「我、我的{趣味|しゅみ}是……睡覺。」\n\n他停了一下：「很好的{趣味|しゅみ}。」\n\n恩恩快崩潰了。這個男人，到底是怎麼回事？\n\n---\n\n一個小時過去了。\n\n她終於放棄了，乖乖地吃完了一整份天婦羅。\n\n「這裡的東西真好吃。」她忍不住說，「我小時候在台灣住過幾年，最喜歡跟我爸一起去吃日本料理。」\n\n「台灣？」他抬起眼睛，「宋恩美的資料上寫，她從沒離開過大阪。」\n\n糟了。恩恩{驚く|おどろく}得筷子停在半空中。\n\n「妳不是宋恩美。」他說，「妳是她妹妹。」\n\n「你……你怎麼知道？」\n\n「妳姊姊高中時的照片，我看過。」他說，「她的眼睛是單眼皮。」\n\n恩恩{恥ずかしい|はずかしい}得臉一下子漲紅：「對不起！我不是故意要說{嘘|うそ}……不，我是故意的。這樣真的很{失礼|しつれい}，對不起！」\n\n她站起來，深深地鞠躬，{正直|しょうじき}地說了實話。\n\n「我姊姊已經有男朋友了，她不想來，所以……請你{断る|ことわる}這門親事吧。」\n\n---\n\n包廂裡安靜了很久。\n\n「好。」他說，「我拒絕和宋恩美結婚。」\n\n恩恩鬆了一口氣。\n\n「然後，」他也站了起來，「我想和妳談談。」\n\n「咦？」\n\n「從妳故意把茶杯放得很大聲開始，」他繞過桌子，走到她面前，「我就想笑。」\n\n「說自己不會做菜的時候，妳的手指在桌下絞成一團。說自己愛花錢的時候，妳點了菜單上最便宜的東西。」\n\n「妳不會說謊。」他低頭看她，「這樣的人，我第一次遇見。」\n\n恩恩的心跳亂了。\n\n「我回去會跟妳的{親|おや}好好{相談|そうだん}。」他說，「這門親事，換個人繼續。」\n\n「換、換誰？」\n\n「妳。」他說得理所當然，「[[〈君:きみ〉と〈結婚:けっこん〉することにした。::我決定要跟妳結婚。]]」\n\n「你、你瘋了！我們才見面一個小時！」\n\n「一個小時就夠了。」他說，「我做生意，從來不需要看第二次。」\n\n她還有一堆{文句|もんく}想說，他已經伸手扶住她的後頸，低頭吻住她。\n\n很輕，很短，卻讓她整個人都忘了呼吸。\n\n「[[〈断:ことわ〉っても〈無駄:むだ〉だ。::妳拒絕也沒用。]]」\n\n恩恩想，今天回去，大概要換姊姊來替她{謝る|あやまる}了。", "blurb": "替姊姊去相親，故意表現很糟，對方卻說：「我決定要跟妳結婚。」", "gram": {"pt": "〜ことにする", "mean": "決定～", "how": "動詞辭書形＋ことにした（結婚する→結婚することにした）", "ex": "〈君:きみ〉と〈結婚:けっこん〉することにした。", "exzh": "我決定要跟妳結婚。"}, "boss": {"name": "榊原千景", "yomi": "さかきばら ちかげ", "mark": "景", "c1": "#1e2c50", "c2": "#6f86c9"}}, {"id": "A25", "title": "總裁的深夜自習室", "band": "N5-N4", "text": "每天晚上十點，車站旁那間二十四小時的自習室，都會亮著一盞燈。\n\n坐在靠窗第三個位子的，是陳安安。這間自習室，她已經{通う|かよう}了一年。\n\n她白天在便利商店打工，晚上念書，準備明年春天的大學入學{試験|しけん}。這是她第二次考了。\n\n去年，她差了三分。\n\n---\n\n自習室裡，還有另一個常客。\n\n坐在她斜後方的男人。三十歲上下，西裝，筆電，總是在打一些看起來很難的報告。他每天十一點來，{夜中|よなか}兩點走，從來不說一句話。\n\n直到有一天，安安{眠い|ねむい}得趴在桌上睡著了。\n\n醒來的時候，身上多了一件西裝外套。桌上放著一罐熱可可，和一張便條：\n\n「第三題的文法錯了。」\n\n她翻開筆記一看——真的錯了。\n\n---\n\n從那天起，她的桌上常常出現便條。\n\n「這一段{復習|ふくしゅう}三次。」\n\n「數學的公式，背錯了。」\n\n「今天的{予習|よしゅう}很好。」\n\n她開始在便條背面回信：「謝謝你。可是你是誰？」\n\n隔天的便條只有一句話：「先考上再說。」\n\n---\n\n考試前一週，安安在自習室{倒れる|たおれる}了。\n\n醒來的時候，她已經在醫院了。那個男人坐在旁邊，看起來非常{心配|しんぱい}。\n\n「醫生說妳太{無理|むり}了。」他說，「每天睡幾個小時？」\n\n「三、三個小時……」\n\n他的臉更難看了。\n\n「白天打工，晚上念書，還不好好吃飯。」他壓低聲音，「妳以為妳的身體是鐵做的嗎？」\n\n「可是我{必ず|かならず}要考上。」她咬著嘴唇，「我爸生病了，我不能再{落ちる|おちる|落る}一次。」\n\n他看著她，很久沒有說話。\n\n然後，他把一個信封放在她手上。\n\n「這是什麼？」\n\n「便利商店的店長，是我的朋友。」他說，「從明天起，妳放一個月的假。薪水照付。」\n\n「我不能收——」\n\n「[[〈頑張:がんば〉りすぎるな。::不要太拚了。]]」他打斷她，「妳已經很努力了。剩下的，交給我。」\n\n---\n\n三月，放榜。\n\n安安在榜單上看見自己的名字，{喜ぶ|よろこぶ}得差點哭出來。第一個想到的，是那個人。\n\n她衝到自習室。靠窗第三個位子的桌上，放著一束花，和一張便條：\n\n「{合格|ごうかく}，恭喜。」\n\n最下面一行，用很工整的字署名：「鳴海遥斗。」\n\n她拿著便條轉身，他就站在門口。\n\n「你、你一直在等我？」安安{驚く|おどろく}地問。\n\n「嗯。」鳴海遥斗說，「等了一年。」\n\n「為什麼？」\n\n「去年，妳差三分落榜那天，在這裡哭了一整晚。」他說，「我坐在後面，聽了一整晚。」\n\n「那時候我就決定，明年，一定要看妳笑。」\n\n他走過來，把她拉進懷裡。\n\n「現在，妳笑了。」他低頭吻住她，「妳的{約束|やくそく}，也該兌現了。」\n\n「什麼約定？」\n\n「考上以後，」他說，「跟我交往。」\n\n「你什麼時候說過！」\n\n他從口袋裡掏出一張舊便條，是她半年前寫的回信：「如果我考上，你想要什麼都可以。」\n\n安安的臉一下子紅透了。\n\n「[[〈俺:おれ〉の〈言:い〉うことを〈聞:き〉け。::聽我的話。]]」他笑了，「這是妳自己答應的。」", "blurb": "深夜自習室，斜後方的陌生男人每天留便條給她。「不要太拚了。」", "gram": {"pt": "〜すぎる", "mean": "太～", "how": "動詞ます形去ます＋すぎる（頑張ります→頑張りすぎる）", "ex": "〈頑張:がんば〉りすぎるな。", "exzh": "不要太拚了。"}, "boss": {"name": "鳴海遥斗", "yomi": "なるみ はると", "mark": "遥", "c1": "#122a4a", "c2": "#4a86c9"}}, {"id": "A26", "title": "總裁的雨傘", "band": "N5-N4", "text": "六月的東京，雨下個不停。\n\n晚上八點，沈小雨抱著一疊文件{急いで|いそいで|急ぐ}衝出公司大門，才發現自己又忘了帶傘。傘，是她最常見的{忘れ物|わすれもの}。\n\n她站在屋簷下，看著街上的雨，越下越大。外面已經完全{暮れる|くれる}了。\n\n「又沒帶傘？」\n\n身後傳來一個冷淡的聲音。她回頭，看見社長真壁拓海站在那裡，手裡拿著一把黑色的長傘。\n\n這已經是這個月第三次了。奇怪的是，每次她忘了帶傘，隔天桌上就會莫名多出一把傘。她每次都把那些傘帶回家，然後又忘在家裡。\n\n「我、我等雨小一點就走。」\n\n「天氣預報說，會下到明天早上。」他把傘塞進她手裡，「拿去。」\n\n「那社長你呢？」\n\n「我有車。」他說完，轉身走進了停車場。\n\n---\n\n第二天早上，小雨把傘還回社長室。\n\n傘柄上，綁著一張小小的便條：「下次記得帶。」\n\n她笑了。可是那天晚上，她又忘了。\n\n這次，社長沒有出現。\n\n她咬咬牙，抱著文件衝進雨裡。她拚命跑，想{間に合う|まにあう}最後一班電車，在樓梯上差點{滑る|すべる}。跑到車站的時候，全身都{濡れる|ぬれる}了，連頭髮都在滴水。\n\n---\n\n隔天，她發燒了。\n\n她一個人躺在小公寓裡，全身{冷える|ひえる}，連起來{沸かす|わかす}一壺熱水的力氣都沒有。\n\n傍晚，門鈴響了。\n\n門外站著的，是真壁拓海。她{驚く|おどろく}得說不出話。他手上提著一個紙袋，西裝肩膀濕了一片。\n\n「你怎麼知道我住這裡？」\n\n「人事資料。」他毫不心虛，「下班時{寄る|よる}一下。躺回去。」\n\n他在她小小的廚房裡忙了半天，端出一碗熱騰騰的粥，又{用意|ようい}好毛巾和藥。\n\n「你為什麼……對我這麼好？」\n\n他沉默了一下：「因為妳每次忘記帶傘，我都很{心配|しんぱい}。」\n\n「昨天，我開完會出來，妳已經走了。」他的聲音低了下去，「我開車繞了三條街{探す|さがす}妳。」\n\n小雨的眼眶一熱。\n\n「那、那三把傘……」\n\n「是我故意放在妳桌上的。」他說，「我想，總有一天，妳會發現。」\n\n他用毛巾{包む|つつむ}住冰塊，輕輕敷在她發燙的額頭上，動作很{優しい|やさしい}。\n\n「以後下雨天，不准一個人走。」\n\n「可是社長你那麼忙……」\n\n「[[〈仕事:しごと〉が〈終:お〉わってから、〈迎:むか〉えに〈行:い〉く。::等我工作結束，就去接妳。]]」\n\n他低頭，在她發燙的額頭上落下一個吻。\n\n「[[〈俺:おれ〉の〈傘:かさ〉に〈入:はい〉れ。::到我的傘下來。]]」\n\n---\n\n一週後，她的病好了。\n\n下班時，外面又下起了雨。\n\n她站在門口，這次沒有慌張。因為她知道，有一個人會來。\n\n果然，一把黑色的傘撐在她頭上。\n\n「走吧。」真壁拓海說。\n\n她靠在他身邊，雨聲變得好溫柔。她大概會一直記得這一天。\n\n從那天起，她再也沒有帶過傘。\n\n因為，她已經有一個專屬的雨傘了。", "blurb": "總是忘了帶傘的她，桌上一直出現一把黑傘。「等我工作結束，就去接妳。」", "gram": {"pt": "〜てから", "mean": "～之後（再）", "how": "動詞て形＋から（終わる→終わってから）", "ex": "〈仕事:しごと〉が〈終:お〉わってから、〈迎:むか〉えに〈行:い〉く。", "exzh": "等我工作結束，就去接妳。"}, "boss": {"name": "真壁拓海", "yomi": "まかべ たくみ", "mark": "拓", "c1": "#13294d", "c2": "#4f7fc4"}}, {"id": "A27", "title": "總裁的花見約會", "band": "N5-N4", "text": "四月，上野公園的櫻花開了。\n\n公司每年都會辦一場{花見|はなみ}，由部長指派一個人負責一大早去占位子。\n\n今年輪到的是何曉曉。她早上四點就起床做好{支度|したく}，五點就到了，在一棵最大的櫻花樹下鋪好野餐墊，一個人坐在那裡，冷得一直{震える|ふるえる}。\n\n「妳在這裡做什麼？」\n\n一個穿著灰色大衣的男人站在她面前。他的頭髮上，落了一片花瓣。\n\n「幫公司占位子。」她說，「今天下午有花見。」\n\n男人看了看她冷得發紅的手，皺起眉頭，把自己的圍巾解下來，{包む|つつむ}住她的脖子。\n\n「你、你不用……」\n\n「閉嘴。」他在她旁邊坐下，「我也在等人。」\n\n---\n\n那一個早上，他們聊了很久。\n\n他說他幾乎不休假，每天都在工作。她說她來日本一年了，還沒好好{見物|けんぶつ}過東京。\n\n「那今天就是第一次。」他說。\n\n太陽慢慢升起來，陽光很{柔らかい|やわらかい}。風一吹，花瓣像雪一樣{散る|ちる}下來。她伸出手，想{捕まえる|つかまえる}一片，卻怎麼也抓不到。\n\n他抬起手，輕輕一夾，把一片花瓣放在她手心。\n\n「給妳。」\n\n她{嬉しい|うれしい}地笑了。他看著她，好像有點愣住。\n\n---\n\n中午，同事們{騒ぐ|さわぐ}著陸續到了。\n\n「曉曉，辛苦了！」部長笑著走過來，然後突然停住，臉色一變，恭敬地{挨拶|あいさつ}：「社、社長！您竟然來花見，真{珍しい|めずらしい}！」\n\n曉曉{驚く|おどろく}得差點把手上的茶打翻。\n\n坐在她旁邊、陪她聊了一整個早上的男人，是公司的社長，水瀨碧斗。\n\n「我說過，」水瀨碧斗淡淡地說，「我在等人。」\n\n---\n\n花見結束，大家陸續往車站走了。\n\n曉曉留下來{片付ける|かたづける}垃圾。等她回過神來，公園裡只剩下她，和社長。\n\n「你在等誰？」她終於忍不住問，「你早上說的那個人，最後沒有來嗎？」\n\n「來了。」他說，「一大早就來了，冷得發抖，還在幫別人占位子。」\n\n曉曉愣住了。\n\n「去年的花見，我第一次在公司看到妳。」他說，「妳一個人蹲在樹下，仔細地把每一片垃圾都撿起來。沒有人注意到妳，只有我。」\n\n「從那天起，我就一直在想，什麼時候能跟妳說上話。」\n\n「所以今年，我{決める|きめる}了，特地讓部長排妳來占位子。」\n\n「你、你好狡猾……」\n\n「嗯。」他毫不否認，走近一步，把她圈在櫻花樹和他之間。\n\n「[[〈一緒:いっしょ〉に〈歩:ある〉いたり、〈話:はな〉したりしたい。::我想跟妳一起散步、一起聊天。]]」他低聲說，「不只今天，以後每一天。」\n\n花瓣落在她的頭髮上。他伸手替她拿掉，然後低頭吻了她。\n\n很輕，很甜，像春天的第一陣風。\n\n「明年的花見，」他說，「妳不用占位子了。」\n\n「為什麼？」\n\n「[[〈俺:おれ〉の〈隣:となり〉に〈座:すわ〉れ。::坐在我旁邊。]]」\n\n曉曉笑著點頭。這是她來日本以後，最{美しい|うつくしい}的一個春天。", "blurb": "一大早幫公司占花見位子，陪她聊天的陌生男人竟是社長。", "gram": {"pt": "〜たり〜たりする", "mean": "又～又～（列舉動作）", "how": "動詞た形＋り（歩いた→歩いたり、話した→話したり）＋する", "ex": "〈一緒:いっしょ〉に〈歩:ある〉いたり、〈話:はな〉したりしたい。", "exzh": "我想跟妳一起散步、一起聊天。"}, "boss": {"name": "水瀬碧斗", "yomi": "みなせ あおと", "mark": "碧", "c1": "#123050", "c2": "#4c8fc9"}}, {"id": "A28", "title": "總裁的搬家", "band": "N5-N4", "text": "林可可要搬家了。\n\n她住了三年的老公寓要拆掉，房東給了她一個月時間。她找了好久，才找到一間便宜的小套房，離公司要坐一個小時的電車。\n\n搬家那天，她一個人把箱子一個一個{運ぶ|はこぶ}下樓。\n\n紙箱太重，她在樓梯上一個踉蹌，整個人往後{倒れる|たおれる}——\n\n一隻手穩穩地扶住了她的背。\n\n「小心。」\n\n是住在對面的男人。聽說他是為了監督改建工程，才暫時住進這棟老樓的。\n\n她只知道他姓宮代，每天早上準時出門，西裝筆挺，從來不跟鄰居說話。\n\n「宮代先生，謝謝……」\n\n他看了看她腳邊的十幾個箱子，又看了看她：「搬家公司呢？」\n\n「錢不{足りる|たりる}。」她不好意思地笑，「我自己來就好。」\n\n他沉默了一下，脫下西裝外套，捲起袖子。\n\n「我{手伝う|てつだう}。」\n\n---\n\n那天下午，他陪她搬了十七個箱子。\n\n他力氣很大，一次可以搬兩箱。她跟在後面，看著他滿身是汗的背影，心跳得有點快。\n\n搬到最後一箱，他打開看了一眼，裡面是一個舊舊的布{人形|にんぎょう}。\n\n「這是……」\n\n「我媽媽做給我的。」她說，「我小時候很怕黑，她說，抱著它睡就不怕了。」\n\n他把人形拿出來，小心地放在她手上。\n\n「很重要的東西，」他說，「不要放在箱子裡壓壞了。」\n\n---\n\n搬到新家的那天晚上，她才發現一件事。\n\n新家的{冷房|れいぼう}{壊れる|こわれる}了。熱水器也壞了。窗戶關不緊，外面的電車聲吵得她睡不著。\n\n她坐在一堆紙箱中間，突然覺得好{寂しい|さびしい}，很想哭。\n\n手機響了。是一則訊息：「新家還好嗎？」\n\n是宮代先生。他們搬家那天交換了聯絡方式。\n\n她{我慢|がまん}了一下，還是回了實話：「冷氣壞了，熱水也沒有。」\n\n二十分鐘後，門鈴響了。\n\n宮代柊吾站在門外，手上提著一個工具箱。\n\n「你怎麼來了？這裡離你家很遠……」\n\n「我開車。」他走進來，二話不說，開始{直す|なおす}冷氣。\n\n一個小時後，冷氣涼了，熱水器也好了。\n\n「你……到底是做什麼的？」\n\n「{建てる|たてる}房子的。」他說，「宮代建設的社長。」\n\n可可{驚く|おどろく}得說不出話。宮代建設，就是要拆掉她老公寓的那間公司。\n\n---\n\n「對不起。」他把頭{下げる|さげる}，「拆掉妳家的，是我。」\n\n「那棟樓太老了，地震的話很危險。我不能讓妳住在那裡。」\n\n「可是，我沒想到妳會搬這麼遠。」\n\n他看著她，聲音低了下去：「新的大樓明年蓋好。在那之前——」\n\n「[[〈俺:おれ〉のそばにいてもらう。::我要妳待在我身邊。]]」\n\n「什麼意思？」\n\n「我自己家那棟大樓，還有一間空房。」他說，「房租，妳{払う|はらう}得起的價錢。」\n\n「你、你這樣是假公濟私……」\n\n「嗯。」他毫不否認，伸手把她拉進懷裡，「因為我想每天早上出門的時候，都能看到妳。」\n\n她紅著臉，終於笑了。\n\n他低頭吻住她，很輕，很{優しい|やさしい}。\n\n「[[〈引:ひ〉っ〈越:こ〉しは〈明日:あした〉だ。::明天就搬家。]]」他說，「這次，我全部{手伝う|てつだう}。」", "blurb": "一個人搬家的她，被對門的冷淡鄰居捲起袖子幫忙。「我要妳待在我身邊。」", "gram": {"pt": "〜てもらう", "mean": "請（別人）為我～", "how": "動詞て形＋もらう（いる→いてもらう）", "ex": "〈俺:おれ〉のそばにいてもらう。", "exzh": "我要妳待在我身邊。"}, "boss": {"name": "宮代柊吾", "yomi": "みやしろ しゅうご", "mark": "柊", "c1": "#1a2b48", "c2": "#5c84bf"}}, {"id": "A29", "title": "總裁的便利商店", "band": "N5-N4", "text": "凌晨三點，便利商店裡很安靜，只有一個店員。\n\n那是蔡安安。她白天在大學上課，晚上在這裡打工，一週五天，已經{続ける|つづける}了一年，早就{慣れる|なれる}了這種安靜。\n\n每天凌晨三點十分，都會有同一個客人。\n\n黑色大衣，深灰色西裝，看起來累得快{倒れる|たおれる}，卻總是站得筆直。他買的東西永遠一樣：一杯黑咖啡，一個飯糰。\n\n「三百八十圓。」\n\n他{払う|はらう}完錢，拿起咖啡就走，從來不多說一句話。\n\n---\n\n那天，下著大雪。\n\n凌晨三點十分，他沒有來。\n\n三點半，四點，他還是沒有來。\n\n安安一直看著門口，心裡有點{心配|しんぱい}。她不知道自己為什麼會在意一個陌生人。\n\n四點十五分，自動門打開了。\n\n他走進來，臉色白得嚇人，西裝上全是雪。走到收銀台前，身體晃了一下。\n\n「先生！」\n\n安安{驚く|おどろく}得從櫃檯後面跑出來，{支える|ささえる}他。他的手{冷える|ひえる}，冰得像石頭。\n\n「你有{熱|ねつ}。」她摸了一下他的額頭，「我叫救護車——」\n\n「不用。」他抓住她的手，「我只是……三天沒{眠る|ねむる}了。」\n\n---\n\n她把他扶到店裡的休息椅上，讓他閉著眼睛休息。她{温める|あたためる}了一杯熱牛奶，又從自己的包包裡拿出一條圍巾，蓋在他身上。\n\n她小聲{尋ねる|たずねる}：「你為什麼這麼{無理|むり}？」\n\n他閉著眼睛，很久才回答：「公司出了問題。上千個員工，在等我想辦法。」\n\n「那你更應該休息啊。」安安說，「你倒下了，誰來救他們？」\n\n他睜開眼睛，看著她。\n\n「每天凌晨來這裡，」他說，「是我一天之中，唯一不用當社長的時候。」\n\n「只有在這裡，有人會對我說『歡迎光臨』，而不是『社長，出事了』。」\n\n安安不知道該說什麼。她只好把熱牛奶塞到他手裡。\n\n「那……歡迎光臨。」\n\n他愣了一下，然後，第一次笑了。\n\n---\n\n一個月後，安安在新聞上看到了他。\n\n北條匡，北條集團社長。公司度過了危機，股價大漲。\n\n那天凌晨三點十分，自動門又打開了。\n\n他走進來，手上沒有拿咖啡，而是拿著一束花。\n\n「公司的問題，解決了。」\n\n「恭喜你。」她{喜ぶ|よろこぶ}地笑著說，「那今天要買什麼？」\n\n「什麼都不買。」他把花放在櫃檯上，「我是來接一個人下班的。」\n\n安安{恥ずかしい|はずかしい}得臉一下子紅了。\n\n「我、我還有快兩個小時才下班……」\n\n「我等。」他說，「我已經等了一個月了，不差這兩個小時。」\n\n他在休息椅上坐下，看著她工作。\n\n五點，她換下制服走出來。他站起來，把她拉進懷裡。\n\n「那天晚上，妳說我太勉強自己了。」他低聲說，「其實，妳也一樣。白天上課，晚上打工，從來沒休息過。」\n\n「[[もう〈無理:むり〉しなくてもいい。::妳不用再勉強自己了。]]」\n\n「以後，換我照顧妳。」\n\n他低頭吻住她。窗外，天慢慢亮了。\n\n「[[〈俺:おれ〉のそばで〈休:やす〉め。::在我身邊好好休息。]]」", "blurb": "每天凌晨三點十分來買咖啡的男人，那晚倒在了收銀台前。", "gram": {"pt": "〜なくてもいい", "mean": "不～也可以", "how": "動詞ない形去い＋くてもいい（しない→しなくてもいい）", "ex": "もう〈無理:むり〉しなくてもいい。", "exzh": "妳不用再勉強自己了。"}, "boss": {"name": "北条匡", "yomi": "ほうじょう ただし", "mark": "匡", "c1": "#14284a", "c2": "#4d7fc0"}}, {"id": "A30", "title": "總裁的同學會", "band": "N5-N4", "text": "高中{卒業|そつぎょう}十年，班長辦了一場同學會。\n\n鄭小魚本來不想去。她在一間小公司當會計，薪水普通，沒有男朋友，也沒什麼好炫耀的。\n\n可是班長說：「夏目也會來喔。」\n\n夏目礼央。高中時坐在她後面的男生。安靜，成績很好，總是在借她的橡皮擦。\n\n她還記得，畢業那天，他好像想跟她說什麼，最後卻什麼也沒說。\n\n---\n\n同學會在一間高級餐廳的包廂。\n\n小魚一走進去，就聽見一個{噂|うわさ}：「聽說夏目現在是大公司的社長耶！」\n\n「真的假的？那個書呆子？」\n\n她找了一個{隅|すみ}的位子坐下，假裝看手機。\n\n當年最受歡迎的女生美香，穿著名牌洋裝坐在她旁邊，笑著問：「小魚，妳現在在哪裡上班？」\n\n「一間小公司，做會計。」\n\n美香上下打量她，像在{比べる|くらべる}什麼。「喔——」美香拉長了聲音，「還是一樣{地味|じみ}呢。」\n\n幾個人{騒ぐ|さわぐ}著笑了起來。小魚覺得好{悲しい|かなしい}，低下頭，手指緊緊{握る|にぎる}著杯子。\n\n---\n\n包廂的門被推開了。\n\n一個穿著深藍色西裝的男人走進來。高大，冷淡，和十年前那個瘦瘦的少年，判若兩人。\n\n「夏目！{久しぶり|ひさしぶり}！」美香第一個站起來，「快坐這裡！」\n\n夏目礼央沒有看她。\n\n他的視線掃過整個包廂，最後落在角落裡的小魚身上。\n\n他走過去，在她旁邊空著的{席|せき}坐下。\n\n「好久不見。」他說，「鄭小魚。」\n\n大家都{驚く|おどろく}得安靜了。\n\n「你、你還記得我的名字？」\n\n「當然。」他從口袋裡拿出一個小小的東西，放在她面前。\n\n是一塊用舊的橡皮擦，上面用原子筆寫著她的名字。\n\n「高三那年，我借走以後，一直沒有{返す|かえす}。」他說，「對不起，{遅れる|おくれる}了十年。」\n\n---\n\n同學會結束，他陪她走到車站。\n\n「為什麼……要留著那塊橡皮擦？」\n\n他停下腳步，看著她，眼神很{深い|ふかい}。\n\n「畢業那天，我想跟妳表白。」他說，「可是我太膽小了，連一句話都說不出口。」\n\n「後來，我拚命工作，想變成配得上妳的人。」\n\n「可是我拚命了十年，才發現自己一點都沒{変わる|かわる}。」他苦笑，「在妳面前，我還是那個連話都說不好的少年。」\n\n小魚的眼淚掉了下來。\n\n「笨蛋……」她說，「我也一直在等你開口啊。」\n\n他愣住了。\n\n「那天，我一直在教室等到天黑。」她說，「我以為你會來。」\n\n夏目礼央深吸一口氣，把她拉進懷裡。\n\n「[[〈君:きみ〉も〈俺:おれ〉に〈会:あ〉いたかったはずだ。::妳也一定很想見我。]]」他在她耳邊說，「不然，今天不會來。」\n\n「你、你怎麼這麼有把握……」\n\n他沒有回答，低頭吻住她。\n\n十年的等待，終於有了回音。\n\n「[[もう〈二度:にど〉と〈離:はな〉れない。::我再也不會離開妳。]]」\n\n那天晚上，小魚收到美香的訊息：「妳跟夏目是什麼關係？」\n\n她想了想，回了一句：「他欠我一塊橡皮擦。」\n\n然後，她把手機收進包包，{握る|にぎる}了身邊那個人的手。", "blurb": "十年後的同學會，當年借走她橡皮擦的男生，成了社長。", "gram": {"pt": "〜はずだ", "mean": "應該～（有把握的推測）", "how": "普通形＋はずだ（会いたかった→会いたかったはずだ）", "ex": "〈君:きみ〉も〈俺:おれ〉に〈会:あ〉いたかったはずだ。", "exzh": "妳也一定很想見我。"}, "boss": {"name": "夏目礼央", "yomi": "なつめ れお", "mark": "央", "c1": "#172a48", "c2": "#5585c4"}}, {"id": "A31", "title": "總裁的笑容", "band": "N5-N4", "text": "公司裡的人都說，篁社長從來不笑。\n\n開會的時候不笑，簽下百億合約的時候不笑，連公司尾牙抽到頭獎，他也只是冷冷地點點頭。\n\n新來的秘書蘇甜甜，在上班第一天就被{注意|ちゅうい}了：「千萬不要在社長面前開玩笑。」\n\n可是甜甜是個很愛笑的人。\n\n她早上{挨拶|あいさつ}的時候笑，送文件的時候笑，連被罵的時候，也會不小心笑出來。\n\n「蘇秘書。」篁理人看著她，眉頭皺得很{深い|ふかい}，「妳覺得被罵很好笑？」\n\n「不、不是……」她{慌てる|あわてる}地說，「我一緊張就會笑。對不起！」\n\n他看了她很久，什麼也沒說。\n\n---\n\n有一天，甜甜在社長的桌上，發現了一張舊照片。\n\n照片裡，是一個大約七、八歲的男孩，和一個{優しい|やさしい}的女人。男孩笑得很開心，露出一顆缺了的門牙。\n\n「這是……」\n\n「我母親。」\n\n篁理人站在門口。甜甜{驚く|おどろく}得趕緊把照片放回去：「對不起，我不是故意看的。」\n\n他走過來，拿起照片，看了很久。\n\n「她在我十歲那年{亡くなる|なくなる}了。」他說，「從那天起，我就忘記怎麼笑了。」\n\n甜甜不知道該說什麼。\n\n那天下班前，她在他桌上放了一個小紙袋。裡面是一顆糖，和一張便條：\n\n「社長，今天也辛苦了。:)」\n\n---\n\n從那天起，社長桌上每天都會出現一張便條。\n\n「社長今天的{格好|かっこう}很帥！」\n\n「天氣變冷了，記得穿外套。」\n\n「吃了這顆糖，心情會變好喔。」\n\n篁理人從來沒有回過。可是甜甜發現，那些便條，他一張也沒有{捨てる|すてる}，全部收在{引き出し|ひきだし}裡。\n\n---\n\n一個月後，甜甜在公司的樓梯上{滑る|すべる}，扭傷了腳。\n\n她坐在台階上，痛得眼淚直流。\n\n腳步聲傳來。篁理人蹲下來，看了一眼她腫起來的腳踝，二話不說，把她抱起來。\n\n「社、社長！大家都在看——」\n\n「讓他們看。」\n\n他把她抱進社長室，放在沙發上，親自替她冰敷。\n\n「痛嗎？」\n\n「有一點……」她咬著嘴唇，然後，又不小心笑了，「對不起，我一痛也會笑。」\n\n篁理人看著她，突然——\n\n嘴角，慢慢{上がる|あがる}了。\n\n那是一個很淺、很生疏的笑容。可是甜甜看見了。\n\n「社長，你笑了！」\n\n他好像自己也愣住了，伸手{触る|さわる}了一下嘴角。\n\n「是妳的錯。」他說，「每天在我桌上放那些{変|へん}的便條。」\n\n「[[〈君:きみ〉のおかげで、〈笑:わら〉えるようになった。::多虧了妳，我又會笑了。]]」\n\n他低下頭，靠近她，近到她能看見他的睫毛。\n\n「所以，妳要負責。」\n\n「什、什麼責任？」\n\n「[[〈毎日:まいにち〉、〈俺:おれ〉の〈隣:となり〉で〈笑:わら〉え。::每天都在我身邊笑。]]」\n\n他吻住了她。很輕，很溫柔，像一顆剛{包む|つつむ}好的糖。\n\n隔天，公司的人都驚呆了。\n\n因為篁社長，在電梯裡，對著蘇秘書笑了。", "blurb": "從來不笑的社長，桌上每天出現一張便條。「多虧了妳，我又會笑了。」", "gram": {"pt": "〜ようになる", "mean": "變得（能）～", "how": "動詞可能形＋ようになる（笑える→笑えるようになった）", "ex": "〈君:きみ〉のおかげで、〈笑:わら〉えるようになった。", "exzh": "多虧了妳，我又會笑了。"}, "boss": {"name": "篁理人", "yomi": "たかむら りひと", "mark": "理", "c1": "#1b2c4a", "c2": "#5b8fc9"}}, {"id": "A32", "title": "總裁的釣魚課", "band": "N5-N4", "text": "神奈川的小漁港旁邊，有一間老舊的釣具店。\n\n店主是周小海的爺爺。爺爺生病{入院|にゅういん}以後，小海辭掉了東京的工作，回來幫忙顧店。\n\n客人不多，大多是附近的老人。直到那個週末，店門口停了一輛黑色的高級轎車。\n\n下車的男人穿著一身昂貴的西裝，皮鞋擦得發亮，和這間小店格格不入。\n\n「我想學{釣る|つる}魚。」他說。\n\n小海上下打量他：「穿這樣？」\n\n「……我下次換衣服。」\n\n---\n\n他叫氷川嵐，說自己在東京工作，最近壓力太大，醫生要他找個興趣。\n\n他是小海見過最笨拙的學生。\n\n第一天，他把魚線{投げる|なげる}到了自己的頭上。\n\n第二天，他的{糸|いと}纏成了一團，花了一個小時才解開。\n\n第三天，他一個不小心，掉進了海裡，全身都{濡れる|ぬれる}了。\n\n小海笑得蹲在地上。\n\n「妳笑什麼。」他坐在海邊的石頭上，渾身滴水，表情卻很認真。\n\n「對不起……」她擦掉笑出來的眼淚，「只是你看起來，一點也不像會失敗的人。」\n\n他看著她，沉默了一下：「我確實很少失敗。」\n\n「可是在妳面前，好像一直在失敗。」\n\n---\n\n一個月後，魚線突然{動く|うごく}了。他終於釣到了第一條魚。\n\n不大，大概只有手掌那麼長。可是他{喜ぶ|よろこぶ}得像個孩子，捧著魚跑過來給她看。\n\n「小海，妳看！」\n\n那是她第一次聽到他叫她的名字。\n\n那天傍晚，她把那條魚撒上鹽，{焼く|やく}成了鹽烤魚。\n\n「請{召し上がって|めしあがって|召し上がる}。」她故意用很客氣的敬語說。\n\n他吃了一口，閉上眼睛，很久沒有說話。\n\n「好吃嗎？」\n\n「這是我吃過，最{素晴らしい|すばらしい}的一條魚。」\n\n---\n\n那天晚上，爺爺從醫院打電話來。\n\n「小海啊，」爺爺笑著說，「那個氷川先生，有沒有好好學釣魚？」\n\n「爺爺你認識他？」\n\n「當然認識。是我叫他來的。」爺爺說，「他是氷川集團的社長。十五年前，他還是個高中生，離家出走跑到這個港口，在我店裡坐了一整晚。」\n\n「是我讓他坐在店裡看海，是妳煮魚給他吃。妳不記得了嗎？那時候妳才十歲。」\n\n小海握著電話，愣住了。\n\n她{思い出す|おもいだす}了。那個一直低著頭、不說話的大哥哥。她把自己最喜歡的烤魚分了一半給他。\n\n---\n\n隔天，氷川嵐又來了。\n\n這次，他沒有拿釣竿。\n\n「爺爺都跟我說了。」小海看著他，「你根本不是來學釣魚的，對不對？」\n\n「不對。」他說，「我是來學的。只是我想學的，不只是釣魚。」\n\n他走到她面前，海風把她的頭髮吹亂了。他伸手，替她把頭髮撥到耳後。\n\n「十五年前，妳給了我一半的烤魚。」他低聲說，「那是我這輩子，第一次不覺得{寂しい|さびしい}。」\n\n「我{探す|さがす}了妳很久。」\n\n小海的眼淚掉了下來。\n\n耳邊{聞こえる|きこえる}海浪聲，夕陽把整片海染成了金色，波光一閃一閃地{光る|ひかる}。\n\n「[[まるで〈夢:ゆめ〉のようだ。::簡直就像一場夢。]]」他說。\n\n他低頭吻住她，吻裡有淡淡的海水味。\n\n「[[〈俺:おれ〉と〈東京:とうきょう〉に〈来:こ〉い。::跟我去東京。]]」\n\n「可是爺爺的店……」\n\n「店，我們一起顧。」他說，「週末來這裡，平日回東京。」\n\n小海笑了，眼淚卻停不下來。\n\n從那天起，小港口的釣具店，週末總是有兩個人。一個教釣魚，一個怎麼學也學不會。", "blurb": "海邊釣具店來了一個最笨拙的學生，他要學的不只是釣魚。", "gram": {"pt": "〜のようだ", "mean": "好像～", "how": "名詞＋のようだ（夢→夢のようだ）", "ex": "まるで〈夢:ゆめ〉のようだ。", "exzh": "簡直就像一場夢。"}, "boss": {"name": "氷川嵐", "yomi": "ひかわ らん", "mark": "嵐", "c1": "#0f2a44", "c2": "#3e86b8"}}, {"id": "A33", "title": "總裁的翻譯", "band": "N5-N4", "text": "陳晴是一名口譯員。\n\n她的日文很好，可是每次接到大案子，都會緊張得睡不著。\n\n這一次，是加賀美集團和台灣一間大公司的合約談判。社長加賀美秀一，是業界有名的冷血又{厳しい|きびしい}的談判家。\n\n「聽說他把上一個口譯員罵哭了。」同事小聲說，「妳要小心。」\n\n---\n\n談判在東京最高級的飯店會議室舉行。\n\n加賀美秀一坐在長桌的另一端，冷淡的眼睛掃過全場，最後落在她身上。\n\n「妳是新的口譯？」\n\n「是的，我叫陳晴。」\n\n「翻譯{間違える|まちがえる}一個字，」他說，「這筆生意就沒了。」\n\n陳晴的手心全是汗，很{心配|しんぱい}自己會翻錯。\n\n談判開始了，一直{続く|つづく}了三個小時。台灣那邊的代表說話很快，句子又長又複雜。陳晴拚命地記，一句一句{伝える|つたえる}給加賀美。\n\n說到一半，對方突然丟出一個很難的專業用語。她愣了一秒，腦中一片空白。\n\n完了。她想。\n\n這時，一張小紙條從桌子底下推了過來。\n\n上面是那個用語的日文，字寫得很工整。\n\n她抬頭一看，加賀美秀一面無表情地看著前方，好像什麼都沒發生。\n\n---\n\n談判結束，合約順利簽下了。\n\n陳晴在走廊上追上他。\n\n「社長，剛才謝謝您。」\n\n「我什麼都沒做。」\n\n「那張紙條……」\n\n他停下腳步，轉過身看她。\n\n「妳的日文很好。」他說，「只是太{真面目|まじめ}了，一點錯都不敢犯。」\n\n「這樣太累了。」\n\n陳晴{驚く|おどろく}得愣住了。她以為他會{叱る|しかる}她。\n\n---\n\n他{選ぶ|えらぶ}了她。從那天起，加賀美集團的所有台灣案子，都指定要她當口譯。\n\n她開始{慣れる|なれる}他的說話方式，習慣他喝黑咖啡不加糖，習慣他在談判前{必ず|かならず}把資料看三遍。\n\n他也開始習慣她。習慣她緊張的時候會咬嘴唇，習慣她在休息時間偷偷吃巧克力。\n\n三個月後，最後一場談判結束了。\n\n那天晚上，他約她在飯店頂樓的酒吧見面。\n\n「以後，台灣的案子結束了。」他說，「妳不用再來了。」\n\n陳晴的心沉了下去，突然覺得好{寂しい|さびしい}。\n\n「是……是我做得不好嗎？」\n\n「不是。」他看著她，「是因為，我不想再當妳的客戶了。」\n\n「什麼意思？」\n\n他從口袋裡拿出一張紙條，推到她面前。\n\n跟第一次談判那天一樣的紙條，一樣工整的字。只是這次，上面寫的是：\n\n「我喜歡妳。」\n\n陳晴的臉一下子紅了。\n\n「這、這句話，」她小聲說，「需要翻譯嗎？」\n\n「不用翻譯。」他站起來，走到她身邊，聲音很{優しい|やさしい}，「我要妳用日文{返事|へんじ}。」\n\n「[[〈俺:おれ〉のそばにいてくれ。::留在我身邊。]]」\n\n陳晴的眼淚掉了下來。\n\n她深吸一口氣，用她最好的日文，一字一句地回答：\n\n「[[はい、〈喜:よろこ〉んで。::好，我很樂意。]]」\n\n他笑了，低頭吻住她。窗外，東京的夜景像星星一樣{光る|ひかる}。\n\n那天，是她第一次，沒有把任何一句話翻錯。", "blurb": "口譯卡住的那一秒，冷血談判家從桌下推來一張紙條。", "gram": {"pt": "〜てくれ", "mean": "（男性口吻）給我～、為我～", "how": "動詞て形＋くれ（いる→いてくれ）", "ex": "〈俺:おれ〉のそばにいてくれ。", "exzh": "留在我身邊。"}, "boss": {"name": "加賀美秀一", "yomi": "かがみ しゅういち", "mark": "秀", "c1": "#162b52", "c2": "#5e88d6"}}, {"id": "A34", "title": "總裁的競爭者", "band": "N5-N4", "text": "「下週六，有空嗎？」\n\n公司的帥氣{先輩|せんぱい}田中，在茶水間攔住了林悠悠。\n\n「我有兩張美術展的票。」他笑著說，「一起去？」\n\n悠悠還沒回答，茶水間的門口就傳來一聲冷冷的咳嗽。\n\n站在那裡的，是社長竜崎獅央。\n\n「林秘書。」他說，「下週六，妳要加班。」\n\n「咦？可是行程表上沒有——」\n\n「現在有了。」\n\n他轉身走了。田中前輩聳聳肩，苦笑著離開。\n\n悠悠站在原地，一頭霧水。\n\n---\n\n從那天起，事情變得很奇怪。\n\n田中前輩約她吃午餐，社長就剛好要她送文件到樓上。\n\n田中前輩{誘う|さそう}她下班喝一杯，社長就剛好要她{残る|のこる}整理資料。\n\n田中前輩在她生日那天送了一束花，隔天早上，就有人{届ける|とどける}了一個比那束大三倍的花籃到她桌上，卡片上沒有署名。\n\n「社長，」悠悠終於忍不住了，抱著一疊文件衝進社長室，「您是不是在{邪魔|じゃま}我？」\n\n竜崎獅央從文件裡抬起頭：「什麼意思？」\n\n「每次田中前輩約我，您就給我安排工作。」\n\n「巧合。」\n\n「那花籃呢？」\n\n他沉默了一下：「……也是巧合。」\n\n---\n\n那個週末，悠悠一個人在公司加班。\n\n外面下起了大雨，雷聲轟隆隆地響。突然，整棟大樓的燈都熄了，電梯也{止まる|とまる}了。\n\n停電了。\n\n悠悠覺得黑暗很{怖い|こわい}。遠處{聞こえる|きこえる}雷聲，她緊緊{噛む|かむ}著嘴唇。她蹲在辦公桌底下，抱著膝蓋，全身發抖。\n\n「林悠悠！」\n\n手機的光照了過來。是竜崎獅央。\n\n「社、社長？」她{驚く|おどろく}地問，「您怎麼在這裡……」\n\n「我也在加班。」他蹲下來，把西裝外套{掛ける|かける}在她身上，「別怕，我在。」\n\n他就那樣陪她坐在黑暗裡，一直到燈亮起來。她終於放心了。\n\n「社長，」她小聲問，「您為什麼總是不讓我跟田中前輩出去？」\n\n黑暗中，他安靜了很久。\n\n「因為我很不安。」他說，「妳每次對他笑，我都很不安。」\n\n「我是社長，可以給妳加薪，可以給妳升職。可是我不知道，怎麼讓妳對我笑。」\n\n悠悠的心跳亂了。\n\n「我一直很{羨ましい|うらやましい}他，一直拿自己跟他{比べる|くらべる}。」他低聲說，「他可以那麼自然地約妳出去。我卻只能用工作把妳留在身邊。」\n\n「[[〈他:ほか〉の〈男:おとこ〉に〈取:と〉られたくない。::我不想被別的男人搶走妳。]]」\n\n燈亮了。\n\n悠悠看見他的臉，第一次，不是冷淡的社長，而是一個{恥ずかしい|はずかしい}得紅了耳朵的男人。\n\n她{嬉しい|うれしい}得忍不住笑了。\n\n「社長，」她說，「其實田中前輩約我的時候，我每次都想拒絕。」\n\n「為什麼？」\n\n「因為我在等另一個人約我。」\n\n竜崎獅央愣住了。然後，他伸手把她拉進懷裡，緊緊地抱住。\n\n「下週六，」他說，「妳不用加班了。」\n\n「那要做什麼？」\n\n「[[〈俺:おれ〉とデートしろ。::跟我約會。]]」\n\n他低頭吻住她。窗外的雨停了，城市的燈一盞一盞亮了起來。", "blurb": "每次前輩約她，社長就剛好要她加班。停電的夜裡，他終於說了實話。", "gram": {"pt": "〜られる（被動）", "mean": "被～", "how": "動詞被動形（取る→取られる）＋たくない", "ex": "〈他:ほか〉の〈男:おとこ〉に〈取:と〉られたくない。", "exzh": "我不想被別的男人搶走妳。"}, "boss": {"name": "竜崎獅央", "yomi": "りゅうざき しおう", "mark": "獅", "c1": "#112440", "c2": "#3f73b5"}}, {"id": "A35", "title": "總裁的初戀信", "band": "N5-N4", "text": "朝比奈光收到那封信的時候，已經是二十八歲的社長了。\n\n信封很舊，郵戳是十二年前的。收件{住所|じゅうしょ}，是他高中時住過的老房子。\n\n「這封信卡在郵局的倉庫裡，最近整理的時候才發現。」郵差不好意思地{謝る|あやまる}，「真的很抱歉。」\n\n他打開信。\n\n字跡很稚嫩，是一個女孩子寫的：\n\n「朝比奈同學：明天我就要回台灣了。我一直不敢跟你說，我喜歡你。如果你也喜歡我，明天早上八點，請到車站來送我。我會一直等。——小雪」\n\n朝比奈光拿著信，很久很久沒有動。\n\n十二年前，他確實認識一個叫小雪的台灣女孩。坐在他隔壁，總是安靜地看書，笑起來很{優しい|やさしい}。\n\n她突然{転校|てんこう}那天，他什麼都不知道。\n\n---\n\n一個月後，台北。\n\n朝比奈集團在台灣的新分公司開幕。社長親自出席。\n\n開幕典禮上，負責花藝布置的，是一間小花店。\n\n花店的老闆娘在台上{飾る|かざる}最後一盆花。她回頭的那一刻，朝比奈光的心跳停了一拍。\n\n是她。十二年過去了，她的眼睛，一點也沒{変わる|かわる}。\n\n---\n\n典禮結束，他在後台找到她。\n\n「小雪。」\n\n她一不小心，把剪刀{落とす|おとす|落す}到了地上。\n\n「朝、朝比奈同學？」她{驚く|おどろく}得說不出話。\n\n「我收到妳的信了。」他說，「十二年前的那封。」\n\n她{恥ずかしい|はずかしい}得臉一下子紅了，然後又白了：「那、那封信……你現在才收到？」\n\n「上個月。」\n\n小雪愣住了。然後，她低下頭，笑了笑，笑容裡有一點{悲しい|かなしい}。\n\n「難怪那天，你沒有來。」她小聲說，「我在車站一直等到不得不上車的最後一刻。」\n\n「我一直以為，你是故意不來的。」\n\n朝比奈光的胸口一陣疼痛。\n\n「如果我收到了，」他說，「我一定會去。」\n\n「我會跑著去。」\n\n---\n\n那天晚上，他約她在花店打烊後見面。\n\n花店很小，到處都是花的{匂い|におい}。她在整理明天要用的花，他站在旁邊，笨拙地{手伝う|てつだう}。\n\n「這十二年，」她{尋ねる|たずねる}，「你過得好嗎？」\n\n「不好。」他說，「我一直覺得，好像忘了什麼很{大事|だいじ}的東西。」\n\n「可是我想不起來是什麼。」\n\n「現在我知道了。」\n\n他從口袋裡拿出那封舊信，放在她手心。\n\n「[[〈君:きみ〉を〈忘:わす〉れることができなかった。::我一直沒辦法忘記妳。]]」\n\n小雪的眼淚掉了下來。\n\n「這封信，晚了十二年才{届く|とどく}。」他說，「所以，換我回信。」\n\n他把她拉進懷裡，低頭吻住她。很輕，很慢，像是要把十二年的時間，一點一點補回來。\n\n「[[〈明日:あした〉の〈朝:あさ〉、〈迎:むか〉えに〈来:く〉る。::明天早上，我來接妳。]]」\n\n「這次，」他說，「換我去接妳。」", "blurb": "一封晚到十二年的情書，讓社長飛到了台北的小花店。", "gram": {"pt": "〜ことができる", "mean": "能夠～", "how": "動詞辭書形＋ことができる（忘れる→忘れることができなかった）", "ex": "〈君:きみ〉を〈忘:わす〉れることができなかった。", "exzh": "我一直沒辦法忘記妳。"}, "boss": {"name": "朝比奈光", "yomi": "あさひな ひかる", "mark": "光", "c1": "#1e2c50", "c2": "#6f86c9"}}, {"id": "A36", "title": "總裁的二手書店", "band": "N5-N4", "text": "商店街的盡頭，有一間小小的二手書店。\n\n店主是二十五歲的方小書。這間店是爺爺留下來的，她不想讓它關門。\n\n每週三晚上，都會有一個客人走進這間店。\n\n他總是穿著一身深灰色的西裝，在最裡面的書架前，一站就是一個小時。他買的書很雜，有詩集、有{漫画|まんが}，也有很舊的歷史書。\n\n結帳的時候，他從來不說話。只有一次，他看著她手上的OK繃，問了一句：「怎麼了？」\n\n「整理書架的時候，被釘子劃到了。」\n\n下一個星期三，他除了書，還在櫃台上放了一個急救箱。\n\n---\n\n那天晚上十一點，小書正要關店。\n\n後門突然傳來一聲巨響。\n\n她嚇得回頭——一個戴著帽子的男人，正從後門的窗戶爬進來。\n\n是{泥棒|どろぼう}。\n\n男人看見她，愣了一下，然後抓起櫃台上的收銀機，轉身就{逃げる|にげる}。\n\n「那是爺爺的——」\n\n她想都沒想就追了出去。\n\n商店街已經沒有人了。{近所|きんじょ}的店都關了。她追了兩個路口，被一塊石頭絆得{転ぶ|ころぶ}在地上，{膝|ひざ}重重地撞到地面。\n\n那個男人已經跑到{遠く|とおく}了。\n\n就在這時，一個剛加完班、正好路過商店街的男人，像一道黑影從旁邊的巷子衝了出來。\n\n---\n\n不到一分鐘，那個男人就被壓在了地上。\n\n壓住他的，是每週三來買書的那個客人。\n\n「別動。」他的聲音冷得像冰，一隻手牢牢地壓住對方的{腕|うで}。\n\n附近的人{知らせる|しらせる}了警察，警察很快就來了，把收銀機{届ける|とどける}店裡。\n\n小書坐在路邊，膝蓋擦破了皮，手還在發抖。\n\n那個男人走過來，蹲在她面前，拿出手帕，按住她的傷口。\n\n「妳被偷了東西，就自己追上去？」他的語氣，像是在{怒る|おこる}。\n\n「那是爺爺的收銀機……」她小聲說，「裡面沒有多少錢，可是那是爺爺用了四十年的東西。」\n\n他看著她，很久沒說話。\n\n---\n\n隔天，書店的後門換上了全新的鎖，櫃台上放著兩把新鑰匙，窗戶也裝上了鐵窗。\n\n工人說：「是一位九鬼先生{払う|はらう}的錢。」她的{気分|きぶん}這才好了一點。\n\n那天是星期三。晚上八點，他照常走進店裡。\n\n「九鬼先生，」小書紅著眼睛，「門和窗戶，是你……」\n\n「嗯。」他說，「九鬼隆之介。九鬼集團的社長。」\n\n「你為什麼對我這麼好？」\n\n他從書架上拿下一本很舊的歷史書，翻到最後一頁。\n\n上面有一行小小的字，是她爺爺的筆跡：「送給隆之介。等你長大了，再回來看看。」\n\n「二十年前，我父親的公司{倒産|とうさん}，我一個人離家出走，在這間店裡躲了三天。」他說，「是妳爺爺收留了我。妳那時候才五歲，每天都把妳的點心分我一半。」\n\n小書忍不住{泣く|なく}了。\n\n「我每週三來，是因為妳爺爺說過，週三是他進新書的日子。」\n\n「後來，我來，是因為妳。」\n\n他伸手，替她擦掉眼淚。\n\n「[[〈何:なに〉があっても、〈君:きみ〉を〈守:まも〉る。::不管發生什麼事，我都會保護妳。]]」\n\n他低頭，輕輕吻了她的額頭。\n\n「[[〈明日:あした〉も〈来:く〉る。::明天我也會來。]]」\n\n「明天又不是星期三。」\n\n「從今天起，」他說，「每天都是。」", "blurb": "每週三晚上，總有一位西裝客人來二手書店，一站就是一小時。", "gram": {"pt": "〜ても", "mean": "即使～也", "how": "動詞て形＋も（ある→あっても）", "ex": "〈何:なに〉があっても、〈君:きみ〉を〈守:まも〉る。", "exzh": "不管發生什麼事，我都會保護妳。"}, "boss": {"name": "九鬼隆之介", "yomi": "くき りゅうのすけ", "mark": "隆", "c1": "#2a1e14", "c2": "#9a7650"}}, {"id": "A37", "title": "總裁的家政婦", "band": "N5-N4", "text": "媽媽扭傷了{腰|こし}，沒辦法去上班。\n\n她是一位家政婦，每週一到週五，去一間高級公寓打掃、做飯。媽媽拉著林小米的手：「那位先生很挑剔，換了好幾個人都不滿意。妳替我去一個月，好不好？」\n\n小米只好答應。\n\n---\n\n公寓在東京最高的大樓頂樓。屋主{留守|るす}，是大樓管理員幫她開的門。\n\n屋子大得像美術館，卻一點生活感也沒有。冰箱裡只有礦泉水，{棚|たな}上一層薄灰，浴室的{鏡|かがみ}好像幾個月沒擦過。\n\n小米捲起袖子，從早做到晚。\n\n她把每一層架子都擦得{光る|ひかる}，把{布団|ふとん}拿到陽台上曬，又去超市買了菜，做晚飯的{支度|したく}，{炊く|たく}了一鍋飯，{焼く|やく}了一條魚，煮了一鍋熱湯。\n\n傍晚六點，門開了。\n\n一個高大的男人站在玄關，看著一桌子的菜，皺起眉頭。\n\n「誰讓妳做飯的？」\n\n「我、我是來代班的。」小米緊張地說，「媽媽說，這裡的主人{普段|ふだん}都不好好吃飯……」\n\n男人沉默地看了她一眼，走過來，坐下，拿起筷子。\n\n他吃得很慢，一口一口，把整碗飯都吃完了。\n\n「明天，」他放下筷子，「也做。」\n\n---\n\n那個男人叫東郷啓，是一間大公司的社長。\n\n他很少說話，對什麼都很挑剔。襯衫要燙到沒有一條皺褶，泡咖啡的水要先{沸く|わく}，再放涼到剛好的溫度，書要照顏色排列好。\n\n可是他從來沒有挑剔過她做的菜。\n\n每天晚上，他都會準時六點回家，把她做的飯全部吃完。\n\n「社長，」有一天，小米忍不住說，「您以前都不吃晚飯嗎？」\n\n「{適当|てきとう}吃一點。」他說，「一個人吃，很{つまらない}。」\n\n小米想了想，把自己的那一份也端上桌，在他對面坐下。\n\n「那……我陪您一起吃。」\n\n他愣了一下。然後，第一次，對她笑了。\n\n---\n\n一個月很快就過去了。\n\n最後一天，小米把房子打掃得乾乾淨淨，在冰箱裡放滿了做好的小菜，每一盒都貼上了便條：「星期一的晚餐」「星期二的晚餐」……\n\n她把鑰匙和辭職信留在餐桌上，正要離開，門開了。\n\n東郷啓走進來，看了一眼餐桌，拿起那張紙。\n\n「這是什麼？」\n\n是她的辭職信。\n\n「媽媽的腰好了，下週開始她會回來。」小米說，「我的工作，到今天為止。」\n\n「我不同意。」\n\n「咦？」\n\n「妳媽媽可以回來。」他走進來，把她逼到廚房的流理台邊，「可是妳，不准走。」\n\n「為、為什麼？」\n\n他低頭看著她，眼神第一次這麼認真。\n\n「[[〈料理:りょうり〉は〈上手:じょうず〉だし、よく〈笑:わら〉うし、〈文句:もんく〉なしだ。::妳菜做得好，又愛笑，我挑不出任何毛病。]]」\n\n「這一個月，我{太る|ふとる}了三公斤。」他說，「我才知道，原來回家是這種感覺。」\n\n他把她拉進懷裡，低頭吻住她。廚房裡，水壺裡的{湯|ゆ}還在冒著白煙。\n\n「[[〈毎日:まいにち〉、〈俺:おれ〉と〈一緒:いっしょ〉に〈食:た〉べろ。::以後每天，都跟我一起吃飯。]]」\n\n「這是工作嗎？」\n\n「不是。」他說，「這是求婚。」\n\n小米笑著，眼淚掉了下來。\n\n後來，她媽媽回來上班的第一天，發現社長家的冰箱上，多了一張兩個人的合照。\n\n「我就知道，」媽媽笑著說，「那個挑剔的先生，挑的不是家政婦。」", "blurb": "替媽媽代班當家政婦，挑剔的社長卻天天提早回家吃飯。", "gram": {"pt": "〜し〜し", "mean": "又～又～", "how": "普通形＋し（上手だ→上手だし）", "ex": "〈料理:りょうり〉は〈上手:じょうず〉だし、よく〈笑:わら〉うし、〈文句:もんく〉なしだ。", "exzh": "妳菜做得好，又愛笑，我挑不出任何毛病。"}, "boss": {"name": "東郷啓", "yomi": "とうごう けい", "mark": "啓", "c1": "#1c2430", "c2": "#6a84a8"}}, {"id": "A38", "title": "總裁的鄉下旅館", "band": "N5-N4", "text": "「我要辭職。」\n\n葉小鈴把辭職信放在社長的桌上。\n\n白鳥新抬起頭，看了一眼信封，又看了一眼她：「理由？」\n\n「我外婆在長野的鄉下開了一間小{旅館|りょかん}。她年紀大了，一個人顧不來。」小鈴說，「我已經決定了，要回去幫她。」\n\n白鳥新沉默了很久。\n\n「知道了。」他說。\n\n小鈴{安心|あんしん}了，心裡卻有一點空空的。\n\n---\n\n出發那天，她搭上了往長野的{特急|とっきゅう}。\n\n一路上，窗外的景色從高樓，變成田野，再變成一片一片的{林|はやし}。\n\n在一個小車站{乗り換える|のりかえる}以後，電車慢慢地{向かう|むかう}山裡。外婆的旅館，在一座安靜的{湖|みずうみ}旁邊。外婆早早就站在門口{迎える|むかえる}她。\n\n山裡的{空気|くうき}很乾淨，太陽一下山，手腳就{冷える|ひえる}得厲害。小鈴深吸一口氣，覺得心裡好像也輕了一點。\n\n---\n\n旅館的工作比她想像的辛苦。\n\n每天早上五點起床，打掃房間，準備早餐，替客人鋪床。晚上還要幫外婆算帳。\n\n一週後的傍晚，有一位客人突然來訪，沒有{予約|よやく}。\n\n小鈴跑到門口，愣住了。\n\n是白鳥新。他提著一個小行李箱，穿著一件灰色的大衣，站在雪地裡。\n\n「你、你怎麼來了？」\n\n「休假。」他說，「我在附近有{用事|ようじ}。」\n\n「這附近除了一間寺廟，什麼都沒有。」\n\n「那我就是來參拜的。」他面不改色。\n\n---\n\n他在旅館住了一個星期。\n\n他會一大早起來，幫外婆劈柴；會陪小鈴去湖邊散步；會在晚上，和外婆一起喝茶，聽她講這間旅館的故事。\n\n外婆很喜歡他。\n\n「這個年輕人，」外婆偷偷跟小鈴說，「每天晚上都在窗邊打電話，一講就是好幾個小時。聽說公司很忙，他卻說什麼都不肯回去。」\n\n小鈴的心，揪了一下。\n\n---\n\n最後一天晚上，湖面結了薄冰。\n\n白鳥新站在湖邊，看著遠處的山。\n\n「你明天就要回東京了吧。」小鈴走到他身邊。\n\n「嗯。」他說，「不過，下週會再來。」\n\n「你公司那麼忙……」\n\n「我已經申請，以後每週有三天，{移る|うつる}長野市的分公司辦公。」他轉過身，看著她，「我會在長野。」\n\n小鈴愣住了：「為什麼要做到這種地步？」\n\n「因為妳在這裡。」\n\n他伸手，把她圍巾上的雪拍掉。\n\n「妳辭職那天，我說我知道了，其實心裡一點也不想放妳走。」他說，「我只是知道，妳決定的事，誰也攔不住。」\n\n「所以，攔不住，我就跟過來。」\n\n「[[〈君:きみ〉が〈行:い〉くなら、〈俺:おれ〉も〈行:い〉く。::妳要去的話，我也去。]]」\n\n小鈴忍不住{泣く|なく}了。\n\n他低頭吻住她，湖邊的風很冷，他的懷抱卻很暖。\n\n「[[〈来年:らいねん〉の〈春:はる〉、ここで〈結婚式:けっこんしき〉を〈挙:あ〉げよう。::明年春天，我們在這裡辦婚禮吧。]]」\n\n隔天早上，外婆看著兩個人牽著手來吃早餐，笑著說：「我就知道，這個年輕人不是來參拜的。」\n\n白鳥新來的那天，帶了一盒東京的{お土産|おみやげ}給外婆。離開時，他在櫃台留下一張紙條：「下週見。請替我留同一間房間。」", "blurb": "秘書辭職回鄉下顧旅館，社長竟然跟著搬來劈柴。", "gram": {"pt": "〜なら", "mean": "如果～的話", "how": "普通形＋なら（行く→行くなら）", "ex": "〈君:きみ〉が〈行:い〉くなら、〈俺:おれ〉も〈行:い〉く。", "exzh": "妳要去的話，我也去。"}, "boss": {"name": "白鳥新", "yomi": "しらとり あらた", "mark": "新", "c1": "#1b2b26", "c2": "#5f9a86"}}, {"id": "A39", "title": "總裁的牙醫診所", "band": "N5-N4", "text": "林小芽在一間{歯医者|はいしゃ}的{受付|うけつけ}工作。\n\n診所很小，在一棟老大樓的二樓。病人大多是{近所|きんじょ}的老人和小孩，每天都很平靜。\n\n直到那個星期一。\n\n一個穿著昂貴西裝的男人推門進來，臉色蒼白，一手捂著右邊的臉。\n\n「有{予約|よやく}嗎？」\n\n「沒有。」他咬著牙說，「痛。」\n\n小芽看了看行程表：「今天已經滿了，最快也要後天……」\n\n「我現在就要。」\n\n---\n\n最後，醫生在午休時間替他看了。\n\n小芽在診療室外面，聽見裡面傳來一陣低沉的悶哼。\n\n二十分鐘後，男人走出來，額頭上全是冷汗。\n\n「蛀牙。」醫生說，「拖太久了。下週還要再來。」\n\n男人看起來比剛才還要蒼白。\n\n小芽忍不住笑了出來。\n\n男人瞪了她一眼。\n\n「對、對不起。」她趕緊低頭{謝る|あやまる}，「只是……您看起來很怕看牙醫。」\n\n「我不怕。」\n\n「嗯。」\n\n「我只是很{嫌い|きらい}那個聲音。」他說，「那個鑽牙的{道具|どうぐ}。」\n\n---\n\n從那天起，他開始{通う|かよう}這間診所，每週一準時報到。\n\n他叫桐島志貴，是附近一間大公司的社長。\n\n每次來，他都提早半個小時到，坐在候診室的角落，一臉嚴肅地看著牆上的時鐘。\n\n小芽發現，他每次都會緊緊{掴む|つかむ}著椅子的扶手。\n\n第三次的時候，她倒了一杯溫水，放在他手邊。\n\n「{大体|だいたい}再兩次就好了。」她小聲說，「您很有{勇気|ゆうき}喔。」\n\n他看了她一眼，耳朵好像紅了一點。\n\n第四次，他帶了一盒點心給診所。\n\n第五次，他的牙{治る|なおる}了。\n\n「恭喜您。」小芽笑著說，「以後要好好刷牙喔，不然還要再來。」\n\n他站在櫃台前，{中々|なかなか}沒有走。\n\n「那個……」他說，「這週末，妳有空嗎？」\n\n小芽愣住了。\n\n「我想請妳吃飯。」他說，「當作{お礼|おれい}。」\n\n「不、不用了，這是我的工作……」\n\n「那就不是謝禮。」他看著她，「是約會。」\n\n---\n\n週末，他們在一間安靜的餐廳見面。\n\n吃飯的時候，他一直很安靜。直到最後，他才放下刀叉，從口袋裡拿出一張紙。\n\n是診所的預約單。上面密密麻麻，寫著他這五週來的每一次預約。\n\n「其實，」他說，「我的牙第二次就快好了。」\n\n「咦？」\n\n「是我拜託醫生，多排了幾次。」他把頭轉開，「因為每次來，都能看到妳。」\n\n小芽的臉一下子熱了起來。\n\n「我知道這樣很卑鄙。」他說，「所以，我想直接問妳。」\n\n他看著她，眼神很認真。\n\n「[[〈明日:あした〉までに〈返事:へんじ〉をくれ。::明天之前，給我答覆。]]」\n\n小芽想了想，笑了。\n\n「不用等到明天。」\n\n她站起來，繞過桌子，在他臉頰上輕輕親了一下。\n\n他整個人僵住了。然後，他把她拉進懷裡，低頭吻住她。\n\n「[[〈俺:おれ〉と〈付:つ〉き〈合:あ〉え。::跟我交往。]]」\n\n「社長，」她靠在他胸口，小聲說，「下次看牙醫，我陪你。」\n\n「……{是非|ぜひ}。」", "blurb": "牙痛的社長闖進小診所，從此每週一準時報到。", "gram": {"pt": "〜までに", "mean": "在～之前", "how": "名詞／動詞辭書形＋までに（明日→明日までに）", "ex": "〈明日:あした〉までに〈返事:へんじ〉をくれ。", "exzh": "明天之前，給我答覆。"}, "boss": {"name": "桐島志貴", "yomi": "きりしま しき", "mark": "貴", "c1": "#20202e", "c2": "#7c7cb8"}}, {"id": "A40", "title": "總裁的新年", "band": "N5-N4", "text": "十二月三十一日，東京下著小雪。\n\n公司裡的{皆|みな}都回家跨年了。只有蔡小年，一個人留在公司的{寮|りょう}。\n\n她是台灣來的實習生，機票的{値段|ねだん}太高，今年沒辦法回家。\n\n她打開手機，看著家裡傳來的照片——全家圍著火鍋，等著看101的跨年煙火。她笑著回了一句「新年快樂」，然後把手機蓋在桌上。\n\n---\n\n晚上十點，她出門去便利商店買泡麵。\n\n回來的路上，經過一間小小的神社。門口掛著燈籠，有人在準備明天的{正月|しょうがつ}。\n\n她站在鳥居前，看了很久。\n\n「不進去嗎？」\n\n身後傳來一個聲音。她回頭，看見一個高大的男人，穿著黑色大衣，肩膀上落滿了雪。\n\n是社長，藤堂千尋。\n\n「社、社長？您怎麼在這裡？」\n\n「我住在附近。」他看了一眼她手上的泡麵，皺起眉頭，「{今夜|こんや}，妳就吃這個？」\n\n「……嗯。」\n\n他沉默了一下：「跟我來。」\n\n---\n\n他帶她去了一間還開著的小料理店。\n\n店裡的{暖房|だんぼう}很暖，老闆娘端上了一鍋熱騰騰的蕎麥麵。\n\n「這是年越蕎麥麵。」他說，「日本人在除夕吃，代表把今年的辛苦全部切斷。」\n\n小年喝了一口湯，眼眶突然紅了。\n\n「怎麼了？」\n\n「沒事。」她低著頭，「只是……好久沒有人陪我吃飯了。」\n\n他沒有說話，只是又替她倒了{一杯|いっぱい}熱茶。\n\n---\n\n吃完麵，已經快十二點了。\n\n他們走回神社。{遠く|とおく}的寺廟，{鐘|かね}一聲一聲地響起來，一共要敲一百零八下。\n\n「新年快樂。」他說。\n\n「新年快樂。」她笑了，「社長，您每年都一個人跨年嗎？」\n\n「嗯。」他看著神社的燈籠，「我的家人都在國外。」\n\n「那您不覺得……」\n\n「以前不覺得。」他轉過頭，看著她，「今年{特に|とくに}覺得。」\n\n---\n\n元旦早上，小年{寝坊|ねぼう}了。\n\n她是被手機的鈴聲{起こす|おこす}的。是社長傳來的訊息：\n\n「十點，神社門口。去參拜。」\n\n她手忙腳亂地換衣服，跑到神社的時候，已經十點十分了。\n\n他站在雪地裡，手上拿著兩碗熱騰騰的紅豆湯。\n\n「對不起，我睡過頭了……」\n\n「沒關係。」他把紅豆湯{渡す|わたす}她，「我也剛到。」\n\n可是他的肩膀上，積了一層薄薄的雪。\n\n他們一起投了香油錢，一起{願う|ねがう}新年平安。\n\n「妳許了什麼願？」\n\n「希望明年可以回家跨年。」小年說，「社長呢？」\n\n「希望明年，」他看著她，「妳不要回家跨年。」\n\n「咦？」\n\n「因為我想跟妳一起過。」\n\n小年愣住了。他低下頭，臉竟然有點紅。\n\n「這種話我不太會說。」他說，「總之——」\n\n「[[〈寂:さび〉しいときは、〈俺:おれ〉を〈呼:よ〉べ。::寂寞的時候，就叫我。]]」\n\n「不管是除夕，還是平常的日子。」\n\n小年的眼淚掉了下來。她笑著點頭。\n\n他伸手，把她圍巾上的雪拍掉，然後輕輕吻了她的額頭。\n\n「[[〈今年:ことし〉もよろしく。::今年也請多多指教。]]」\n\n他們一起用手機{写す|うつす}了一張合照。照片裡，她笑得很開心，他的耳朵很紅。\n\n那天晚上，她把照片{送る|おくる}到台灣家人的手機裡。\n\n媽媽回了一句話：「這個年，妳過得很好啊。」\n\n她回：「非常好。」", "blurb": "除夕夜一個人留在東京，社長帶她去吃了一碗跨年蕎麥麵。", "gram": {"pt": "〜とき", "mean": "～的時候", "how": "い形容詞／動詞普通形＋とき（寂しい→寂しいとき）", "ex": "〈寂:さび〉しいときは、〈俺:おれ〉を〈呼:よ〉べ。", "exzh": "寂寞的時候，就叫我。"}, "boss": {"name": "藤堂千尋", "yomi": "とうどう ちひろ", "mark": "尋", "c1": "#2c1418", "c2": "#b05a64
